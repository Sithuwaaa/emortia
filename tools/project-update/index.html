}


/* ============================================================
   THE EXCEL BROWSER - the second half of this tool.

   Drawn in Claude Design and imported from the design project. The rollout
   dashboard above is untouched and is still what the tool opens on; this is
   reached from the Excel Browser tab, and the two share the header, the
   photograph and the Field Operations palette.

   WHERE ITS DATA LIVES, AND WHY THAT IS NOT WHERE THE DASHBOARD'S LIVES.
   A workbook dropped in here is kept in IndexedDB on the device that
   dropped it. It is NOT synced, and that is deliberate, not an omission:

     - the rollout dashboard's two workbooks are published, read by other
       people, and belong in `books` where they are;
     - an ad-hoc report somebody opens to look at something is not;
     - and whole workbooks read back out of Postgres is the exact shape
       that put 96% of a month's egress through PostgREST. One page of this
       tool reloading every open tab on every row change cost about 880 MB
       in a day. A sheet is bigger than a ticket.

   So nothing in this half touches window.DB, and there is no table, no
   migration and no channel behind it. If that ever needs to change it is a
   deliberate decision with a cost attached, not a refactor.

   Every name here is prefixed. The dashboard already has a DB (the
   IndexedDB database name), a parseSheet and a load; shadowing any of them
   would break the half that works, and it would break it silently.
   ============================================================ */
const XDB = (() => {
  let p; const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('emortia_project_update', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('projects', { keyPath:'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('projects', mode), s = t.objectStore('projects'); const out = fn(s);
    t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return { all: () => tx('readonly', s => s.getAll()), put: v => tx('readwrite', s => s.put(v)),
           del: id => tx('readwrite', s => s.delete(id)) };
})();

/* the dashboard's esc leaves the apostrophe alone, which is fine for its own
   markup; this half writes values into single-quoted contexts too */
const xesc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const xnum = n => (+n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const xwhen = t => new Date(t).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
const xuid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let XP = [], xcur = null, xrep = null, xcurFile = null, xready = false;
const XV = { q:'', filters:[], sort:null, dir:1, limit:150 };

const XDONE = /\b(done|complete[d]?|finish(ed)?|on[\s-]?air|closed|integrated|accepted|ready|handed[\s-]?over|commissioned|pat\s?ok|yes|ok)\b/i;
const XHOLD = /\b(hold|pending|wip|in[\s-]?progress|ongoing|open|plan(ned)?|scheduled|waiting|not\s?started|todo|partial)\b/i;
const XBAD  = /\b(reject(ed)?|fail(ed)?|issue|dispute|drop(ped)?|cancel(led)?|blocked|no)\b/i;
const xtone = v => { v = String(v);
  return XDONE.test(v) && !/\bnot\b/i.test(v) ? 'ok' : XBAD.test(v) ? 'b' : XHOLD.test(v) ? 'w' : ''; };

function xParseSheet(aoa){
  aoa = aoa.filter(r => r && r.some(c => String(c).trim() !== ''));
  if (aoa.length < 2) return null;
  let hi = 0, best = -1;
  for (let i = 0; i < Math.min(12, aoa.length); i++){
    const n = aoa[i].filter(c => String(c).trim() !== '' && isNaN(+c)).length;
    if (n > best){ best = n; hi = i; } }
  const raw = aoa[hi].map(c => String(c).trim());
  const width = Math.max(...aoa.slice(hi).map(r => r.length));
  const seen = {}; const cols = [];
  for (let j = 0; j < width; j++){ let h = raw[j] || ('Column ' + (j + 1));
    if (seen[h]) h += ' (' + (++seen[h]) + ')'; else seen[h] = 1; cols.push(h); }
  let rows = aoa.slice(hi + 1).map(r => cols.map((_, j) => String(r[j] == null ? '' : r[j]).trim()));
  const keep = cols.map((_, j) => raw[j] || rows.some(r => r[j] !== ''));
  return { cols: cols.filter((_, j) => keep[j]), rows: rows.map(r => r.filter((_, j) => keep[j])) };
}

function xProfile(R){
  const n = R.rows.length;
  return R.cols.map((name, j) => {
    const vals = R.rows.map(r => r[j]); const filled = vals.filter(v => v !== '');
    const counts = {}; filled.forEach(v => counts[v] = (counts[v] || 0) + 1);
    const distinct = Object.keys(counts).length;
    const nums = filled.filter(v => /^-?[\d,]*\.?\d+$/.test(v)).map(v => +v.replace(/,/g, ''));
    const isNum = filled.length > 0 && nums.length / filled.length > .9;
    const isDate = /date|day|on$|planned|actual|target|eta|due/i.test(name) ||
      (filled.length && filled.filter(v => /^\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}$/.test(v)).length / filled.length > .8);
    const isId = /\b(id|site|code|no|number|ref)\b/i.test(name) && distinct > n * .6;
    const isCat = !isNum && !isId && distinct >= 2 && distinct <= Math.max(14, Math.min(25, n / 4)) && filled.length >= 3;
    const isStatus = isCat && (/status|stage|progress|state|remark|result/i.test(name) ||
      Object.keys(counts).some(v => XDONE.test(v) || XHOLD.test(v)));
    return { name, j, blanks: n - filled.length, distinct, counts, isNum, isDate, isId, isCat, isStatus,
             sum: isNum ? nums.reduce((a, b) => a + b, 0) : 0 };
  });
}
function xStatusOf(prof){ return prof.filter(c => c.isStatus)
  .sort((a, b) => (/status/i.test(b.name) - /status/i.test(a.name)) || (a.blanks - b.blanks))[0]; }
function xDoneCount(c){ return c ? Object.entries(c.counts)
  .filter(([v]) => xtone(v) === 'ok').reduce((a, [, k]) => a + k, 0) : 0; }

const XPC = new Map();
const xprof = r => { if (!XPC.has(r.id)) XPC.set(r.id, xProfile(r)); return XPC.get(r.id); };
const XN = v => { const x = +String(v == null ? '' : v).replace(/[,\s]/g, ''); return isFinite(x) ? x : 0; };
const xpad = n => String(n).padStart(2, '0');
const XHUES = [255, 155, 40, 320, 90, 195, 15, 285];
let XFM = [];
const xfmeta = f => XFM.find(x => x.f === f) || { f, h: 255, L: '?' };
function xBuildFM(){ XFM = [...new Set(xcur.reports.map(r => r.file))]
  .map((f, i) => ({ f, h: XHUES[i % XHUES.length], L: i < 26 ? String.fromCharCode(65 + i) : String(i + 1) })); }
const xLatest = p => { const m = {}; p.reports.forEach(r => { const k = (r.file + '|' + r.sheet).toLowerCase();
  if (!m[k] || m[k].uploaded < r.uploaded) m[k] = r; }); return Object.values(m); };
const xSheetsOf = f => xLatest(xcur).filter(r => r.file === f);
const xCodeOf = r => { const i = xSheetsOf(r.file)
  .findIndex(x => x.sheet.toLowerCase() === r.sheet.toLowerCase()); return xfmeta(r.file).L + '·' + xpad(i + 1); };
const xShort = f => f.replace(/\.(xlsx|xlsm|xls|csv)$/i, '');
const xPrevOf = r => xcur.reports.filter(x => x.id !== r.id && x.file === r.file &&
  x.sheet.toLowerCase() === r.sheet.toLowerCase() && x.uploaded < r.uploaded)
  .sort((a, b) => b.uploaded - a.uploaded)[0];

/* ---- material sheets: an item column and some quantity columns ---- */
const XNOT_MAT = /^\s*(all\s*collected|collected|sent|returns?)\s*$/i;
function xMatInfo(r){
  if (XNOT_MAT.test(r.sheet)) return null;
  const P_ = xprof(r), used = new Set();
  const pick = (re, test) => { const c = P_.find(c => !used.has(c.j) && re.test(c.name) && test(c));
    if (c) used.add(c.j); return c || null; };
  const isN = c => c.isNum, isT = c => !c.isNum;
  const m = {};
  m.code = pick(/\b(code|part\s?no|sap|item\s?no|sku|mat(erial)?\s?no)\b/i, () => true);
  m.item = pick(/desc|material|item|part|product|component|equipment|article/i, isT);
  m.bal  = pick(/bal|stock|on\s?hand|avail|remain|left|in\s?hand|closing/i, isN);
  m.rec  = pick(/rec(ei)?v|deliver|grn|suppl|arriv|\bin\b|inward/i, isN);
  m.iss  = pick(/issu|used|consum|install|utili|\bout\b|dispatch|outward/i, isN);
  m.req  = pick(/req|boq|plan|need|demand|order|\bpo\b|allocat|budget|target|total/i, isN);
  const qty = pick(/qty|quantity|count|nos|amount/i, isN);
  if (!m.req && qty) m.req = qty;
  m.unit = pick(/\b(uom|unit)\b/i, isT);
  m.cat = P_.find(c => !used.has(c.j) && c.isCat &&
    /categ|type|group|class|vendor|supplier|section/i.test(c.name)) || null;
  const nq = ['req', 'rec', 'iss', 'bal'].filter(k => m[k]).length;
  const named = /material|stock|inventor|store|boq|warehouse|items?\b|mat\b/i.test(r.sheet + ' ' + r.file);
  if (!m.item || !(nq >= 2 || (named && nq >= 1))) return null;
  return m;
}
function xMatCalc(r){
  const m = xMatInfo(r); if (!m) return null;
  const g = {};
  r.rows.forEach(row => { const k = row[m.item.j]; if (!k) return;
    const o = g[k] || (g[k] = { name:k, code: m.code ? row[m.code.j] : '', unit: m.unit ? row[m.unit.j] : '',
      cat: m.cat ? row[m.cat.j] : '', req:0, rec:0, iss:0, bal:0, n:0 });
    o.n++; ['req', 'rec', 'iss', 'bal'].forEach(x => { if (m[x]) o[x] += XN(row[m[x].j]); }); });
  const items = Object.values(g);
  const hasBal = !!(m.bal || m.rec);
  items.forEach(o => {
    if (!m.bal) o.bal = m.rec ? o.rec - (m.iss ? o.iss : 0) : null;
    o.pend = m.req && m.rec ? Math.max(0, o.req - o.rec) : null;
    o.out = hasBal && o.bal <= 0 && (o.req > 0 || o.rec > 0 || o.iss > 0 || m.bal);
    o.short = o.pend !== null ? o.pend > 0 : !!o.out;
  });
  const T = k => items.reduce((a, o) => a + (o[k] || 0), 0);
  const tot = { req:T('req'), rec:T('rec'), iss:T('iss'),
    bal: hasBal ? items.reduce((a, o) => a + Math.max(0, o.bal), 0) : null };
  const deliv = m.req && m.rec && tot.req
    ? Math.round(items.reduce((a, o) => a + Math.min(o.rec, o.req), 0) / tot.req * 100) : null;
  const units = m.unit ? new Set(items.map(o => o.unit).filter(Boolean)).size : 0;
  return { m, items, tot, deliv, hasBal, units,
    shortN: items.filter(o => o.short).length, outN: items.filter(o => o.out).length };
}
const xKindOf = r => xMatInfo(r) ? 'mat' : xStatusOf(xprof(r)) ? 'trk' : 'list';
const XKIND = { mat:'Material', trk:'Tracker', list:'List' };

function xProjStats(p){
  const latest = xLatest(p); let done = 0, tot = 0;
  latest.forEach(r => { const st = xStatusOf(xProfile(r)); if (st){ done += xDoneCount(st); tot += r.rows.length; } });
  return { reports: latest.length, files: new Set(p.reports.map(r => r.file)).size,
           pct: tot ? Math.round(done / tot * 100) : null };
}

/* ---- importing ---- */
async function xImport(files){
  if (!window.XLSX){ toast('Excel reader still loading – try again in a second'); return; }
  if (!xcur) return;
  const busy = document.createElement('div'); busy.className = 'xbusy';
  busy.innerHTML = '<div>Reading workbook…</div>'; document.body.appendChild(busy);
  let added = 0, firstId = null;
  try {
    for (const f of files){
      const wb = XLSX.read(await f.arrayBuffer(), { type:'array', cellDates:true });
      for (const sn of wb.SheetNames){
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn],
          { header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd', blankrows:false });
        const R = xParseSheet(aoa); if (!R || !R.rows.length) continue;
        const r = { id: xuid(), file: f.name, sheet: sn, uploaded: Date.now(), cols: R.cols, rows: R.rows };
        xcur.reports.push(r); added++; firstId = firstId || r.id;
      }
    }
    xcur.updated = Date.now(); await XDB.put(xcur);
  } catch(e){ console.error(e); toast('Could not read that file'); }
  busy.remove();
  if (added){
    toast(added + ' sheet' + (added > 1 ? 's' : '') + ' added from ' +
          files.length + ' file' + (files.length > 1 ? 's' : ''));
    const many = new Set(xcur.reports.map(r => r.file)).size > 1;
    xcurFile = many && files.length === 1 ? files[0].name : null;
    if (added === 1) xOpenReport(firstId); else { xrep = null; xResetV(); render(); }
  } else toast('No data sheets found in that file');
}

function xFiltered(){
  let rows = xrep.rows;
  XV.filters.forEach(f => rows = rows.filter(r => f.set ? f.set.has(r[f.j])
    : f.blank ? r[f.j] === ''
    : f.notDone ? xtone(r[f.j]) !== 'ok'
    : (f.tone ? xtone(r[f.j]) === f.tone : r[f.j] === f.val)));
  if (XV.q){ const q = XV.q.toLowerCase(); rows = rows.filter(r => r.some(c => c.toLowerCase().includes(q))); }
  if (XV.sort !== null){ const j = XV.sort; rows = rows.slice().sort((a, b) => {
    const x = a[j], y = b[j]; const nx = +x.replace(/,/g, ''), ny = +y.replace(/,/g, '');
    return (x === '' ? 1 : y === '' ? -1
      : (!isNaN(nx) && !isNaN(ny) ? nx - ny : x.localeCompare(y))) * XV.dir; }); }
  return rows;
}

function xMatDash(c){
  const { m, items, tot, deliv } = c;
  const itemF = XV.filters.find(f => f.j === m.item.j && f.val !== undefined);
  const segs = o => { const s = [];
    if (m.iss) s.push({ v:o.iss, c:'var(--c-iss)' });
    if (c.hasBal) s.push({ v:Math.max(0, o.bal), c:'var(--c-stk)' });
    if (o.pend) s.push({ v:o.pend, c:'var(--c-pen)' });
    if (!s.some(x => x.v > 0)) return [{ v:o.req || 0, c:'var(--p-acc)' }];
    return s; };
  const size = o => segs(o).reduce((a, x) => a + x.v, 0);
  const top = items.slice().sort((a, b) => size(b) - size(a)).slice(0, 12);
  const max = Math.max(1, ...top.map(size));
  const shorts = items.filter(o => o.short)
    .sort((a, b) => ((b.pend == null ? -b.bal : b.pend) - (a.pend == null ? -a.bal : a.pend))).slice(0, 8);
  const u = c.units > 1 ? ' (mixed units)' : '';
  const cats = m.cat ? Object.values(items.reduce((g, o) => { const k = o.cat || '—';
    if (!g[k]) g[k] = { k, n:0, s:0 }; g[k].n++; if (o.short) g[k].s++; return g; }, {}))
    .sort((a, b) => b.n - a.n).slice(0, 8) : [];
  const cmax = Math.max(1, ...cats.map(x => x.n));
  return '<section class="glass mdash">' +
    '<div class="mdh"><h4>Material dashboard</h4><small style="color:var(--p-dim)">by ' +
      xesc(m.item.name) + (m.req ? ' · ' + xesc(m.req.name) : '') +
      (m.rec ? ' · ' + xesc(m.rec.name) : '') + (m.iss ? ' · ' + xesc(m.iss.name) : '') +
      (m.bal ? ' · ' + xesc(m.bal.name) : '') + '</small></div>' +
    '<div class="mks">' +
      '<div class="mk"><b>' + xnum(items.length) + '</b><span>items</span></div>' +
      (m.req ? '<div class="mk"><b>' + xnum(tot.req) + '</b><span>' + xesc(m.req.name) + u + '</span></div>' : '') +
      (m.rec ? '<div class="mk"><b>' + xnum(tot.rec) + '</b><span>' + xesc(m.rec.name) +
        (deliv !== null ? ' · ' + deliv + '%' : '') + '</span></div>' : '') +
      (m.iss ? '<div class="mk"><b>' + xnum(tot.iss) + '</b><span>' + xesc(m.iss.name) + '</span></div>' : '') +
      (c.hasBal ? '<div class="mk ok"><b>' + xnum(tot.bal) + '</b><span>in stock' +

        '</b><span>' + (m.req && m.rec ? 'not fully delivered' : 'short') + ' · filter</span></button>' +
      (c.hasBal ? '<button class="mk ' + (c.outN ? 'b' : 'ok') + '" data-xmset="out"><b>' + xnum(c.outN) +
        '</b><span>out of stock · filter</span></button>' : '') +

      (m.req && m.rec ? '<i class="lg" style="--c:var(--c-pen)">to deliver</i>' : '') + '</span></h5>' +
      top.map(o => '<button class="irow' + (itemF && itemF.val === o.name ? ' on' : '') +
        '" data-xmi="' + xesc(o.name) + '" title="' + xesc(o.name) + '"><span>' +

        (shorts.length
          ? shorts.map(o => '<button class="irow' + (itemF && itemF.val === o.name ? ' on' : '') +
            '" data-xmi="' + xesc(o.name) + '" title="' + xesc(o.name) + '"><span>' + xesc(o.name) +
            '</span><em class="w">' + (o.pend !== null ? xnum(o.pend) + ' to deliver'
              : o.bal < 0 ? xnum(o.bal) + ' balance' : 'out of stock') + '</em></button>').join('')
          : '<p style="color:var(--okT);font-size:14px;padding:4px 6px">Nothing short — every item ' +
            'is covered.</p>') + '</div>' +
      (cats.length ? '<div class="mcard"><h5>' + xesc(m.cat.name) + '</h5>' +
        cats.map(x => '<button class="bar' +
          (XV.filters.some(f => f.j === m.cat.j && f.val === x.k) ? ' on' : '') +
          '" data-xfj="' + m.cat.j + '" data-xfv="' + xesc(x.k) + '"><span>' + xesc(x.k) +
          '</span><em>' + x.n + ' items' +
          (x.s ? ' · <span style="color:var(--pending)">' + x.s + ' short</span>' : '') +
          '</em><div class="track"><i style="width:' + (x.n / cmax * 100) + '%"></i></div></button>').join('') +
        '</div>' : '') +
    '</div></div></section>';
}

function xReportView(){
  const P_ = xprof(xrep), st = xStatusOf(P_), n = xrep.rows.length, mc = xMatCalc(xrep);
  const done = xDoneCount(st), pct = st ? Math.round(done / n * 100) : null;
  const prev = xPrevOf(xrep), pst = prev && xStatusOf(xProfile(prev));
  const pd = pst ? done - xDoneCount(pst) : null;
  const numsK = P_.filter(c => c.isNum && !c.isId && !/^(no|#|s\.?no|sr)/i.test(c.name)).slice(0, 2);
  const rows = xFiltered();
  const fl = XV.filters.map((f, k) => '<span class="fchip"><span>' + xesc(xrep.cols[f.j]) + ': ' +
    (f.label ? xesc(f.label) : f.blank ? 'blank' : f.tone === 'b' ? 'problem'
     : f.notDone ? 'not done' : xesc(f.val)) +
    '</span><button data-xunf="' + k + '" aria-label="Remove filter">✕</button></span>').join('');
  const show = rows.slice(0, XV.limit), fmx = xfmeta(xrep.file), ss = xSheetsOf(xrep.file);
  const si = ss.findIndex(r => r.sheet.toLowerCase() === xrep.sheet.toLowerCase());
  const statJ = st ? st.j : -1, numJ = new Set(P_.filter(c => c.isNum).map(c => c.j));
  const balJ = mc && mc.m.bal ? mc.m.bal.j : -1;
  const k = mc ? 'mat' : st ? 'trk' : 'list';
  const ringP = mc ? mc.deliv : pct;
  return '<div class="content">' +
    '<section class="glass head hue" style="--h:' + fmx.h + '">' +
      (ringP !== null ? '<div class="ring" style="--p:' + ringP + (mc ? ';--rc:var(--ok)' : '') +
        '"><div><span><b>' + ringP + '%</b>' + (mc ? 'delivered' : 'done') + '</span></div></div>' : '') +
      '<div class="t"><div class="where"><span class="fb">' + fmx.L + '</span>' +
        '<span style="overflow-wrap:anywhere">' + xesc(xrep.file) + '</span><span>·</span>' +
        '<span>Sheet ' + (si + 1) + ' of ' + ss.length + '</span>' +
        '<span class="kind ' + k + '">' + XKIND[k] + '</span></div>' +
        '<h3>' + xesc(xrep.sheet) + '</h3><p>Uploaded ' + xwhen(xrep.uploaded) +
        (prev ? ' · <button class="btn sm ghost" style="padding:2px 10px" data-xrep="' + xesc(prev.id) +
          '">previous ' + xwhen(prev.uploaded) + '</button>' : '') + '</p></div>' +
      '<div class="kpis"><div class="kpi"><b>' + xnum(n) + '</b><span>rows</span></div>' +
        (st && !mc ? '<div class="kpi"><b>' + xnum(done) +
          (pd !== null && pd !== 0 ? '<span class="' + (pd > 0 ? 'up' : 'dn') + '">' +
            (pd > 0 ? '+' : '') + pd + '</span>' : '') + '</b><span>done</span></div>' +
          '<div class="kpi"><b>' + xnum(n - done) + '</b><span>open</span></div>' : '') +
        (mc ? '' : numsK.map(c => '<div class="kpi"><b>' + xnum(c.sum) + '</b><span>total ' +
          xesc(c.name) + '</span></div>').join('')) + '</div>' +
      '<button class="btn sm ghost" data-xdelr="1" style="align-self:flex-start">Remove</button>' +
    '</section>' +
    (mc ? xMatDash(mc) : '') +
    '<section class="glass tbl"><div class="tools">' +
      '<label class="search"><span aria-hidden="true">⌕</span>' +
        '<input id="xq" placeholder="Search every column" value="' + xesc(XV.q) + '"></label>' +
      fl + (XV.filters.length || XV.q ? '<button class="btn sm ghost" data-xclr="1">Clear</button>' : '') +
      '<span class="cap">' + xnum(rows.length) + ' of ' + xnum(n) + '</span>' +
      '<button class="btn sm" data-xexp="1">Export view</button></div>' +
    '<div class="scroll"><table><thead><tr><th class="rn">#</th>' +
      xrep.cols.map((c, j) => '<th data-xsort="' + j + '">' + xesc(c) +
        (XV.sort === j ? (XV.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>').join('') + '</tr></thead><tbody>' +
      show.map((r, i) => '<tr><td class="rn">' + (i + 1) + '</td>' +
        r.map((v, j) => v === '' ? '<td class="blank">–</td>'
          : j === statJ ? '<td title="' + xesc(v) + '"><span class="xtag ' + xtone(v) + '">' +
            xesc(v) + '</span></td>'
          : j === balJ ? '<td class="n"><span class="xtag ' + (XN(v) <= 0 ? 'b' : 'ok') + '">' +
            xesc(v) + '</span></td>'
          : '<td' + (numJ.has(j) ? ' class="n"' : '') + ' title="' + xesc(v) + '">' + xesc(v) + '</td>')
        .join('') + '</tr>').join('') + '</tbody></table>' +
      (rows.length ? '' : '<p style="padding:24px;text-align:center;color:var(--p-dim)">' +
        'No rows match.</p>') + '</div>' +
    (rows.length > XV.limit ? '<div class="more"><button class="btn sm" data-xmore="1">Show ' +
      Math.min(300, rows.length - XV.limit) + ' more</button></div>' : '') +
    '</section></div>';
}

/* the one entry point render() calls */
function renderExcel(){
  if (!xready) return '<div class="empty"><div class="big">📁</div>Opening what is on this device…</div>';
  return '<div id="xl">' + (xcur ? xProjectPage() : xHome()) + '</div>';
}

function xResetV(){ XV.q = ''; XV.filters = []; XV.sort = null; XV.dir = 1; XV.limit = 150; }
function xOpenProject(id){ xcur = XP.find(p => p.id === id); xcurFile = null; xrep = null; xResetV(); render(); }
function xOpenReport(id){ xrep = xcur.reports.find(r => r.id === id);
  if (xrep && new Set(xcur.reports.map(r => r.file)).size > 1) xcurFile = xrep.file;
  xResetV(); render(); window.scrollTo({ top: 0 }); }
function xStep(d){ if (!xrep) return; const s = xSheetsOf(xrep.file);
  const i = s.findIndex(r => r.sheet.toLowerCase() === xrep.sheet.toLowerCase());
  const nx = s[i + d]; if (nx) xOpenReport(nx.id); }

function xSheetEditor(p){
  const isNew = !p; p = p || { name:'', client:'' };
  const v = document.createElement('div'); v.className = 'xveil';
  v.innerHTML = '<form class="xsheet" autocomplete="off"><h3>' +
    (isNew ? 'New project' : 'Edit project') + '</h3>' +
    '<label class="f"><span class="cap">Project name</span><input name="name" required maxlength="80" ' +
      'placeholder="e.g. Lamp Pole Rollout" value="' + xesc(p.name) + '"></label>' +
    '<label class="f"><span class="cap">Client · scope</span><input name="client" maxlength="80" ' +
      'placeholder="optional, e.g. Dialog · Western" value="' + xesc(p.client) + '"></label>' +
    '<div class="acts">' + (isNew ? '' : '<button type="button" class="del" data-xdelp="1">Delete project</button>') +
      '<span class="sp"></span><button type="button" class="btn" data-xcancel="1">Cancel</button>' +
      '<button class="btn pri">' + (isNew ? 'Create' : 'Save') + '</button></div></form>';
  document.body.appendChild(v);
  const f = v.querySelector('form'); f.name.focus();
  const close = () => v.remove();
  v.addEventListener('mousedown', e => { if (e.target === v) close(); });
  v.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  v.querySelector('[data-xcancel]').onclick = close;
  const d = v.querySelector('[data-xdelp]');
  if (d) d.onclick = async () => {
    if (!confirm('Delete “' + p.name + '” and all its reports?')) return;
    await XDB.del(p.id); await xLoad(); close(); xcur = null; xrep = null; render(); toast('Project deleted'); };
  f.onsubmit = async e => { e.preventDefault(); const name = f.name.value.trim(); if (!name) return;
    if (isNew){ const np = { id: xuid(), name, client: f.client.value.trim(),
        created: Date.now(), updated: Date.now(), reports: [] };
      await XDB.put(np); await xLoad(); close(); xOpenProject(np.id); }
    else { p.name = name; p.client = f.client.value.trim(); await XDB.put(p); await xLoad();
      xcur = XP.find(x => x.id === p.id); xrep = xrep && xcur.reports.find(r => r.id === xrep.id);
      close(); render(); } };
}

function xExportView(){
  if (!window.XLSX) return;
  const ws = XLSX.utils.aoa_to_sheet([xrep.cols, ...xFiltered()]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, xrep.sheet.slice(0, 31));
  XLSX.writeFile(wb, xcur.name + ' - ' + xrep.sheet + '.xlsx');
}

/* Everything that needs a live element rather than markup. render() calls
   this after writing #view, and only when this half is the one on screen. */
function wireExcel(){
  const box = $('xl'); if (!box) return;
  /* the sheet finder inside a workbook card with more than eight sheets */
  box.querySelectorAll('[data-xfind]').forEach(inp => inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    inp.closest('[data-xwb]').querySelectorAll('.tile').forEach(t => {
      t.hidden = !!q && !t.dataset.xname.includes(q); });
  });
  /* dropping files on either drop target. The click is handled by the
     delegated listener below, so only the drag half is wired here. */
  box.querySelectorAll('[data-xdrop]').forEach(d => {
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over');
      xImport([...e.dataTransfer.files]); };
  });
  /* the table search. Debounced, and the caret is put back afterwards
     because the repaint replaces the input it was typed into. */
  const q = $('xq');
  if (q){ let t; q.oninput = () => { clearTimeout(t); const v = q.value;
    t = setTimeout(() => { XV.q = v; XV.limit = 150; render();
      const again = $('xq');
      if (again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 220); }; }
  /* and the open sheet brought into view in the strip */
  const st = $('xstabs'), on = st && st.querySelector('.stab.on');
  if (on) st.scrollLeft = on.offsetLeft - st.clientWidth / 2 + on.offsetWidth / 2;
}

/* Both listeners below return immediately unless the Excel Browser tab is
   the one on screen. A document-level handler that acts on any page is how
   one half of a merged tool starts eating the other half's clicks. */
document.addEventListener('click', async e => {
  if (ACTIVE !== EXCEL_TAB) return;
  const drop = e.target.closest('[data-xdrop]');
  if (drop){ $('xfile').click(); return; }
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.xopen) xOpenProject(d.xopen);
  else if (d.xnew) xSheetEditor();
  else if (d.xhome){ xcur = null; xrep = null; xcurFile = null; xResetV(); render(); }
  else if (d.xedit) xSheetEditor(xcur);
  else if (d.xup) $('xfile').click();
  else if (d.xstep) xStep(+d.xstep);
  else if (d.xrep) xOpenReport(d.xrep);
  else if (d.xov){ xrep = null; xResetV(); render(); }
  else if (d.xft !== undefined){ xcurFile = d.xft || null; xrep = null; xResetV(); render(); }
  else if (d.xmset){ const M = xMatCalc(xrep);
    const set = new Set(M.items.filter(o => d.xmset === 'out' ? o.out : o.short).map(o => o.name));
    const had = XV.filters.some(f => f.set && f.label === (d.xmset === 'out' ? 'out of stock' : 'short items'));
    XV.filters = XV.filters.filter(f => !f.set && f.j !== M.m.item.j);
    if (!had) XV.filters.push({ j:M.m.item.j, set,
      label: d.xmset === 'out' ? 'out of stock' : 'short items' });
    XV.limit = 150; render(); }
  else if (d.xmi !== undefined){ const M = xMatCalc(xrep), j = M.m.item.j;
    const had = XV.filters.some(f => f.j === j && f.val === d.xmi);
    XV.filters = XV.filters.filter(f => f.j !== j);
    if (!had) XV.filters.push({ j, val:d.xmi }); XV.limit = 150; render(); }
  else if (d.xdelf){ if (!confirm('Remove ' + d.xdelf + ' and its sheets?')) return;
    xcur.reports = xcur.reports.filter(r => r.file !== d.xdelf); await XDB.put(xcur);
    xrep = null; xcurFile = null; render(); toast('File removed'); }
  else if (d.xfj){ const j = +d.xfj, val = d.xfv;
    const k = XV.filters.findIndex(f => f.j === j && f.val === val);
    if (k > -1) XV.filters.splice(k, 1);
    else { XV.filters = XV.filters.filter(f => f.j !== j); XV.filters.push({ j, val }); }
    XV.limit = 150; render(); }
  else if (d.xunf !== undefined){ XV.filters.splice(+d.xunf, 1); render(); }
  else if (d.xclr){ XV.filters = []; XV.q = ''; render(); }
  else if (d.xsort !== undefined){ const j = +d.xsort;
    if (XV.sort === j) XV.dir *= -1; else { XV.sort = j; XV.dir = 1; } render(); }
  else if (d.xmore){ XV.limit += 300; render(); }
  else if (d.xexp) xExportView();
  else if (d.xdelr){ if (!confirm('Remove “' + xrep.sheet + '” from ' + xcur.name + '?')) return;
    xcur.reports = xcur.reports.filter(r => r.id !== xrep.id); await XDB.put(xcur);
    xrep = null; xResetV(); render(); }
});
document.addEventListener('keydown', e => {
  if (ACTIVE !== EXCEL_TAB || !xrep) return;
  if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('.xveil') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  xStep(e.key === 'ArrowRight' ? 1 : -1);
});

/* ---------- render ---------- */
function render(){
  $('view').innerHTML = ACTIVE === 'Dashboard' ? renderDashboard()
                      : ACTIVE === 'Export'    ? renderExport()
                      : ACTIVE === EXCEL_TAB   ? renderExcel()
                      : renderGrid(ACTIVE);
  [...document.querySelectorAll('[data-ex]')].forEach(b => b.onclick = () => {
    const k = b.dataset.ex;
    if (k === '*') exportBook();
    else if (k === '#mod') exportMod();
    else exportSheet(k);
  });
  const q = $('q');
  if (q){
    let t;
    q.addEventListener('input', e => { clearTimeout(t); const v = e.target.value;
      t = setTimeout(() => { QUERY = v; render(); const n = $('q');
        if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 140); });
  }
  const w = $('wrapBtn'); if (w) w.onclick = () => { WRAP = !WRAP; render(); };
  const es = $('expSheet');
  if (es) es.onclick = () => {
    // exactly the rows on screen, filter and all
    const sh = BOOK[ACTIVE];
    const parts = QUERY.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const shown = parts.length
      ? sh.rows.filter(r => { const b = r.join(' ').toLowerCase(); return parts.every(p => b.includes(p)); })
      : sh.rows;
    exportSheet(ACTIVE, shown);
  };
  const eb = $('expBook'); if (eb) eb.onclick = () => exportBook();
  if (ACTIVE === EXCEL_TAB) wireExcel();
  renderFooter();
}
load();
/* Read what is on this device alongside the published workbook, and repaint
   only if the browser tab is the one being looked at. A failed read leaves
   xready true so the tab says what it found rather than spinning. */
xLoad().then(() => { if (ACTIVE === EXCEL_TAB) render(); })
  .catch(e => { console.error(e); xready = true; });
$('xfile').onchange = e => { const f = [...e.target.files]; e.target.value = '';
  if (f.length) xImport(f); };
</script>
<footer></footer>
</body>
</html>
