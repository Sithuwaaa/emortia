<style>
  :root{
    /* teal - the site's Tools colour; this is the flagship tool */
    --navy:#0f2126;--navy-2:#16323a;
    --bg:#0c1619;--card:#142428;--card-2:#0f1d21;--line:#1e363c;--line3:#2c4c54;
    --text:#e9f4f6;--muted:#8fa8ad;--zebra:rgba(255,255,255,.018);--rowhover:rgba(31,151,168,.10);
    /* ---- the eleven status hues, each clearly distinct from the teal chrome

       ALL ELEVEN ARE TOKENS NOW. Four used to be hex literals sitting in
       the BUCKETS array - #a8c93f, #e8a13c, #e2596b, #5f6f75 - and a hex
       that no token names is invisible to every guard. That is not a
       theory: the two worst numbers measured on this page, 1.73 and 1.96,
       were both hardcoded. The tokenised hues were merely poor; the
       untokenised ones could not be checked at all.

       Each value is solved for the CHIP, which is the strict rendering:
       11.5px/700 text in the colour on a 15% tint of itself over the card,
       needing 4.5:1. The KPI big number (3:1) and the bar fills follow
       from it. Hue and chroma held in OKLab; lightness only.

       Dark needed two moves, light eight. --partial keeps its lime here at
       6.80 and only goes olive in light, which is the same
       two-values-per-token shape --ok has always had. */
    --ok:#34c98b;--warn:#f2764a;--info:#4f9bf0;--wip:#9a8bf2;
    --idle:#81989e;      /* was #7f979d, chip 4.48 on the field card -> 4.55 */
    --partial:#a8c93f;   /* chip 6.80 */
    --pending:#e8a13c;   /* chip 5.96 */
    --dispute:#f06576;   /* was #e2596b, chip 3.98 -> 4.51 */
    --dropped:#87979e;   /* was #5f6f75, then #85959c for the site card. The
                            field card is lighter, which took the chip back
                            down to 4.46 -> 4.56 */
  }
  html[data-theme="light"]{
    --navy:#12262b;--navy-2:#16323a;
    --bg:#eef5f6;--card:#ffffff;--card-2:#f4fafb;--line:#d5e5e8;--line3:#bcd4d9;
    --text:#10262b;--muted:#5f7b81;--zebra:rgba(0,0,0,.022);--rowhover:rgba(20,125,141,.09);
    /* eight of the eleven moved here. Every one is its own colour taken
       darker in OKLab until the chip clears 4.5 - nothing re-hued, so On
       Air is still green, Dispute still red, Terminated still grey. */
    --ok:#007748;        /* was #1f9a68, chip 3.01 -> 4.52 */
    --warn:#b1441a;      /* was #c2542c, chip 3.75 -> 4.53 */
    --info:#2565c5;      /* was #2f6fd0, chip 4.00 -> 4.53 */
    --wip:#5a49c6;       /* chip 5.24, unchanged */
    --idle:#516d72;      /* was #5f7b81, chip 3.78 -> 4.55 */
    --partial:#567100;   /* was #a8c93f, chip 1.73 -> 4.55 - the lime is
                            kept in dark, where it measures 6.80 */
    --pending:#9a5800;   /* was #e8a13c, chip 1.96 -> 4.51 */
    --dispute:#bb344b;   /* was #e2596b, chip 2.99 -> 4.53 */
    --dropped:#5b6b71;   /* was #5f6f75, chip 4.30 -> 4.54 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}

  .hdr{position:sticky;top:0;z-index:30;background:var(--navy);
    color:var(--barInk);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--barLine);box-shadow:none;overflow:hidden}
  .hdr>*{position:relative;z-index:1}
  .hdr .logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,var(--accentB),var(--accentD));
    display:grid;place-items:center;font-weight:800;color:var(--barDim);font-size:14px;flex-shrink:0;
    box-shadow:0 0 18px rgba(31,151,168,.5)}
  @keyframes tFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hdr h1{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;color:var(--barInk)}
  .pill{font-family:'Space Mono',monospace;font-size:11.5px;background:var(--barFill);border:1px solid var(--barLine);
    color:var(--barDim);border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accentB)}
  /* tLed removed 18 Oct: the nav bar does not animate. The dot stays,
     resting at the bright frame, like the one after the tool name. */
  .pill b{color:var(--accentB)}
  .theme{background:none;border:1px solid var(--barLine);color:var(--barInk);border-radius:9px;width:34px;height:34px;
    font-size:15px;cursor:pointer;flex-shrink:0;transition:border-color .2s ease,transform .2s ease}
  .theme:hover{border-color:var(--accentB);transform:scale(1.06)}

  /* dataset switcher - the first thing on the page */
  .dsbar{position:sticky;top:55px;z-index:26;display:flex;gap:8px;padding:12px 14px 10px;
    background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dsbtn{flex:1;min-width:160px;text-align:left;border:1px solid var(--line);background:var(--card);
    color:var(--muted);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:700;
    font-family:'Bricolage Grotesque',sans-serif;display:flex;flex-direction:column;gap:2px;
    transition:transform .15s ease,border-color .15s ease,color .15s ease,background .15s ease}
  .dsbtn em{font-style:normal;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.04em;
    color:var(--muted);font-weight:400}
  .dsbtn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--text)}
  .dsbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;
    box-shadow:0 6px 18px var(--glowSoft)}
  .dsbtn.on em{color:var(--accent-ink);opacity:.75}

  .tabs{position:sticky;top:120px;z-index:25;display:flex;gap:4px;overflow-x:auto;padding:10px 14px;
    background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;border:1px solid var(--line);background:var(--card-2);color:var(--muted);border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:transform .15s ease,border-color .15s ease,color .15s ease}
  .tab:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--text)}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px rgba(31,151,168,.28)}

  main{max-width:1500px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 40px)}
  @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
    position:relative;overflow:hidden;animation:rise .4s ease both}
  .kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--accent))}
  .kpi .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:'Bricolage Grotesque',sans-serif;font-size:34px;font-weight:800;line-height:1.1;margin-top:4px;color:var(--k,var(--text))}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;animation:rise .45s ease both}
  .panel h2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accentB)}
  .panel h2 .tag{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);font-weight:400}
  .cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:grid;grid-template-columns:132px 1fr 44px;gap:10px;align-items:center;font-size:13px}
  .barrow .lb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{height:9px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1px solid var(--line)}
  /* display:block matters - as a span it stays inline, and then width/height are ignored.
     The real width is the base style, not the animation's end state: if animations are
     throttled (background tab, reduced motion) the bar must still show the right fill. */
  .barfill{display:block;height:100%;border-radius:999px;background:var(--b,var(--accent));width:var(--w,0);
    animation:grow .8s cubic-bezier(.22,.9,.3,1)}
  @keyframes grow{from{width:0}}
  @media (prefers-reduced-motion:reduce){.barfill{animation:none}}
  .barrow .n{font-family:'Space Mono',monospace;font-size:12.5px;text-align:right;color:var(--text)}

  /* MOD permission cards */
  .mod{border-left:3px solid var(--warn)}
  .modlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .modcard{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .modcard .id{font-family:'Space Mono',monospace;font-weight:700;color:var(--warnT);font-size:15px}
  .modcard .nm{font-weight:600;margin-top:2px}
  .modcard .perm{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;border-radius:999px;
    padding:3px 10px;border:1px solid var(--warn);color:var(--warnT);background:color-mix(in oklab,var(--warn) 14%,transparent)}
  .modcard .serves{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .modcard .serves b{color:var(--text);font-family:'Space Mono',monospace;font-weight:700;font-size:12px}
  /* the tabs this site is written on */
  .modcard .where{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tabchip{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.03em;
    border:1px solid var(--line3);border-radius:999px;padding:3px 9px;color:var(--muted);
    background:color-mix(in oklab,var(--warn) 7%,transparent);white-space:nowrap}
  /* the export tab */
  .exlist{display:flex;flex-direction:column;gap:8px}
  .exrow{display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px}
  .exrow>div:first-child{flex:1;min-width:0}
  .exrow.whole{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 8%,var(--card-2))}
  .exname{font-weight:600;font-size:14.5px}
  .exmeta{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:3px}
  .note{font-size:13px;color:var(--muted);line-height:1.65}

  .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:200px;max-width:420px}
  .search input{width:100%;font-family:'Space Mono',monospace;font-size:14px;padding:10px 14px 10px 34px;
    border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;
    transition:border-color .2s ease,box-shadow .2s ease}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,151,168,.28)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--accentB)}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 13px;
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s ease,border-color .15s ease}
  .btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  .btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .count{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-left:auto}

  .gridwrap{overflow:auto;max-height:calc(100vh - 260px);border:1px solid var(--line);border-radius:12px;background:var(--card-2)}
  table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
  thead th{position:sticky;top:0;z-index:3;background:var(--card);color:var(--accentB);
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    text-align:left;padding:10px 12px;border-bottom:1px solid var(--line3);border-right:1px solid var(--line);
    white-space:nowrap;font-weight:700}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    vertical-align:top;max-width:280px}
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody tr:hover{background:var(--rowhover)}
  .nowrap tbody td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap tbody td{white-space:pre-wrap;word-break:break-word}
  th.rn,td.rn{position:sticky;left:0;z-index:2;background:var(--card);color:var(--muted);
    font-family:'Space Mono',monospace;font-size:11px;text-align:center;width:46px;min-width:46px;padding:9px 6px}
  thead th.rn{z-index:4}
  tbody td.k1{position:sticky;left:46px;z-index:2;background:var(--card);font-family:'Space Mono',monospace;
    font-weight:700;color:var(--accentB);white-space:nowrap}
  thead th.k1{left:46px;z-index:4}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;
    border:1px solid var(--c);color:var(--c);background:color-mix(in oklab,var(--c) 15%,transparent)}
  .dim{color:var(--muted)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:42px;margin-bottom:10px;animation:tFloat 5s ease-in-out infinite}
  .err{border:1px solid var(--warn);background:color-mix(in oklab,var(--warn) 8%,transparent);
    border-radius:12px;padding:18px;line-height:1.6}
  .err code{font-family:'Space Mono',monospace;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:5px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--navy-2);color:var(--barInk);border:1px solid var(--barLine);padding:10px 18px;border-radius:10px;
    font-family:'Space Mono',monospace;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.25s;
    pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{color:var(--muted);font-family:'Space Mono',monospace;font-size:11.5px;text-align:center;padding:22px 0 8px;line-height:1.8}
  footer a{color:var(--accentB)}
  #file{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}

  /* the site's mark, and the way back to it */
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;text-decoration:none;font-size:0;
    padding:0;border:none;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease}
  .hdr .logo:hover{transform:scale(1.09);box-shadow:0 0 24px rgba(176,58,86,.75)}
  .hdr .logo:focus-visible{outline:2px solid #f7edf0;outline-offset:3px}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  @media (prefers-reduced-motion:reduce){.hdr .logo{transition:none}}

  /* the site's name beside its mark, both leading home */
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-0.02em;color:var(--barInk);white-space:nowrap}
  /* the site's name and the tool's are different things, so they are kept apart */
  .hdr .hsep{width:1px;height:19px;background:var(--barLine);flex-shrink:0;margin:0 1px}
  /* the mark is inside the link now, so the lift belongs to the whole brand */
  .hdr .brand:hover .logo{transform:scale(1.06)}
  /* on a narrow screen the tool's own name is the one worth keeping */

  /* What a cramped header gives up, and in what order. The status pill is the
     most expendable thing in it - it was taking half the bar and squeezing the
     tool name down to "Site Ac…" long before the site name joined it. */
  .hdr h1{flex:0 1 auto;min-width:7ch}
  .hdr .pill{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }

  /* ---------- the photograph, behind both halves ------------------------

     Field Operations' own pair, the same treatment What To Do uses: a fixed
     cover layer with a tint over it, so the glass has something to be glass
     against. The design project ships these as PNGs - 2.6 MB and 3.0 MB -
     and that is a deliberate divergence here, exactly as in What To Do: the
     page loads a WebP pair instead, 215-393 KB, cover-cropped to the size
     it is painted at. The PNGs stay in the gitignored media/backgroud.

     body goes transparent so the layer shows; html keeps --bg, which is
     what is seen before the image arrives and wherever it cannot decode. */
  .scene{position:fixed;inset:0;pointer-events:none;z-index:0;background-color:var(--bg);
    background-image:var(--scene);background-position:center;background-size:cover}
  .scene::after{content:'';position:absolute;inset:0;background:var(--tint)}
  html{--scene:image-set(url('img/field-dark-1280.webp') type('image/webp'));
    --tint:linear-gradient(rgba(2,12,30,.72),rgba(2,12,30,.82))}
  html[data-theme="light"]{--scene:image-set(url('img/field-light-1280.webp') type('image/webp'));
    --tint:linear-gradient(rgba(30,50,140,.2),rgba(30,50,140,.12))}
  @media (min-width:900px){
    html{--scene:image-set(url('img/field-dark-1672.webp') type('image/webp'))}
    html[data-theme="light"]{--scene:image-set(url('img/field-light-1672.webp') type('image/webp'))}
  }
  body{background:transparent}
  /* ONLY the two that were not already positioned. The first version of this
     named .hdr, .dsbar and .tabs too, and position:relative silently undid
     their position:sticky - the dataset switcher and the tab strip stopped
     sticking and the tab strip started overlapping main. They already carry
     z-index 30, 26 and 25, every one of them above the photograph's 0, so
     they needed nothing from here. */
  main,footer{position:relative;z-index:1}

  /* ---------- the Excel browser ----------------------------------------

     The half drawn in Claude Design, imported from the design project and
     scoped under #xl so none of it can reach the rollout dashboard. Every
     rule below is the design's own with its selector prefixed; the glass
     tokens are the design's values, and its accents are already the Field
     Operations accents in category.css, which is why the two halves agree
     without either being retuned.

     The three status hues it asks for come from this tool's own eleven
     rather than from the design's --ok/--warn/--bad, because those eleven
     are the ones palette.test.js solves for the card the page paints.

     Names are prefixed in the script too - XDB, xParseSheet, xLoad -
     because the dashboard already has a DB, a parseSheet and a load, and
     silently shadowing any of them would break the half that works. */
  #xl{
    --p-ink:#E2E6EE; --p-dim:#B4BCCC; --p-acc2:#A5C3FF;
    /* these two ARE the family accents - taken, not restated */
    --p-acc:var(--accent); --p-accInk:var(--accent-ink);
    --p-glass:rgba(136,174,255,.07); --p-edge:rgba(165,195,255,.24); --p-faint:rgba(165,195,255,.14);
    --p-chip:rgba(165,195,255,.1); --p-field:rgba(9,28,49,.55); --p-solid:rgba(9,22,42,.9);
    --p-blur:blur(14px) saturate(1.4); --p-inset:inset 0 1px 0 rgba(255,255,255,.1);
    --p-shadow:0 18px 40px -24px rgba(0,0,0,.6);
    --c-iss:var(--p-acc);--c-stk:var(--ok);--c-pen:var(--pending);
    color:var(--p-ink);font-family:Jost,'Hanken Grotesk',-apple-system,sans-serif;
    display:flex;flex-direction:column;gap:20px;max-width:1240px;margin:0 auto}
  html[data-theme="light"] #xl{
    --p-ink:#141A2A; --p-dim:#3F475A; --p-acc2:#1B2A8C;
    --p-acc:var(--accent); --p-accInk:var(--accent-ink);
    --p-glass:rgba(255,255,255,.7); --p-edge:rgba(255,255,255,.75); --p-faint:rgba(3,4,94,.1);
    --p-chip:rgba(3,4,94,.07); --p-field:rgba(255,255,255,.75); --p-solid:rgba(255,255,255,.96);
    --p-blur:blur(32px) saturate(1.3) brightness(1.8); --p-inset:inset 0 1px 0 rgba(255,255,255,.85);
    --p-shadow:0 18px 40px -24px rgba(10,20,60,.45)}
  #xl *{box-sizing:border-box;margin:0;padding:0}
  #xl [hidden]{display:none !important}
  #xl button,#xl input{font:inherit;color:inherit}
  #xl .glass{position:relative;border-radius:30px;background:var(--p-glass);
    backdrop-filter:var(--p-blur);-webkit-backdrop-filter:var(--p-blur);
    border:1px solid var(--p-edge);box-shadow:var(--p-inset),var(--p-shadow)}
  #xl .cap{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--p-dim)}
  #xl .mono{font-family:'JetBrains Mono','Space Mono',monospace}
  #xl .serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}

  #xl .hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;color:#F3F6FC}
  #xl .hero h2{font:500 46px/1.05 'Cormorant Garamond',Georgia,serif}
  #xl .hero h2 em{font-style:italic}
  #xl .hero p{color:#D6DDEB;margin-top:4px}
  #xl .hero .sp{flex:1}
  /* over the photograph in light mode, the same stroke What To Do uses -
     centred, so paint-order keeps the fill on top and the letterform whole */
  html[data-theme="light"] #xl .hero h2,
  html[data-theme="light"] #xl .hero p{
    color:#FFFFFF;paint-order:stroke fill;-webkit-text-stroke:2.5px rgba(6,10,48,.8);
    text-shadow:0 2px 14px rgba(6,10,48,.7)}

  #xl .btn{cursor:pointer;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:500;
    border:1px solid var(--p-edge);background:var(--p-chip);color:var(--p-ink);white-space:nowrap;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #xl .btn:hover{background:var(--p-faint)}
  #xl .btn.pri{background:var(--p-acc);border-color:transparent;color:var(--p-accInk)}
  #xl .btn.pri:hover{filter:brightness(1.08)}
  #xl .btn.ghost{background:transparent}
  #xl .btn.sm{padding:6px 12px;font-size:13px}
  html[data-theme="light"] #xl .hero .btn:not(.pri){background:rgba(255,255,255,.82)}

  #xl .phead{display:flex;align-items:center;gap:24px;padding:24px 28px;flex-wrap:wrap}
  #xl .pback{width:44px;height:44px;border-radius:50%;border:1px solid var(--p-edge);
    background:var(--p-chip);color:var(--p-ink);font-size:18px;cursor:pointer;flex-shrink:0}
  #xl .pback:hover{background:var(--p-faint)}
  #xl .pt{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
  #xl .pt h2{font:500 48px/1 'Cormorant Garamond',Georgia,serif;overflow-wrap:anywhere}
  #xl .pm{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--p-dim)}
  #xl .pm span{white-space:nowrap;line-height:1.5}
  #xl .pact{display:flex;padding:4px;border-radius:99px;background:var(--p-solid);border:1px solid var(--p-edge)}
  html[data-theme="light"] #xl .pact{background:rgba(3,4,94,.07);border-color:rgba(3,4,94,.14)}
  #xl .pact button{border:0;border-radius:99px;padding:9px 18px;background:transparent;color:var(--p-ink);
    font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  #xl .pact button:hover{background:var(--p-faint)}
  #xl .pact button.on{background:var(--p-acc);color:var(--p-accInk)}
  #xl .pact button.on:hover{filter:brightness(1.08);background:var(--p-acc)}

  #xl .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  #xl .proj{padding:22px 24px;display:flex;flex-direction:column;gap:14px;cursor:pointer;
    text-align:left;color:inherit;font:inherit;transition:transform .2s ease}
  #xl .proj:hover{transform:translateY(-2px);border-color:var(--p-acc)}
  #xl .proj h3{font:500 28px/1.1 'Cormorant Garamond',serif;overflow-wrap:anywhere}
  #xl .proj .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--p-dim)}
  #xl .track{height:8px;border-radius:99px;background:var(--p-faint);overflow:hidden}
  #xl .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p-acc2),var(--p-acc))}
  html[data-theme="light"] #xl .track i{background:linear-gradient(90deg,#3446C8,#03045E)}
  #xl .newp{border-style:dashed;align-items:center;justify-content:center;min-height:170px;color:var(--p-ink)}
  #xl .newp b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;
    font-weight:400;background:var(--p-acc);color:var(--p-accInk)}

  #xl .hue{--fc:oklch(.82 .11 var(--h));--fbg:oklch(.82 .11 var(--h) / .16)}
  html[data-theme="light"] #xl .hue{--fc:oklch(.42 .15 var(--h));--fbg:oklch(.55 .15 var(--h) / .12)}
  #xl .fb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;
    font:700 12px 'JetBrains Mono',monospace;background:var(--fc);color:var(--p-accInk);flex-shrink:0}
  html[data-theme="light"] #xl .fb{color:#fff}
  #xl .code{font:500 11.5px 'JetBrains Mono',monospace;color:var(--fc);background:var(--fbg);
    padding:2px 7px;border-radius:6px;font-style:normal;white-space:nowrap}
  #xl .kind{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;
    letter-spacing:.1em;text-transform:uppercase;color:var(--p-dim);white-space:nowrap}
  #xl .kind::before{content:'';width:7px;height:7px;border-radius:2px;background:currentColor}
  #xl .kind.mat{color:var(--pending)}
  #xl .kind.trk{color:var(--p-acc2)}
  html[data-theme="light"] #xl .kind.trk{color:var(--p-acc)}

  #xl .ftabs{display:flex;gap:6px;padding:6px;border-radius:99px;overflow-x:auto;
    scrollbar-width:none;max-width:100%;align-self:flex-start}
  #xl .ftabs::-webkit-scrollbar{display:none}
  #xl .ftab{display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;
    padding:7px 16px 7px 8px;border-radius:99px;font-size:14px;font-weight:500;color:var(--p-ink);
    white-space:nowrap;flex-shrink:0}
  #xl .ftab.all{padding-left:16px}
  #xl .ftab:hover{background:var(--p-chip)}
  #xl .ftab.on{background:var(--p-acc);color:var(--p-accInk)}
  #xl .ftab small{font-family:'JetBrains Mono',monospace;font-size:11.5px;opacity:.75}

  /* The design stuck this at 64px, under its own single header. Here it sits
     under three stacked bars - the header, the dataset switcher and the tab
     strip - whose sticky tops are 0, 55 and 120 and which end at 174 when
     the page is scrolled. At 64 the sheet tabs slid underneath them and
     disappeared, and its z-index of 20 is below the tab strip's 25, so
     nothing about it looked broken: it was simply gone. */
  #xl .strip{position:sticky;top:180px;z-index:20;display:flex;align-items:stretch;gap:4px;
    padding:6px;border-radius:22px;background:var(--p-solid)}
  #xl .strip .nav{border:0;background:var(--p-chip);color:var(--p-ink);cursor:pointer;width:38px;
    border-radius:16px;font-size:16px;flex-shrink:0}
  #xl .strip .nav:disabled{opacity:.35;cursor:default}
  #xl .stabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0}
  #xl .stab{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;
    cursor:pointer;padding:7px 12px;border-radius:16px;font-size:13.5px;color:var(--p-ink);
    white-space:nowrap;flex-shrink:0;max-width:260px}
  #xl .stab span{overflow:hidden;text-overflow:ellipsis}
  #xl .stab:hover{background:var(--p-chip)}
  #xl .stab.on{background:var(--fbg);border-color:var(--fc);font-weight:500}
  #xl .stab.ov{font-weight:500}

  #xl .content{display:flex;flex-direction:column;gap:20px;min-width:0}
  #xl .head{padding:22px 26px;display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center}
  #xl .head .t{flex:1;min-width:220px}
  #xl .head .where{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;
    color:var(--p-dim);margin-bottom:4px}
  #xl .head h3{font:500 32px/1.1 'Cormorant Garamond',serif;overflow-wrap:anywhere}
  #xl .head p{font-size:13px;color:var(--p-dim)}
  #xl .kpis{display:flex;flex-wrap:wrap;gap:12px 30px}
  #xl .kpi b{display:block;font:500 30px/1.05 'Cormorant Garamond',serif}
  #xl .kpi span{font-size:12.5px;color:var(--p-dim);white-space:nowrap}
  #xl .kpi .up{color:var(--okT);font-family:'JetBrains Mono',monospace;font-size:12px;margin-left:6px}
  #xl .kpi .dn{color:var(--dispute);font-family:'JetBrains Mono',monospace;font-size:12px;margin-left:6px}
  #xl .ring{--p:0;--rc:var(--p-acc);width:96px;height:96px;border-radius:50%;display:grid;
    place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--p-faint) 0);flex-shrink:0}
  #xl .ring div{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
    text-align:center;background:var(--p-solid)}
  #xl .ring b{font:500 24px/1 'Cormorant Garamond',serif;display:block}
  #xl .ring span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--p-dim)}

  #xl .wb{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  #xl .wbh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #xl .wbh h4{font-weight:500;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
  #xl .wbh small{color:var(--p-dim);font-size:12.5px}
  #xl .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  #xl .tile{display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;
    padding:12px 14px;border-radius:18px;border:1px solid var(--p-edge);background:var(--p-chip);
    color:var(--p-ink);min-width:0}
  #xl .tile:hover{border-color:var(--fc);background:var(--fbg)}
  #xl .tile .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
  #xl .tile b{font-weight:500;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
  #xl .tile small{font-size:12.5px;color:var(--p-dim)}
  #xl .tile .track{height:5px}
  #xl .finder{display:flex;align-items:center;gap:8px;border-radius:99px;border:1px solid var(--p-edge);
    background:var(--p-field);padding:8px 14px;min-width:200px;flex:0 1 300px}
  #xl .finder input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:14px}

  #xl .mdash{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
  #xl .mdh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #xl .mdh h4{font:500 26px/1.1 'Cormorant Garamond',serif;flex:1}
  #xl .mks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  #xl .mk{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:16px;
    border:1px solid var(--p-faint);background:var(--p-chip);color:var(--p-ink)}
  #xl button.mk{cursor:pointer}
  #xl button.mk:hover{border-color:var(--p-acc)}
  #xl .mk b{font:500 28px/1.1 'Cormorant Garamond',serif}
  #xl .mk span{font-size:12px;color:var(--p-dim)}
  #xl .mk.w b{color:var(--pending)}
  #xl .mk.b b{color:var(--dispute)}
  #xl .mk.ok b{color:var(--okT)}
  #xl .mgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
  #xl .mcard{padding:18px 20px;display:flex;flex-direction:column;gap:10px;border-radius:22px;
    border:1px solid var(--p-faint);background:var(--p-glass)}
  #xl .mcard h5{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--p-dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #xl .mcard h5 span{margin-left:auto;letter-spacing:0;text-transform:none;font-size:12px;display:flex;gap:12px}
  #xl .lg{display:inline-flex;align-items:center;gap:5px}
  #xl .lg::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--c)}
  #xl .irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;
    border:0;background:none;text-align:left;cursor:pointer;padding:5px 6px;border-radius:10px;color:var(--p-ink)}
  #xl .irow:hover,#xl .irow.on{background:var(--p-chip)}
  #xl .irow.on{outline:1.5px solid var(--p-acc)}
  #xl .irow > span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #xl .irow em{font-style:normal;font-size:12px;font-family:'JetBrains Mono',monospace;
    color:var(--p-dim);white-space:nowrap}
  #xl .irow em.w{color:var(--pending)}
  #xl .sbar{grid-column:1 / -1;display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--p-faint)}
  #xl .sbar i{display:block;height:100%}
  #xl .sbar i + i{border-left:1.5px solid var(--p-solid)}

  #xl .bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  #xl .bk{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
  #xl .bk h4{display:flex;align-items:baseline;gap:8px;font-weight:500;font-size:15px}
  #xl .bk h4 span{margin-left:auto;font-size:12px;color:var(--p-dim);font-weight:400}
  #xl .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;
    cursor:pointer;border:0;background:none;text-align:left;padding:4px 6px;border-radius:10px;color:var(--p-ink)}
  #xl .bar:hover,#xl .bar.on{background:var(--p-chip)}
  #xl .bar.on{outline:1.5px solid var(--p-acc)}
  #xl .bar > span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #xl .bar em{white-space:nowrap;font-style:normal;font-size:12.5px;
    font-family:'JetBrains Mono',monospace;color:var(--p-dim)}
  #xl .bar .track{grid-column:1 / -1;height:6px}

  #xl .tbl{padding:16px 0 8px;overflow:hidden}
  #xl .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 18px 14px}
  #xl .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border-radius:99px;
    border:1px solid var(--p-edge);background:var(--p-field);padding:9px 16px}
  #xl .search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
  #xl .fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:99px;
    background:var(--p-acc);color:var(--p-accInk);font-size:13px;max-width:100%}
  #xl .fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #xl .fchip button{border:0;background:rgba(0,0,0,.15);color:inherit;width:20px;height:20px;
    border-radius:50%;cursor:pointer;font-size:12px;flex-shrink:0}
  #xl .scroll{overflow:auto;max-height:70vh;border-top:1px solid var(--p-faint)}
  #xl table{border-collapse:collapse;width:100%;font-size:13.5px}
  #xl th{position:sticky;top:0;z-index:1;text-align:left;font-weight:500;font-size:11.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--p-dim);background:var(--p-solid);
    padding:10px 14px;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--p-faint)}
  #xl th:hover{color:var(--p-ink)}
  #xl th.rn,#xl td.rn{color:var(--p-dim);font-family:'JetBrains Mono',monospace;font-size:11.5px;
    cursor:default;text-align:right;width:1%}
  #xl td{padding:9px 14px;border-bottom:1px solid var(--p-faint);white-space:nowrap;max-width:280px;
    overflow:hidden;text-overflow:ellipsis}
  #xl td.n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px}
  #xl tr:hover td{background:var(--p-chip)}
  #xl td.blank{color:var(--p-dim);opacity:.6}
  #xl .xtag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;
    background:var(--p-chip)}
  #xl .xtag.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--okT)}
  #xl .xtag.w{background:color-mix(in srgb,var(--pending) 22%,transparent);color:var(--pending)}
  #xl .xtag.b{background:color-mix(in srgb,var(--dispute) 20%,transparent);color:var(--dispute)}
  #xl .more{display:flex;justify-content:center;padding:12px}
  #xl .xempty{padding:44px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  #xl .xempty h3{font:500 32px 'Cormorant Garamond',serif}
  #xl .xempty p{color:var(--p-dim);max-width:46ch;text-wrap:pretty}
  #xl .drop{border:1.5px dashed var(--p-edge);border-radius:20px;padding:16px;text-align:center;
    font-size:13px;color:var(--p-dim);cursor:pointer}
  #xl .drop:hover,#xl .drop.over{border-color:var(--p-acc);color:var(--p-ink);background:var(--p-chip)}
  #xl .drop b{display:block;color:var(--p-ink);font-weight:500;font-size:14px}

  /* the editor and the reading veil live on <body>, outside #xl, so they are
     named rather than prefixed */
  .xveil{position:fixed;inset:0;z-index:50;background:rgba(2,6,18,.5);display:grid;place-items:center;
    padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .xsheet{width:min(460px,100%);padding:26px 28px;display:flex;flex-direction:column;gap:16px;
    border-radius:30px;border:1px solid rgba(165,195,255,.24);background:rgba(9,22,42,.96);color:#E2E6EE}
  html[data-theme="light"] .xsheet{background:#fff;border-color:rgba(3,4,94,.14);color:#141A2A}
  .xsheet h3{font:500 30px 'Cormorant Garamond',serif}
  .xsheet .f{display:flex;flex-direction:column;gap:6px}
  .xsheet .cap{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .xsheet input{width:100%;border-radius:16px;border:1px solid rgba(165,195,255,.24);
    background:rgba(9,28,49,.55);color:inherit;padding:11px 14px;outline:none;font:inherit}
  html[data-theme="light"] .xsheet input{background:rgba(255,255,255,.75);border-color:rgba(3,4,94,.14)}

<script>
/* ============================================================
   Project Update - dashboard + Excel-style viewer.
   Data comes from the workbook committed in this folder; in owner
   mode a new workbook can be uploaded, which replaces the whole
   stored database (kept in IndexedDB, same pattern as Site Access).
   ============================================================ */
/* Two datasets, switched from the bar at the top of the page. Each is a row
   in `books`, and that is the only place either of them lives now: the two
   .xlsm files that used to sit in this folder as a fallback were served
   publicly by GitHub Pages, which put the whole lamp-pole rollout at a
   guessable URL. Deleted, purged, and the fetch that read them with them. */
const DATASETS = [
  { key:'ongoing', label:'Ongoing', hint:'current batch in progress' },
  { key:'master',  label:'Master',  hint:'everything completed to date' }
];
const DS_KEY = 'project_update_dataset';
let DSK = (() => { try { return localStorage.getItem(DS_KEY) || 'ongoing'; } catch(e){ return 'ongoing'; } })();
const ds = () => DATASETS.find(d => d.key === DSK) || DATASETS[0];
const bookKey = () => 'book:' + DSK;
const DB = 'project_update_db', STORE = 'ds';
/* sheets we don't surface */
const HIDDEN = ['Dashboard', 'Temp Sheet', 'New Site Locations'];
/* The Excel browser earns a tab beside the workbook’s own sheets. It is
   last, and Dashboard is still first, because the rollout figures are what
   this tool gets opened for. */
const EXCEL_TAB = 'Excel Browser';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let BOOK = null, ORDER = [], SAVED = '', ORIGIN = '';
let SITEACCESS = null;             // {cols, rows} from the Site Access tool
let ACTIVE = 'Dashboard', QUERY = '', WRAP = false;

/* ---------- theme (shared key with the other tools) ---------- */
const THEME_KEY = 'office_tool_theme';
function applyTheme(t){ document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
  try { localStorage.setItem(THEME_KEY, t); } catch(e){} }
applyTheme(localStorage.getItem(THEME_KEY) || 'light');
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let tt; function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2200); }

/* ---------- IndexedDB ---------- */
function idb(name, store){ return new Promise((res, rej) => { const r = indexedDB.open(name, 1);
  r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(store)) r.result.createObjectStore(store); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(name, store, k){ try { const db = await idb(name, store);
  return await new Promise(res => { const t = db.transaction(store).objectStore(store).get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbSet(name, store, k, v){ try { const db = await idb(name, store);
  return await new Promise(res => { const t = db.transaction(store, 'readwrite').objectStore(store).put(v, k);
    t.onsuccess = () => res(1); t.onerror = () => res(0); }); } catch(e){ return 0; } }

/* ---------- workbook parsing ---------- */
const isNum = s => /^-?[\d.,]+%?$/.test(String(s).trim());
function parseSheet(arr){
  let h = 0;
  for (let i = 0; i < Math.min(arr.length, 8); i++){
    const cells = (arr[i] || []).map(c => String(c).trim()).filter(Boolean);
    if (cells.length >= 3 && cells.filter(c => !isNum(c)).length >= Math.ceil(cells.length * 0.6)) { h = i; break; }
  }
  const cols = (arr[h] || []).map(c => String(c).trim());
  let start = h + 1;
  const nxt = (arr[start] || []).map(c => String(c).trim()).filter(Boolean);
  if (nxt.length >= 3 && nxt.every(isNum)) start++;   // skip the formula count row
  const rows = arr.slice(start)
    .map(r => { const o = []; for (let i = 0; i < cols.length; i++) o[i] = String(r[i] == null ? '' : r[i]).trim(); return o; })
    .filter(r => r.some(Boolean));
  return { cols, rows };
}
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type: 'array' });
  const sheets = {}, order = [];
  wb.SheetNames.forEach(n => {
    sheets[n] = parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false }));
    order.push(n);
  });
  return { sheets, order };
}

/* ---------- load ---------- */
/* The MOD and SLA permission flags are read off the Site Access list, which
   now lives only in the database - the snapshot committed beside that tool was
   served publicly by GitHub Pages and has been deleted and purged. Its own
   IndexedDB store went with it, so there is one way in and it is DB.load. */
async function loadSiteAccess(){
  try {
    const ds = await window.DB.load('site_access');
    SITEACCESS = (ds && ds.cols && ds.cols.length) ? ds : null;
  } catch(e){ SITEACCESS = null; }
}
function applyBook(b){
  BOOK = b.sheets; ORDER = b.order || []; SAVED = b.savedAt || ''; ORIGIN = b.source || '';
}
async function load(){
  BOOK = null; ORDER = []; SAVED = ''; ORIGIN = '';
  buildSwitcher();
  const b = await window.DB.loadBook(bookKey(), fresh => {
    applyBook(fresh); refreshPill(); buildTabs(); render();
    toast('Updated from another device', 3600);
  });
  if (!b){
    $('view').innerHTML = '<div class="err"><b>No “' + esc(ds().label) + '” workbook yet.</b><br>' +
      'This page reads the database and nothing else — there is no copy of the ' +
      'workbook in the site any more.<br>' +
      (window.IS_OWNER ? 'Upload one with the link at the bottom of this page.'
                       : 'Ask Sithara to upload it.') + '</div>';
    $('pill').innerHTML = '<b>—</b> no workbook';
    buildTabs(); renderFooter(); return;
  }
  applyBook(b);
  await loadSiteAccess();
  refreshPill(); buildTabs(); render();
    /* ONLY ON A REAL EVENT. liveChannel calls this for four reasons and
       hands the reason in: undefined for an actual postgres_changes
       event, and a string for the three reconciliation paths - becoming
       visible, the 15 minute backstop, and the channel coming back. The
       reload runs for all four, because that is the reconciliation and
       it is the point. The SENTENCE is only true for the first.

       It said "Updated from another device" on every tab focus and every
       quarter of an hour, when nothing had happened. The caller was
       handed what it needed to be accurate and dropped it. */
  window.DB.subscribeBook(bookKey(), async (why) => {
    const fresh = await window.DB.loadBook(bookKey());
    if (fresh){ applyBook(fresh); refreshPill(); buildTabs(); render();
      if (!why) toast('Updated from another device', 3600); }
  });
}
function buildSwitcher(){
  $('dsbar').innerHTML = DATASETS.map(d =>
    '<button class="dsbtn' + (d.key === DSK ? ' on' : '') + '" data-d="' + d.key + '">' +
    esc(d.label) + '<em>' + esc(d.hint) + '</em></button>').join('');
  [...$('dsbar').children].forEach(b => b.onclick = () => {
    if (b.dataset.d === DSK) return;
    DSK = b.dataset.d;
    try { localStorage.setItem(DS_KEY, DSK); } catch(e){}
    ACTIVE = 'Dashboard'; QUERY = ''; DIST_MAP = null;
    $('view').innerHTML = '<div class="empty"><div class="big">📊</div>Reading the workbook…</div>';
    load();
  });
}
function refreshPill(){
  const plan = BOOK && BOOK['Full Plan'];
  $('pill').innerHTML = '<b>' + (plan ? plan.rows.length : 0) + '</b> sites · ' + ds().label + (SAVED ? ' · updated ' + SAVED : '');
}
/* Each dataset carries its own sheet list - Ongoing has eleven, Master eight
   with different names - so the tabs are built from that book's order and
   never from a fixed set. */
function visibleSheets(){
  return (ORDER || []).filter(n => !HIDDEN.includes(n) && BOOK[n] && BOOK[n].rows && BOOK[n].rows.length);
}
function buildTabs(){
  // Export earns a tab of its own: wanting the file is not the same as being
  // part-way through reading a sheet, and it should not depend on which one.
  const all = ['Dashboard'].concat(visibleSheets()).concat(['Export', EXCEL_TAB]);
  if (!all.includes(ACTIVE)) ACTIVE = 'Dashboard';
  $('tabs').innerHTML = all.map(n =>
    '<button class="tab' + (n === ACTIVE ? ' on' : '') + '" data-t="' + esc(n) + '">' + esc(n) + '</button>').join('');
  [...$('tabs').children].forEach(b => b.onclick = () => { ACTIVE = b.dataset.t; QUERY = ''; buildTabs(); render(); });
}

/* ---------- status ---------- */
function bucketOf(status){
  const s = String(status || '').toLowerCase();
  if (!s) return 'other';
  if (/on hold|hold/.test(s)) return 'hold';
  if (/terminat/.test(s)) return 'terminated';
  if (/dispute/.test(s)) return 'dispute';
  if (/tx pending/.test(s)) return 'tx';
  if (/on air pending/.test(s)) return 'airPending';
  // must come before the plain on-air test, or "Partially On Air" reads as live
  if (/partial\w*\s*on\s*air/.test(s)) return 'partial';
  if (/on air/.test(s)) return 'onAir';
  if (/installation completed|commissioning/.test(s)) return 'commissioning';
  if (/te wip|partially completed|wip/.test(s)) return 'wip';
  if (/mobili/.test(s)) return 'mobilize';
  return 'other';
}
/* EVERY COLOUR HERE IS A TOKEN, AND THAT IS THE POINT.

   Four of these were hex literals - #a8c93f, #e8a13c, #e2596b, #5f6f75 -
   and being literals is exactly why they were the worst on the page. A hex
   that no token names cannot be checked by anything: it has no theme pair,
   it never appears in a stylesheet a guard reads, and it cannot be found
   by looking for token usages. The two lowest contrasts measured anywhere
   in this tool, 1.73 and 1.96, were both of them.

   One colour is one fact. These are read in three renderings - the KPI
   tile's rule and big number, the By status bar fills, and the chips in
   the data table - so a literal here is one fact in three places with
   nothing holding them together.

   project-update.test.js asserts all eleven clear 4.5 as a chip in both
   themes, reading THIS array, so a twelfth bucket cannot skip the check. */
const BUCKETS = [
  { k:'onAir', label:'On Air', sub:'live', c:'var(--ok)' },
  { k:'partial', label:'Partially On Air', sub:'part live', c:'var(--partial)' },
  { k:'airPending', label:'On Air Pending', sub:'nearly done', c:'var(--pending)' },
  { k:'commissioning', label:'Commissioning', sub:'install done', c:'var(--info)' },
  { k:'wip', label:'TE WIP', sub:'in progress', c:'var(--wip)' },
  { k:'mobilize', label:'To be Mobilized', sub:'not started', c:'var(--idle)' },
  { k:'hold', label:'On Hold', sub:'blocked', c:'var(--warn)' },
  { k:'tx', label:'Tx Pending', sub:'tx blocked', c:'var(--warn)' },
  { k:'dispute', label:'Dispute', sub:'blocked', c:'var(--dispute)' },
  { k:'terminated', label:'Terminated', sub:'dropped', c:'var(--dropped)' },
  { k:'other', label:'Unclassified', sub:'no status', c:'var(--muted)' }
];
const statusColour = s => (BUCKETS.find(b => b.k === bucketOf(s)) || {}).c || 'var(--muted)';

/* ---------- MOD / defence permission cross-reference ----------
   Two ways a defence permission reaches this project. A lamp site can carry one
   itself, now that most of them have been added to the operational site list;
   or the far end of one of its MW hops can, which is an existing site and was
   the only route when the lamp sites were still missing from that list. Check
   both against Site Access and flag whatever comes back. */
const MOD_RE = /\b(mod|sla|slaf|sln|slarmy|army|navy|air\s*force|defen[cs]e|stf)\b/i;
const SITE_ID_RE = /^[A-Z]{2}\d{3,5}$/;
/* The far end of a hop is the other party's site; the near end is ours. Some
   trackers carry nothing but a NEAR END and a FAR END column, so treating
   every hop column alike would file our own lamp sites under somebody else's. */
const FAR_COL_RE = /far\s*end/i;

/* Every sheet in the book, not two of them. A site turns up wherever the work
   took it - the MW removal tracker, the new locations, the AP data, the CR
   update - and one that needs defence clearance needs it just as much when it
   is written on a tab nobody thought to look at.

   Columns are found by what they hold rather than by what they are called, so
   a tab added to the workbook later is read without this having to be told
   about it. A column of hop endpoints names somebody else's site; any other
   column of ids names one of ours. */
function harvestSites(){
  // id -> {name, where:Set}     : sites this project works on
  const own = new Map();
  // id -> {serves:Map, where:Set} : the other end of a hop
  const hubs = new Map();
  let sheets = 0;
  if (!BOOK) return { own, hubs, sheets };

  for (const name of Object.keys(BOOK)){
    const sh = BOOK[name];
    if (!sh || !sh.rows || !sh.rows.length) continue;
    const { cols, rows } = sh;

    const idCols = [];
    cols.forEach((c, i) => {
      let n = 0;
      for (const r of rows) if (SITE_ID_RE.test(String(r[i] || '').trim().toUpperCase())) n++;
      // a fifth of the column, and never on one lucky cell
      if (n >= Math.max(2, rows.length * 0.2)) idCols.push(i);
    });
    if (!idCols.length) continue;
    sheets++;

    const iName = cols.findIndex(c => /^site\s*name/i.test(c));
    const farCols = idCols.filter(i => FAR_COL_RE.test(cols[i] || ''));
    const ourCols = idCols.filter(i => !FAR_COL_RE.test(cols[i] || ''));
    const iSelf = ourCols[0];          // the row's own site, for the serves link
    rows.forEach(r => {
      const selfId = iSelf == null ? '' : String(r[iSelf] || '').trim().toUpperCase();
      const selfNm = iName >= 0 ? String(r[iName] || '').trim() : '';
      ourCols.forEach(i => {
        const id = String(r[i] || '').trim().toUpperCase();
        if (!SITE_ID_RE.test(id)) return;
        if (!own.has(id)) own.set(id, { name: selfNm, where: new Set() });
        const o = own.get(id);
        if (!o.name && selfNm) o.name = selfNm;
        o.where.add(name);                        // the tab it was written on
      });
      farCols.forEach(i => {
        const id = String(r[i] || '').trim().toUpperCase();
        if (!SITE_ID_RE.test(id)) return;
        if (!hubs.has(id)) hubs.set(id, { serves: new Map(), where: new Set() });
        const hb = hubs.get(id);
        hb.where.add(name);
        if (selfId && selfId !== id) hb.serves.set(selfId, selfNm);
      });
    });
  }
  /* Ours is ours, even where it also appears as somebody's far end - but the
     tabs it turned up on are worth keeping either way. */
  own.forEach((o, id) => {
    const hb = hubs.get(id);
    if (hb){ hb.where.forEach(w => o.where.add(w)); hubs.delete(id); }
  });
  return { own, hubs, sheets };
}

function modSites(){
  if (!SITEACCESS || !BOOK) return null;
  const ci = n => SITEACCESS.cols.indexOf(n);
  const iId = ci('Site_ID'), iPerm = ci('Access_Permission_providing_Party'),
        iName = ci('Site_Name'), iTime = ci('Time_Restrictions_final'), iTel = ci('Depot_Contact');
  if (iId < 0 || iPerm < 0) return null;
  const byId = {}; SITEACCESS.rows.forEach(r => { const k = String(r[iId] || '').trim().toUpperCase(); if (k) byId[k] = r; });

  const { own, hubs, sheets } = harvestSites();

  const seen = {}, out = [];
  let checked = 0, known = 0;
  const test = (id, serves, isOwn, where) => {
    if (seen[id]) return; seen[id] = 1; checked++;
    const m = byId[id]; if (!m) return; known++;
    const perm = String(m[iPerm] || '').trim();
    if (perm && MOD_RE.test(perm))
      out.push({ id, name: String(m[iName] || ''), perm, own: !!isOwn,
                 restrict: iTime >= 0 ? String(m[iTime] || '') : '',
                 // the tabs it is written on, in the order the workbook has them
                 where: (ORDER || []).filter(n => where && where.has(n))
                          .concat([...(where || [])].filter(n => !(ORDER || []).includes(n))),
                 serves: serves ? [...serves.entries()] : [] });
  };
  own.forEach((o, id) => test(id, null, true, o.where));
  hubs.forEach((v, id) => test(id, v.serves, false, v.where));
  out.sort((a, b) => (a.own === b.own ? a.id.localeCompare(b.id) : (a.own ? -1 : 1)));
  return { list: out, checked, known, sheets };
}

/* ---------- district from the Site ID prefix ----------
   Site IDs start with a two-letter district code (MU, MA, VA, GM, CM…).
   Rather than hard-coding the codes we learn them from the Site Access
   list: for each prefix, the district most of its sites sit in. Unknown
   prefixes simply show the code itself. */
let DIST_MAP = null;
function districtMap(){
  if (DIST_MAP) return DIST_MAP;
  DIST_MAP = {};
  if (!SITEACCESS) return DIST_MAP;
  const ci = n => SITEACCESS.cols.indexOf(n);
  const iId = ci('Site_ID'), iD = ci('District');
  if (iId < 0 || iD < 0) return DIST_MAP;
  const tally = {};
  SITEACCESS.rows.forEach(r => {
    const id = String(r[iId] || '').trim().toUpperCase();
    const p = id.slice(0, 2);
    if (!/^[A-Z]{2}$/.test(p)) return;
    const d = String(r[iD] || '').trim();
    if (!d || /^unknown$/i.test(d)) return;
    const key = d.toLowerCase();
    const t = (tally[p] = tally[p] || {});
    if (!t[key]) t[key] = { n: 0, label: d };
    t[key].n++;
  });
  Object.keys(tally).forEach(p => {
    const best = Object.values(tally[p]).sort((a, b) => b.n - a.n)[0];
    if (best) DIST_MAP[p] = best.label;
  });
  return DIST_MAP;
}
function districtOf(siteId){
  const code = String(siteId || '').trim().toUpperCase().slice(0, 2);
  if (!/^[A-Z]{2}$/.test(code)) return { code: '—', name: 'Unknown' };
  return { code, name: districtMap()[code] || code };
}

/* ---------- dashboard ---------- */
function colIdx(cols, ...names){
  const norm = s => String(s).toLowerCase().replace(/[\s_]+/g, '');
  for (const n of names){ const i = cols.findIndex(c => norm(c) === norm(n)); if (i >= 0) return i; }
  return -1;
}
function tally(rows, i){
  const m = new Map();
  rows.forEach(r => { const v = (i >= 0 ? r[i] : '') || '—'; m.set(v, (m.get(v) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function barBlock(pairs, total, colourFn){
  return '<div class="bars">' + pairs.map(([label, n]) => {
    const pct = total ? Math.round(n / total * 100) : 0;
    return '<div class="barrow"><span class="lb" title="' + esc(label) + '">' + esc(label) + '</span>' +
      '<span class="bartrack"><span class="barfill" style="--w:' + pct + '%;--b:' + (colourFn ? colourFn(label) : 'var(--accent)') + '"></span></span>' +
      '<span class="n">' + n + '</span></div>';
  }).join('') + '</div>';
}
function renderDashboard(){
  const plan = BOOK && BOOK['Full Plan'];
  if (!plan) return '<div class="empty">No “Full Plan” sheet in this workbook.</div>';
  const { cols, rows } = plan;
  const iStatus = colIdx(cols, 'Site Status'), iRegion = colIdx(cols, 'Operation Region', 'Region'),
        iTeam = colIdx(cols, 'Team'), iTx = colIdx(cols, 'Tx plan', 'Tx Plan');

  const counts = {}; BUCKETS.forEach(b => counts[b.k] = 0);
  rows.forEach(r => counts[bucketOf(r[iStatus])]++);
  const total = rows.length, pct = total ? Math.round(counts.onAir / total * 100) : 0;

  let h = '<div class="kpis">';
  h += '<div class="kpi" style="--k:var(--accentB)"><div class="k">Total sites</div><div class="v">' + total + '</div><div class="s">in this plan</div></div>';
  BUCKETS.forEach(b => { if (b.k === 'other' && !counts.other) return;
    h += '<div class="kpi" style="--k:' + b.c + '"><div class="k">' + esc(b.label) + '</div><div class="v">' + counts[b.k] + '</div><div class="s">' + esc(b.sub) + '</div></div>'; });
  h += '</div>';

  /* Overall completion - a site part-way through still counts for something,
     so the green bar is weighted by how far each stage has got. "On air" is
     shown underneath as the strict figure. */
  const WEIGHT = { onAir:1, airPending:.9, partial:.8, commissioning:.75, wip:.5, tx:.25, mobilize:.1,
                   hold:0, dispute:0, terminated:0, other:0 };
  const earned = BUCKETS.reduce((s, b) => s + counts[b.k] * (WEIGHT[b.k] || 0), 0);
  const wpct = total ? Math.round(earned / total * 100) : 0;
  const partOf = BUCKETS.filter(b => counts[b.k] && WEIGHT[b.k] > 0 && b.k !== 'onAir')
                        .map(b => counts[b.k] + ' ' + b.label.toLowerCase());
  h += '<div class="panel"><h2><span class="dot" style="background:var(--ok)"></span>Overall completion' +
       '<span class="tag">weighted by stage</span></h2>' +
       '<div class="barrow"><span class="lb">Progress</span><span class="bartrack" style="height:16px">' +
       '<span class="barfill" style="--w:' + wpct + '%;--b:linear-gradient(90deg,var(--accentD),var(--ok))"></span>' +
       '</span><span class="n" style="color:var(--okT);font-weight:700">' + wpct + '%</span></div>' +
       '<div class="barrow" style="margin-top:9px"><span class="lb">On air</span>' +
       '<span class="bartrack"><span class="barfill" style="--w:' + pct + '%;--b:var(--ok)"></span></span>' +
       '<span class="n">' + pct + '%</span></div>' +
       '<div class="note" style="margin-top:11px">' + counts.onAir + ' of ' + total + ' sites fully on air' +
       (partOf.length ? '; part credit for ' + partOf.join(', ') : '') + '.' +
       // a dropped site can never complete, so say why the bar cannot reach 100%
       (counts.terminated ? ' ' + counts.terminated + ' terminated ' +
         (counts.terminated === 1 ? 'site is' : 'sites are') +
         ' still counted in the total, so the bar cannot reach 100%.' : '') +
       '</div></div>';

  /* MOD permission panel */
  const mod = modSites();
  h += '<div class="panel mod"><h2><span class="dot" style="background:var(--warn)"></span>MOD permission sites' +
       (mod ? '<span class="tag">' + mod.known + ' of ' + mod.checked + ' sites checked · ' +
              mod.sheets + (mod.sheets === 1 ? ' tab' : ' tabs') + ' read</span>' : '') + '</h2>';
  if (!mod) h += '<div class="note">Couldn’t reach the Site Access data to check permissions.</div>';
  else if (!mod.list.length)
    h += '<div class="note">No defence permissions found. Every site in the plan is looked up in the Site Access list, and so is ' +
         'the far end of each MW hop - clearance can sit on either.</div>';
  else {
    h += '<div class="note" style="margin-bottom:12px">These need defence clearance before access - plan lead time for them and for anything they serve.</div><div class="modlist">';
    mod.list.forEach(m => {
      h += '<div class="modcard"><div class="id">' + esc(m.id) + '</div><div class="nm">' + esc(m.name) + '</div>' +
           '<span class="perm">🛡 ' + esc(m.perm) + '</span>' +
           (m.restrict ? '<div class="serves" style="margin-top:8px">⏱ ' + esc(m.restrict) + '</div>' : '') +
           // which tabs it is written on, so it can be found without hunting
           (m.where && m.where.length
             ? '<div class="where">' + m.where.map(w => '<span class="tabchip">' + esc(w) + '</span>').join('') + '</div>'
             : '') +
           '<div class="serves">' + (m.own ? 'In this plan' : 'Hop far end') +
           (m.serves.length ? ' · serves ' + m.serves.map(([id, nm]) => '<b>' + esc(id) + '</b> ' + esc(nm)).join('<br>') : '') +
           '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="cols2">';
  h += '<div class="panel"><h2><span class="dot"></span>By status</h2>' + barBlock(tally(rows, iStatus), total, statusColour) + '</div>';
  h += '<div class="panel"><h2><span class="dot"></span>By region</h2>' + barBlock(tally(rows, iRegion), total) + '</div>';
  h += '<div class="panel"><h2><span class="dot"></span>By Tx plan</h2>' + barBlock(tally(rows, iTx), total) + '</div>';

  const teams = new Map();
  rows.forEach(r => {
    const t = (iTeam >= 0 ? r[iTeam] : '') || 'Unassigned';
    if (!teams.has(t)) teams.set(t, { total:0, onAir:0, hold:0, wip:0 });
    const o = teams.get(t); o.total++;
    const b = bucketOf(r[iStatus]);
    if (b === 'onAir') o.onAir++; else if (b === 'hold') o.hold++;
    else if (b === 'wip' || b === 'commissioning' || b === 'airPending') o.wip++;
  });
  /* by district, derived from the Site ID prefix */
  const iSite = colIdx(cols, 'Site ID', 'Site  ID', 'SiteID');
  const dist = new Map();
  rows.forEach(r => {
    const d = districtOf(iSite >= 0 ? r[iSite] : '');
    const key = d.code;
    if (!dist.has(key)) dist.set(key, { code: d.code, name: d.name, total: 0, onAir: 0, wip: 0, hold: 0 });
    const o = dist.get(key); o.total++;
    const b = bucketOf(r[iStatus]);
    if (b === 'onAir') o.onAir++;
    else if (b === 'hold') o.hold++;
    else if (b === 'wip' || b === 'commissioning' || b === 'airPending') o.wip++;
  });
  const dl = [...dist.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  const maxD = dl.length ? dl[0].total : 0;
  h += '<div class="panel"><h2><span class="dot"></span>By district' +
       '<span class="tag">' + dl.length + ' districts · from Site ID</span></h2>' +
       '<div class="bars" style="margin-bottom:14px">' + dl.map(d => {
         const pct = maxD ? Math.round(d.total / maxD * 100) : 0;
         return '<div class="barrow"><span class="lb" title="' + esc(d.name) + '">' +
           '<b style="font-family:\'Space Mono\',monospace;color:var(--accentB)">' + esc(d.code) + '</b> ' + esc(d.name) + '</span>' +
           '<span class="bartrack"><span class="barfill" style="--w:' + pct + '%;--b:var(--accent)"></span></span>' +
           '<span class="n">' + d.total + '</span></div>';
       }).join('') + '</div>' +
       '<div class="gridwrap" style="max-height:none"><table><thead><tr><th>Code</th><th>District</th><th>Sites</th>' +
       '<th>On air</th><th>In progress</th><th>On hold</th><th>Done</th></tr></thead><tbody>' +
       dl.map(d => {
         const p = d.total ? Math.round(d.onAir / d.total * 100) : 0;
         return '<tr><td style="font-family:\'Space Mono\',monospace;font-weight:700;color:var(--accentB)">' + esc(d.code) + '</td>' +
                '<td style="font-weight:600">' + esc(d.name) + '</td><td>' + d.total + '</td><td>' + d.onAir +
                '</td><td>' + d.wip + '</td><td>' + d.hold + '</td><td>' + p + '%</td></tr>';
       }).join('') + '</tbody></table></div></div>';

  h += '<div class="panel"><h2><span class="dot"></span>By team</h2><div class="gridwrap" style="max-height:none">' +
       '<table><thead><tr><th>Team</th><th>Sites</th><th>On air</th><th>In progress</th><th>On hold</th><th>Done</th></tr></thead><tbody>' +
       [...teams.entries()].sort((a,b) => b[1].total - a[1].total).map(([t, o]) => {
         const p = o.total ? Math.round(o.onAir / o.total * 100) : 0;
         return '<tr><td style="font-weight:600">' + esc(t) + '</td><td>' + o.total + '</td><td>' + o.onAir +
                '</td><td>' + o.wip + '</td><td>' + o.hold + '</td><td>' + p + '%</td></tr>';
       }).join('') + '</tbody></table></div></div></div>';
  return h;
}

/* ---------- taking the data away ----------
   Reading a table on a page is one thing; doing anything with it is another.
   Both exports write a real .xlsx rather than a CSV, so the Sinhala names and
   the leading zeros on a site id survive the trip - a spreadsheet opening a
   CSV will happily turn KI0023 into a number and a date into whatever it
   fancies. */
function xlName(n, used){
  // Excel refuses : \ / ? * [ ] and anything past 31 characters
  let s = String(n || 'Sheet').replace(/[:\\\/\?\*\[\]]/g, '-').slice(0, 31) || 'Sheet';
  let i = 2, base = s;
  while (used.has(s.toLowerCase())){ const tail = ' (' + i++ + ')'; s = base.slice(0, 31 - tail.length) + tail; }
  used.add(s.toLowerCase());
  return s;
}
function stem(){
  return 'Lamp Pole Update - ' + ds().label + (SAVED ? ' ' + SAVED : '');
}
function sheetToAoa(sh){ return [sh.cols].concat(sh.rows); }
function exportSheet(name, rows){
  const sh = BOOK && BOOK[name]; if (!sh) return;
  const used = new Set();
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([sh.cols].concat(rows || sh.rows)), xlName(name, used));
  XLSX.writeFile(wb, stem() + ' - ' + String(name).replace(/[\\\/:*?"<>|]/g, '-') + '.xlsx');
  toast('Downloaded ' + (rows ? rows.length : sh.rows.length) + ' rows');
}
function exportBook(){
  if (!BOOK) return;
  const names = visibleSheets();
  if (!names.length){ toast('Nothing to export yet'); return; }
  const used = new Set();
  const wb = XLSX.utils.book_new();
  names.forEach(n => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheetToAoa(BOOK[n])), xlName(n, used)));
  XLSX.writeFile(wb, stem() + '.xlsx');
  toast('Downloaded ' + names.length + ' sheets');
}

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('Reading ' + f.name + '…');
  let buf, p;
  try {
    buf = await f.arrayBuffer();
    p = parseWorkbook(buf);
    if (!p.sheets['Full Plan']) { toast('That workbook has no “Full Plan” sheet'); return; }
  } catch (err){ console.error(err); toast('Could not read that file: ' + err.message); return; }

  const okRep = await Ask.twice([
    { title: 'Replace ' + ds().label + ' with ' + f.name + '?',
      body: 'Every sheet in this workbook takes the place of what is published now – ' +
            p.sheets['Full Plan'].rows.length + ' sites on the Full Plan.',
      no: 'Cancel', yes: 'Yes, go on' },
    { title: 'Every device sees this at once.',
      body: 'The workbook published now is not kept anywhere else. Publish only if this file is the newer one.',
      no: 'No, leave it', yes: 'Publish it' }
  ]);
  if (!okRep){ toast('Nothing was published'); return; }

  // ask for the session before writing, rather than failing inside the upsert
  let s;
  try { s = await window.AuthGate.require(); }
  catch (err){ toast(err.message, 7000); return; }
  if (!s){ toast('Cancelled - nothing was published'); return; }

  const book = { sheets: p.sheets, order: p.order,
                 savedAt: new Date().toISOString().slice(0, 10), bytes: buf.byteLength };
  toast('Publishing ' + ds().label + '…', 60000);
  try {
    await window.DB.publishBook(bookKey(), book);
    applyBook(Object.assign({}, book, { source: 'server' }));
    refreshPill(); buildTabs(); render();
    toast(ds().label + ' published · ' + p.sheets['Full Plan'].rows.length +
          ' sites · every device sees this now', 5200);
  } catch (err){
    console.error(err);
    toast('Could not publish: ' + err.message, 7000);
  }
});
