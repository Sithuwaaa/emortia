<style>
  /* Green - the stores colour, and the one accent the other tools had not
     taken: the lookups are teal, the field reference amber, the directory
     olive. Only the accent is this tool's own; the rest is theme.css. */
  :root,html[data-theme="dark"]{
    
    --bad:#e2607a;--badInk:#2b0f16;--zebra:rgba(255,255,255,.02);--goHover:var(--accentB);
    /* THE CHIP KINDS. His colours, taken from the leaf palette in his
       redesign and made the defaults here, so the chips carry his colour
       intent without the palette machinery that came with them - see the
       note in the commit about why those palettes were not taken.
       Measured against --card with tools/_lib/contrast.js, which is the
       ground family.test.js governs: 11.48 / 11.71 / 10.05 in dark. */
    --chipType:#A2E59C;--chipVendor:#E8D5A8;--chipAttr:#A9CFC9}
  html[data-theme="light"]{
    
    --bad:#c2405c;--badInk:#ffffff;--zebra:rgba(0,0,0,.024);
    /* 6.59 / 6.05 / 6.57 on white */
    --chipType:#1F6B22;--chipVendor:#7A5E30;--chipAttr:#2E6663;}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  ::selection{background:var(--glowSoft)}

  /* ---------------------------------------------------------- the header */
  .hdr{display:flex;align-items:center;gap:10px;color:var(--barInk);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:var(--navy);position:sticky;top:0;z-index:20}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;font-size:0;padding:0;border:none}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  .hdr .brand:hover .logo{transform:scale(1.06)}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-.02em;color:var(--barInk);white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:var(--barLine);flex-shrink:0;margin:0 1px}
  .hdr h1{font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .pill{font-size:11.5px;background:var(--navy-2);border:1px solid var(--barLine);
    color:var(--barDim);border-radius:999px;padding:4px 11px;white-space:nowrap;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill b{color:var(--accent);font-weight:600}
  .theme{background:none;border:1px solid rgba(255,255,255,.25);color:var(--barInk);border-radius:8px;
    width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;flex-shrink:0}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }

  /* THE DESIGN'S TWO COLUMNS. 1600px rather than 1180: the design gives the
     list the whole remaining width and the row grid needs it once the spec
     line is in. flex-wrap with a huge grow on the panel is what makes the
     aside drop above the list on a narrow screen without a second
     breakpoint deciding it. */
  main{max-width:1600px;margin:0 auto;padding:20px 24px 28px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .side{flex:1 1 260px;max-width:320px;position:sticky;top:92px;
    max-height:calc(100vh - 112px);overflow-y:auto;
    display:flex;flex-direction:column;gap:12px;padding-bottom:2px}
  /* THE SIDEBAR AS TILES (design 3a): category + status, vendor, specs, upload */
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
  .tile.cat{position:relative;z-index:5}
  /* LIQUID GLASS SCROLLBARS, AUTO-HIDING: the sidebar and the dropdown.
     Invisible at rest, so the glass is not cut by a bar nobody is using;
     any scroll puts .sbon on the scroller for a second, and hovering the
     panel shows its own. No scrollbar-width/color outside @supports -
     Chrome ignores the ::-webkit-scrollbar rules when either is set.

     The html rules are here for completeness and do nothing: nav.css
     loads after this block and hides the page's own bar outright. That
     is why the page has a DRAWN bar instead, #pgbar, further down. */
  html::-webkit-scrollbar,.side::-webkit-scrollbar{width:12px}
  .ddpan::-webkit-scrollbar{width:9px}
  html::-webkit-scrollbar-track,.side::-webkit-scrollbar-track,.ddpan::-webkit-scrollbar-track{
    margin:10px 0;border-radius:99px;background:transparent;border:1px solid transparent}
  html::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,.ddpan::-webkit-scrollbar-thumb{
    border-radius:99px;border:2px solid transparent;background-clip:padding-box;background-image:none}
  html.sbon::-webkit-scrollbar-track,.side.sbon::-webkit-scrollbar-track,.side:hover::-webkit-scrollbar-track,
  .ddpan.sbon::-webkit-scrollbar-track,.ddpan:hover::-webkit-scrollbar-track{
    background:rgba(16,34,18,.45);border-color:rgba(162,229,156,.18)}
  html.sbon::-webkit-scrollbar-thumb,.side.sbon::-webkit-scrollbar-thumb,.side:hover::-webkit-scrollbar-thumb,
  .ddpan.sbon::-webkit-scrollbar-thumb,.ddpan:hover::-webkit-scrollbar-thumb{
    background-image:linear-gradient(180deg,rgba(210,248,210,.62),rgba(134,224,143,.3))}
  html.sbon::-webkit-scrollbar-thumb:hover,.side::-webkit-scrollbar-thumb:hover,.ddpan::-webkit-scrollbar-thumb:hover{
    background-image:linear-gradient(180deg,rgba(225,252,225,.8),rgba(134,224,143,.5))}
  html[data-theme="light"].sbon::-webkit-scrollbar-track,html[data-theme="light"] .side.sbon::-webkit-scrollbar-track,
  html[data-theme="light"] .side:hover::-webkit-scrollbar-track,html[data-theme="light"] .ddpan.sbon::-webkit-scrollbar-track,
  html[data-theme="light"] .ddpan:hover::-webkit-scrollbar-track{
    background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.75)}
  html[data-theme="light"].sbon::-webkit-scrollbar-thumb,html[data-theme="light"] .side.sbon::-webkit-scrollbar-thumb,
  html[data-theme="light"] .side:hover::-webkit-scrollbar-thumb,html[data-theme="light"] .ddpan.sbon::-webkit-scrollbar-thumb,
  html[data-theme="light"] .ddpan:hover::-webkit-scrollbar-thumb{
    background-image:linear-gradient(180deg,rgba(31,138,62,.5),rgba(31,138,62,.28))}
  html[data-theme="light"].sbon::-webkit-scrollbar-thumb:hover,html[data-theme="light"] .side::-webkit-scrollbar-thumb:hover,
  html[data-theme="light"] .ddpan::-webkit-scrollbar-thumb:hover{
    background-image:linear-gradient(180deg,rgba(31,138,62,.7),rgba(31,138,62,.45))}
  @supports (-moz-appearance:none){
    html,.side,.ddpan{scrollbar-width:thin;scrollbar-color:transparent transparent}
    html.sbon,.side.sbon,.side:hover,.ddpan.sbon,.ddpan:hover{scrollbar-color:rgba(180,240,180,.5) rgba(16,34,18,.45)}
    html[data-theme="light"].sbon,html[data-theme="light"] .side.sbon,html[data-theme="light"] .side:hover,
    html[data-theme="light"] .ddpan.sbon,html[data-theme="light"] .ddpan:hover{scrollbar-color:rgba(31,138,62,.45) rgba(255,255,255,.45)}
  }
  .sbar{display:none !important}
  .tile,.phead{border-radius:18px}
  /* THE FLOATING PILL (design 4a): the sidebar's own bar is hidden; this
     one sits in the gap, appears when the cursor is over the filters or
     they are moving, and fades out after. Drag it, or click the gap. */
  .sbar{position:fixed;width:14px;z-index:15;opacity:0;pointer-events:none;
    transition:opacity .45s ease;cursor:pointer;touch-action:none}
  .sbar.show{opacity:1;pointer-events:auto}
  .sbar i{display:block;width:5px;margin:0 auto;border-radius:99px;
    background:rgba(180,240,180,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
    transition:width .2s ease,background .2s ease}
  .sbar.act i,.sbar:hover i{width:7px;background:rgba(190,245,190,.7)}
  html[data-theme="light"] .sbar i{background:rgba(15,31,20,.35)}
  html[data-theme="light"] .sbar.act i,html[data-theme="light"] .sbar:hover i{background:rgba(15,31,20,.5)}

  .tile.specs{gap:16px}
  .tile .upblk{border:0;padding:0;margin:0}
  .rcol{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:12px}
  /* the category dropdown, drawn rather than native */
  .dd{position:relative}
  .ddbtn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--accent);background:rgba(0,0,0,.22);color:var(--text);font:inherit;
    cursor:pointer;text-align:left;box-shadow:0 0 0 3px var(--glowSoft)}
  .ddbtn .l{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
  .ddbtn .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ddbtn .s{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted)}
  .ddbtn .ch{color:var(--accent);font-size:14px;transition:transform .18s ease}
  .dd.open .ch{transform:rotate(180deg)}
  .ddpan{position:fixed;top:0;left:0;width:260px;min-width:240px;max-height:320px;
    overflow:auto;z-index:30;border-radius:12px;background:rgba(10,24,13,.97);
    border:1px solid rgba(162,229,156,.35);box-shadow:0 18px 40px rgba(0,0,0,.6);
    padding:5px;display:none;flex-direction:column;gap:1px}
  .ddpan.show{display:flex}
  .ddi{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;
    font-size:12.5px;background:none;border:0;color:var(--text);font-family:inherit;text-align:left;width:100%}
  .ddi:hover{background:var(--glowSoft)}
  .ddi.on{background:var(--glowSoft);color:var(--accent);font-weight:600}
  .ddi .mk{width:14px;color:var(--accent);font-weight:700;flex-shrink:0}
  .ddi .v{flex:1}
  .ddi .n{font-family:'Space Mono',monospace;font-size:11px;opacity:.75}
  .ddi.fam{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);padding:4px 8px}
  .ddi.fam.on{color:var(--accent)}
  .ddi.sub{padding-left:14px}
  .ddsep{height:1px;background:var(--line);margin:3px 4px;flex-shrink:0}
  /* All / Active / Disposed */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;
    border-radius:10px;border:1px solid var(--line)}
  .seg button{padding:7px;border-radius:8px;border:0;background:none;color:var(--text);
    font:inherit;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  /* DARKEN THE INK, NOT THE FILL. White on #e2607a measures 3.39:1 - under
     the 4.5 floor - and lightening ink on a mid-light fill was never going
     to clear it, which is the polarity: a pale fill wants dark ink. The
     first instinct was to darken the fill to #c2405c (5.02), and that
     changes a colour somebody chose to fix a defect in something else.
     #2b0f16 on the same pink is 5.23, measured through contrast.js; pure
     black is 6.19 and reads harsh against it. The pink is untouched. */
  .seg button.on.bad{background:var(--bad);color:var(--badInk)}
  /* AND THE OTHER WAY ROUND IN LIGHT, because --bad flips with the theme.
     Dark's #e2607a is a mid-light pink and wants dark ink; light's
     #c2405c is a deeper one and wants white. Setting #2b0f16 for both
     cleared dark at 5.23 and left light at 3.54 - one theme fixed, the
     other broken, which family.test.js caught in the same run. The
     polarity rule is per theme, not per element. */
  html[data-theme="light"] .seg button.on.bad{color:#fff}
  .panel{min-width:0;background:var(--card);
    border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .phead{padding:14px 16px;display:flex;flex-direction:column;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:22px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}

  /* ---------------------------------------------------------- the search */
  .searchwrap{position:relative;display:flex;align-items:center}
  .searchwrap .ic{position:absolute;left:14px;font-size:17px;color:var(--muted);pointer-events:none}
  #q{width:100%;padding:13px 40px 13px 40px;font:inherit;font-size:16px;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;
    transition:border-color .16s ease,box-shadow .16s ease}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glowSoft)}
  .clr{position:absolute;right:8px;display:none;background:none;border:none;cursor:pointer;
    color:var(--muted);font-size:20px;line-height:1;padding:6px 10px;border-radius:8px}
  .clr:hover{color:var(--text)}

  /* ----------------------------------------------------------- the chips

     Type first, because that is how somebody asks - they want the antennas,
     or the RRU power cables. Vendor second, because the next question is
     which Huawei one. Both counted from the data, so a type that turns up in
     a future upload turns up here on its own. */
  .fgrp{display:flex;flex-direction:column;gap:6px}
  .flabel{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .fhead{display:flex;justify-content:space-between;align-items:baseline}
  .fclear{font-size:11.5px;color:var(--accent);cursor:pointer;background:none;
    border:none;font-family:inherit;padding:0}
  .side select{padding:11px 12px;border-radius:10px;border:1px solid var(--accent);
    background:var(--card-2);color:var(--text);font:inherit;font-size:14px;
    font-weight:500;outline:none;width:100%}
  /* THE CHECKBOX FACETS the design draws: a value, its count, and a box that
     fills with the accent when it is on. One row per value, scrollable with
     the aside, rather than the chip rows this tool had - chips do not survive
     an attribute with twenty values. */
  .fv{display:flex;align-items:center;gap:9px;padding:4px 2px;cursor:pointer;
    font-size:13.5px;background:none;border:none;color:var(--text);
    font-family:inherit;text-align:left;width:100%}
  .fv:hover{color:var(--accent)}
  .fv .box{width:16px;height:16px;border-radius:4px;border:1px solid var(--accent);
    color:var(--accent-ink);font-weight:700;font-size:11px;line-height:14px;
    text-align:center;flex-shrink:0}
  .fv.on .box{background:var(--accent)}
  .fv .v{flex:1;word-break:break-word}
  .fv .n{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
  .fnone{font-size:13px;line-height:1.45;color:var(--muted)}
  /* the owner's upload, last in the sidebar rather than under the list */
  .upblk{border-top:1px solid var(--line);padding-top:16px;margin-top:2px}
  .upbtn{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--accent);
    background:var(--accent);color:var(--accent-ink);font:inherit;font-size:13.5px;
    font-weight:600;cursor:pointer}
  .upbtn:hover{background:var(--goHover)}
  /* THE DESIGN MAKES IT A FILLED BUTTON, not the quiet outline I had
     drawn. His call: it is the owner's own sidebar, nobody reaches it
     without signing in as the owner, and it asks twice after the click.

     --badInk, NOT #fff, which is the one change made to the drawing.
     White on this pink measures 3.39:1 in dark; --badInk is the token
     that already flips per theme for exactly this pairing - #2b0f16 on
     dark's #e2607a at 5.23, white on light's #c2405c at 5.02. Same
     button, same colour, legible in both. family.test.js refuses the
     other version, which is how it was caught the first time. */
  .emptybtn{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--bad);background:var(--bad);color:var(--badInk);
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .emptybtn:hover{filter:brightness(1.1)}
  .emptybtn[disabled]{opacity:.55;cursor:default;filter:none}
  /* the active-filter pills above the list, and the way back out */
  .tag-x{padding:3px 9px;border-radius:999px;background:var(--glowSoft);
    border:1px solid var(--accent);font-size:12px;color:var(--accent);
    cursor:pointer;font-family:inherit}
  .clearall{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;
    background:none;border:none;font-family:inherit}

  /* ---------------------------------------------------------- the results */
  .hint{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);
    letter-spacing:.06em}
  .rows{overflow:hidden}
  /* 104px | the description and its spec line | the two copy buttons.
     The design's three columns, and the middle one stacks two lines where
     this tool used to show the type in a third column - which is where the
     attribute values now go, so a row says what the thing IS without
     anybody opening it. */
  .row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;
    align-items:center;padding:10px 18px;cursor:pointer;
    border-top:1px solid var(--line);transition:background .13s ease;
    width:100%;background:none;border-left:0;border-right:0;border-bottom:0;
    color:var(--text);font-family:inherit;text-align:left}
  .row:first-child{border-top:none}
  .row:nth-child(even){background:var(--zebra)}
  .row:hover{background:var(--glowSoft)}
  .row .c{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent)}
  .row .mid{display:flex;flex-direction:column;gap:2px;min-width:0}
  .row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
  .row .spec{font-size:12px;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* ---- THE METADATA AS CHIPS ----

     His. The pills this replaces were mine, and the difference is that a
     chip carries its KIND in its colour: what the material is, who makes
     it, a fact or two off its sheet, and whether it is still in use - four
     things that were four identical grey pills and are now told apart
     before they are read.

     THE BORDER AND THE WASH ARE DERIVED FROM THE TEXT COLOUR, with
     color-mix, so a chip needs one colour rather than three and cannot
     drift out of step with itself. 38% for the border, 7% for the wash:
     both faint enough that the TEXT is what carries the contrast, which
     is what keeps this measurable - see the tokens below.

  /* ------------------------------------------------------------ the modal */
  /* [hidden] IS NOT A TOGGLE ONCE CSS SETS display ON THE SAME ELEMENT.
     The hidden attribute works by a UA rule, [hidden]{display:none}, and
     ANY author display declaration outranks it. .scrim says display:flex,
     so hidden did nothing: the modal backdrop stood over the whole page
     permanently - dimming it and swallowing every click - and the tool
     read as broken while the markup said it was closed.

     Both of these need the explicit rule, and both had the bug. */
  .scrim[hidden],.totop[hidden]{display:none}
  .scrim{position:fixed;inset:0;background:rgba(2,8,3,.72);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);

  .mbody{overflow:auto;min-height:0}

  /* --------------------------------------------------------- back to top */
  .totop{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;

    .side{position:static;max-width:none;max-height:none;flex-basis:100%}

<style>
  /* PAGE SCROLLBAR - a drawn liquid-glass bar sitting just right of the
     results list. The page's own bar is hidden by nav.css for the whole
     site, so without this there is nothing to show position or to drag.
     Auto-hides; shows while scrolling or hovered; draggable. */
  #pgbar{position:fixed;width:10px;z-index:15;border-radius:99px;opacity:0;
    transition:opacity .35s ease;background:rgba(16,34,18,.45);
    border:1px solid rgba(162,229,156,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #pgbar.on,#pgbar:hover,#pgbar.drag{opacity:1;transition-duration:.12s}
  #pgbar i{position:absolute;left:1px;right:1px;top:0;border-radius:99px;min-height:36px;cursor:grab;
    background:linear-gradient(180deg,rgba(210,248,210,.62),rgba(134,224,143,.3));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  #pgbar i:hover,#pgbar.drag i{background:linear-gradient(180deg,rgba(225,252,225,.8),rgba(134,224,143,.5))}
  #pgbar.drag i{cursor:grabbing}
  html[data-theme="light"] #pgbar{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.75)}
  html[data-theme="light"] #pgbar i{background:linear-gradient(180deg,rgba(31,138,62,.5),rgba(31,138,62,.28))}
  html[data-theme="light"] #pgbar i:hover,html[data-theme="light"] #pgbar.drag i{background:linear-gradient(180deg,rgba(31,138,62,.7),rgba(31,138,62,.45))}
  /* ---- THE PHOTOGRAPH, AND GLASS OVER IT ----

     The design's own, and the last piece of it I had left out: I looked
     for tools/materials/img/ and did not look for the source, which was
     in media/backgroud all along as "Dark/Light Mode - Design &
     Materials.png" - the same place project-update's Field Operations
     pair came from.

     THE WebP PAIR, not the 2.8 MB PNGs. media/backgroud is gitignored
     because the sources are 2.6-2.8 MB each; what ships is the same
     picture exported through a canvas at quality 0.56, 1280 and 1672
     wide, 120-217 KB. Exactly the treatment What To Do and Project
     Update already get, and the native width is 1672 so neither file is
     upscaled.

     The bar keeps its own rule off, as the design draws it: no border,
     no glow, the header running straight into the picture. */
  html[data-cat] header.hdr,html[data-cat] .hdr{border-bottom:0 !important;box-shadow:none !important}

  .scene{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:var(--bg) var(--scene) center/cover no-repeat}
  .scene::after{content:'';position:absolute;inset:0;background:var(--tint)}
  html{
    /* ---- THE PHOTOGRAPH AS IT IS, AND THE PANELS THAT MAKE THAT WORK ----

       His change, and it is ONE change: the darkening layer comes off the
       dark-mode photo, and the glass goes near-solid so the text still has
       a ground. It arrived as two items on a list and was reviewed as two,
       which is how the half of it that cannot stand alone got measured,
       failed, and looked like the designer had been wrong.

       WHAT SPLITTING IT MEASURED. With --tint:none at the old .58 glass,
       the brightest pixel under the results panel is rgb(255,255,250) -
       blown-out white - and every text colour failed against it:
       --text 3.23, --muted 1.61, the chips 2.23 to 2.56, Disposed 1.92,
       worst 1.61 against a floor of 4.5. All true, and all irrelevant,
       because the other half of his change was the answer: solving for
       the glass alpha that clears the floor gives 0.93, and his own
       leafmint palette already set 0.94.

       So the alpha below is not a number I invented to rescue his idea.
       It is the one he had used, arrived at from the other direction. */
    --scene:image-set(url('img/scene-dark-original-1280.webp') 1x, url('img/scene-dark-original-1672.webp') 2x);
    --tint:none;
    --g-glass:rgba(16,34,18,0.93);--g-edge:rgba(162,229,156,.22);
    --g-blur:blur(16px) saturate(1.4);--g-inset:inset 0 1px 0 rgba(255,255,255,.08)}
  html[data-theme="light"]{
    --scene:image-set(url('img/scene-light-1280.webp') 1x, url('img/scene-light-1672.webp') 2x);
    --tint:linear-gradient(rgba(10,60,25,.14),rgba(10,60,25,.06));
    /* LIGHT GOES SOLID TOO, AND THIS ONE WAS ALREADY BROKEN. Light keeps
       its photo and its tint - his change was dark-only - but the darkest
       pixel under the panel is rgb(2,4,2), and at the old .62 glass the
       worst pairing measured 2.08, with --muted at 3.29 and the code ink
       at 2.42. That is the site-wide problem raised on 9 November, not
       something the pair introduced; it simply got measured properly this
       time. .93 clears it, worst 4.51. Same number as dark, arrived at
       independently. */
    --g-glass:rgba(255,255,255,0.93);--g-edge:rgba(255,255,255,.7);
    --g-blur:blur(10px) saturate(1.25);--g-inset:inset 0 1px 0 rgba(255,255,255,.9)}

  html[data-theme="light"][data-accent="mint"] body{--codeInk:#007d69;--markBg:rgba(155,227,184,.6);--sideGlass:rgba(255,255,255,.8);--selBg:#ffffff;--modalHead:rgba(155,227,184,.3);--cpbEdge:#1c2b24;--cpbInk:#1c2b24}
  html[data-accent="coral"] body{--codeInk:#ffa79e;--markBg:rgba(255,140,115,.35);--sideGlass:rgba(8,28,28,.6);--selBg:rgba(255,140,115,.12);--modalHead:rgba(255,140,115,.16);--cpbEdge:rgba(255,159,138,.45);--cpbInk:#ffd2c8}

<body>
<div class="scene" aria-hidden="true"></div>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep"></span>
  <h1>Material Codes</h1>
  <span class="pill" id="pill">loading…</span>
  <button class="theme" id="themeBtn" title="Light / dark">☾</button>
</header>

<main>
  <!-- TWO COLUMNS, as the design draws it: the filters stay put on the left
       while the list scrolls past them. Under 900px the aside stops being
       sticky and sits above the list, because 260px of filters and a table
       do not share a phone. -->
  <aside class="side" id="facets"></aside>
  <div class="rcol">
    <div class="phead">
      <div class="searchwrap">
        <span class="ic">⌕</span>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
          placeholder="Search code, description, model, vendor, band…" aria-label="Search materials">
        <button class="clr" id="clr" aria-label="Clear">×</button>
      </div>
      <div class="bar"><span class="hint" id="hint"></span><span class="tags" id="active"></span></div>
    </div>
    <section class="panel"><div id="view"></div></section>
  </div>
</main>

<!-- The detail is a modal now rather than a route. It used to be a view that
     replaced the list, so closing it rebuilt the whole table and lost the
     scroll position; over a dialog the list keeps its place underneath. -->
<div class="sbar" id="sbar" aria-hidden="true"><i></i></div>
<div class="scrim" id="scrim" hidden></div>
<button class="totop" id="totop" hidden><span>↑</span>Back to top</button>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none" multiple>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const M = window.MAT;
let ALL = [], TYPE = '', VENDOR = '', Q = '', PICKED = null;
/* FS: the per-attribute facet selections, { 'Band': ['900','1800'] }. LIM:
   how many rows are drawn, raised by Show more - it replaced a hard stop
   at 400 that nothing could get past. */
let FS = {}, LIM = 150;
/* FAM: a whole family picked from the dropdown (TYPE is one type in it).
   STATUS: All / Active / Disposed, read from the sheets' disposal column. */
let FAM = '', STATUS = 'All', DDOPEN = false;
/* what the last completed read came back with, so the next one can ask
   whether anything has moved instead of reading it all again */
let MSTAMP = null, MN = 0;
/* null until a delete on THIS page has completed, then the number the
   server reported deleting. Not a boolean: the page prints it. */
let WIPED = null;

let tt; function toast(m, ms){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), ms||2000); }

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s, term){
  s = esc(s);
  const parts = String(term||'').trim().split(/\s+/).filter(Boolean);
  for (const p of parts){
    const re = new RegExp('('+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    s = s.replace(re,'<mark>$1</mark>');
  }
  return s;
}

/* ---------------------------------------------------------------- loading */
async function load(){
  if (!window.DB || !window.DB.materialsLoad){ shell('Not connected', 'The database library did not load.'); return; }
  const r = await window.DB.materialsLoad();
  if (r.error && !(r.rows || []).length){ shell('Nothing to show', r.error); return; }
  ALL = r.rows || []; MSTAMP = r.stamp || null; MN = r.n || 0;
  paint();
  if (QS.get('open') && ALL[0]) openDetail(ALL[0]);
    /* ONLY ON A REAL EVENT. liveChannel calls this for four reasons and
       hands the reason in: undefined for an actual postgres_changes
       event, and a string for the three reconciliation paths - becoming
       visible, the 15 minute backstop, and the channel coming back. The
       reload runs for all four, because that is the reconciliation and
       it is the point. The SENTENCE is only true for the first.

       It said "Updated from another device" on every tab focus and every
       quarter of an hour, when nothing had happened. The caller was
       handed what it needed to be accurate and dropped it. */
  window.DB.materialsSubscribe(async (why) => {
    /* A reload that changed nothing produces no repaint. UNKNOWN STILL
       REPAINTS - no RELOG, no signature, a serialiser that threw, all
       render - because skipping a render that was needed shows stale
       rows and says nothing, while rendering one that was not costs a
       repaint. The two directions are not symmetrical.
       RELOG still records every reload either way, so the log says
       whether the skip is doing anything. */
    const before = ALL;
    /* ASK BEFORE READING. Only the subscriber passes `since`, so the first
       load always walks and the gate can never be why a freshly opened tab
       is empty. MSTAMP and MN are what the last completed walk came back
       with; a reload that was held does not change them. */
    const f = await window.DB.materialsLoad(
      MSTAMP && MN ? { since: { stamp: MSTAMP, n: MN } } : undefined);
    if (!f.error){
      /* null is "nothing moved": keep the rows that are already on screen. */
      if (f.rows !== null){ ALL = f.rows; MSTAMP = f.stamp; MN = f.n; }
      /* somebody uploaded again, here or elsewhere: the page is no longer
         showing the aftermath of a delete and must stop saying so */
      if (ALL.length) WIPED = null;
      /* One call decides, paints and records, so this tool and WH24 cannot
         log differently - which they did, and it read as the skip being
         absent here when it was only silent. No RELOG means paint. */
      if (window.RELOG) RELOG.decide('materials', why, before, ALL,
                                     { key: r => r && r.code, render: paint });
      else paint();
      if (!why) toast('Updated from another device');
    }
  });
}
function shell(head, body){
  $('pill').textContent = '—';
  $('view').innerHTML = '<div class="empty"><div class="big">☁</div><h2>'+esc(head)+'</h2><p>'+esc(body)+'</p></div>';
  renderFooter();
}

/* ---------------------------------------------------------------- painting */
function paint(){
  $('pill').innerHTML = '<b>'+ALL.length.toLocaleString()+'</b> materials';
  renderFacets();
  route();
  renderFooter();
}

/* ---------------------------------------------------------- the sidebar

   THE DESIGN'S LEFT COLUMN, with one substitution and one omission, both
   because of what the data is rather than what the drawing shows.

   SUBSTITUTED: the design's category <select> groups its options under
   RF / Baseband / Transmission / Power / Civil, read from a `f` family
   field in its catalog.json. The material list has no family - a row is
   { code, desc, type, vendor, attrs } - so the select is flat. Inventing
   a family mapping would be five made-up facts on screen.

   OMITTED: the design's All / Active / Disposed control, which reads a
   `x` disposed flag. Nothing in the material master marks disposal, so
   there is nothing for it to filter. Vendor takes that slot instead,
   which is the second axis the data actually has.

   KEPT, and it is the real gain: the per-attribute facets. Every key in
   `attrs` with between two and thirty distinct values becomes a checkable
   list, counted from the rows currently in view. That is the design's
   behaviour exactly, and this tool's chip rows could not do it. */
/* `vendor` is in here as of 9 November, and it closes the SECOND of two
   bugs that together drew the sidebar two "VENDOR" headings.

   collate() lifts attrs.Vendor into its own normalised r.vendor column,
   which the Vendor tile above is built from - but it LEAVES the raw key in
   attrs, and this list did not skip it. So the same fact drew a facet
   twice: once normalised (Huawei 394) and once raw (Huawei 183, Hua 171,
   and "—" for the 1,104 rows with no Vendor attr at all).

   THE ORDER MATTERED. This line on its own would have removed the second
   heading and, with it, the only visible sign that normVendor was throwing
   away 20 rows' vendors - the raw facet was the only place those rows'
   spellings still appeared. Deleting the symptom before the cause would
   have left the data loss in place and invisible. materials.js was fixed
   first; this is the tidy-up after it.

   The /i flag covers Vendor and vendor both; the sheets use each. */
const FEXCL = /part|final mc|comment|remark|dispos|vendor/i;
const isDisp = r => Object.entries(r.attrs || {}).some(([k, v]) =>
  v && (/dispos/i.test(k) || /^dispos/i.test(String(v))));
const stOK = r => STATUS === 'All' || isDisp(r) === (STATUS === 'Disposed');
const inFS = (r, skip) => Object.entries(FS).every(([k, set]) =>
  k === skip || !set.length || set.includes((r.attrs || {})[k] || '—'));
const baseRows = () => M.view(ALL, { type:TYPE, vendor:VENDOR, q:Q })
  .filter(r => (!FAM || M.famOf(r.type) === FAM) && stOK(r));

function renderFacets(){
  const f = M.facets(ALL), base = baseRows();
  const lbl = s => String(s).replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
  let h = '';

  /* THE CATEGORY TILE: a drawn dropdown - every family, its types under
     it, a count on each that ignores the current pick - and the status
     switch when the sheets carry a disposal column at all. */
  const ddBase = M.view(ALL, { vendor:VENDOR, q:Q }).filter(stOK);
  const cnt = {}; ddBase.forEach(r => { cnt[r.type] = (cnt[r.type] || 0) + 1; });
  const resN = base.filter(r => inFS(r)).length;
  const ddi = (cls, on, attr, v, n) => '<button class="ddi ' + cls + (on ? ' on' : '') + '" ' + attr +
    '><span class="mk">' + (on ? '✓' : '') + '</span><span class="v">' + esc(v) +
    '</span><span class="n">' + n + '</span></button>';
  const label = TYPE ? M.labelOf(TYPE) : (FAM || 'All materials');
  const sub = (TYPE ? M.famOf(TYPE) + ' · ' : '') + resN.toLocaleString() + ' items';
  h += '<div class="tile cat"><div class="flabel">Category</div>' +
    '<div class="dd' + (DDOPEN ? ' open' : '') + '" id="dd"><button class="ddbtn" id="ddbtn">' +
    '<span class="l"><span class="t">' + esc(label) + '</span><span class="s">' + esc(sub) + '</span></span>' +
    '<span class="ch">▾</span></button><div class="ddpan">' +
    ddi('', !TYPE && !FAM, 'data-dd=""', 'All materials', ddBase.length) +
    M.families(ALL).map(fm => '<div class="ddsep"></div>' +
      ddi('fam', FAM === fm.name && !TYPE, 'data-ddf="' + esc(fm.name) + '"', fm.name,
        fm.types.reduce((s, t) => s + (cnt[t.name] || 0), 0)) +
      fm.types.map(t => ddi('sub', TYPE === t.name, 'data-ddt="' + esc(t.name) + '"', t.label, cnt[t.name] || 0)).join('')
    ).join('') + '</div></div>' +
    (ALL.some(isDisp) ? '<div class="seg">' + ['All', 'Active', 'Disposed'].map(n =>
      '<button class="' + (STATUS === n ? 'on' : '') + (n === 'Disposed' ? ' bad' : '') +
      '" data-st="' + n + '">' + n + '</button>').join('') + '</div>' : '') + '</div>';

  if (f.vendors.length)
    h += '<div class="tile"><div class="fgrp"><div class="fhead"><span class="flabel">Vendor</span>' +
      (VENDOR ? '<button class="fclear" data-clr="vendor">clear</button>' : '') + '</div>' +
      f.vendors.map(v => '<button class="fv' + (VENDOR === v.name ? ' on' : '') +
        '" data-ven="' + esc(v.name) + '"><span class="box">' + (VENDOR === v.name ? '✓' : '') +
        '</span><span class="v">' + esc(v.name) + '</span><span class="n">' + v.count +
        '</span></button>').join('') + '</div></div>';

  let sp = '';
  /* the attribute facets, counted against the rows every OTHER filter
     leaves - so a value's count is what picking it would give you */
  const seen = {};
  base.forEach(r => Object.keys(r.attrs || {}).forEach(k => {
    (seen[k] = seen[k] || new Set()).add(r.attrs[k]);
  }));
  const cols = Object.keys(seen)
    .filter(k => seen[k].size >= 2 && seen[k].size <= 30 && !FEXCL.test(k));
  if (!TYPE && !cols.length)
    sp += '<div class="fnone">Pick a category to filter by its specs.</div>';
  cols.forEach(k => {
    const m = {};
    base.filter(r => inFS(r, k)).forEach(r => {
      const v = (r.attrs || {})[k] || '—'; m[v] = (m[v] || 0) + 1;
    });
    const sel = FS[k] || [];
    sp += '<div class="fgrp"><div class="fhead"><span class="flabel">' + esc(lbl(k)) + '</span>' +
      (sel.length ? '<button class="fclear" data-clr="' + esc(k) + '">clear</button>' : '') +
      '</div>' + Object.entries(m)
        .sort((a, b) => (parseFloat(a[0]) - parseFloat(b[0])) || b[1] - a[1])
        .map(([v, n]) => '<button class="fv' + (sel.includes(v) ? ' on' : '') +
          '" data-fk="' + esc(k) + '" data-fv="' + esc(v) + '"><span class="box">' +
          (sel.includes(v) ? '✓' : '') + '</span><span class="v">' + esc(v) +
          '</span><span class="n">' + n + '</span></button>').join('') + '</div>';
  });

  if (sp) h += '<div class="tile specs">' + sp + '</div>';
  const ob = ownerBlock();
  $('facets').innerHTML = h + (ob ? '<div class="tile">' + ob + '</div>' : '');
  /* the dropdown list lives on <body>, outside the sidebar's scroll box,
     so the sidebar scrollbar cannot paint over it */
  const oldP = document.getElementById('ddpan'); if (oldP) oldP.remove();
  const pan = $('facets').querySelector('.ddpan');
  pan.id = 'ddpan'; pan.classList.toggle('show', DDOPEN); document.body.appendChild(pan);
  if ($('up')) $('up').onclick = () => $('file').click();
  if ($('wipe')) $('wipe').onclick = askWipe;
  $('ddbtn').onclick = e => { e.stopPropagation(); setDD(!DDOPEN); };
  placeDD(); sbUpdate();
  [...$('ddpan').querySelectorAll('.ddi')].forEach(b => b.onclick = () => {
    if ('ddt' in b.dataset){ TYPE = b.dataset.ddt; FAM = ''; }
    else if ('ddf' in b.dataset){ FAM = b.dataset.ddf; TYPE = ''; }
    else { FAM = ''; TYPE = ''; }
    DDOPEN = false; FS = {}; LIM = 150; PICKED = null; renderFacets(); route();
  });
  [...$('facets').querySelectorAll('[data-st]')].forEach(b => b.onclick = () => {
    STATUS = b.dataset.st; LIM = 150; renderFacets(); route();
  });
  [...$('facets').querySelectorAll('[data-ven]')].forEach(b => b.onclick = () => {
    VENDOR = VENDOR === b.dataset.ven ? '' : b.dataset.ven;
    LIM = 150; PICKED = null; renderFacets(); route();
  });
  [...$('facets').querySelectorAll('[data-fk]')].forEach(b => b.onclick = () => {
    const k = b.dataset.fk, v = b.dataset.fv, cur = FS[k] || [];
    FS[k] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]);
    LIM = 150; renderFacets(); route();
  });
  [...$('facets').querySelectorAll('[data-clr]')].forEach(b => b.onclick = () => {
    if (b.dataset.clr === 'vendor') VENDOR = ''; else FS[b.dataset.clr] = [];
    LIM = 150; renderFacets(); route();
  });
}

function route(){
  const base = baseRows(), res = base.filter(r => inFS(r));
  $('clr').style.display = Q ? 'block' : 'none';

  /* the count line and the active-filter pills, as the design has them */
  /* WIPED is the number the server said it deleted. While it is set the
     count line stays on at "0 of 0", because a blank line next to an
     empty page is what a failed load looks like and this is not one. */
  $('hint').textContent = (ALL.length || WIPED !== null)
    ? res.length.toLocaleString() + ' of ' + base.length.toLocaleString() : '';
  const act = [];
  if (VENDOR) act.push(['vendor', VENDOR, VENDOR]);
  Object.entries(FS).forEach(([k, set]) => set.forEach(v => act.push([k, v, v])));
  $('active').innerHTML = act.map(([k, v, t]) =>
      '<button class="tag-x" data-ak="' + esc(k) + '" data-av="' + esc(v) + '">' +
      esc(t) + ' ×</button>').join('') +
    (act.length ? '<button class="clearall" id="clrall">clear all</button>' : '');
  [...$('active').querySelectorAll('[data-ak]')].forEach(b => b.onclick = () => {
    const k = b.dataset.ak;
    if (k === 'vendor') VENDOR = ''; else FS[k] = (FS[k] || []).filter(x => x !== b.dataset.av);
    LIM = 150; renderFacets(); route();
  });
  if ($('clrall')) $('clrall').onclick = () => {
    VENDOR = ''; FS = {}; LIM = 150; renderFacets(); route();
  };

  if (!res.length){
    /* THREE EMPTINESSES, AND THEY ARE NOT THE SAME SENTENCE. Filters that
       match nothing, a list that was emptied on purpose, and a list that
       is empty for a reason nobody here knows - which is also what a read
       that quietly returned nothing looks like, so it keeps the vaguest
       wording and the other two say what happened. */
    $('view').innerHTML = ALL.length
      ? '<div class="empty"><div class="big">🔍</div>' +
        'No materials match. Try fewer filters.</div>'
      : WIPED !== null
      ? '<div class="empty"><div class="big">✓</div><h2>The list is empty</h2><p>' +
        WIPED.toLocaleString() + (WIPED === 1 ? ' row was' : ' rows were') +
        ' deleted. Nothing failed – upload a workbook to fill it again.</p></div>'
      : '<div class="empty"><div class="big">🔍</div>Nothing to show.</div>';
    return;
  }

  /* SHOW MORE rather than a hard 400. The old list stopped at 400 and said
     so in the hint, which left no way to reach row 401 except typing a
     narrower search - and the person who wants all 600 antennas is exactly
     the person who cannot. */
  const show = res.slice(0, LIM);
  /* THE CHIPS under each description: what it is, who makes it, a few
     short facts from its sheet, and whether it is still in use.

     SKIP is his, and it is NOT FEXCL. FEXCL is the facet list and is
     about which attribute keys deserve a filter; this is about which
     deserve a chip, and the answers differ - a Model is worth filtering
     on and would be noise on every row. They do overlap on the disposal
     column, which both must drop, and that overlap is the one thing to
     watch if either list changes: the chip would say Active while the
     disposal value sat beside it as an attribute.

     The status still reads isDisp(r) - the same flag the Disposed
     segment and the struck-through code use. No second source for it. */
  const SKIP = /^(vendor|category|category \d|type|type - cat|model|model name|item description|part no|part number|final mc|remarks|comment|owner|base|column\d*|level \d+ categorizing|genaric name of antenna|bb\/mpt\/ext\/bb accs|total disposal.*|total dispose)$/i;
  const chips = r => {
    const at = Object.entries(r.attrs || {})
      .filter(([k, v]) => !SKIP.test(k) && v && v.length <= 14 && !/^[-—]$/.test(v) && v !== r.vendor)
      .slice(0, 3).map(e => '<span class="tag at">' + esc(e[1]) + '</span>').join('');
    return (r.type ? '<span class="tag ty">' + esc(M.labelOf(r.type)) + '</span>' : '') +
      (r.vendor ? '<span class="tag vn">' + esc(r.vendor) + '</span>' : '') + at +
      (isDisp(r) ? '<span class="tag st bad">Disposed</span>' : '<span class="tag st ok">Active</span>');
  };
  $('view').innerHTML = '<div class="rows">' + show.map((r, i) =>
    '<div class="row' + (isDisp(r) ? ' disp' : '') + '" role="button" tabindex="0" data-i="' + i + '"><span class="c">' + hl(r.code, Q) + '</span>' +
    '<span class="mid"><span class="d">' + hl(r.desc, Q) + '</span>' +
    '<span class="chips">' + chips(r) + '</span></span>' +
    '<span class="cp"><button class="cpb primary" data-cp="code" data-i="' + i + '">⧉ Code</button>' +
    '<button class="cpb" data-cp="desc" data-i="' + i + '">⧉ Description</button></span></div>'
  ).join('') + '</div>' +
  (res.length > LIM ? '<button class="more" id="more">Show ' +
    Math.min(200, res.length - LIM) + ' more · ' +
    (res.length - LIM).toLocaleString() + ' left</button>' : '');

  [...$('view').querySelectorAll('.row')].forEach(el =>
    { el.onclick = () => openDetail(show[+el.dataset.i]);
      el.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === el){ e.preventDefault(); openDetail(show[+el.dataset.i]); } }; });
  [...$('view').querySelectorAll('[data-cp]')].forEach(b => b.onclick = e => {
    e.stopPropagation();
    copyOf(show[+b.dataset.i], b.dataset.cp,
      b.dataset.cp === 'code' ? 'Code copied' : 'Description copied');
  });
  if ($('more')) $('more').onclick = () => { LIM += 200; route(); };
}

/* one clipboard path for the rows, the modal and its fields */
function copyOf(r, what, said){
  const text = what === 'field' ? r : M.copyText(r, what);
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast(said)).catch(() => toast('Could not reach the clipboard'));
}

/* ------------------------------------------------------------- the detail

   A MODAL, not a route. It used to be a view that replaced the list, so
   closing it rebuilt the whole table and threw away the scroll position -
   on a 600-row category that is the difference between checking two codes
   and checking two codes and finding your place again twice. Over a
   dialog the list keeps its place underneath.

   Escape closes it, the scrim closes it, and the dialog itself does not -
   a click inside must not fall through to the scrim behind it. */
function openDetail(r){
  PICKED = r;
  const d = M.details(r);
  const act = (id, cls, label) =>
    '<button class="cpb ' + cls + '" data-m="' + id + '">' + label + '</button>';
  $('scrim').innerHTML =
    '<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="' + esc(r.code) + '">' +
      '<div class="mhead">' +
        '<div class="mtop">' +
          '<div class="dcode">' + esc(r.code) + '</div>' +
          '<button class="mclose" id="mclose" aria-label="Close">×</button>' +
        '</div>' +
        '<div class="ddesc">' + esc(r.desc) + '</div>' +
        '<div class="dtags">' +
          (r.type   ? '<span class="tag">' + esc(M.famOf(r.type)) + '</span>' +
                      '<span class="tag">' + esc(M.labelOf(r.type)) + '</span>' : '') +
          (r.vendor ? '<span class="tag">' + esc(r.vendor) + '</span>' : '') +
        '</div>' +
        '<div class="acts">' +
          act('code', 'primary', '⧉ Copy code') +
          act('desc', '', '⧉ Copy description') +
          act('row',  '', '⧉ Copy row (Excel)') +
          act('all',  '', '⧉ Copy all details') +
        '</div>' +
      '</div>' +
      '<div class="mbody">' +
        (d.length
          ? '<div class="fields">' + d.map((x, i) =>
              '<div class="f"><div class="kv"><div class="k">' + esc(x.k) + '</div>' +
              '<div class="v">' + esc(x.v) + '</div></div>' +
              '<button class="fcopy" data-f="' + i + '">⧉</button></div>').join('') + '</div>'
          : '<div class="fnone" style="padding:22px">The sheet has no extra columns ' +
            'for this item, only the code and description.</div>') +
      '</div>' +
    '</div>';
  $('scrim').hidden = false;

  $('mclose').onclick = closeDetail;
  $('modal').onclick = e => e.stopPropagation();
  [...$('scrim').querySelectorAll('[data-m]')].forEach(b => b.onclick = () =>
    copyOf(r, b.dataset.m, ({ code:'Code copied', desc:'Description copied',
      row:'Row copied', all:'All details copied' })[b.dataset.m]));
  [...$('scrim').querySelectorAll('[data-f]')].forEach(b => b.onclick = () =>
    copyOf(d[+b.dataset.f].v, 'field', esc(d[+b.dataset.f].k) + ' copied'));
  $('mclose').focus();
}

function closeDetail(){
  PICKED = null;
  $('scrim').hidden = true;
  $('scrim').innerHTML = '';
}

$('scrim').onclick = closeDetail;
/* THE DROPDOWN FLOATS (position:fixed) so the sidebar's own scroll box
   cannot clip it: it starts under the button and runs 26px past the tile's
   right edge, clear of the sidebar scrollbar. */
function setDD(on){
  DDOPEN = on;
  const d = $('dd'), p = $('ddpan');
  if (d) d.classList.toggle('open', on);
  if (p) p.classList.toggle('show', on);
  placeDD();
}
function placeDD(){
  const d = $('dd'); if (!d || !DDOPEN) return;
  const b = $('ddbtn').getBoundingClientRect(), p = $('ddpan'); if (!p) return;
  const room = innerHeight - b.bottom - 16;
  p.style.top = (b.bottom + 6) + 'px'; p.style.left = b.left + 'px';
  p.style.width = (b.width + 26) + 'px';
  p.style.maxHeight = Math.max(180, Math.min(320, room)) + 'px';
}
addEventListener('resize', placeDD);

/* the floating pill: positioned beside the sidebar, sized to what it shows */
let sbHover = false, sbT = 0;
function sbUpdate(){
  const side = $('facets'), sb = $('sbar'), th = sb.firstChild;
  const r = side.getBoundingClientRect(), max = side.scrollHeight - side.clientHeight;
  if (max <= 1 || getComputedStyle(side).position === 'static'){ sb.style.display = 'none'; return; }
  sb.style.display = 'block';
  const trackH = r.height - 40, h = Math.max(48, trackH * side.clientHeight / side.scrollHeight);
  sb.style.left = (r.right + 3) + 'px'; sb.style.top = (r.top + 20) + 'px'; sb.style.height = trackH + 'px';
  th.style.height = h + 'px';
  th.style.transform = 'translateY(' + (side.scrollTop / max * (trackH - h)) + 'px)';
  sb.classList.toggle('show', sbHover || sb.classList.contains('act'));
}
(function(){
  const side = $('facets'), sb = $('sbar');
  const hov = on => { sbHover = on; sbUpdate(); };
  [side, sb].forEach(el => {
    el.addEventListener('mouseenter', () => hov(true));
    el.addEventListener('mouseleave', () => hov(false));
  });
  side.addEventListener('scroll', () => {
    sb.classList.add('act'); sbUpdate(); clearTimeout(sbT);
    sbT = setTimeout(() => { sb.classList.remove('act'); sbUpdate(); }, 700);
  }, { passive: true });
  const drag = e => {
    const r = sb.getBoundingClientRect();
    side.scrollTop = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) * (side.scrollHeight - side.clientHeight);
  };
  sb.addEventListener('pointerdown', e => {
    e.preventDefault(); sb.setPointerCapture(e.pointerId); drag(e);
    sb.onpointermove = drag; sb.onpointerup = () => { sb.onpointermove = null; };
  });
  addEventListener('resize', sbUpdate);
  addEventListener('scroll', sbUpdate, { passive: true });
})();
document.addEventListener('scroll', placeDD, true);
document.addEventListener('click', e => {
  if (DDOPEN && !e.target.closest('#dd') && !e.target.closest('#ddpan')) setDD(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && DDOPEN) setDD(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && PICKED) closeDetail();
});

/* ------------------------------------------------------------ back to top

   The design shows it after a scroll. 500px is its threshold, and the
   handler is passive so it cannot hold up a scroll on a phone. */
addEventListener('scroll', () => {
  const on = (window.scrollY || document.documentElement.scrollTop) > 500;
  if (on === !$('totop').hidden) return;
  $('totop').hidden = !on;
}, { passive: true });
$('totop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

/* ------------------------------------------------------------- the upload

   Either file, or both at once. Each is read for whatever material masters it
   holds and merged into what is already there: a material the upload does not
   mention is left alone, because the two files each cover part of the list
   and neither is the whole of it. Only what actually changed is written. */
$('file').addEventListener('change', async e => {
  const files = [...(e.target.files || [])];
  e.target.value = '';
  if (!files.length) return;
  try {
    let incoming = [];
    for (const f of files){
      toast('Reading ' + f.name + '…', 20000);
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const sheets = {};
      wb.SheetNames.forEach(n => {
        sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:'', raw:false });
      });
      /* a csv arrives as one nameless sheet; it is the export, so say so */
      if (wb.SheetNames.length === 1 && /\.csv$/i.test(f.name)){
        sheets['table-export'] = sheets[wb.SheetNames[0]];
      }
      incoming = incoming.concat(M.readWorkbook(sheets));
    }
    if (!incoming.length){ toast('No material sheets in that file', 4000); return; }

    const plan = M.planUpload(incoming, ALL);
    if (!plan.write.length){
      toast(plan.unchanged.toLocaleString() + ' materials, all already right', 5000);
      return;
    }
    const okUp = await Ask.twice([
      { title: 'Save ' + plan.write.length.toLocaleString() + ' materials?',
        body: plan.added.toLocaleString() + ' are new and ' + plan.changed.toLocaleString() + ' are corrected. ' +
              'The other ' + plan.unchanged.toLocaleString() + ' already match and are not touched.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Corrections overwrite what is there.',
        body: 'A corrected description replaces the old one for everybody who searches the codes. Nothing is deleted by an upload.',
        no: 'No, leave it', yes: 'Save them' }
    ]);
    if (!okUp){ toast('Nothing was saved'); return; }
    toast('Saving ' + plan.write.length.toLocaleString() + ' of ' + plan.total.toLocaleString() + '…', 60000);
    await window.DB.materialsSave(plan.write, (done, total) => {
      if (done < total) toast('Saving… ' + done.toLocaleString() + ' of ' + total.toLocaleString(), 60000);
    });
    const r = await window.DB.materialsLoad();
    if (!r.error) ALL = r.rows;
    PICKED = null; paint();
    toast(plan.added.toLocaleString() + ' added · ' + plan.changed.toLocaleString() + ' corrected · ' +
          plan.unchanged.toLocaleString() + ' already right', 7000);
  } catch (err){
    console.error(err);
    toast('Could not read that: ' + err.message, 7000);
  }
});

/* THE FOOTER IS ONE LINE AGAIN, and the upload moved out of it.

   It was "Read from the database · Dialog material master" with the
   owner's upload link hung underneath on a <br>. In the two-column layout
   that put the only way to publish a new material master at the very
   bottom of a 2,422-row list - past every row, in a page that now has a
   Show more button, so reaching it meant loading everything first.

   It is the last block of the sidebar instead: owner-only, always in
   view because the aside is sticky, and one click. The sidebar is also
   the one place in this design with room - the header bar is a fixed
   height that access.js documents as having 38px to work in, and the
   account chip already owns the right-hand end of it. */
function renderFooter(){
  const old = document.querySelector('main footer');
  if (old) old.remove();
  document.querySelector('.panel').insertAdjacentHTML('beforeend',
    '<footer>Read from the database · Dialog material master</footer>');
}

/* ------------------------------------------------- emptying the list

   THE SAME BOX AS EVERY OTHER DELETE IN THE PROJECT: Ask.twice from
   _lib/ask.js, which this page already loads. Two questions, not one
   question twice - the first names the number, the second names what
   that number is. Escape, the backdrop and the safe button all cancel,
   at either step, and the safe button holds the focus, so no stray
   Enter agrees to anything.

   THE NUMBER IS READ HERE, NOT TAKEN FROM ALL.length. ALL is whatever
   the last walk left on this tab, which may be minutes old and may have
   been held by the gate; the table is the only thing that knows. If the
   read fails the question is never asked, because a question with the
   wrong number in it is worse than no question.

   Nothing is deleted between the two steps. The only call that writes is
   after both of them have been answered. */
async function askWipe(){
  const btn = $('wipe');
  if (!window.DB || !window.DB.materialsCount || !window.DB.materialsWipe){
    toast('The database library did not load.', 4000); return;
  }
  if (btn) btn.disabled = true;
  let n = null;
  try {
    const r = await window.DB.materialsCount();
    if (r.error || r.n === null){ toast(r.error || 'Could not read the count.', 4000); return; }
    n = r.n;
  } finally { if (btn) btn.disabled = false; }

  if (!n){ toast('The list is already empty.', 3000); return; }

  /* THE DESIGN'S WORDING, over the count this page read a moment ago
     rather than over ALL.length. The drawing takes the number from the
     rows on screen; those are whatever the last walk left on this tab
     and may have been held by the gate, so the figure in the question
     could be wrong at the one moment it matters. */
  const ok = await Ask.twice([
    { title: 'Empty the material list?',
      body: 'All ' + n.toLocaleString() + ' materials, counted just now, are ' +
            'removed for everybody who searches the codes. There is a second ' +
            'question after this one.',
      no: 'Cancel', yes: 'Yes, go on' },
    { title: 'This cannot be undone.',
      body: 'Nothing else is touched – no files, no other table – and there is ' +
            'no copy of it here. The list stays empty until a workbook is ' +
            'uploaded again.',
      no: 'No, keep them', yes: 'Empty it' }
  ]);
  if (!ok){ toast('Nothing was removed'); return; }

  /* textContent would eat the icon, so only the label node is touched */
  const setLabel = t => { if (!btn) return;
    const n2 = [...btn.childNodes].find(x => x.nodeType === 3);
    if (n2) n2.nodeValue = t; else btn.textContent = t; };
  if (btn){ btn.disabled = true; setLabel('Emptying…'); }
  try {
    /* THE NUMBER PRINTED IS THE ONE THE SERVER REPORTS, not the one in the
       question. They are the same unless something moved in between, or
       unless RLS refused and nothing was deleted at all - and in that case
       this says 0, which is the truth, instead of congratulating itself. */
    const gone = await window.DB.materialsWipe();
    ALL = []; MSTAMP = null; MN = 0; PICKED = null;
    FS = {}; TYPE = ''; FAM = ''; VENDOR = ''; Q = ''; LIM = 150;
    if ($('q')) $('q').value = '';
    WIPED = gone;
    paint();
    toast(gone ? gone.toLocaleString() + ' rows deleted' : 'Nothing was deleted', 4000);
  } catch (err){
    toast(err.message, 5000);
  } finally {
    if (btn){ btn.disabled = false; setLabel('Empty the list…'); }
  }
}

/* appended to the sidebar by renderFacets, so it survives every repaint */
function ownerBlock(){
  if (!window.IS_OWNER) return '';
  return '<div class="fgrp upblk"><div class="flabel">Material master</div>' +
    '<button class="upbtn" id="up">⬆ Update from Excel…</button>' +
    /* the id stays `wipe` and the handler stays askWipe: the drawing
       changes how it looks, not what it is called, and wipe.test.js
       asserts the control and the wiring by those names. */
    '<button class="emptybtn" id="wipe">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ' +
      'style="vertical-align:-2px;margin-right:6px" aria-hidden="true">' +
      '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>' +
      'Empty the list…</button>' +
    '<div class="fnone">The workbook or the table export. Nothing is ' +
    'deleted by an upload – emptying the list is the separate button, ' +
    'and it asks twice.</div></div>';
}

/* ------------------------------------------------------------------ events */
/* a new search is a new list, so it starts at the top of it - and the
   facet counts are of the rows the search leaves, so they move too */
$('q').addEventListener('input', () => { Q = $('q').value; LIM = 150; PICKED = null; renderFacets(); route(); });
$('clr').onclick = () => { $('q').value = ''; Q = ''; LIM = 150; PICKED = null; renderFacets(); route(); $('q').focus(); };
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape' && PICKED){ PICKED = null; route(); }
});

/* ------------------------------------------------------------------- theme
   The button was drawn with nothing behind it, so this page could only ever be
   dark. Same key as every other tool, so light chosen anywhere is light here,
   and the glyph is what pressing it will give you. */
const THEME_KEY = 'office_tool_theme';
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('themeBtn').textContent = t === 'dark' ? '☀' : '☾';
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0c1619' : '#eef5f6');
}
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e){}
const QS = new URLSearchParams(location.search);
applyTheme(QS.get('theme') || savedTheme || 'light');
let accent = QS.get('accent');
try { if (!accent) accent = localStorage.getItem('mat_accent'); } catch(e){}
if (accent && accent !== 'green') document.documentElement.dataset.accent = accent;
/* ?btn=b1..b12, his button studies. Sets data-btn and nothing else; the
   rules that read it are in the stylesheet and are inert without it. */
const btnOpt = QS.get('btn');
if (btnOpt && /^b([1-9]|1[0-2])$/.test(btnOpt)) document.documentElement.dataset.btn = btnOpt;
$('themeBtn').onclick = () => {
  const to = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, to); } catch(e){}
  applyTheme(to);
};

load();
})();
</script>
<script>
/* AUTO-HIDE: any scroll marks its own scroller for a second, so the bar
   is there while you are moving and gone while you are reading. Capture,
   because scroll does not bubble - a listener on document only hears the
   sidebar and the dropdown if it is catching on the way down. */
(function(){
  const T = new WeakMap();
  document.addEventListener('scroll', e => {
    const el = (e.target === document || e.target === document.body)
      ? document.documentElement : e.target;
    if (!el.classList) return;
    el.classList.add('sbon');
    clearTimeout(T.get(el));
    T.set(el, setTimeout(() => el.classList.remove('sbon'), 1000));
  }, { capture: true, passive: true });
})();
</script>
<script>
/* THE DRAWN PAGE SCROLLBAR, beside the results column.

   nav.css hides the page's own bar across the whole site, so this page
   had no way to show how far down the list you were, and no way to drag.
   This is that bar, drawn: positioned against .rcol so it sits in the
   gutter beside the list rather than off at the window edge.

   It hides itself when the page does not scroll - a bar that is always
   there, pinned at full height, is a lie about the length of the list. */
(function(){
  const bar = document.createElement('div');
  bar.id = 'pgbar'; bar.innerHTML = '<i></i>';
  document.body.appendChild(bar);
  const th = bar.firstChild, D = document.documentElement;
  let hideT, drag = null;

  function layout(){
    const col = document.querySelector('.rcol'), hd = document.querySelector('.hdr');
    const sh = D.scrollHeight, vh = innerHeight;
    if (!col || sh <= vh + 2){ bar.style.display = 'none'; return; }
    bar.style.display = '';
    const r = col.getBoundingClientRect();
    const top = (hd ? hd.getBoundingClientRect().bottom : 0) + 20;
    const H = vh - top - 20;
    bar.style.left = (r.right + 7) + 'px';
    bar.style.top = top + 'px';
    bar.style.height = H + 'px';
    const tH = Math.max(36, H * vh / sh);
    th.style.height = tH + 'px';
    th.style.transform = 'translateY(' + ((H - 2 - tH) * scrollY / (sh - vh)) + 'px)';
  }
  function show(){
    bar.classList.add('on');
    clearTimeout(hideT);
    hideT = setTimeout(() => bar.classList.remove('on'), 1000);
  }
  addEventListener('scroll', () => { layout(); show(); }, { passive: true });
  addEventListener('resize', layout);
  new ResizeObserver(layout).observe(document.body);

  th.addEventListener('pointerdown', e => { e.preventDefault();
    th.setPointerCapture(e.pointerId); drag = { y: e.clientY, s: scrollY };
    bar.classList.add('drag'); });
  th.addEventListener('pointermove', e => { if (!drag) return;
    const H = bar.clientHeight - 2, tH = th.offsetHeight, max = D.scrollHeight - innerHeight;
    scrollTo(0, drag.s + (e.clientY - drag.y) * max / Math.max(1, H - tH)); });
  const end = () => { drag = null; bar.classList.remove('drag'); show(); };
  th.addEventListener('pointerup', end);
  th.addEventListener('pointercancel', end);
  /* a click on the track pages, the way a real one does */
  bar.addEventListener('pointerdown', e => { if (e.target !== bar) return;
    const r = th.getBoundingClientRect();
    scrollBy({ top: (e.clientY < r.top ? -1 : 1) * innerHeight * 0.9, behavior: 'smooth' }); });
  layout();
})();
</script>
</body>
</html>
