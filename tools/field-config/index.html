<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1619">
<title>Field Config</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_lib/theme.css">
<script src="../_lib/theme.js" defer></script>
<script src="../_lib/owner-config.js"></script>
<script src="../_lib/owner.js"></script>
<script src="../_lib/supabase-config.js"></script>
<script src="../_lib/db.js"></script>
<script src="../_lib/access-config.js"></script>
<script src="../_lib/access.js"></script>
<script>Access.protect({ owner: true, feature: 'tool:field-config' });</script>
<script src="config.js"></script>
<style>
  /* Amber - the signal colour, for the tool you open with one hand while the
     other is holding a laptop against a cabinet. Only the accent is this
     tool's own; everything else comes from theme.css. */
  :root,html[data-theme="dark"]{--accent:#d9922e;--accentB:#f0b155;--accentD:#a86c18;
    --accent-ink:#1c1204;--glow:rgba(217,146,46,.5);--glowSoft:rgba(217,146,46,.26);
    --bad:#e2607a;--zebra:rgba(255,255,255,.02);--goHover:var(--accentB)}
  html[data-theme="light"]{--accent:#8a5606;--accentB:#a86c18;--accentD:#6b4104;
    --accent-ink:#ffffff;--glow:rgba(138,86,6,.4);--glowSoft:rgba(138,86,6,.18);
    --bad:#c2405c;--zebra:rgba(0,0,0,.024);--goHover:#6b4104}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  ::selection{background:var(--glowSoft)}

  /* ---------------------------------------------------------- the header */
  .hdr{display:flex;align-items:center;gap:10px;color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:var(--navy);position:sticky;top:0;z-index:20}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;font-size:0;padding:0;border:none}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  .hdr .brand:hover .logo{transform:scale(1.06)}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-.02em;color:#fff;white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  .hdr h1{font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .pill{font-size:11.5px;background:var(--navy-2);border:1px solid rgba(255,255,255,.15);
    color:#cfd6e6;border-radius:999px;padding:4px 11px;white-space:nowrap;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill b{color:var(--accent);font-weight:600}
  .theme{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;
    width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;flex-shrink:0}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }

  /* --------------------------------------------------------- the choosing */
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 18px}

  .vendors{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);
    margin-top:0;background:var(--card-2)}
  .vendor{cursor:pointer;font-family:inherit;background:none;border:0;
    border-right:1px solid var(--line);border-bottom:3px solid transparent;
    padding:13px 22px 11px;text-align:left;color:var(--muted);
    display:flex;flex-direction:column;gap:1px;min-width:132px;
    transition:background .14s ease,color .14s ease}
  .vendor:hover{background:var(--zebra);color:var(--text)}
  .vendor.on{color:var(--text);border-bottom-color:var(--accent);background:var(--glowSoft)}
  .vendor b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;
    letter-spacing:-.01em}
  .vendor i{font-style:normal;font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;opacity:.72}

  .groups{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);
    padding:0 2px}
  .group{cursor:pointer;font-family:inherit;background:none;border:0;
    border-bottom:3px solid transparent;padding:11px 0 9px;color:var(--muted);
    display:flex;align-items:baseline;gap:8px;transition:color .14s ease}
  .group:hover{color:var(--text)}
  .group.on{color:var(--text);border-bottom-color:var(--accent)}
  .group span{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .group i{font-style:normal;font-family:'Space Mono',monospace;font-size:10.5px;opacity:.66}

  /* the search is what this page is for, so it sits above everything */
  .find{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
  .find input{flex:1;min-width:0;background:var(--card-2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;
    font-size:15px;outline:none;transition:border-color .15s ease}
  .find input:focus{border-color:var(--accent)}
  .find .clr{background:none;border:1px solid var(--line3);border-radius:9px;color:var(--muted);
    cursor:pointer;font:600 12px/1 inherit;padding:9px 12px;white-space:nowrap}
  .find .clr:hover{color:var(--text);border-color:var(--accent)}

  .found{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--accent);padding:8px 0 0}

  /* ---------------------------------------------------------- a section */
  main{padding-bottom:90px}
  section{padding:26px 0 22px;border-bottom:1px solid var(--line)}
  section:last-of-type{border-bottom:0}
  .shead{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
    flex-wrap:wrap;margin-bottom:14px}
  .shead h2{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;
    letter-spacing:-.015em;line-height:1.15}
  .shead .kick{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
  .shead .all{background:none;border:1px solid var(--line3);border-radius:8px;color:var(--muted);
    cursor:pointer;font:600 11px/1 inherit;padding:7px 10px;white-space:nowrap}
  .shead .all:hover{color:var(--text);border-color:var(--accent)}
  .note{max-width:78ch;font-size:14.5px;line-height:1.6;color:var(--muted);margin-bottom:11px}

  /* key/value: the settings you read off and type in somewhere else */
  .kv{display:grid;grid-template-columns:minmax(140px,290px) 1fr auto;gap:16px;
    align-items:baseline;width:100%;text-align:left;cursor:pointer;font:inherit;
    color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);
    padding:10px 10px}
  .kv:hover{background:var(--glowSoft)}
  .kv b{font-size:14px;font-weight:600}
  .kv span{font-family:'Space Mono',ui-monospace,monospace;font-size:13.5px;color:var(--muted);
    word-break:break-word}
  .kv i{font-style:normal;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);opacity:0}
  .kv:hover i,.kv:focus-visible i{opacity:1}
  @media (max-width:620px){ .kv{grid-template-columns:1fr auto;gap:4px 12px}
    .kv b{grid-column:1/-1} }

  /* chips: the passwords, tried in order until one takes */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px}
  .chip{cursor:pointer;font-family:'Space Mono',ui-monospace,monospace;font-size:13.5px;
    color:var(--text);background:var(--card-2);border:1px solid var(--line3);border-radius:9px;
    padding:9px 13px;transition:border-color .14s ease,color .14s ease}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip u{text-decoration:none;font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.1em;color:var(--muted);margin-right:8px}

  /* steps: do these in this order */
  .step{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:10px 0;
    border-bottom:1px solid var(--line)}
  .step b{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent)}
  .step span{font-size:14.5px;line-height:1.55;max-width:82ch}

  /* commands: the thing you actually paste */
  .cmd{border:1px solid var(--line);border-radius:11px;background:var(--card-2);
    margin-bottom:11px;overflow:hidden}
  .cmd .top{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:9px 13px;border-bottom:1px solid var(--line)}
  .cmd .top b{font-size:13px;font-weight:600}
  .cmd .go{background:none;border:1px solid var(--accent);border-radius:7px;color:var(--accent);
    cursor:pointer;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;padding:5px 10px;white-space:nowrap;
    transition:background .14s ease,color .14s ease}
  .cmd .go:hover{background:var(--accent);color:var(--accent-ink)}
  .cmd pre{padding:12px 13px;font-family:'Space Mono',ui-monospace,monospace;font-size:13px;
    line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .cmd .why{padding:0 13px 11px;font-size:13px;color:var(--accent)}

  /* documents and pictures, for the parts that are still a deck */
  .doc{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;
    background:var(--card-2);text-decoration:none;color:var(--text)}
  .doc:hover{border-color:var(--accent)}
  .doc i{font-style:normal;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent)}
  figure{margin:0 0 18px}
  figcaption{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);padding-bottom:7px}
  figure img{display:block;width:100%;border:1px solid var(--line);border-radius:10px}

  .none{padding:44px 2px;font-size:15px;color:var(--muted);max-width:70ch;line-height:1.65}
  .none b{color:var(--text);font-weight:600}

  .toast{position:fixed;left:18px;bottom:18px;z-index:80;display:flex;align-items:center;
    max-width:min(520px,calc(100vw - 36px));padding:11px 15px;border-radius:10px;
    background:var(--text);color:var(--bg);font-size:13px;font-weight:600;
    box-shadow:0 14px 40px rgba(0,0,0,.45);animation:up .16s ease-out}
  .toast.bad{background:var(--bad);color:#fff}
  .toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>Field Config</h1>
  <span class="pill" id="tally">loading…</span>
  <button class="theme" id="themeBtn" type="button" aria-label="Toggle theme">☾</button>
</header>

<div class="vendors" id="vendors"></div>
<div class="wrap">
  <div class="groups" id="groups"></div>
  <div class="find">
    <input type="search" id="q" placeholder="command, IP, VLAN, password…"
           autocomplete="off" spellcheck="false" aria-label="Search the reference">
    <button class="clr" id="clr" type="button" hidden>Clear</button>
  </div>
  <div class="found" id="found" hidden></div>
  <main id="body"></main>
</div>

<div id="toastHost"></div>

<script>
(function(){
  'use strict';
  var C = window.ConfigCore, DB = window.DB, A = window.Access;

  var S = { doc: [], loaded: false, err: '', vendor: '', group: '', q: '' };

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; });
  };

  /* --------------------------------------------------------------- saying */

  var toastT = null;
  function say(msg, bad){
    clearTimeout(toastT);
    $('toastHost').innerHTML = '<div class="toast' + (bad ? ' bad' : '') + '">' +
      '<span>' + esc(msg) + '</span></div>';
    toastT = setTimeout(function(){ $('toastHost').innerHTML = ''; }, bad ? 4200 : 1700);
  }

  /* The clipboard API wants a secure context and a real gesture and refuses
     quietly without them. Saying nothing would look like the copy worked,
     which on a password is worse than saying it failed. */
  function copy(text, label){
    if (!text) return say('Nothing recorded there.', true);
    var done = function(){ say(label); };
    var hard = function(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      ok ? done() : say('This browser would not let the page copy. Select it by hand.', true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(done, hard);
    else hard();
  }

  /* -------------------------------------------------------------- loading */

  function load(){
    if (!DB || !DB.configured()){
      S.err = 'The reference lives on the server and this page cannot reach it.';
      S.loaded = true; return paint();
    }
    return DB.fieldConfigLoad().then(function(r){
      S.loaded = true;
      S.err = r.error || '';
      S.doc = r.doc || [];
      /* a document that will not render is worth saying out loud to whoever
         can fix it, rather than drawing half of it */
      if (!S.err && S.doc.length){
        var bad = C.check(S.doc);
        if (bad.length && A && A.isOwner())
          S.err = 'The reference has ' + bad.length + ' problem' +
                  (bad.length === 1 ? '' : 's') + ': ' + bad.slice(0, 3).join(' ');
      }
      paint();
    });
  }

  /* --------------------------------------------------------------- drawing */

  function paint(){
    var t = C.totals(S.doc);
    $('tally').innerHTML = S.loaded
      ? '<b>' + t.entries + '</b> entries · <b>' + t.vendors + '</b> vendors'
      : 'loading…';

    var v = C.view(S.doc, S.vendor, S.group, S.q);

    $('vendors').innerHTML = v.vendors.map(function(x){
      return '<button class="vendor' + (x.on ? ' on' : '') + '" data-v="' + esc(x.id) +
        '" type="button"><b>' + esc(x.name) + '</b>' +
        (x.sub ? '<i>' + esc(x.sub) + '</i>' : '') + '</button>';
    }).join('');

    $('groups').innerHTML = v.groups.map(function(x){
      return '<button class="group' + (x.on ? ' on' : '') + '" data-g="' + esc(x.id) +
        '" type="button"><span>' + esc(x.name) + '</span><i>' + x.entries + '</i></button>';
    }).join('');

    $('clr').hidden = !S.q;
    $('found').hidden = !S.q;
    if (S.q) $('found').textContent = v.sections.length +
      (v.sections.length === 1 ? ' section' : ' sections') + ' across every vendor';

    $('body').innerHTML = v.sections.map(section).join('');

    if (!v.sections.length){
      $('body').innerHTML = '<div class="none">' + esc(
        S.err ? S.err
        : !S.loaded ? 'Reading the reference…'
        : !S.doc.length ? 'The reference is empty. Nothing has been loaded into it yet.'
        : S.q ? 'Nothing matches that. Try a shorter term.'
        : 'Nothing is filed under this heading yet.') + '</div>';
    }
  }

  function section(s){
    var out = '<section><div class="shead">' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<div style="display:flex;align-items:baseline;gap:12px">' +
      (s.where ? '<span class="kick">' + esc(s.where) + '</span>'
               : s.kicker ? '<span class="kick">' + esc(s.kicker) + '</span>' : '') +
      '<button class="all" data-all="' + esc(s.title) + '" type="button">Copy section</button>' +
      '</div></div>';

    (s.notes || []).forEach(function(n){ out += '<p class="note">' + esc(n) + '</p>'; });

    (s.kvs || []).forEach(function(kv, i){
      out += '<button class="kv" data-k="kvs" data-s="' + esc(s.title) + '" data-i="' + i +
        '" type="button"><b>' + esc(kv.k) + '</b><span>' + esc(kv.v) + '</span><i>copy</i></button>';
    });

    if ((s.chips || []).length){
      out += '<div class="chips">' + s.chips.map(function(c, i){
        var val = typeof c === 'string' ? c : c.v;
        return '<button class="chip" data-k="chips" data-s="' + esc(s.title) + '" data-i="' + i +
          '" type="button"><u>' + (i + 1) + '</u>' + esc(val) + '</button>';
      }).join('') + '</div>';
    }

    (s.steps || []).forEach(function(st){
      out += '<div class="step"><b>' + esc(st.n) + '</b><span>' + esc(st.t) + '</span></div>';
    });

    (s.cmds || []).forEach(function(c, i){
      out += '<div class="cmd"><div class="top"><b>' + esc(c.label) + '</b>' +
        '<button class="go" data-k="cmds" data-s="' + esc(s.title) + '" data-i="' + i +
        '" type="button">Copy</button></div>' +
        '<pre>' + esc(c.cmd) + '</pre>' +
        (c.note ? '<div class="why">' + esc(c.note) + '</div>' : '') + '</div>';
    });

    (s.images || []).forEach(function(im){
      out += '<figure><figcaption>' + esc(im.cap) + '</figcaption>' +
        '<img src="' + esc(im.src) + '" alt="' + esc(im.cap) + '" loading="lazy"></figure>';
    });

    (s.docs || []).forEach(function(d){
      out += '<a class="doc" href="' + esc(d.href) + '" target="_blank" rel="noopener">' +
        '<span>' + esc(d.name) + '</span><i>' + esc(d.kind || 'file') + '</i></a>';
    });

    return out + '</section>';
  }

  /* ----------------------------------------------------------- listening */

  function sectionByTitle(title){
    var v = C.view(S.doc, S.vendor, S.group, S.q);
    return v.sections.filter(function(s){ return s.title === title; })[0];
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest(
      '[data-v],[data-g],[data-k],[data-all],#clr,#themeBtn') : null;
    if (!el) return;
    var d = el.dataset || {};

    if (d.v){ S.vendor = d.v; S.group = ''; S.q = ''; $('q').value = ''; return paint(); }
    if (d.g){ S.group = d.g; S.q = ''; $('q').value = ''; return paint(); }
    if (el.id === 'clr'){ S.q = ''; $('q').value = ''; $('q').focus(); return paint(); }
    if (el.id === 'themeBtn') return flipTheme();

    if (d.all){
      var sec = sectionByTitle(d.all);
      if (!sec) return;
      var text = C.sectionText(sec);
      return text ? copy(text, 'Copied ' + sec.title)
                  : say('Nothing in that section copies as text.', true);
    }
    if (d.k){
      var s = sectionByTitle(d.s);
      if (!s) return;
      var item = (s[d.k] || [])[Number(d.i)];
      if (item == null) return;
      var val = C.copyText(d.k, item);
      /* a password copied silently is indistinguishable from one that did
         not copy, so the toast names what went */
      return copy(val, 'Copied ' + (val.length > 40 ? val.slice(0, 40) + '…' : val));
    }
  });

  $('q').addEventListener('input', function(e){ S.q = e.target.value; paint(); });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && S.q){ S.q = ''; $('q').value = ''; return paint(); }
    if (e.key === '/' && /^(BODY|DIV|BUTTON|SECTION)$/.test(e.target.tagName)){
      e.preventDefault(); $('q').focus(); $('q').select();
    }
  });

  /* ------------------------------------------------------------- the theme */
  var THEME = 'office_tool_theme';
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    $('themeBtn').textContent = t === 'light' ? '☾' : '☀';
    $('themeBtn').title = t === 'light' ? 'Dark' : 'Light';
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#eef5f6' : '#0c1619');
  }
  function flipTheme(){
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(THEME, next); } catch(e){}
    applyTheme(next);
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME); } catch(e){}
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  /* --------------------------------------------------------------- start */

  paint();
  load();
  if (DB && DB.fieldConfigSubscribe) DB.fieldConfigSubscribe(function(){ load(); });
})();
</script>
