<style>
  /* ===================================================================
     WHAT TO DO · liquid glass

     Frosted panels floating on a lit burgundy ground, calendar first.
     The ground is painted on a container INSIDE the page, never on
     --bg: category.css owns the page ground with !important and this
     tool does not get to argue with it. Everything that can come from
     the family tokens does - text, muted, line, accent - so the five
     categories stay one system and family.test.js still governs.
     =================================================================== */
  :root{
    /* ONE FLAT COLOUR, no gradient and no blobs.

       The lit ground cost more than it gave. A frosted pane takes its
       lightness from whatever is behind it, so every blob moved the
       contrast of the text standing on it - body text measured 4.81
       against a spec of 13.5. On a flat ground the number is the same
       everywhere and can be predicted from the tokens.

       Set on html and body as well as here, so the colour runs edge to
       edge instead of a panel sitting on a different shade. */
    /* the glass itself */
    --glass:#34121A;
    --glass-hero:#3A161F;
    /* THE SAME OUTER STROKE ON EVERY TILE. It used to be a dark grey line
       with only the carried-over card getting a rose one, so two kinds of
       card sat next to each other looking like two different components.
       One stroke, the family accent at a third strength - visible on the
       ground without ringing every card in full pink. */
    --glass-edge:rgba(239,113,126,.34);
    --glass-shadow:0 18px 50px rgba(0,0,0,.25);
    --blur:40px; --sat:120%;
    /* the four decorative hues, for type chips and stat dots. NOT status:
       --ok, --warn and --bad above keep their jobs. */
    --sky:#4DD8FF; --mint:#3DFFA4; --amber:#FFD94A; --coral:#FF5F8F;
    --chk-on:#3DFFA4; --chk-ink:#0E2418; --chk-edge:rgba(255,240,242,.38);
    --lq-track:rgba(255,240,242,.12);
    --lq-ink:#F7F1E8;
    --star:#FFFFFF;    --iv-ink:#22060E; --chip-bg:rgba(255,240,242,.1); --stop-ink:#22060E;
    /* the idle rain chips. --muted clears on this track in dark (5.63) but
       measures 4.32 on the light one, under the 4.5 that 13px needs - so
       light gets its own, a shade darker. Same reason --stop-ink exists. */
    --wx-dim:var(--muted);
    /* the selected chip: dark fill, light ink, accent ring - the same
       treatment in both themes, so it reads as picked either way */
    --sel-bg:#181014; --sel-ink:#F7F1E8;
  }
  html[data-theme="light"]{
    --glass:#FFFFFF;
    --glass-hero:#FFF4F6;
    --glass-edge:rgba(194,0,63,.2);
    --glass-shadow:0 18px 50px rgba(0,0,0,.25);
    --sky:#006F94; --mint:#007A44; --amber:#8A6500; --coral:#B0005A;
    /* #1F9E62 is the design's green and it stays; its own #FFFFFF ink is
       3.43 on it, so the ink goes dark instead - 4.77, and the colour the
       design picked is untouched. */
    --chk-on:#1F9E62; --chk-ink:#0E2418; --chk-edge:rgba(107,94,85,.5);
    --lq-track:rgba(109,26,46,.12);
    --lq-ink:#2B1E1A;
    --star:#93364D;    --iv-ink:#22060E; --chip-bg:rgba(109,26,46,.07); --stop-ink:#FFFFFF;
    --wx-dim:#6D5A5E;   /* 4.93 on the light track, where --muted is 4.32 */
    --sel-bg:#2B1E1A; --sel-ink:#FBF3F4;
  }

  /* ---- the bar every tool wears, to the pixel ----
     Restored verbatim from the shared contract: the bar is --navy (the top
     elevation rung, the same dark value in both themes) with --barInk on it,
     and nav.css adds the 2px family rule and the fixed height. The new look
     stops at the bar - sixteen tools wear the same one and this is not the
     place to be different. */
  .hdr{position:sticky;top:0;z-index:30;background:var(--navy);color:var(--barInk);display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--barLine);
    box-shadow:none;overflow:hidden}
  .hdr>*{position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--barInk);flex-shrink:0;transition:opacity .18s ease}
  .brand:hover{opacity:.86}
  .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:linear-gradient(150deg,#d15873,#87213c);
    display:flex;align-items:center;justify-content:center;gap:2.4px;font-size:0;
    box-shadow:0 0 22px rgba(176,58,86,.55);transition:scale .18s ease,box-shadow .18s ease}
  .brand:hover .logo{scale:1.06;box-shadow:0 0 26px rgba(176,58,86,.8)}
  .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .logo i:nth-child(1){height:7px}.logo i:nth-child(2){height:12px}.logo i:nth-child(3){height:9px}.logo i:nth-child(4){height:13px}
  .bname{font:700 16px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;color:var(--barInk);white-space:nowrap}
  .hsep{width:1px;height:19px;background:var(--barLine);flex-shrink:0}
  .hdr h1{font-size:18px;font-weight:700;line-height:1.5;margin-right:auto;white-space:nowrap;color:var(--barInk);
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .pill{font-family:'Space Mono',monospace;font-size:11.5px;background:var(--barFill);border:1px solid var(--barLine);
    color:var(--barDim);border-radius:999px;padding:4px 11px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill b{color:var(--accentB)}
  .theme{background:none;border:1px solid var(--barLine);color:var(--barInk);border-radius:999px;width:34px;height:34px;
    padding:0;font-size:16px;line-height:1;cursor:pointer;flex-shrink:0}
  @media (max-width:900px){.bname,.hsep{display:none}}
  @media (max-width:760px){.pill{display:none}}
  *{box-sizing:border-box;margin:0;padding:0}
  /* THE GROUND IS ON html AND body, so it fills the viewport. It used to
     be painted only on the .liquid panel, which left the panel one colour
     and everything outside it another - two backgrounds on one page. */
  html,body{background:var(--bg);color:var(--lq-ink);
    font:15px/1.55 Jost,'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  [hidden]{display:none !important}
  /* 90px of bottom padding was left over from the old layout, which ended
     in a text input you wanted room to type under. This one ends in the
     footer, so that much empty page below it is just empty page. */
  main{max-width:1340px;margin:0 auto;padding:20px 16px 26px}
  .serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
  .mono{font-family:'JetBrains Mono','Space Mono',ui-monospace,monospace}
  .cap{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ---- NO MOTION ON THE BAR ----

     motion.css gives every tool a wedge of light crossing the bar, a bright
     length travelling the rule under it, a pulsing dot after the title and a
     floating mark. It loads AFTER this block, so turning them off takes
     !important rather than ordering.

     Off here only - the other nine tools that load motion.css keep it. The
     bar is a fixed piece of furniture you read a count off, not something
     that should be moving while you do. */
  .hdr::after,.hdr::before{content:none !important;display:none !important}
  .hdr h1::after{animation:none !important;opacity:1 !important;box-shadow:none !important}
  .hdr .logo{animation:none !important}

  /* ---- the lit ground ---- */
  /* No radius, no inset, no second colour: the ground is the page. */
  /* the reminder bar is fixed to the viewport, so the page has to reserve
     the room it no longer takes in the flow */
  .liquid{position:relative;padding:0 0 104px;background:transparent;color:var(--lq-ink);min-height:0}
  .lq-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px}

  /* ---- a pane of glass ---- */
  .glass{position:relative;overflow:hidden;border-radius:38px;background:var(--glass);
    backdrop-filter:blur(var(--blur)) saturate(var(--sat));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
    border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}

  .lq-sub{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:42px;line-height:1.1}
  .cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .colL{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px}
  .colR{flex:1.4 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px}

  /* ---- dashboard across the top, tasks full width below ----
     The calendar is a fixed six rows; the right side carries the week,
     the day's progress and the counts. Below ~900px they stack, because
     a seven-column calendar beside anything is already tight. */
  /* BOTH SIDES END ON THE SAME LINE. align-items:start let the right column
     stop wherever its content ran out, leaving a ragged step against the
     calendar's bottom edge. Stretched, and the stat tiles take up the slack
     so the last one lands level with the last row of dates. */
  .dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
    gap:20px;align-items:stretch}
  .dashL,.dashR{min-width:0;display:flex;flex-direction:column;gap:20px}
  .dashR .stats{flex:1;justify-content:space-between}
  .tasks{display:flex;flex-direction:column;gap:20px;margin-top:20px}
  @media (max-width:900px){ .dash{grid-template-columns:minmax(0,1fr)} }

  /* ---- Add task: option 3a, a disc that widens ----

     A burgundy + disc on the right edge, which becomes a pill showing
     "Add task" when the pointer gets near it or it takes focus. At rest it
     is a 52px disc, so it covers almost nothing of the page it floats over
     - which is what made the always-open pill awkward at the widths where
     the content reaches the edge.

     THE WIDTH IS ANIMATED, NOT THE DISPLAY. A label that appears by
     display:none -> flex cannot transition and arrives in one jump; the
     label is always in the DOM, clipped by the button's width, so the pill
     grows and the words slide out of the disc. max-width rather than width,
     because the label's real width is whatever the font gives it.

     "Near" is a real measurement - see fabProximity() - because the design
     says "when your pointer gets close", and hover alone means you have
     already found it. */
  .fab{position:fixed;z-index:30;
    right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:0;cursor:pointer;overflow:hidden;
    padding:5px;border-radius:99px;font:inherit;font-size:15px;font-weight:600;
    border:0;background:var(--accent);color:var(--iv-ink);
    box-shadow:0 10px 30px -10px color-mix(in srgb,var(--accent) 60%,transparent);
    transition:gap .22s ease,padding .22s ease,box-shadow .22s ease}
  .fab i{width:42px;height:42px;border-radius:50%;flex:none;
    background:color-mix(in srgb,var(--iv-ink) 14%,transparent);color:var(--iv-ink);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-style:normal;line-height:1;transition:transform .22s ease}
  .fab span{max-width:0;overflow:hidden;white-space:nowrap;
    transition:max-width .22s ease,opacity .18s ease;opacity:0}
  .fab.near,.fab:hover,.fab:focus-visible{gap:11px;padding:5px 20px 5px 5px;
    box-shadow:0 14px 34px -10px color-mix(in srgb,var(--accent) 75%,transparent)}
  .fab.near span,.fab:hover span,.fab:focus-visible span{max-width:140px;opacity:1}
  .fab:hover i,.fab.near i{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){ .fab,.fab i,.fab span{transition:none} }
  /* narrow: it stays a disc and tucks above the reminder bar, where a pill
     would cover a whole task card */
  @media (max-width:760px){
    .fab{top:auto;bottom:calc(210px + env(safe-area-inset-bottom,0px));transform:none}
    .fab.near,.fab:hover{gap:0;padding:5px}
    .fab span,.fab.near span,.fab:hover span{max-width:0;opacity:0}
  }

  /* ---- the new-task tile, opening from the button's side ----

     It used to render inline at the top of the day's list, which pushed
     every task down the moment you started typing. As a tile anchored to
     the button it opens over the page and puts nothing out of place.

     Right of centre and clear of the button, flipping to the left edge of
     it when there is no room - the same rule the account menu and the news
     panel use. */
  .addpop{position:fixed;z-index:31;width:min(430px,calc(100vw - 32px));
    max-height:calc(100vh - 120px);overflow:auto;
    border-radius:26px;padding:20px;
    background:color-mix(in srgb,var(--bar) 96%,transparent);
    border:1px solid var(--glass-edge);box-shadow:0 26px 70px -18px rgba(0,0,0,.6);
    backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
  .addpop .hd{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  /* the matching disc, so the tile reads as having come out of the button */
  .addpop .hd i{width:34px;height:34px;border-radius:50%;flex:none;
    background:var(--accent);color:var(--iv-ink);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-style:normal;line-height:1}
  .addpop .hd .t{font-size:17px;font-weight:600}
  .addpop .hd .n{margin-left:auto;font-size:13px;color:var(--ground-dim)}

  /* ---- the month ---- */  /* ---- the month ---- */
  /* 6px, not 14. With the weekday row's own top padding on top of it the
     month name floated nearly 40px above the grid, which read as a gap
     rather than as spacing. The weekday row below is tightened to match. */
  .cal{padding:24px;display:flex;flex-direction:column;gap:6px}
  .cal-h{display:flex;align-items:baseline;gap:10px}
  .cal-h .m{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:44px;line-height:1}
  .cal-h .y{font-size:18px;color:var(--muted);align-self:flex-end;padding-bottom:4px}
  .cal-h .nav{margin-left:auto;display:flex;gap:4px}
  .cal-h .nav button{cursor:pointer;width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-edge);
    background:transparent;color:inherit;font-size:15px;line-height:1}
  .grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
  .grid7 .dn{text-align:center;font-size:14px;color:var(--muted);padding:2px 0 10px}
  .cell{cursor:pointer;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;
    gap:2px;padding:3px 0;color:inherit}
  .cell .n{width:58px;height:58px;max-width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:19px;border:2px solid transparent;transition:background .18s,border-color .18s}
  .cell .c{font-size:13px;font-weight:600;min-height:16px;color:var(--amber)}
  .cell.out{opacity:.4}
  .cell.all .n{background:color-mix(in srgb,var(--mint) 18%,transparent)}
  .cell.all .c{color:var(--mint)}
  /* SELECTED IS THE DARK CHIP WITH THE ACCENT RING, in both themes.
     This had the fill and the ink the wrong way round - it painted
     --lq-ink, which is cream in dark mode, so the selected day was a
     cream disc with dark text on an otherwise dark page: the light
     treatment, rendered in the dark theme. Written against one mock and
     never looked at in the other. */
  .cell.sel .n{background:var(--sel-bg);color:var(--sel-ink);font-weight:600;border-color:var(--accent)}
  .cell.sel .c{color:var(--accent)}
  .cell.today .n{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .cell:hover .n{background:rgba(255,255,255,.10)}

  /* ---- progress ---- */
  .prog{padding:22px;display:flex;flex-direction:column;gap:10px}
  .prog .big{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:44px;line-height:1}
  .prog .row{display:flex;align-items:baseline;gap:10px}
  .prog .row span{font-size:17px;color:var(--muted)}
  .segs{display:flex;gap:4px;height:30px;align-items:stretch}
  .segs i{flex:1;border-radius:3px;background:var(--lq-track);transition:background .25s}
  .segs i.on{background:var(--sky)}

  /* ---- the four counts ---- */
  .stats{display:flex;flex-direction:column;gap:10px}
  .stat{border-radius:99px;display:flex;align-items:center;gap:16px;padding:20px 28px}
  /* All four the same width. The design staggers two of them to make a
     shape out of the column; four counts you compare against each other
     should be the same size, or the shorter ones read as less important
     than the longer ones. */
  .stat i{width:10px;height:10px;border-radius:50%;flex:none}
  .stat .l{flex:1;font-size:18px}
  .stat .v{font-size:23px;font-weight:600}

  /* ---- the week ---- */
  .wk{padding:22px;display:flex;flex-direction:column;gap:14px}
  .wk-h{display:flex;align-items:baseline;justify-content:space-between}
  .wk-h .t{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:34px}
  .wk-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .wd{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;
    border-radius:18px;background:transparent;border:1px solid transparent;color:inherit;transition:background .18s}
  .wd .l{font-size:14px;color:var(--muted)}
  .wd .n{font-size:23px;font-weight:600}
  .wd .c{font-size:13px;font-weight:600;min-height:16px;color:var(--amber)}
  .wd:hover{background:rgba(255,255,255,.08)}
  .wd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .wd.sel{background:var(--sel-bg);border-color:var(--accent);color:var(--sel-ink)}
  .wd.sel .l{color:var(--sel-ink);opacity:.8} .wd.sel .c{color:var(--accent)}

  /* ---- tasks ---- */
  .tk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .tk-h .t{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:36px}
  .tk-h .n{font-size:16px;color:var(--muted)}
  .tk-h .sp{flex:1}
  /* ---- the search box ----
     It takes the slack in the header where the old spacer was, so the Add
     button stays on the right. The clear × only exists while there is
     something to clear. */
  .qw{flex:1;min-width:170px;position:relative;display:flex;align-items:center}
  .q{width:100%;padding:10px 38px 10px 16px;border-radius:99px;font:inherit;font-size:14px;
    border:1px solid var(--glass-edge);background:var(--glass);color:var(--text);
    -webkit-appearance:none;appearance:none}
  .q::placeholder{color:var(--muted)}
  .q:focus{outline:none;border-color:var(--accent)}
  .q::-webkit-search-cancel-button{display:none}
  .qw button{position:absolute;right:8px;cursor:pointer;width:24px;height:24px;border-radius:50%;
    border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .qw button:hover{color:var(--text)}
  /* a result's day is the whole reason it is readable out of context, so it
     stops being the quiet grey it is inside a single day's list */
  /* the 16% wash alone measured 1.05 against the tile in dark - no pill at
     all - so the edge is what actually draws it. The ink stays --text,
     which is 14.1 dark and 10.8 light; tinting it instead would have put a
     15px label on the accent's 3.9 in light. */
  .task.hit .dt{color:var(--text);font-weight:500;padding:3px 11px;border-radius:99px;
    background:color-mix(in srgb,var(--accent) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 75%,transparent)}
  .task.hit .step.mt label{color:var(--text);font-weight:500}
  .task.hit .step.mt{border-left:2px solid var(--accent);padding-left:30px}
  .addbtn{cursor:pointer;display:flex;align-items:center;gap:9px;padding:9px 18px 9px 10px;border-radius:99px;
    border:1px solid var(--glass-edge);background:var(--glass);backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--glass-shadow);color:inherit;
    font-size:13.5px;font-weight:500;white-space:nowrap}
  .addbtn i{width:24px;height:24px;border-radius:50%;background:var(--chk-on);color:var(--chk-ink);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-style:normal;line-height:1}

  /* ---- the edit button, which had no size and so no icon ----
     It rendered 3px wide with a 0x0 svg: a bare button with an inline svg
     and no dimensions collapses, and an icon nobody can see is an icon that
     is not there. */
  .edit{flex:none;cursor:pointer;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--glass-edge);background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;padding:0;transition:color .18s,border-color .18s}
  .edit svg{width:15px;height:15px;display:block}
  .edit:hover{color:var(--accent);border-color:var(--accent)}
  .edit.rm{font-size:17px;line-height:1}
  .edit.rm:hover{color:var(--coral);border-color:var(--coral)}


  /* ---- EVERY TASK TITLE IS THE SERIF ----
     The carried card had the big Cormorant title and the ordinary cards a
     16.5px sans one, so two cards in the same column read as two different
     components. One title treatment; the carried card is still told apart
     by its marker and its two buttons. */
  .task .ti{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
    font-size:38px;line-height:1.1}
  .task input.ti{font-size:22px}
  .doneline{align-self:flex-start;cursor:pointer;padding:8px 16px;border-radius:99px;
    border:1px dashed var(--glass-edge);background:transparent;color:var(--muted);font-size:12.5px}
  .doneline:hover{color:var(--text);border-color:var(--accent)}
  /* ---- the bin ---- */
  .binline{opacity:.82}
  .bin{display:flex;flex-direction:column;gap:8px}
  .binrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 16px;
    border-radius:18px;border:1px dashed var(--chk-edge);background:transparent}
  .binrow .bt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px;opacity:.85}
  .binrow .bw{font-size:13px;color:var(--muted);white-space:nowrap}
  .binrow .bre{cursor:pointer;white-space:nowrap;padding:6px 14px;border-radius:99px;font:inherit;
    font-size:13px;border:1px solid var(--glass-edge);background:var(--glass);color:inherit}
  .binrow .bre:hover{border-color:var(--chk-on);color:var(--text)}
  /* a removed task found by search is struck through and leaning back */
  .task.gone{opacity:.72}
  .task.gone .ti{text-decoration:line-through}
  .carryk.gone i{background:var(--coral)}
  /* "Done" on a search result */
  .fin{flex:none;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 9px;border-radius:99px;background:var(--chk-on);color:var(--chk-ink)}
  /* the include-removed switch in the results header */
  .incl{cursor:pointer;white-space:nowrap;padding:6px 13px;border-radius:99px;font:inherit;font-size:13px;
    border:1px solid var(--glass-edge);background:var(--glass);color:var(--muted)}
  .incl.on{background:var(--coral);border-color:var(--coral);color:var(--stop-ink);font-weight:500}
  /* Undo, inside the toast */
  .tundo{cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:4px 12px;margin-left:4px;
    border-radius:99px;border:1px solid var(--accent);background:var(--accent);color:var(--iv-ink)}
  .task{padding:18px 22px;display:flex;flex-direction:column;gap:4px}
  .task-top{display:flex;align-items:center;gap:12px;padding-bottom:8px}
  .task-top .ti{flex:1;min-width:0;overflow-wrap:anywhere}
  .task-top .dt{font-size:15px;color:var(--muted);white-space:nowrap}
  .task-top .ct{font-size:15px;font-weight:600;color:var(--amber);white-space:nowrap}
  .task.done .ti{color:var(--muted);text-decoration:line-through}
  .rm{flex:none;cursor:pointer;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-edge);
    background:transparent;color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
  .rm:hover{color:var(--coral);border-color:var(--coral)}
  /* disabled until the delete design is agreed - it must not look pressable */
  .rm[disabled]{cursor:not-allowed;opacity:.38}
  .rm[disabled]:hover{color:var(--muted);border-color:var(--glass-edge)}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;font-size:14px;
    margin:0 0 6px 32px;align-self:flex-start}
  .chip i{width:7px;height:7px;border-radius:50%}
  .box{cursor:pointer;padding:0;flex:none;width:20px;height:20px;border-radius:6px;display:flex;
    align-items:center;justify-content:center;background:transparent;border:1.5px solid var(--chk-edge);
    transition:background .2s,border-color .2s}
  .box.on{background:var(--chk-on);border-color:var(--chk-on)}
  .box s{width:4px;height:9px;border-style:solid;border-color:var(--chk-ink);border-width:0 2px 2px 0;
    transform:translateY(-1px) rotate(45deg);opacity:0;text-decoration:none}
  .box.on s{opacity:1}
  .step{display:flex;align-items:center;gap:12px;padding:5px 0 5px 32px}
  .step .box{width:17px;height:17px}
  .step .box s{height:8px}
  .step label{font-size:17px;cursor:pointer}
  .step.on label{color:var(--muted);text-decoration:line-through}
  .more{align-self:flex-start;cursor:pointer;margin:6px 0 0 32px;padding:6px 14px;border-radius:99px;
    border:1px solid var(--glass-edge);background:transparent;color:var(--muted);font-size:12.5px}

  /* ---- carried over: the hero treatment, WITH its steps ----

     The design gives a carried-over job a card of its own - a big serif
     title, a summary line and two actions - and that is right when one job
     is left over. It is wrong when the whole list is: every overdue,
     unfinished job is carried, so a backlog rendered entirely as summary
     cards and the steps could not be opened anywhere. The card keeps the
     design's prominence and gains the step list and the expander, so it is
     the same card whether you have one leftover or twenty. */
  /* The carried card gets the SAME stroke as every other tile - it was the
     one card with a brighter border, which is what made two kinds of card sit
     next to each other looking like two components. It still reads as carried
     from its marker, its serif title and its two buttons; it does not need a
     different edge as well. */
  .task.carry{background:var(--glass-hero)}
  .carryk{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--coral);padding-bottom:12px}
  .carryk i{width:8px;height:8px;border-radius:50%;background:var(--coral)}
  .task .acts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 2px 32px}
  /* ---- carried over ---- */
  .hero{padding:28px 30px;background:var(--glass-hero);display:flex;flex-direction:column;gap:12px}
  .hero .k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
  .hero .k i{width:8px;height:8px;border-radius:50%;background:var(--coral)}
  .hero .t{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:32px;line-height:1.1}
  .hero .m{font-size:13.5px}
  .hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  /* burgundy, matching the button the tile came out of. It was the green
     tick colour, which on this tile reads as "done" rather than "save". */
  .pri{cursor:pointer;padding:10px 20px;border-radius:99px;border:0;background:var(--accent);
    /* --iv-ink, not --chk-ink: the ink has to match the fill it sits on.
       --chk-ink is sized for the green tick and measures 4.19 on the light
       accent; --iv-ink is the accent's own ink and measures 4.89. */
    color:var(--iv-ink);font-size:13.5px;font-weight:500;white-space:nowrap}
  .sec{cursor:pointer;padding:10px 20px;border-radius:99px;border:1px solid var(--chk-edge);
    background:transparent;color:inherit;font-size:13.5px;white-space:nowrap}

  /* ---- new task ---- */
  .add{padding:22px 26px;display:flex;flex-direction:column;gap:16px}
  .add .hd{display:flex;align-items:center;justify-content:space-between}
  .add input{font-size:18px;font-weight:500;background:transparent;border:0;
    border-bottom:1px solid var(--glass-edge);padding:6px 0 10px;outline:none;width:100%}
  .add .stepin{display:flex;align-items:center;gap:12px;padding:5px 0}
  .add .stepin input{font-size:14px;border-bottom:0;padding:4px 0;flex:1;min-width:0}
  .add .ghost{flex:none;width:17px;height:17px;border-radius:6px;border:1.5px dashed var(--chk-edge)}
  .add .acts{display:flex;justify-content:flex-end;gap:10px}
  .add .drafts{display:flex;flex-direction:column;gap:2px}
  .add .drow{display:flex;align-items:center;gap:12px;padding:5px 0}
  .add .drow span{flex:1;font-size:14px}
  .add .drow button{cursor:pointer;border:0;background:transparent;color:var(--muted);font-size:15px;padding:2px 6px}
  .days{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .days .cap{margin-right:4px}
  .days button{cursor:pointer;padding:6px 12px;border-radius:99px;font-size:12.5px;white-space:nowrap;
    border:1px solid var(--glass-edge);background:transparent;color:inherit}
  .days button.on{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--accent)}

  .none{padding:48px;text-align:center;border-radius:38px;border:1px dashed var(--chk-edge);
    color:var(--muted);font-size:14px}
  .err{border:1px solid var(--warn);border-radius:16px;padding:14px 18px;color:var(--text);font-size:14px}

  /* ---- the starfield ----
     Seventy faint dots fixed behind everything, from the design. Drawn once
     from a fixed seed so they do not jump about on every redraw - a ground
     that reshuffles each time you tick a box is a ground you notice. */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;border-radius:50%;background:var(--star);display:block}
  /* THE STARFIELD GOES WHEN THE PHOTOGRAPH ARRIVES - my call, asked for.

     Seventy dots scattered over a whole viewport read as a night sky only
     while the ground is empty. With the promenade behind them they land on
     trees, on the river, on lit buildings and on the woman's umbrella -
     places a star cannot be - so they stop reading as sky and start reading
     as dirt on the lens. The photograph already supplies what the starfield
     was there for: something to look at behind the glass.

     Hidden, not deleted. STARS and starsHTML stay, so turning the scene off
     brings the sky straight back. */
  html[data-wtd-scene="on"] .stars{display:none}

  /* ---- the weather, over the ground and under the glass ----

     From the Promenade design: rain falling behind the tiles, with distant
     lightning low on the horizon. The design hangs it over a photograph of
     a promenade; --wtd-scene is the hook for that image and is unset, so
     until one is supplied the rain falls over the starfield instead.

     z-index 0 puts it in the same layer as the stars and below .liquid,
     which is why it reads as atmosphere rather than an overlay - the design
     calls that "behind glass". pointer-events:none so it never eats a click;
     the click-to-strike listener sits on the document instead. */
  .wx{position:fixed;inset:0;pointer-events:none;z-index:0;display:block}

  /* ---- the photograph ----

     SOLID --bg UNDER IT, always. background-color paints immediately and
     the image arrives on top whenever it arrives, so there is no moment of
     blank page on a cold load and no flash if the file 404s.

     THE WIDTH SWITCH IS A MEDIA QUERY, NOT image-set's x DESCRIPTORS, and
     that is a correction to the brief rather than a shortcut. image-set()
     selects on DEVICE PIXEL RATIO, not viewport width - so a phone at DPR 3
     would have taken the LARGER file, which is the opposite of the
     intention. The media query asks the question actually meant: is this a
     small screen. image-set is still used, carrying type('image/webp'), so
     a browser without WebP skips the image and keeps the solid ground. */
  .scene{position:fixed;inset:0;pointer-events:none;z-index:0;
    background-color:var(--bg);
    background-image:var(--wtd-scene,none);
    background-position:center;background-size:cover;background-repeat:no-repeat}
  html[data-wtd-scene="on"]{
    --wtd-scene:image-set(url('img/scene-1280.webp') type('image/webp'));
    --wtd-scene-tint:rgba(11,3,6,.75);
  }
  /* ONE BACKGROUND, THE SAME IN BOTH THEMES. There is no light-mode veil:
     the photograph is not re-tinted when the theme flips, so it looks
     identical either way. That is a deliberate instruction, and it has a
     consequence worth stating next to it - see "the ground is dark in both
     themes" below. */
  @media (min-width:900px){
    html[data-wtd-scene="on"]{
      --wtd-scene:image-set(url('img/scene-1672.webp') type('image/webp'));
    }
  }
  /* the readability tint, over the photo and under everything else */
  .scene::after{content:'';position:absolute;inset:0;
    background:var(--wtd-scene-tint,transparent)}
  /* ---- glass, only once there is something to see through it ----

     The tiles already carried backdrop-filter:blur(40px) and an OPAQUE
     background, so the blur computed and painted nothing - forty pixels of
     blur over a colour is that colour. The photo sat behind a wall.

     Everything here is gated on [data-wtd-scene], so with no photograph the
     tiles stay solid and nothing changes in the other fifteen tools.

     The nav bar needs the !important and the extra attribute to outrank
     category.css, which paints every tool's bar with !important and loads
     after this block. Specificity decides a tie between two !important
     rules, so [data-cat][data-wtd-scene] beats [data-cat] alone. This is
     the one place a tool is allowed to overrule the shared chrome, and it
     is scoped to the one page that has a scene behind it. */
  html[data-wtd-scene="on"] .glass{
    background:color-mix(in srgb,var(--glass) var(--glass-a,72%),transparent);
    backdrop-filter:blur(var(--blur)) saturate(1.25);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.25)}
  /* ---- the ground is dark in BOTH themes, so its text is light in both ----

     The photograph is not re-tinted for light mode, which means the page
     behind the tiles is a night scene whichever theme is on. Text that sits
     on a TILE follows the theme as usual - a white tile wants dark ink. But
     text that sits directly on the GROUND cannot: in light mode --muted is
     #796263, and dark ink on a dark photograph measured 3.11 to 3.74 across
     four places. Those four were the only real failures in the whole sweep.

     So the ground carries its own two inks, identical in both themes,
     because the thing they sit on is identical in both themes. This is not
     a theme override - it is the ground refusing to pretend it is light. */
  html[data-wtd-scene="on"]{ --ground-ink:#F7F1E8; --ground-dim:#D6C3C6; }
  /* LIGHT MODE'S TILES ARE NEARLY OPAQUE, and this is the answer to "will
     light mode read over a dark photo".

     In dark the tile is a dark glass over a dark photo, so 72% is plenty and
     the scene reads through beautifully. In light the tile is WHITE over the
     same dark photo: at 72% it lands mid-grey, and the dark inks inside it
     measured 2.84 to 3.08 - four real failures. The photograph is not being
     re-tinted (that was the instruction), so the tile is the only lever, and
     93% is where every pair clears. The photo still shows between the tiles
     and through the bars, which is where it was doing the work anyway. */
  html[data-theme="light"][data-wtd-scene="on"]{ --glass-a:93%; }
  /* ONLY BARE TEXT ON THE GROUND. The search field and the Lightning pill
     sit on the ground but carry their OWN opaque fill - white in light mode -
     so they follow the theme like anything else with a background. Giving
     them the ground's light ink put pale text on a white pill at 1.12:1. */
  html[data-wtd-scene="on"] .lq-sub,
  html[data-wtd-scene="on"] .tk-h .t{color:var(--ground-ink)}
  html[data-wtd-scene="on"] .tk-h .n,
  html[data-wtd-scene="on"] .wxc .cap,
  /* :not(.on) - the active chip sits on an opaque accent fill, not on the
     ground, and giving it the ground's light ink put pale text on pink at
     1.7:1. The ground's inks are for text on the ground. */
  html[data-wtd-scene="on"] .wxc .seg button:not(.on),
  html[data-wtd-scene="on"] .doneline,
  html[data-wtd-scene="on"] .none{color:var(--ground-dim)}
  html[data-wtd-scene="on"] .doneline:hover{color:var(--ground-ink)}

  /* NO GLOW ON EITHER BAR. Both hung a soft coloured shadow off their edge -
     the nav bar 0 10px 30px -14px, the reminder bar the same upward. Over a
     flat ground that read as lift; over a photograph it reads as a smear,
     because the thing it is bleeding onto is already busy. A single crisp
     rule separates them now, which is what the design draws.

     Scoped like everything else here: the other fifteen tools keep theirs. */
  /* THE BARS ARE NEARLY SOLID, THE TILES ARE NOT, and that is deliberate.
     At 80% the photograph came through the footer strongly enough that the
     bright foliage on the left of the frame lit one end of the bar and left
     the other dark - a control strip that changes brightness along its
     length is a control strip you have to hunt across. 93% keeps a hint of
     the scene without letting it set the contrast. The tiles stay at 72%,
     where the photo is the point. */
  html[data-wtd-scene="on"] .rbar,
  html[data-wtd-scene="on"] .rbar.on{
    background:color-mix(in srgb,var(--bar) var(--bar-a,93%),transparent);
    backdrop-filter:blur(24px) saturate(1.15);
    -webkit-backdrop-filter:blur(24px) saturate(1.15);
    box-shadow:none}
  html[data-wtd-scene="on"] .rbar.on{
    background:color-mix(in srgb,#8E2B46 var(--bar-a,93%),transparent)}
  html[data-cat][data-wtd-scene="on"] header.hdr,
  html[data-cat][data-wtd-scene="on"] .hdr{
    background:color-mix(in srgb,var(--bar) var(--bar-a,93%),transparent) !important;
    backdrop-filter:blur(24px) saturate(1.15);
    -webkit-backdrop-filter:blur(24px) saturate(1.15);
    box-shadow:none !important}

  /* the control, beside the day heading rather than in the bottom bar: that
     bar was centred and signed off this morning and a fourth group would
     have pushed the intervals off the middle */
  .wxc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wxc .cap{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .wxc .seg{display:flex;gap:3px;padding:3px;border-radius:99px;background:var(--lq-track)}
  .wxc .seg button{cursor:pointer;border:0;border-radius:99px;padding:5px 12px;font:inherit;
    font-size:13px;background:transparent;color:var(--wx-dim)}
  .wxc .seg button.on{background:var(--accent);color:var(--iv-ink);font-weight:500}
  .wxc .lt{cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;
    border-radius:99px;border:1px solid var(--glass-edge);background:var(--glass);
    color:var(--muted);font:inherit;font-size:13px}
  .wxc .lt i{width:34px;height:20px;border-radius:99px;background:var(--lq-track);
    position:relative;transition:background .2s}
  .wxc .lt i s{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#FFFFFF;transition:transform .2s}
  .wxc .lt.on{color:var(--text)}
  .wxc .lt.on i{background:var(--mint)}
  .wxc .lt.on i s{transform:translateX(14px)}
  .hd-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hd-row .sp{flex:1}

  /* ---- the reminder bar, stuck to the bottom ----

     It was at the end of the page, so on a long day you scrolled past every
     task to reach the thing that tells you when the next nudge is.

     Two states, because the bar is the status display: OFF it is the nav
     colour and sits quietly; ON it fills with the burgundy gradient, the
     toggle goes green and the countdown runs in mint, so whether you are
     being reminded is readable from across the desk. */
  /* FULL WIDTH, LIKE THE NAV BAR. It was sticky inside the content column,
     so it stopped 180px short of each edge while the bar at the top ran the
     whole way - two bars of different lengths on the same page. Fixed to the
     viewport now, with the nav bar's own 28px gutter so the switch on the
     left lines up with the logo above it. .liquid carries the matching
     padding-bottom, or a fixed bar hides the last card. */
  .rbar{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;
    padding:12px 28px calc(12px + env(safe-area-inset-bottom));
    background:var(--bar);border-top:2px solid var(--accent);
    box-shadow:0 -12px 30px -14px var(--accent);
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    color:var(--text);transition:background .3s,box-shadow .3s,color .3s}
  .rbar.on{background:linear-gradient(90deg,#B23A56,#7F2640);color:#FFFFFF;
    box-shadow:0 -12px 30px -14px rgba(239,113,126,.6)}
  /* left, centre, right. The outer two share the slack equally, so the
     intervals land on the bar's centre line rather than wherever the switch
     happens to end. */
  .rg{display:flex;align-items:center;gap:14px;min-width:0}
  .rg.lft{flex:1 1 0;justify-content:flex-start}
  .rg.mid{flex:0 0 auto;justify-content:center}
  .rg.rgt{flex:1 1 0;justify-content:flex-end}
  /* narrow: three rows, each still reading left, centre, right */
  @media (max-width:760px){
    .rbar{justify-content:center}
    .rg.lft,.rg.rgt{flex:1 1 100%;justify-content:center}
  }
  .rbar .sw{color:inherit;font-size:15px;font-weight:500}
  .rbar .sw i{width:48px;height:28px;background:var(--lq-track)}
  .rbar .sw i s{width:22px;height:22px}
  .rbar .sw.on i{background:var(--mint)}
  .ivs{display:flex;gap:4px;padding:3px;border-radius:99px;background:rgba(255,240,242,.08)}
  .rbar.on .ivs{background:rgba(255,255,255,.14)}
  .ivs button{cursor:pointer;white-space:nowrap;padding:7px 14px;border-radius:99px;border:0;
    font-size:14px;font-weight:500;background:transparent;color:inherit}
  .ivs button.on{background:var(--accent);color:var(--iv-ink)}
  .rbar.on .ivs button.on{background:#F7F1E8;color:#521323}
  .bell{cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;
    border-radius:99px;border:1px solid var(--glass-edge);background:var(--glass);color:var(--text)}

<script>
/* ============================================================

let tt; function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400); }

/* A toast carrying one action, which is how Undo reaches the screen.

   The two confirms catch the mis-click; this catches the decision you
   regret ten seconds later. They are not the same mistake, which is why
   both are here rather than one standing in for the other.

   It stays up far longer than an ordinary toast - an undo you have to catch
   is not an undo - and the handler is cleared on dismissal so a late click
   on a stale toast cannot restore something you removed twice. */
function toastDo(m, label, fn, ms){
  const t = $('toast');
  t.textContent = '';
  t.append(document.createTextNode(m + '  '));
  const b = document.createElement('button');
  b.className = 'tundo'; b.textContent = label;
  b.onclick = () => { clearTimeout(tt); t.classList.remove('show'); t.textContent = ''; fn(); };
  t.appendChild(b);
  t.classList.add('show');

/* ---------- time helpers ---------- */
const pending = () => TODOS.filter(t => !t.done);
function whenText(due){
  if (!due) return { text:'no deadline', state:'' };
  const d = new Date(due), now = Date.now(), diff = d - now;
  const mins = Math.round(Math.abs(diff) / 60000);
  const rel = mins < 60 ? mins + ' min'
            : mins < 1440 ? Math.round(mins / 60) + ' h'
            : Math.round(mins / 1440) + ' d';
  const stamp = d.toLocaleString([], { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  if (diff < 0) return { text: stamp + ' · ' + rel + ' overdue', state:'over' };
  if (diff < 3600e3) return { text: stamp + ' · in ' + rel, state:'soon' };
  return { text: stamp + ' · in ' + rel, state:'' };
}

/* ---------- one day at a time ----------
   Every job belongs to a day: the day it was added for. Its deadline is the
   end of that day, so anything left open overnight shows as carried over
   (and counts as overdue for the reminders). Older jobs with no date sit on
   the day they were written down. */
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dayKey = d => { const x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };

let SEL = TODAY();
let EDIT_ID = null;
/* MON is the month the calendar is showing, which is not always the month
   of the selected day - you can page ahead without picking anything. MODE
   and FILT went with the separate month view: the month is on screen all the
   time now, so there is no mode to be in. */
let MON = null;
/* Q is the search box, and it is NOT a filter on the selected day - a day at
   a time is exactly what you cannot search a two-month backlog with. While
   it has text in it the right column shows matches from every day, each card
   carrying the day it sits on. Empty means not searching. */
let Q = '';
const dayOf = t => dayKey(t.due || t.created_at || Date.now());

const shift = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
/* NEWEST FIRST. It was oldest first, so a task added just now appeared at
   the bottom of the day - below everything already dealt with - and you
   had to go looking for the thing you had this second typed in. */
function forDay(k){
  return TODOS.filter(t => dayOf(t) === k)
    .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
}
const carried = () => TODOS.filter(t => !t.done && dayOf(t) < TODAY())
  .sort((a, b) => dayOf(a) < dayOf(b) ? -1 : 1);
function refreshPill(){
  const today = forDay(TODAY()), left = today.filter(t => !t.done).length;
  $('pill').innerHTML = '<b>' + left + '</b> left today' + (REMIND ? ' · reminding' : '');
}

/* ============================================================
   Reminders - every 15 minutes while this page is open.

   Worth being straight about the limit: with no server pushing to
   your phone, a browser can only remind you while the tab is
   alive. Closing it stops the reminders. Making them arrive with
   the tab shut needs push, which needs a server - a later job.
   ============================================================ */
/* EVERY was a fixed quarter hour; the bar lets you pick now, so it reads
   the choice instead of hard-coding it. */
const EVERY = () => IV * 60 * 1000;
const REMIND_KEY = 'whattodo_remind';
const SOUND_KEY = 'whattodo_sound';
let REMIND = false, SOUND = true, timer = null, nextAt = 0, tick = null;

function canNotify(){ return typeof Notification !== 'undefined'; }

/* ---------- the ring ----------
   Synthesised rather than a file: nothing to download, works offline, and no
   sound sitting in the repo. A browser will not let a page make noise until
   it has been interacted with, so the context is opened on the click that
   turns reminders on - which is also why that click plays a short preview.
   Audio is not throttled the way animation is, so this still sounds with the
   tab in the background. It cannot sound with the tab closed. */
let AC = null, MASTER = null;
/* Nine partials and a hammer strike all landing at once add up, and a single
   strike was already peaking at 0.96 of full scale. Everything goes through a
   limiter so it cannot clip and crackle however many strikes overlap. */
function master(ctx){
  if (!MASTER){
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-8, ctx.currentTime);
    comp.knee.setValueAtTime(6, ctx.currentTime);
    comp.ratio.setValueAtTime(12, ctx.currentTime);
    comp.attack.setValueAtTime(0.002, ctx.currentTime);
    comp.release.setValueAtTime(0.20, ctx.currentTime);

function audioCtx(){

    if (AC.state === 'suspended') AC.resume();

/* A tower bell.

   What makes a bell sound like struck metal rather than an organ is that its
   partials are not whole multiples of the note. A founder tunes them to the
   old ratios - hum an octave below, then prime, tierce a minor third above
   (which is why a big bell always sounds sombre), quint, and nominal an octave
   up. The high inharmonic ones give the clang and die away quickly while the
   hum hangs on for seconds. Each is detuned a hair so they beat against each
   other, which is the shimmer you hear from a real one.

   Plus the hammer itself: a scrap of filtered noise, gone in a moment. Without
   it the bell sounds blown rather than struck. */
const BELL = [
  { r:0.50, g:1.00, d:5.0 },   // hum
  { r:1.00, g:0.90, d:4.2 },   // prime
  { r:1.20, g:0.55, d:2.6 },   // tierce - the minor third
  { r:1.50, g:0.40, d:2.0 },   // quint
  { r:2.00, g:0.62, d:1.7 },   // nominal
  { r:2.52, g:0.24, d:1.0 },
  { r:3.01, g:0.19, d:0.75 },
  { r:4.17, g:0.13, d:0.45 },
  { r:5.43, g:0.09, d:0.30 }
];
/* Everything that gets scheduled is kept, so a minute of chiming already on
   the audio clock can still be cut off when Stop is pressed. */
let scheduled = [];
function keep(node){ scheduled.push(node); return node; }
function killScheduled(){
  for (const n of scheduled){ try { n.stop(0); } catch(e){} }
  scheduled = [];
}

let noiseBuf = null;
function hammer(ctx, at, level, tone){
  if (!noiseBuf){
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.06), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  }
  const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = noiseBuf;
  bp.type = 'bandpass'; bp.frequency.setValueAtTime(tone || 2600, at); bp.Q.setValueAtTime(1.1, at);
  g.gain.setValueAtTime(level, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
  src.connect(bp); bp.connect(g); g.connect(master(ctx));
  src.start(at); src.stop(at + 0.09); keep(src);

/* base is the prime. `hold` scales every partial's decay, which is the whole
   difference between a quarter bell and the hour bell. */
function strikePartials(ctx, at, base, level, hold){
  for (const p of BELL){
    const o = ctx.createOscillator(), g = ctx.createGain();
    const d = p.d * (hold || 1);
    o.type = 'sine';
    o.frequency.setValueAtTime(base * p.r * (1 + (Math.random() - 0.5) * 0.005), at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level * p.g), at + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.connect(g); g.connect(master(ctx));
    o.start(at); o.stop(at + d + 0.05); keep(o);
  }
}
/* ---------- Big Ben ----------
   Westminster Quarters. The tune lives on four quarter bells in E major, and
   the hour is struck on the great bell - the one actually named Big Ben,
   which sounds E an octave and a half below.

   The phrases are the real ones. At the hour the tower plays four of them,
   sixteen strokes, and only then strikes the hour. A quarter past gets one
   phrase - which happens to be exactly what this tool wants for a fifteen
   minute nudge, so the quarter chime is the nudge and the full hour sequence
   is the alarm. */
const WQ = { B: 246.94, E: 329.63, Fs: 369.99, Gs: 415.30 };   // B3 E4 F#4 G#4
const WQ_QUARTER = ['Gs','Fs','E','B'];
const WQ_HOUR = [
  ['E','Gs','Fs','B'],
  ['E','Fs','Gs','E'],
  ['Gs','E','Fs','B'],
  ['B','Fs','Gs','E']
];
const GREAT_HZ = 82.41;          // E2 - the hour bell
const NOTE_GAP = 1.15, PHRASE_GAP = 2.05, HOUR_GAP = 4.6;

/* The quarter bells are smaller: brighter, and they let go sooner. */
function quarterBell(ctx, at, hz, level){
  hammer(ctx, at, level * 0.35, 3200);
  strikePartials(ctx, at, hz, level, 0.55);
}
/* The great bell is the opposite: slow to speak and slow to die. */
function greatBell(ctx, at, level){
  hammer(ctx, at, level * 0.45, 1800);
  strikePartials(ctx, at, GREAT_HZ, level, 1.8);
}

const ALARM_FOR = 60 * 1000;
let alarmEnds = 0, alarmTick = null, alarmStop = null;
const alarming = () => !!alarmStop;

function startAlarm(ms){
  stopAlarm(true);
  const ctx = audioCtx(); if (!ctx) return;
  const span = (ms || ALARM_FOR) / 1000;
  alarmEnds = Date.now() + span * 1000;

  /* Scheduled on the audio clock rather than by timer, because a melody drifts
     audibly if each note waits on setInterval. Every node is kept so the whole
     lot can be cut off - otherwise Stop would leave a minute of Westminster
     already committed and no way to call it back. */
  const t0 = ctx.currentTime + 0.06, endAt = t0 + span;

      t += NOTE_GAP;

    t += PHRASE_GAP - NOTE_GAP;

  if (navigator.vibrate) navigator.vibrate([260, 140, 200]);

    if (Date.now() >= alarmEnds){ stopAlarm(); return; }
    const el = $('almLeft'); if (el) el.textContent = alarmLeft();

function stopAlarm(quiet){

function fire(){
  const list = pending();
  nextAt = Date.now() + EVERY();
  if (!list.length) return;                       // nothing to nag about
  const overdue = list.filter(t => t.due && new Date(t.due) < new Date()).length;
  const head = list.length + (list.length === 1 ? ' job pending' : ' jobs pending')
             + (overdue ? ' · ' + overdue + ' overdue' : '');
  const body = list.slice(0, 4).map(t => '• ' + t.title).join('\n')
             + (list.length > 4 ? '\n…and ' + (list.length - 4) + ' more' : '');
  if (canNotify() && Notification.permission === 'granted'){
    try { new Notification(head, { body: body, tag: 'whattodo', renotify: true }); } catch(e){}
  }
  if (SOUND) ring(overdue > 0);                   // chime, or the alarm if overdue

async function setRemind(on){
  REMIND = on;
  try { localStorage.setItem(REMIND_KEY, on ? '1' : '0'); } catch(e){}
  clearInterval(timer); clearInterval(tick); timer = tick = null;
  if (on){
    if (canNotify() && Notification.permission === 'default'){
      try { await Notification.requestPermission(); } catch(e){}
    }
    audioCtx();                                   // unlock sound on this click
    nextAt = Date.now() + EVERY();
    timer = setInterval(fire, EVERY());
    tick = setInterval(() => { const el = $('nextIn'); if (el) el.textContent = countdown(); }, 1000);
  } else {
    document.title = 'What To Do';
  }
  refreshPill(); render();
}
function countdown(){
  if (!REMIND) return 'off';
  const left = Math.max(0, nextAt - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  return 'next in ' + m + ':' + String(s).padStart(2, '0');
}

/* ---------- data ---------- */
async function refresh(){
  const r = await window.DB.listTodos();
  TODOS = r.items; LOAD_ERR = r.error;
  /* The bin is a second read and must never take the page down with it: if
     045 has not been run, listRemovedTodos returns [] and everything else
     carries on exactly as before. */
  try { REMOVED = await window.DB.listRemovedTodos(); }
  catch (e){ REMOVED = []; console.warn('Could not read removed tasks:', e.message); }
  refreshPill(); render();
}

/* THE SWEEP, ONCE A DAY AT MOST, AND NEVER ON COMPLETED WORK.

   Run from the page rather than a cron job: it is one delete with a filter,
   owner-only, and a personal job list does not earn a scheduler. The daily
   stamp stops it firing on every reload.

   db.js carries .eq('done', false), so a finished task that was removed is
   kept for ever. That asymmetry is deliberate - completed work is a record
   to look back on - and it means THE ARCHIVE GROWS WITHOUT BOUND, which is
   intended and is written down in 045 and in the proposal so nobody
   "fixes" it later. */
const SWEEP_KEY = 'whattodo_swept';
async function sweepRemoved(){
  try {
    const last = +(localStorage.getItem(SWEEP_KEY) || 0);
    if (Date.now() - last < 86400000) return;
    const r = await window.DB.purgeRemoved(window.TodoCore.REMOVE_DAYS);
    localStorage.setItem(SWEEP_KEY, String(Date.now()));
    if (r && r.purged) { REMOVED = await window.DB.listRemovedTodos(); render(); }
  } catch (e){ console.warn('Sweep skipped:', e.message); }
}
/* Ticking one off takes it out of the dashboard but not out of the list: it
   is marked, not dropped, so the calendar can still show the day it was for.
   Un-ticking puts it back. */
/* Ticking one step of a heading. The step lives in the note text, so this is a
   note rewrite - and when the last one goes, the heading goes with it, which is
   the whole reason for writing jobs this way. Unticking a step on a finished
   heading puts the heading back, or a job would stay cleared with work left. */
async function markStep(id, k, want, el){
  if (BUSY) return; BUSY = true;
  const t = TODOS.find(x => x.id === id);
  if (!t){ BUSY = false; return; }
  const T = window.TodoCore;
  const before = t.note;
  const note = T.toggleItem(t.note, k, want);
  const finished = T.allItemsDone(note);
  try {
    await window.AuthGate.require();
    await window.DB.updateTodo(id, { title: t.title, note, due: t.due || null });
    t.note = note;
    /* the heading follows its steps, in both directions */
    if (finished !== !!t.done){
      await window.DB.setTodoDone(id, finished);
      t.done = finished;
      t.done_at = finished ? new Date().toISOString() : null;
    }
    refreshPill(); render();
    toast(finished ? 'All done – “' + t.title + '” is cleared'
                   : (want ? 'Step done' : 'Step back on the list'));
  } catch (err){
    t.note = before;
    if (el) el.checked = !want;                 // put the box back as it was
    toast(err.message, 6000);
  } finally { BUSY = false; }
}

async function markDone(id, el, done){
  if (BUSY) return; BUSY = true;
  const want = done === undefined ? true : !!done;
  const card = el.closest('.row');
  try {
    await window.AuthGate.require();
    await window.DB.setTodoDone(id, want);
    const t = TODOS.find(x => x.id === id);
    if (t){ t.done = want; t.done_at = want ? new Date().toISOString() : null; }
    if (!pending().some(x => x.due && new Date(x.due) < new Date())) stopAlarm(true);
    refreshPill(); render();
    toast(want ? 'Done' : 'Back on the list');
  } catch (err){
    if (card) card.classList.remove('going');
    toast(err.message, 6000);
  } finally { BUSY = false; }
}

/* ---------- views ---------- */
/* ============================================================ the new look

   Liquid glass: frosted panes on a lit burgundy ground, calendar first,
   day and month on one page. Everything below is DRAWING - the data layer,
   the reminder bell, the auth gate and the handlers above are untouched,
   because none of them had anything wrong with them.

   Three things this arrangement changes about using the tool:
     - the month is always on screen, so picking a day is one click rather
       than a mode switch. MODE is gone with it.
     - a task carries its steps inline, with a "show all" past four, so a
       nine-step cabinet audit does not push everything else off the page.
     - adding a task takes its sub-steps at the same time, instead of
       writing the heading and then opening it to type the list.
   ============================================================ */

/* Which of the four decorative hues a job wears, read off its heading. The
   words are the ones that actually appear in this list. Purely cosmetic -
   it groups the eye, it does not drive anything. */
function jobType(title){
  const t = String(title || '').toLowerCase();
  if (/lamp/.test(t))     return ['Lamp pole', 'amber'];
  if (/batter/.test(t))   return ['Battery',   'coral'];
  if (/antenna/.test(t))  return ['Antenna',   'sky'];
  if (/fibre|fiber/.test(t)) return ['Fibre',  'mint'];
  if (/audit/.test(t))    return ['Audit',     'coral'];
  if (/survey/.test(t))   return ['Survey',    'sky'];
  return ['Task', 'sky'];
}

/* Seventy faint dots behind the page, from the design. Generated ONCE from
   a fixed seed rather than on each render: a ground that reshuffles every
   time you tick a box is a ground you notice, which is the opposite of what
   a background is for. */
const STARS = (() => {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 70 }, () => ({
    x: (rnd() * 100).toFixed(2), y: (rnd() * 100).toFixed(2),
    r: (1 + rnd() * 1.6).toFixed(1), o: (0.15 + rnd() * 0.35).toFixed(2) }));
})();
const starsHTML = () => '<div class="stars" aria-hidden="true">' + STARS.map(t =>
  '<i style="left:' + t.x + '%;top:' + t.y + '%;width:' + t.r + 'px;height:' + t.r +
  'px;opacity:' + t.o + '"></i>').join('') + '</div>';

/* ============================================================
   The weather, from the Promenade design.

   Rain behind the glass tiles and distant lightning low on the horizon.
   The design hangs it over a photograph; that image is not in this repo, so
   --wtd-scene is left unset and the rain falls over the starfield. Supplying
   the photo is one declaration - see .scene in the stylesheet.

   THE CANVAS LIVES OUTSIDE THE RENDER. render() rewrites #view wholesale on
   every tick of a checkbox, and a canvas inside that would be destroyed and
   recreated - losing every drop mid-fall and reallocating the backing store
   several times a minute. It is appended to <body> once and left there.

   EVERYTHING IS DRIVEN BY THE CLOCK. This display runs at about 145Hz, so a
   per-frame step plays at more than twice the intended speed on it. Each
   frame measures real elapsed time and multiplies; dt is capped at 50ms so
   a backgrounded tab does not teleport every drop to the bottom on return.
   ============================================================ */
const WX_KEY = 'whattodo_rain', WX_LIT_KEY = 'whattodo_lightning';
let WX = (() => { try { return localStorage.getItem(WX_KEY) || 'medium'; } catch (e) { return 'medium'; } })();
let LIT = (() => { try { return localStorage.getItem(WX_LIT_KEY) !== '0'; } catch (e) { return true; } })();

const weather = (() => {
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)');
  let cv = null, ctx = null, drops = [], w = 0, h = 0, dpr = 1;
  let raf = null, last = 0, nextStrike = 0, flash = 0, bolt = null, flicker = 0;

  /* ---- THE PHOTOGRAPH LIFTS WHEN THE LIGHTNING DOES ----

     The veil over the scene sits at 75%, which is a dark night. A strike
     that only brightened the canvas would light the sky and leave the
     promenade beneath it pitch black - the one moment the photo should be
     visible is the moment it stayed hidden.

     So the veil thins with the flash: 75% at rest, down to 34% at the peak
     of a strike, following the same decaying value the sky glow uses, so
     the double flicker reads on the ground as well as in the sky.

     The property is set on the .scene ELEMENT, not the root: ::after
     inherits it from its originating element, and writing one element's
     custom property per frame is a far smaller invalidation than writing
     the document's. It is written only while a flash is running, and
     removed at the end so the stylesheet's own value takes over again -
     no inline leftover to explain later. */
  const REST = 0.75, PEAK = 0.34;
  let lifted = false;
  function lift(f){
    const el = document.querySelector('.scene');
    if (!el) return;
    if (f <= 0){
      el.style.removeProperty('--wtd-scene-tint');
      lifted = false;
      return;
    }
    const a = REST - (REST - PEAK) * Math.min(1, f);
    el.style.setProperty('--wtd-scene-tint', 'rgba(11,3,6,' + a.toFixed(3) + ')');
    lifted = true;
  }

  const rnd = () => Math.random();

  function fit(){
    if (!cv) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);   /* 3x on a phone buys nothing and costs fill rate */
    w = window.innerWidth; h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  /* Drops start spread over the full height, not at the top: filling from
     the top edge makes the rain arrive as a visible curtain every time the
     strength changes. */
  function seed(){
    const n = window.TodoCore.dropCount(WX, w, h);
    const p = window.TodoCore.rainProfile(WX);
    drops = Array.from({ length: n }, () => ({
      x: rnd() * (w + Math.abs(p.slant) * h) - (p.slant > 0 ? p.slant * h : 0),
      y: rnd() * h,
      v: p.vMin + rnd() * (p.vMax - p.vMin),
      l: p.len * (0.7 + rnd() * 0.7),
      a: p.alpha * (0.55 + rnd() * 0.65)
    }));
  }

  /* The rain takes its colour from the theme, not from a fixed white: a pale
     streak is invisible on a near-white page. Light mode uses a dark, cool
     grey; dark mode a warm near-white carrying a little of the accent. */
  const ink = () => document.documentElement.getAttribute('data-theme') === 'light'
    ? '120,132,148' : '236,214,220';

  function strike(now){
    flash = 1; flicker = 2;
    /* low on the horizon, as the design has it - never a bolt through the
       middle of the page where the tasks are */
    const x = w * (0.1 + rnd() * 0.8), top = h * (0.04 + rnd() * 0.10);
    const pts = [[x, top]];
    let cx = x, cy = top;
    const foot = top + h * (0.10 + rnd() * 0.12);
    while (cy < foot){ cy += (foot - top) / 5; cx += (rnd() - 0.5) * w * 0.045; pts.push([cx, cy]); }
    bolt = { pts, born: now };
    nextStrike = now + window.TodoCore.strikeDelay(WX, rnd);
  }

  function frame(now){
    raf = requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!ctx) return;
    ctx.clearRect(0, 0, w, h);
    const p = window.TodoCore.rainProfile(WX);

    if (LIT && p.gap){
      if (!nextStrike) nextStrike = now + window.TodoCore.strikeDelay(WX, rnd);
      else if (now >= nextStrike) strike(now);
    }
    /* the double flicker the design describes: the glow drops, catches once,
       then falls away */
    if (flash > 0){
      flash -= dt * (flicker > 0 ? 5.2 : 1.9);
      if (flash <= 0 && flicker > 0){ flicker--; flash = flicker ? 0.75 : 0; }
      if (flash > 0){
        const g = ctx.createLinearGradient(0, 0, 0, h * 0.5);
        g.addColorStop(0, 'rgba(255,246,236,' + (flash * 0.30).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,246,236,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h * 0.5);
      }
      lift(flash);
    } else if (lifted) lift(0);
    if (bolt && now - bolt.born < 190){
      const k = 1 - (now - bolt.born) / 190;
      ctx.strokeStyle = 'rgba(255,250,242,' + (k * 0.85).toFixed(3) + ')';
      ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath();
      bolt.pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]));
      ctx.stroke();
    } else if (bolt) bolt = null;

    if (!drops.length) return;
    const col = ink();
    ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    for (const d of drops){
      d.y += d.v * dt;
      d.x += d.v * p.slant * dt;
      if (d.y - d.l > h){
        d.y = -d.l - rnd() * h * 0.25;
        d.x = rnd() * (w + Math.abs(p.slant) * h) - (p.slant > 0 ? p.slant * h : 0);
        d.v = p.vMin + rnd() * (p.vMax - p.vMin);
      }
      ctx.strokeStyle = 'rgba(' + col + ',' + d.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - p.slant * d.l, d.y - d.l);
      ctx.stroke();
    }
  }

  /* lift(0) as well: stopping mid-flash would otherwise leave the veil
     thinned at whatever value the last frame wrote, and the photo would
     sit permanently brighter with nothing on screen explaining why */
  function stop(){ if (raf) cancelAnimationFrame(raf); raf = null;
    if (ctx) ctx.clearRect(0, 0, w, h); flash = 0; flicker = 0; bolt = null; lift(0); }

  function start(){
    if (raf) return;
    last = performance.now(); nextStrike = 0;
    raf = requestAnimationFrame(frame);
  }

  function apply(){
    if (!cv) return;
    const off = WX === 'off' || (reduced && reduced.matches);
    if (off){ drops = []; stop(); return; }
    seed();
    start();
  }

  return {
    mount(){
      if (cv) return;
      cv = document.createElement('canvas');
      cv.className = 'wx'; cv.setAttribute('aria-hidden', 'true');
      /* .scene is in the static markup so the photograph starts loading
         during parse; the canvas is built here because it needs sizing
         against a laid-out viewport. It goes directly after the scene. */
      const scene = document.querySelector('.scene');
      if (scene && scene.parentNode) scene.parentNode.insertBefore(cv, scene.nextSibling);
      else document.body.insertBefore(cv, document.body.firstChild);
      ctx = cv.getContext('2d');
      fit();
      addEventListener('resize', fit, { passive: true });
      /* a hidden tab gets no frames anyway; stopping stops the clock drifting
         and the battery draining behind another window */
      document.addEventListener('visibilitychange', () => document.hidden ? stop() : apply());
      /* "clicking anywhere makes the lightning strike now", from the design.
         Capture-phase and passive so it never interferes with a button. */
      document.addEventListener('pointerdown', () => {
        if (LIT && WX !== 'off' && !(reduced && reduced.matches)) strike(performance.now());
      }, { capture: true, passive: true });
      if (reduced && reduced.addEventListener) reduced.addEventListener('change', apply);
      apply();
    },
    apply
  };
})();


function setRain(v){
  WX = v; try { localStorage.setItem(WX_KEY, v); } catch (e) {}
  weather.apply(); render();
}
function setLightning(on){
  LIT = !!on; try { localStorage.setItem(WX_LIT_KEY, on ? '1' : '0'); } catch (e) {}
  render();
}
function weatherHTML(){
  return '<div class="wxc">' +
    '<span class="cap">Rain</span>' +
    '<span class="seg">' + window.TodoCore.RAIN_STEPS.map(s =>
      '<button data-rain="' + s + '" class="' + (WX === s ? 'on' : '') + '">' +
      s.charAt(0).toUpperCase() + s.slice(1) + '</button>').join('') + '</span>' +
    '<button class="lt' + (LIT ? ' on' : '') + '" id="litBtn" ' +
      'aria-pressed="' + (LIT ? 'true' : 'false') + '">' +
      '<i><s></s></i>Lightning</button>' +
  '</div>';
}

/* The reminder interval is a choice now, not a fixed quarter of an hour. */
const IVS = [5, 15, 30, 60];
const IV_KEY = 'whattodo_interval';
let IV = (() => { try { return +localStorage.getItem(IV_KEY) || 15; } catch (e) { return 15; } })();
let OPEN = {};
/* Finished work is off the list by default. SHOWDONE reveals it again -
   see the note where the list is built. */
let SHOWDONE = false;            /* which tasks have their full step list showing */
/* The bin. REMOVED is loaded separately from TODOS because listTodos
   filters deleted_at out - the whole point of the filter - so the only way
   to show what was removed is to ask for it on purpose. */
let REMOVED = [], SHOWBIN = false, INCL_REMOVED = false;
let ADDING = false;
let DRAFT = { id: null, title: '', day: null, steps: [], step: '' };

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

/* ---- the month grid ---- */
function calHTML(){
  const base = new Date((MON || SEL.slice(0, 7) + '-01') + 'T12:00:00');
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  /* Monday-first, like the week strip and like the way the work is planned */
  const lead = (first.getDay() + 6) % 7;
  const cells = [];
  for (let i = lead; i > 0; i--) cells.push({ d: new Date(y, m, 1 - i), out: true });
  for (let i = 1; i <= last.getDate(); i++) cells.push({ d: new Date(y, m, i), out: false });
  while (cells.length % 7) cells.push({ d: new Date(y, m + 1, cells.length - lead - last.getDate() + 1), out: true });

  let h = '<div class="glass cal"><div class="cal-h">' +
    '<span class="m">' + MONTHS[m] + '</span><span class="y">' + y + '</span>' +
    '<span class="nav"><button id="mPrev" title="Previous month" aria-label="Previous month">‹</button>' +
    '<button id="mNow" title="This month" aria-label="This month">·</button>' +
    '<button id="mNext" title="Next month" aria-label="Next month">›</button></span></div>' +
    '<div class="grid7">' + DOW.map(n => '<span class="dn">' + n + '</span>').join('');
  for (const c of cells){
    const k = dayKey(c.d), list = c.out ? [] : forDay(k);
    const n = list.length, dn = list.filter(t => t.done).length;
    const cls = ['cell'];
    if (c.out) cls.push('out');
    if (k === SEL) cls.push('sel');
    if (k === TODAY()) cls.push('today');
    if (n && dn === n) cls.push('all');
    h += '<button class="' + cls.join(' ') + '" data-day="' + k + '">' +
      '<span class="n">' + c.d.getDate() + '</span>' +
      '<span class="c">' + (n ? dn + '/' + n : '') + '</span></button>';
  }
  return h + '</div></div>';
}

/* ---- how far through the day you are, step by step ----
   Counted in STEPS, not headings: a nine-step audit and a one-line job are
   not the same amount of work and the bar should not say they are. */
function progHTML(){
  const list = forDay(SEL), n = list.length, dn = list.filter(t => t.done).length;
  const steps = list.flatMap(t => window.TodoCore.noteItems(t.note));
  const on = steps.filter(s => s.done).length;
  const isToday = SEL === TODAY();
  const d = new Date(SEL + 'T12:00:00');
  const cap = isToday ? 'Today' : d.toLocaleDateString([], { weekday:'long', day:'numeric' });
  /* a day with no steps at all still draws one empty segment, so the panel
     keeps its shape rather than collapsing */
  const segs = steps.length ? steps : [{ done:false }];
  return '<div class="glass prog">' +
    '<span class="cap">' + esc(cap) + '</span>' +
    '<div class="row"><span class="big">' + dn + ' of ' + n + '</span><span>done</span></div>' +
    '<div class="segs">' + segs.map(s => '<i class="' + (s.done ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<span class="cap" style="letter-spacing:0;text-transform:none;font-size:12.5px">' +
      (steps.length ? on + ' of ' + steps.length + ' steps ticked' : 'no steps on this day') +
    '</span></div>';
}

function statsHTML(){
  const tot = TODOS.length, done = TODOS.filter(t => t.done).length;
  const open = carried().length;
  const pct = tot ? Math.round(done / tot * 100) : 0;
  const rows = [['Tasks', tot, 'sky'], ['Done', done, 'mint'],

function weekHTML(){
  const d = new Date(SEL + 'T12:00:00');
  const mon = shift(SEL, -((d.getDay() + 6) % 7));
  const wk = Math.ceil(((new Date(SEL + 'T12:00:00') - new Date(d.getFullYear(), 0, 1)) / 86400000 + 1) / 7);
  let h = '<div class="glass wk"><div class="wk-h"><span class="t">This week</span>' +
