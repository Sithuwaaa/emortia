/* ---- one job, carried over or not ----

   ONE RENDERER, and that is the whole fix for a real bug. Carried-over jobs
   used to get a separate "hero" card modelled on the design, which showed a
   summary line - "5 steps · 4 done" - and no steps, no tick boxes and no
   expander. That is fine for the one prominent leftover the mock imagines.
   It is wrong for a real list: every job that is overdue and unfinished is
   carried, so a backlog going back to August rendered ENTIRELY as summary
   cards and the steps could not be opened at all. The feature the tool was
   rebuilt around was unreachable for exactly the person with a backlog.

   My own check missed it because I shaped the fixture to the design's mock -
   four jobs dated today - so everything went down this path and the other
   one was never drawn. The fixture tested the code I had written rather than
   the data the tool actually holds.

   So a carried job is a task card with a marker and a Move to today button,
   not a different kind of card. Nothing can show a count it will not open. */
/* hit is the search match for this task, when it came from a search: it opens
   the card on the steps that matched and marks them. Without it a card found
   by its ninth step would show its first three and look like a mis-hit. */
function taskHTML(t, carry, hit){
  const T = window.TodoCore;
  const items = T.noteItems(t.note);
  const done = !!t.done;
  const [type, hue] = jobType(t.title);
  const mk = hit ? hit.steps.map(s => s.k) : [];
  const showAll = !!OPEN[t.id] || mk.length > 0;
  const shown = items.length > 4 && !showAll ? items.slice(0, 3) : items;
  /* IN A SEARCH RESULT A FINISHED TASK IS DATED BY WHEN IT WAS FINISHED.
     Everywhere else the card shows the day it sits on, which for a done
     task is also its completion day - but a result found from months back
     is being asked "when did I do this", and the day it was once scheduled
     for is the answer to a different question. */
  const stamp = hit && hit.done && hit.doneAt ? dayKey(hit.doneAt) : dayOf(t);
  const d = new Date(stamp + 'T12:00:00');
  let h = '<div class="glass task' + (done ? ' done' : '') + (carry ? ' carry' : '') +
      (hit ? ' hit' : '') + (hit && hit.removed ? ' gone' : '') + '">' +
    (carry ? '<span class="carryk"><i></i>Carried over · ' +
       esc(d.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' })) + '</span>' : '') +
    (hit && hit.removed
       ? '<span class="carryk gone"><i></i>Removed · ' + esc(T.ago(t.deleted_at)) + '</span>' : '') +
    '<div class="task-top">' +
      '<button class="box' + (done ? ' on' : '') + '" data-tick="' + esc(t.id) + '" data-to="' + (done ? '0' : '1') +
        '" title="' + (done ? 'Not done yet' : 'Done') + '" aria-label="' + (done ? 'Mark not done' : 'Mark done') + '"><s></s></button>' +
      (EDIT_ID === t.id
        ? '<input id="editIn" class="ti" value="' + esc(t.title) + '" maxlength="200">'
        : '<span class="ti" data-edit="' + esc(t.id) + '">' + esc(t.title) + '</span>') +
      /* a finished result says so, and its date is labelled as a finish date
         rather than left ambiguous next to the open ones beside it */
      (hit && hit.done ? '<span class="fin">Done</span>' : '') +
      '<span class="dt">' + (hit && hit.done && hit.doneAt ? 'finished ' : '') +
        esc(d.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' })) + '</span>' +
      (items.length ? '<span class="ct">' + items.filter(i => i.done).length + '/' + items.length + '</span>' : '') +
      '<button class="edit" data-open="' + esc(t.id) + '" title="Edit this task" aria-label="Edit this task">' +
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 2.3a1.1 1.1 0 0 1 1.6 0l0.8 0.8a1.1 1.1 0 0 1 0 1.6L6.4 11.9 3.3 12.7l0.8-3.1z" ' +
        'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>' +
      /* The × is live again as of 18 October, on the agreed design: it soft
         deletes behind two confirms, with an Undo toast and a restore list.
         It was disabled on 13 October because it hard-deleted with no undo.
         See docs/whattodo-delete-proposal.md. */
      '<button class="edit rm" data-rm="' + esc(t.id) + '"' +
        ' title="Remove this task" aria-label="Remove this task">×</button>' +
    '</div>' +
    '<span class="chip" style="background:color-mix(in srgb,var(--' + hue + ') 15%,transparent)">' +
      '<i style="background:var(--' + hue + ')"></i>' + type + '</span>';
  h += shown.map((it, k) =>
    '<div class="step' + (it.done ? ' on' : '') + (mk.indexOf(k) >= 0 ? ' mt' : '') + '">' +
      '<button class="box' + (it.done ? ' on' : '') + '" data-step="' + esc(t.id) + '" data-k="' + k +
        '" data-to="' + (it.done ? '0' : '1') + '" aria-label="' + (it.done ? 'Untick step' : 'Tick step') + '"><s></s></button>' +
      '<label>' + esc(it.text) + '</label></div>').join('');
  /* not in a search result: hit forces the card open, so the toggle would
     report a state it cannot leave */
  if (items.length > 4 && !hit)
    h += '<button class="more" data-more="' + esc(t.id) + '">' +
      (showAll ? 'Show less' : 'Show all ' + items.length + ' steps') + '</button>';
  if (carry)
    h += '<div class="acts">' +
      '<button class="pri" data-bring="' + esc(t.id) + '">Move to today</button>' +
      '<button class="sec" data-tick="' + esc(t.id) + '" data-to="1">Mark done</button>' +
    '</div>';
  return h + '</div>';
}

/* ---- the add form, which takes the steps at the same time ---- */
/* ---- the add form, which is also the EDIT form ----

   An existing task is changed the same way a new one is made: same fields,
   same sub-task list, same Save. Before this the only thing editable was the
   heading, by clicking it, and the steps could only be changed by ticking
   them - so a typo in a step, or a step that turned out to be two steps,
   had no way to be fixed at all.

   DRAFT.id carries which task is being edited, or null for a new one. That
   one field is the whole difference between the two modes, which is why they
   are one form rather than two that drift apart. */
function addHTML(){
  if (!ADDING) return '';
  const editing = !!DRAFT.id;
  const mon = shift(DRAFT.day || SEL, -((new Date((DRAFT.day || SEL) + 'T12:00:00').getDay() + 6) % 7));
  const days = Array.from({ length: 7 }, (_, i) => shift(mon, i));
  return '<div class="addpop" id="addPop">' +
    '<div class="hd"><i>' + (editing ? '✎' : '+') + '</i>' +
      '<span class="t">' + (editing ? 'Edit task' : 'New task') + '</span>' +
      '<span class="n">' + (DRAFT.steps.length ? DRAFT.steps.length + ' sub-task' + (DRAFT.steps.length > 1 ? 's' : '') : '') + '</span></div>' +
    '<input id="dTitle" maxlength="200" autocomplete="off" placeholder="Heading — e.g. NW-0425 · lamp-pole install" value="' + esc(DRAFT.title) + '">' +
    '<div class="days"><span class="cap">Due</span>' +
      days.map(k => '<button data-dday="' + k + '" class="' + (DRAFT.day === k ? 'on' : '') + '">' +
        DOW[days.indexOf(k)] + ' ' + new Date(k + 'T12:00:00').getDate() + '</button>').join('') +
    '</div>' +
    '<div class="drafts">' +
      DRAFT.steps.map((s, i) => '<div class="drow"><span class="ghost"></span><span>' + esc(s) +
        '</span><button data-dstep="' + i + '" aria-label="Remove step">×</button></div>').join('') +
      '<div class="stepin"><span class="ghost"></span>' +
        '<input id="dStep" maxlength="200" autocomplete="off" placeholder="Add a sub-task, press Enter" value="' + esc(DRAFT.step) + '">' +
        '<button class="rbtn" id="dAdd">Add step</button></div>' +
    '</div>' +
    '<div class="acts"><button class="sec" id="dCancel">Cancel</button>' +
      '<button class="pri" id="dSave" style="opacity:' + (DRAFT.title.trim() ? 1 : .45) + '">' + (editing ? 'Save changes' : 'Save task') + '</button></div>' +
  '</div>';
}

function remindBar(){
  const ring = alarming();
  /* THREE GROUPS, NOT A ROW OF SIX THINGS. The switch sits left, the
     intervals centre, the bell and the stop button right. The two outer
     groups both take flex:1, which is what actually centres the middle one -
     a single spacer only pushes things apart and left everything bunched at
     the left edge. */
  return '<div class="rbar' + (REMIND ? ' on' : '') + '">' +
    '<div class="rg lft">' +
      '<button class="sw' + (REMIND ? ' on' : '') + '" id="remBtn"><i><s></s></i>Remind me every</button>' +
    '</div>' +
    '<div class="rg mid">' +
      '<div class="ivs">' + IVS.map(v =>
        '<button data-iv="' + v + '" class="' + (IV === v ? 'on' : '') + '">' +
        (v < 60 ? v + ' min' : '1 hr') + '</button>').join('') + '</div>' +
    '</div>' +
    '<div class="rg rgt">' +
      '<button class="bell" id="sndBtn" title="' + (SOUND ? 'Mute' : 'Unmute') + '">' +
        '<i>' + (SOUND ? '\u{1F514}' : '\u{1F515}') + '</i>' +
        '<b>' + esc(countdown()) + '</b></button>' +
      (ring ? '<button class="rbtn stop" id="stopBtn">Stop alarm \u00b7 <span id="almLeft">' +
          alarmLeft() + '</span></button>'
            : '<button class="rbtn stop" id="stopBtn" disabled title="Nothing is ringing">Stop alarm</button>') +
    '</div>' +
  '</div>';
}
/* "Recently removed" - the same pattern as the done line, one step down.

   Each row says when it was removed and what happens next, because those
   are different answers for a finished task and an unfinished one: the
   unfinished one is counting down to the sweep, the finished one is not
   counting down at all and never will. Saying "kept" rather than a date is
   the honest way to put that on screen. */
function binHTML(){
  const T = window.TodoCore, bin = T.removedTasks(REMOVED);
  if (!bin.length) return '';
  const now = Date.now();
  if (!SHOWBIN)
    return '<button class="doneline binline" id="showBin">' +
      bin.length + ' removed · show</button>';
  return '<button class="doneline binline" id="showBin">Hide removed</button>' +
    '<div class="bin">' + bin.map(t => {
      const left = T.purgeIn(t, now);
      const fate = t.done
        ? 'finished · kept'
        : left === 0 ? 'due to be swept'
        : Math.ceil(left / 86400000) + ' day' + (Math.ceil(left / 86400000) === 1 ? '' : 's') + ' left';
      return '<div class="binrow">' +
        '<span class="bt">' + esc(t.title) + '</span>' +
        '<span class="bw">removed ' + esc(T.ago(t.deleted_at, now)) + ' · ' + fate + '</span>' +
        '<button class="bre" data-restore="' + esc(t.id) + '">Restore</button>' +
      '</div>';
    }).join('') + '</div>';
}

/* ---- the tile sits beside the button, and flips when there is no room ---- */
function placeAddPop(){
  const pop = $('addPop'), btn = $('openAdd');
  if (!pop || !btn) return;
  const b = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  /* left of the button by default - it lives on the right edge - and right
     of it only if that somehow fits better. 14px of air either way. */
  let left = b.left - w - 14;
  if (left < 12) left = Math.min(b.right + 14, innerWidth - w - 12);
  if (left < 12) left = 12;
  /* centred on the button, then pulled inside the viewport */
  let top = b.top + b.height / 2 - h / 2;
  top = Math.max(12 + (parseInt(getComputedStyle(document.documentElement).paddingTop) || 0),
                 Math.min(top, innerHeight - h - 12));
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
}
addEventListener('resize', placeAddPop, { passive: true });

/* ---- "when your pointer gets close", measured ----

   The design asks for the label to appear on approach, not only on hover -
   hover means you have already found it. A pointermove listener measures
   the distance to the button's box and adds .near inside 140px.

   Throttled on the clock rather than on frames: this display runs at about
   145Hz and a per-frame handler would do the work twice as often here as
   on a 60Hz screen for no visible difference. */
let fabNearAt = 0;
addEventListener('pointermove', ev => {
  const now = performance.now();
  if (now - fabNearAt < 60) return;
  fabNearAt = now;
  const btn = $('openAdd'); if (!btn) return;
  const b = btn.getBoundingClientRect();
  const dx = Math.max(b.left - ev.clientX, 0, ev.clientX - b.right);
  const dy = Math.max(b.top - ev.clientY, 0, ev.clientY - b.bottom);
  btn.classList.toggle('near', Math.hypot(dx, dy) < 140);
}, { passive: true });

function render(){
  /* a realtime redraw must not eat what is being typed */
  const ta = document.activeElement, taId = ta && ta.id;
  const caret = ta && ta.selectionStart;

  const list = forDay(SEL), n = list.length, dn = list.filter(t => t.done).length;
  /* FINISHED WORK LEAVES THE LIST. A ticked task with a line through it is
     still a card taking a card's worth of room, and on a day with ten jobs
     the four that are done push the six that are not off the screen.

     Hidden, NOT dropped: it is still counted in 'x of y done', in the
     calendar, in the week strip and in the progress bar - and one click on
     the line below the list brings it all back, because a task ticked by
     mistake has to be untickable. Removing it from the page outright would
     have made a mis-tick unrecoverable. */
  const open = list.filter(t => !t.done), done = list.filter(t => t.done);
  const d = new Date(SEL + 'T12:00:00');
  const carry = SEL === TODAY() ? carried() : [];

  /* null while the box is empty, so everything downstream can ask "searching?"
     with one test. Newest day first, because a search of a backlog that runs
     to 30 August otherwise opens on August. */
  /* SEARCH REACHES THE ARCHIVE. TODOS already carries finished work - the
     done-line only hides it from the day's list - so completed tasks are
     searched without doing anything special. Removed ones are different:
     they are not in TODOS at all, because listTodos filters them, so they
     are appended only when they have been asked for.

     Sorted by the day each result BELONGS to, and for a finished task that
     is the day it was finished. A search that puts work you completed in
     May under the day it was once scheduled for is answering a different
     question from the one asked. */
  const hitDay = m => m.done && m.doneAt ? dayKey(m.doneAt) : dayOf(m.t);
  const pool = INCL_REMOVED ? TODOS.concat(REMOVED) : TODOS;
  const hits = Q.trim()
    ? window.TodoCore.searchTasks(pool, Q, { includeRemoved: INCL_REMOVED })
        .sort((a, b) => hitDay(a) < hitDay(b) ? 1 : -1)
    : null;

  let h = starsHTML() + '<div class="liquid">' +
    '<div class="lq-in">';
  if (LOAD_ERR) h += '<div class="err"><b>The list could not be read.</b><br>' + esc(LOAD_ERR) + '</div>';
  h += '<div class="hd-row"><span class="lq-sub">' +
      esc(d.toLocaleDateString([], { weekday:'long', day:'numeric', month:'long' })) +
    '</span><span class="sp"></span>' + weatherHTML() + '</div>' +
    /* DASHBOARD ON TOP, TASKS BELOW.

       It used to be two columns side by side, calendar on the left and the
       whole task list on the right - which made the task column a narrow
       channel down one half of a wide screen while the calendar sat beside
       acres of nothing. The dashboard is a fixed amount of material and
       the task list is not, so they are stacked: everything that summarises
       the day across the top, and the list full width underneath where a
       long title has room to be one line. */
    '<div class="dash">' +
      '<div class="dashL">' + calHTML() + '</div>' +
      '<div class="dashR">' + weekHTML() + progHTML() + statsHTML() + '</div>' +
    '</div>' +
    '<div class="tasks">' +
        '<div class="tk-h"><span class="t">' + (hits ? 'Results' : 'Tasks') + '</span>' +
          '<span class="n">' + (hits
            ? hits.length + (hits.length === 1 ? ' match' : ' matches') + ' · all days' +
              (hits.filter(m => m.done).length ? ' · ' + hits.filter(m => m.done).length + ' finished' : '')
            : dn + ' of ' + n + ' done') + '</span>' +
          (hits ? '<button class="incl' + (INCL_REMOVED ? ' on' : '') + '" id="inclRemoved" ' +
             'aria-pressed="' + (INCL_REMOVED ? 'true' : 'false') + '" ' +
             'title="Removed tasks are left out of search unless you ask for them">' +
             (INCL_REMOVED ? 'Removed included' : 'Include removed') + '</button>' : '') +
          '<span class="qw"><input id="q" class="q" type="search" autocomplete="off"' +
            ' placeholder="Search every day" value="' + esc(Q) + '">' +
            (Q ? '<button id="qx" title="Clear the search" aria-label="Clear the search">×</button>' : '') +
          '</span>' +
        '</div>' +
        /* searching replaces the day's list rather than filtering it - the
           whole point is to leave the selected day behind */
        (hits
          ? (hits.length
              ? hits.map(m => taskHTML(m.t, false, m)).join('')
              : '<div class="none">Nothing matches “' + esc(Q.trim()) + '”.</div>')
          /* TODAY'S OWN TASKS COME FIRST, CARRIED-OVER BELOW THEM.

             forDay already sorts newest first, but the carried pile was
             rendered above it - so with nine things carried over, a task
             typed a second ago appeared tenth. It was at the top of its own
             group and nowhere near the top of the page, which is not what
             "latest on top" means to anyone looking at the screen.

             Carried work keeps its place in the list rather than being
             hidden: it is still the next thing after today's, where it
             reads as a backlog rather than as the day's agenda. */
          : open.map(t => taskHTML(t, false)).join('') +
            carry.map(t => taskHTML(t, true)).join('') +
            (dn ? '<button class="doneline" id="showDone">' +
              (SHOWDONE ? 'Hide ' + dn + ' finished' : dn + ' finished · show') +
              '</button>' : '') +
            (SHOWDONE ? done.map(t => taskHTML(t, false)).join('') : '') +
            (n ? '' : '<div class="none">Nothing planned for this day.</div>') +
            binHTML()) +
    '</div>' +
    /* ADD TASK FOLLOWS YOU DOWN THE PAGE. In the header it scrolled away
       with the header, and on a day with twenty tasks the control you want
       most is the one you have to scroll back up to reach. Fixed to the
       right edge, clear of the reminder bar. */
    '<button class="fab" id="openAdd" title="Add a task" aria-label="Add a task">' +
      '<i>+</i><span>Add task</span></button>' +
    addHTML() +
    remindBar() +
  '</div></div>';
  $('view').innerHTML = h;

  /* ---- wiring ---- */
  /* picking a day ends the search - otherwise you click a day and the page
     does not move, because the results are not of a day */
  const go = k => { SEL = k; EDIT_ID = null; ADDING = false; Q = ''; render(); };
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => go(b.dataset.day));
  const mstep = n2 => () => { const b = new Date((MON || SEL.slice(0, 7) + '-01') + 'T12:00:00');
    b.setDate(1); b.setMonth(b.getMonth() + n2); MON = dayKey(b); render(); };
  $('mPrev').onclick = mstep(-1); $('mNext').onclick = mstep(1);
  $('mNow').onclick = () => { MON = TODAY().slice(0, 7) + '-01'; render(); };

  document.querySelectorAll('[data-tick]').forEach(b => b.onclick = () => markDone(b.dataset.tick, b, b.dataset.to === '1'));
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => markStep(b.dataset.step, +b.dataset.k, b.dataset.to === '1', b));
  document.querySelectorAll('[data-bring]').forEach(b => b.onclick = () => bring(b.dataset.bring));
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
    OPEN[b.dataset.more] = !OPEN[b.dataset.more]; render(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openEdit(b.dataset.open));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removeTask(b.dataset.rm));
  document.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => restoreTask(b.dataset.restore));
  const sb2 = $('showBin'); if (sb2) sb2.onclick = () => { SHOWBIN = !SHOWBIN; render(); };
  const ir = $('inclRemoved'); if (ir) ir.onclick = () => { INCL_REMOVED = !INCL_REMOVED; render(); };

  const ei = $('editIn');
  if (ei){
    ei.focus(); ei.select();
    ei.onkeydown = e => { if (e.key === 'Enter') saveEdit(EDIT_ID, ei.value.trim());
                          if (e.key === 'Escape'){ EDIT_ID = null; render(); } };
    ei.onblur = () => { if (EDIT_ID) saveEdit(EDIT_ID, ei.value.trim()); };
  }

  const sd = $('showDone'); if (sd) sd.onclick = () => { SHOWDONE = !SHOWDONE; render(); };

  /* The search box redraws the page on every keystroke, so it has to put the
     caret back itself - the add form's restore below only covers its own two
     fields, and without this you get one letter per redraw. */
  const qi = $('q');
  if (qi){
    qi.oninput = () => { Q = qi.value; render(); };
    qi.onkeydown = e => { if (e.key === 'Escape'){ Q = ''; render(); } };
    if (taId === 'q'){ qi.focus(); try { qi.setSelectionRange(caret, caret); } catch(e){} }
  }
  const qx = $('qx'); if (qx) qx.onclick = () => { Q = ''; render(); };

  document.querySelectorAll('[data-rain]').forEach(b => b.onclick = () => setRain(b.dataset.rain));
  const lb = $('litBtn'); if (lb) lb.onclick = () => setLightning(!LIT);

  /* adding leaves the search: the form draws on the day's list, which a
     search has replaced, and its fields would not be on the page to wire */
  $('openAdd').onclick = () => { Q = ''; ADDING = true;
    DRAFT = { id:null, title:'', day:SEL, steps:[], step:'' }; render(); };
  if (ADDING){
    placeAddPop();
    const ti = $('dTitle'), si = $('dStep');
    ti.oninput = () => { DRAFT.title = ti.value; const s = $('dSave'); if (s) s.style.opacity = ti.value.trim() ? 1 : .45; };
    ti.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); si.focus(); } };
    si.oninput = () => { DRAFT.step = si.value; };
    si.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); pushStep(); } };
    $('dAdd').onclick = pushStep;
    document.querySelectorAll('[data-dday]').forEach(b => b.onclick = () => { DRAFT.day = b.dataset.dday; render(); });
    document.querySelectorAll('[data-dstep]').forEach(b => b.onclick = () => {
      DRAFT.steps.splice(+b.dataset.dstep, 1); render(); });
    $('dCancel').onclick = () => { ADDING = false; render(); };
    $('dSave').onclick = saveDraft;
    if (taId === 'dTitle' || taId === 'dStep'){
      const el = $(taId); if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} }
    } else ti.focus();
  }

  const rb = $('remBtn'); if (rb) rb.onclick = () => setRemind(!REMIND);
  const sb = $('sndBtn'); if (sb) sb.onclick = () => setSound(!SOUND);
  document.querySelectorAll('[data-iv]').forEach(b => b.onclick = () => {
    IV = +b.dataset.iv;
    try { localStorage.setItem(IV_KEY, String(IV)); } catch (e) {}
    /* restart the countdown on the new interval, or the next nudge still
       arrives on the old one and the chip is a lie */
    if (REMIND) setRemind(true); else render();
  });
  const stb = $('stopBtn'); if (stb && !stb.disabled) stb.onclick = () => { stopAlarm(); toast('Alarm stopped'); };
}

function pushStep(){
  const si = $('dStep'); if (!si) return;
  const v = si.value.trim(); if (!v) return;
  DRAFT.steps.push(v); DRAFT.step = ''; render();
  const n = $('dStep'); if (n) n.focus();
}

/* The heading and its steps go up together, so a new job arrives with its
   list rather than as a bare line waiting to be opened and filled in. */
/* Open the form on an existing task. The steps come out of the note the
   same way the list draws them, so what you edit is exactly what you see. */
function openEdit(id){
  const t = TODOS.find(x => x.id === id); if (!t) return;
  /* from a search result: leave the search and land on the task's own day.
     The form draws inside the day's list, which the results replaced, so
     without this it would be wired to fields that were never drawn. */
  if (Q.trim()){ Q = ''; SEL = dayOf(t); }
  ADDING = true;
  DRAFT = { id: t.id, title: t.title, day: dayOf(t),
            steps: window.TodoCore.noteItems(t.note).map(i => i.text), step: '' };
  /* the ticks are kept, not reset: editing a heading must not undo an
     afternoon of ticking. saveDraft puts them back by position. */
  DRAFT.done = window.TodoCore.noteItems(t.note).map(i => i.done);
  render();
  const el = $('dTitle'); if (el){ el.focus(); el.select(); }
}

async function saveDraft(){
  const title = DRAFT.title.trim();
  if (!title){ toast('A task needs a heading'); return; }
  const extra = DRAFT.step.trim();
  const steps = extra ? DRAFT.steps.concat([extra]) : DRAFT.steps;
  /* THE TICKS SURVIVE THE EDIT. A step keeps the state it had, matched by
     position; a step that was added in the form starts unticked. Rewriting
     every step as unticked would mean fixing one typo in a heading threw
     away an afternoon of ticking, which is worse than not being able to
     edit at all. */
  const was = DRAFT.done || [];
  const note = window.TodoCore.writeNote(
    steps.map((l, i) => ({ done: !!was[i], text: l })));
  const day = DRAFT.day || SEL;
  const editing = DRAFT.id;
  try {
    await window.AuthGate.require();
    if (editing){
      const t = TODOS.find(x => x.id === editing);
      await window.DB.updateTodo(editing, { title, note, due: endOf(day) });
      /* the heading follows its steps, as everywhere else in this tool */
      const finished = window.TodoCore.allItemsDone(note);
      if (t && finished !== !!t.done) await window.DB.setTodoDone(editing, finished);
    } else {
      await window.DB.addTodo({ title, note, due: endOf(day) });
    }
    ADDING = false; SEL = day;
    await refresh();
    toast(editing ? 'Saved'
      : steps.length ? 'Added with ' + steps.length + ' step' + (steps.length > 1 ? 's' : '') : 'Added');
  } catch (err){ toast(err.message, 6000); }
}


/* ---- the three the rewrite dropped ----

   bring, saveEdit and addTask lived in the block of view code the new look
   replaced, and went out with it. Nothing complained: the handlers that call
   them are assigned to onclick, so a missing name throws inside the event
   and never reaches the click that fired it. "Move to today" looked bound,
   did nothing, and said nothing - which is why it took a screenshot to find.

   The lesson for the next rewrite: a function that disappears from a page is
   silent, so the check has to be that every name the handlers call still
   resolves, not that the buttons are wired. */
async function bring(id){
  const t = TODOS.find(x => x.id === id); if (!t) return;
  const before = t.due;
  t.due = endOf(TODAY()); refreshPill(); render();
  try {
    await window.AuthGate.require();
    await window.DB.updateTodo(id, { title: t.title, note: t.note, due: t.due });
    toast('Moved to today');
  } catch (err){ t.due = before; render(); toast(err.message, 6000); }
}

async function saveEdit(id, title){
  const t = TODOS.find(x => x.id === id); EDIT_ID = null;
  if (!t || !title || title === t.title){ render(); return; }
  const before = t.title; t.title = title; render();
  try {
    await window.AuthGate.require();
    await window.DB.updateTodo(id, { title, note: t.note, due: t.due || null });
  } catch (err){ t.title = before; render(); toast(err.message, 6000); }
}

async function addTask(title){
  try {
    await window.AuthGate.require();
    await window.DB.addTodo({ title, note: '', due: endOf(SEL) });
    await refresh();
  } catch (err){ toast(err.message, 6000); }
}

/* REMOVING: ASKED TWICE, THEN UNDOABLE.

   Belt and braces on purpose, because the two guards catch different
   mistakes. Ask.twice - the same box every other tool on the site uses
   before anything is lost - catches the mis-click, and naming the task and
   counting its steps in the second question is what makes asking again
   worth anything. The Undo toast catches the decision regretted ten seconds
   later. Neither one does the other's job.

   Nothing is destroyed. removeTodo stamps deleted_at; the task leaves the
   list and the counts immediately and sits in "Recently removed", where it
   can be restored by hand long after the toast has gone.

   If row-level security refuses the write the row stays and the page says
   why - the list is only redrawn after the database has agreed. */
async function removeTask(id){
  const t = TODOS.find(x => x.id === id); if (!t) return;
  const n = window.TodoCore.noteItems(t.note).length;
  const keeps = t.done
    ? 'It was finished, so it is kept indefinitely and never swept.'
    : 'It can be restored for ' + window.TodoCore.REMOVE_DAYS + ' days, then it goes for good.';
  const ok = await window.Ask.twice([
    { title: 'Remove this task?',
      body: 'It leaves the list and the counts straight away.',
      no: 'Cancel', yes: 'Continue' },
    { title: 'Remove “' + t.title + '”?',
      body: (n ? 'Its ' + n + (n === 1 ? ' step goes' : ' steps go') + ' with it. ' : '') + keeps,
      no: 'No, keep it', yes: 'Remove it' }
  ]);
  if (!ok) return;
  try {
    await window.AuthGate.require();
    await window.DB.removeTodo(id);
    await refresh();
    toastDo('Removed “' + t.title + '”', 'Undo', () => restoreTask(id, true));
  } catch (err){ toast(err.message, 7000); }
}

/* Putting one back. Also the Undo handler, which is why it is quiet when it
   succeeds from the toast - saying "Restored" after you pressed Undo tells
   you nothing you did not just do. */
async function restoreTask(id, quiet){
  try {
    await window.AuthGate.require();
    await window.DB.restoreTodo(id);
    await refresh();
    if (!quiet) toast('Restored');
  } catch (err){ toast(err.message, 7000); }
}

/* The footer is gone. It said two things: that the list is shared across
   devices, which you know, and who is signed in with a way to sign out -
   and the account chip in the bar already carries both, on every tool. A
   second sign-out in a different place is not redundancy, it is two things
   to keep in step. */

/* ---------- boot ---------- */
(async function(){
  try { REMIND = localStorage.getItem(REMIND_KEY) === '1';
        SOUND  = localStorage.getItem(SOUND_KEY)  !== '0'; } catch(e){}
  await refresh();
  weather.mount();
  if (REMIND) setRemind(true); else render();
  /* after the first paint, never before it - the sweep is housekeeping and
     must not delay the list appearing */
  setTimeout(sweepRemoved, 2500);
  // someone ticked one off elsewhere - drop it here too
  window.DB.subscribeTodos(refresh);
})();
</script>
