<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1619">
<title>Daily Attendance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_lib/theme.css">

<script src="../_lib/owner.js"></script>

<script>Access.protect({ feature: 'tool:attendance' });</script>
<script src="attendance.js"></script>
<style>
  /* Indigo. The one accent left unspoken for: the lookups are teal, the field
     reference amber, the material list green. Only the accent is this tool's
     own; the rest is theme.css, like every other tool. */
  :root,html[data-theme="dark"]{--accent:#6b7fd7;--accentB:#8b9cf0;--accentD:#4a5cae;
    --accent-ink:#0b0e1c;--glow:rgba(107,127,215,.5);--glowSoft:rgba(107,127,215,.24);
    --bad:#e2607a;--ok:#5fc189;--zebra:rgba(255,255,255,.02);--goHover:var(--accentB)}
  html[data-theme="light"]{--accent:#414f9c;--accentB:#4a5cae;--accentD:#2c3670;
    --accent-ink:#ffffff;--glow:rgba(65,79,156,.4);--glowSoft:rgba(65,79,156,.16);
    --bad:#c2405c;--ok:#217a4a;--zebra:rgba(0,0,0,.024);--goHover:#2c3670}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  ::selection{background:var(--glowSoft)}

  .hdr{display:flex;align-items:center;gap:10px;color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:var(--navy);position:sticky;top:0;z-index:20}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;font-size:0;padding:0;border:none}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px} .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px} .hdr .logo i:nth-child(4){height:13px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-.02em;color:#fff;white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  .hdr h1{font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .theme{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;
    width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;flex-shrink:0}
  .seg{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden;flex-shrink:0}
  .seg button{font:inherit;font-size:12.5px;padding:6px 13px;border:0;cursor:pointer;
    background:transparent;color:#cfd6e6}
  .seg button + button{border-left:1px solid rgba(255,255,255,.22)}
  .seg button.on{background:#fff;color:var(--navy);font-weight:600}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }

  /* The bell sits in the header rather than in the tabs, because a photograph
     arriving is news wherever you happen to be looking. */
  .bell{position:relative;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;line-height:1;flex-shrink:0}
  .bell.on{background:#fff;color:var(--navy)}
  .bell .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;
    border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;
    font-family:'Space Mono',monospace}

  main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}

  /* One tab per thing the office does, because the day is read every morning
     and the other three are touched once a month between them. */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{font:inherit;font-size:13.5px;padding:10px 15px;border:0;background:none;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s ease,border-color .15s ease}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tab .n{font-family:'Space Mono',monospace;font-size:11px;opacity:.7;margin-left:5px}
  .panel{border:1px solid var(--accent);border-radius:12px;background:var(--glowSoft);
    padding:15px 17px;margin-bottom:18px}
  .panel .row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}
  .panel .row + .row{border-top:1px solid var(--line)}
  .sw{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer}

  /* Asking twice, properly */
  .ask-back{position:fixed;inset:0;z-index:200;background:rgba(4,6,14,.74);backdrop-filter:blur(3px);
    display:grid;place-items:center;padding:20px;animation:askIn .18s ease}
  @keyframes askIn{from{opacity:0}to{opacity:1}}
  .ask{width:min(430px,100%);background:var(--card);border:1px solid var(--line2);border-radius:16px;
    padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
  .ask .step{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .ask h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;
    letter-spacing:-.02em;margin:7px 0 9px;line-height:1.2}
  .ask p{font-size:13.5px;color:var(--dim);line-height:1.65}
  .ask .btns{display:flex;gap:9px;justify-content:flex-end;margin-top:19px;flex-wrap:wrap}
  .ask .btns button{font:inherit;font-size:13.5px;padding:9px 15px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line2);background:transparent;color:var(--text)}
  .ask .btns .no:hover{border-color:var(--accent)}
  .ask .btns .yes{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
  .ask .btns .yes:hover{opacity:.9}

  /* --------------------------------------------------------- the office */
  .obar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
    flex-wrap:wrap;margin-bottom:16px}
  .obar h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:27px;
    letter-spacing:-.02em;margin-top:6px}
  .ctl{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  select,input[type=text],input[type=month],input[type=date]{font:inherit;font-size:14px;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
  select:focus,input[type=text]:focus,input[type=month]:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px var(--glowSoft)}
  /* the photograph itself, 4:3 because that is what a phone camera hands over */
  .shot{width:100%;aspect-ratio:4/3;border:1px solid var(--line2);border-radius:12px;
    background:var(--card) center/cover no-repeat}
  .shot.gone{display:flex;align-items:center;justify-content:center;border-style:dashed;
    font-size:12px;color:var(--muted);text-align:center;padding:12px}
  .del{display:flex;gap:14px;margin-top:8px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:22px}
  .tile{padding:15px 18px}
  .tile + .tile{border-left:1px solid var(--line)}
  .tile .k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--muted)}
  .tile .v{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;
    line-height:1.05;letter-spacing:-.03em;margin-top:5px}

  .sec{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  .up{display:grid;grid-template-columns:250px 1fr;gap:22px;padding:18px 0;
    border-top:1px solid var(--line)}
  .up .when{display:flex;align-items:center;gap:8px;margin-top:9px}
  .tag{font-size:10.5px;font-family:'Space Mono',monospace;letter-spacing:.1em;
    text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--line2);color:var(--dim)}
  .tag-in{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tag-ok{color:var(--ok);border-color:var(--ok)}
  .tag-late{background:var(--bad);border-color:var(--bad);color:#fff}
  .tag-out{color:var(--muted)}
  .tag-leave{color:var(--accentB);border-color:var(--accentB)}
  .lv{margin-left:9px;font-size:11.5px;opacity:.65}
  .lv:hover{opacity:1}
  .up .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;
    font-variant-numeric:tabular-nums}
  .up .fine2{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:7px 11px;
    cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--dim);
    border-radius:999px;transition:border-color .15s ease,background .15s ease,color .15s ease}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line2);white-space:nowrap}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even){background:var(--zebra)}
  .num{font-variant-numeric:tabular-nums}
  .who .n{font-weight:600}
  .who .r{font-size:11.5px;color:var(--muted)}
  .geo{font-size:12px;color:var(--muted)}

  .madelink{border:1px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:14px;
    background:var(--glowSoft)}
  .madelink .url{font-family:'Space Mono',monospace;font-size:12.5px;word-break:break-all;
    margin-top:8px;color:var(--text);user-select:all}
  .madelink .fine2{font-size:12px;color:var(--dim);line-height:1.65}
  .empty{padding:34px 4px;color:var(--muted);font-size:13.5px;line-height:1.75}
  .foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  .link{background:none;border:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
    background:var(--navy);color:#fff;border-radius:10px;padding:11px 18px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;
    max-width:calc(100vw - 32px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:760px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    .tile:nth-child(3){border-left:none}
    .tile:nth-child(n+3){border-top:1px solid var(--line)}
    .up{grid-template-columns:1fr}
    .wrap-x{overflow-x:auto}
  }
</style>

<body>
<header class="hdr" id="hdr"></header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const A = window.ATT, $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The shift starts at nine and a quarter of an hour is allowed for the road,
   so anybody photographed after 09:15 is late. Everything that says so on
   screen and in the exports reads this, rather than repeating the time. */
const SHIFT = '09:00', GRACE = 15;
let PEOPLE = [], RECS = [], DAY = A.dstr(new Date()), BUSY = false, ERR = '';
let DEVICES = [], MADE = null, LEAVE = [];      // MADE: a link just created, shown once in full
/* What the export covers. The day is what is on screen; the two monthly ones
   are asked for by a month rather than read off it, because a month is not a
   thing this page shows and pretending otherwise would mean loading one. */
let XSCOPE = 'day', XMONTH = DAY.slice(0, 7), XWHO = '';
let OLD = 90;                                   // how old a picture has to be to be swept
let TAB = 'day';                                // day | leave | team | links
let AHEAD = [];                                 // leave marked for the days to come
let BELL = false, SEEN = null;                  // SEEN: the ids already known, so an arrival is an arrival
let LV_WHO = '', LV_FROM = '', LV_TO = '', LV_NOTE = '';
const pref = (k, d) => { try { const v = localStorage.getItem('attend_'+k);
  return v === null ? d : v === '1'; } catch(e){ return d; } };
const setPref = (k, v) => { try { localStorage.setItem('attend_'+k, v ? '1' : '0'); } catch(e){} };
let SOUND = pref('sound', true), DESKTOP = pref('desktop', false);

let tt; function toast(m, ms){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), ms||2400); }

/* --------------------------------------------------------- asking twice

   Two questions, not one question asked twice. A box that says "are you sure"
   and then says it again only teaches somebody to click through both; the
   second question here says what is actually about to be lost, and naming it
   is the only thing that makes asking again worth anything.

   Built rather than confirm(), because a browser that has just shown two
   confirms in a row offers to suppress the next one - and the one it would
   suppress is the second, which is the one that matters. Escape and the
   safe button both cancel, and the safe button is the one that has focus. */
function ask(steps){
  return new Promise(resolve => {
    let at = 0;
    const back = document.createElement('div');
    back.className = 'ask-back';
    const close = ok => { document.removeEventListener('keydown', key); back.remove(); resolve(ok); };
    const key = e => { if (e.key === 'Escape') close(false); };
    function draw(){
      const s = steps[at];
      back.innerHTML = '<div class="ask" role="dialog" aria-modal="true">' +
        '<div class="step">Step ' + (at + 1) + ' of ' + steps.length + '</div>' +
        '<h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p>' +
        '<div class="btns"><button class="no">' + esc(s.no || 'Cancel') + '</button>' +
        '<button class="yes">' + esc(s.yes || 'Yes') + '</button></div></div>';
      back.querySelector('.no').onclick = () => close(false);
      back.querySelector('.yes').onclick = () => { at++; if (at < steps.length) draw(); else close(true); };
      back.querySelector('.no').focus();
    }
    back.onclick = e => { if (e.target === back) close(false); };
    document.addEventListener('keydown', key);
    document.body.appendChild(back);
    draw();
  });
}
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

/* -------------------------------------------------------------- an arrival

   A photograph turning up is the one thing here that happens without anybody
   in the office doing anything, so it is the one thing that has to announce
   itself. Two short notes rather than a file: a sound file is a request, a
   cache entry and a binary in the repository, and this is a beep.

   Browsers will not make a sound until the page has been clicked once. That is
   not worked around, it is said out loud in the panel. */
let AC = null;
function chime(){
  if (!SOUND) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    [[784, 0], [1175, .14]].forEach(pair => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = pair[0];
      g.gain.setValueAtTime(.0001, t0 + pair[1]);
      g.gain.exponentialRampToValueAtTime(.2, t0 + pair[1] + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + pair[1] + .3);
      o.connect(g); g.connect(AC.destination);
      o.start(t0 + pair[1]); o.stop(t0 + pair[1] + .32);
    });
  } catch (e){}
}
function desktopNote(text){
  if (!DESKTOP || !('Notification' in window) || Notification.permission !== 'granted') return;
  /* one tag, so ten photographs in a morning are one notification that keeps
     being replaced rather than ten stacked up */
  try { new Notification('Daily Attendance', { body: text, tag: 'attend' }); } catch (e){}
}
function arrived(n, day){
  const what = n > 1 ? n + ' photos have arrived' : 'A photo has arrived';
  const when = day === A.dstr(new Date()) ? '' : ' for ' + day;
  chime(); desktopNote(what + when + ' – name the faces on it.');
  toast(what + when, 4200);
}
/* What the bell counts: photographs on the day being read with nobody ticked
   on them yet. A count that survives a reload, because it is a fact about the
   day rather than about this browser tab. */
function waiting(day){ return (day || []).filter(u => !(u.members || []).length); }

/* ---------------------------------------------------------------- chrome */
function renderHead(){
  const n = waiting(A.ofDay(RECS, DAY)).length;
  /* The crews' screen is /attendance/ - a page with no
     sign-in, opened from a link on the shared phone - and there is deliberately
     nothing here that navigates to it: it is not a thing to be browsed into,
     and a link from an office laptop would be a link to a credential. */
  $('hdr').innerHTML =
    '<a class="brand" href="../../" title="Emortia"><span class="logo"><i></i><i></i><i></i><i></i></span>' +
    '<span class="bname">Emortia</span></a><span class="hsep"></span>' +
    '<h1>Daily Attendance</h1>' +
    '<button class="bell' + (BELL ? ' on' : '') + '" id="bell" title="Photos waiting to be named">🔔' +
      (n ? '<span class="badge">' + n + '</span>' : '') + '</button>' +
    '<button class="theme" id="themeBtn" title="Light / dark">☾</button>';
  const b = $('bell'); if (b) b.onclick = () => { BELL = !BELL; paint(); };
  const t = $('themeBtn');
  if (t){ t.textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾';
    t.onclick = () => { const to = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = to;
      try { localStorage.setItem('office_tool_theme', to); } catch(e){}
      t.textContent = to === 'dark' ? '☀' : '☾'; }; }
}

/* ------------------------------------------------------------ the office

   Four tabs. The day is read every morning; the other three are touched
   between them about once a month, and having them all on one page meant
   scrolling past the roster and a credential to reach the sheet. */
function renderOffice(){
  const late = A.lateAfter(SHIFT, GRACE);
  const sheet = A.buildSheet(PEOPLE, RECS, DAY, late, LEAVE);
  const day = A.ofDay(RECS, DAY);
  const st = A.stats(sheet, day);

  const tabs = [['day','The day', day.length], ['leave','Leave', AHEAD.length],
                ['team','Team members', PEOPLE.length]];
  if (window.IS_OWNER) tabs.push(['links','Device links', DEVICES.length]);

  let h = '<div class="tabs">' + tabs.map(t =>
    '<button class="tab' + (TAB===t[0]?' on':'') + '" data-tab="'+t[0]+'">' + esc(t[1]) +
    (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>').join('') + '</div>';

  if (BELL) h += bellPanel(day);
  if (ERR) h += '<div class="empty">' + esc(ERR) + '</div>';

  h += TAB === 'leave' ? viewLeave()
     : TAB === 'team'  ? viewTeam()
     : TAB === 'links' ? viewLinks()
     : viewDay(sheet, day, st, late);

  $('main').innerHTML = h;
  wireOffice(sheet, late);
}

/* What is waiting, and what happens when the next one lands. */
function bellPanel(day){
  const w = waiting(day);
  let h = '<div class="panel"><div class="kicker" style="color:var(--accent)">' +
    (w.length ? w.length + (w.length>1 ? ' photos are' : ' photo is') + ' waiting to be named'
              : 'Every photo on this day has a name on it') + '</div>';
  h += w.map(u => '<div class="row"><span class="tag ' + (u.kind==='in'?'tag-in':'') + '">' +
      (u.kind==='in'?'Clock in':'Clock out') + '</span>' +
      '<b>' + A.fmt(u.ts) + '</b><span class="geo">' + esc(deviceOf(u)) + '</span>' +
      '<button class="link" data-goto="'+esc(u.id)+'" style="margin-left:auto">Name it</button></div>').join('');
  h += '<div class="row" style="gap:18px;flex-wrap:wrap">' +
    '<label class="sw"><input type="checkbox" id="swSound"' + (SOUND?' checked':'') + '> Sound when one arrives</label>' +
    '<label class="sw"><input type="checkbox" id="swDesk"' + (DESKTOP?' checked':'') + '> Desktop notification</label>' +
    '</div>';
  h += '<div class="fine2" style="font-size:11.5px;color:var(--dim);margin-top:6px">' +
    'A browser will not play a sound until the page has been clicked once, so the first photo of the ' +
    'morning may arrive quietly if the tab has only been left open.' +
    (DESKTOP && 'Notification' in window && Notification.permission !== 'granted'
      ? ' Desktop notifications are switched on here but the browser has not been given permission – tick it again to ask.' : '') +
    '</div></div>';
  return h;
}

function viewDay(sheet, day, st, late){
  const opts = A.dateOpts(A.dstr(new Date()), 10);

  let h = '<div class="obar"><div><div class="kicker">The office</div>' +
    '<h2>Name the faces, and the sheet fills itself in.</h2></div>' +
    '<div class="ctl"><select id="day" title="Which day the screen shows">' +
      opts.map(o => '<option value="'+o.value+'"'+(o.value===DAY?' selected':'')+'>'+esc(o.label)+'</option>').join('') +
    '</select>' +
    '<select id="xscope" title="What the export covers">' +
      [['day','This day – the team'],['month','A month – the team'],['person','A month – one person']]
        .map(o => '<option value="'+o[0]+'"'+(XSCOPE===o[0]?' selected':'')+'>'+o[1]+'</option>').join('') +
    '</select>' +
    (XSCOPE === 'day' ? '' : '<input type="month" id="xmonth" value="'+esc(XMONTH)+'">') +
    (XSCOPE === 'person' ? '<select id="xwho">' + (PEOPLE.length
        ? PEOPLE.map(p => '<option value="'+esc(p.id)+'"'+(XWHO===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')
        : '<option value="">Nobody on the roster</option>') + '</select>' : '') +
    '<button class="btn" id="xls" style="min-height:0;padding:9px 14px">' +
      (BUSY ? 'Building…' : 'Export Excel') + '</button></div></div>';

  if (ERR) h += '<div class="empty">' + esc(ERR) + '</div>';

  h += '<div class="tiles">' +
    tile('Photos', st.photos) + tile('Names ticked', st.named) +
    tile('Present', st.present + '/' + st.roster) +
    tile('Late', st.late, st.late ? 'var(--bad)' : '') + '</div>';

  h += '<div class="sec">Photos – ' + st.photos + '</div>';
  if (!day.length){
    h += '<div class="empty" style="border-top:1px solid var(--line)">No photos for this date. ' +
      'Open the device screen on the shared phone, submit a clock-in photo, and it appears here to be named.</div>';
  } else {
    h += day.map(u => {
      const on = u.members || [];
      return '<div class="up"><div>' +
        (u.photo
          ? '<div class="shot" style="background-image:url(' + u.photo + ')" role="img" aria-label="Attendance photo"></div>'
          : '<div class="shot gone">The picture has been removed. The time, the place and the names stay.</div>') +
        '<div class="when"><span class="tag ' + (u.kind==='in'?'tag-in':'') + '">' +
          (u.kind==='in'?'Clock in':'Clock out') + '</span><span class="t">' + A.fmt(u.ts) + '</span></div>' +
        '<div class="fine2">' + esc(u.geo || 'location unavailable') + '<br>' + esc(deviceOf(u)) +
        /* Two different acts, so two buttons: the picture goes and the day
           still adds up, or the whole record goes because it should never
           have been filed. Owner only, and the delete is owner-only in the
           database too - a shared phone cannot erase what it filed. */
        (window.IS_OWNER ? '<div class="del">' +
          (u.photo ? '<button class="link" data-delpic="'+esc(u.id)+'">Delete the picture</button>' : '') +
          '<button class="link" data-delrec="'+esc(u.id)+'" style="color:var(--bad)">Delete the record</button>' +
        '</div>' : '') +
        '</div></div>' +
        '<div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px">' +
          '<div class="kicker" style="color:var(--muted)">Who is in this photo – ' + on.length + ' ticked</div>' +
          (on.length ? '<button class="link" data-clear="'+esc(u.id)+'">Clear</button>' : '') +
        '</div><div class="chips">' +
          (PEOPLE.length ? PEOPLE.map(p =>
            '<button class="chip' + (on.indexOf(p.id)>-1?' on':'') + '" data-u="'+esc(u.id)+'" data-p="'+esc(p.id)+'">' +
            (on.indexOf(p.id)>-1 ? '✓ ' : '') + esc(p.name) + '</button>').join('')
            : '<span class="empty" style="padding:0">No names on the roster yet. Add one below.</span>') +
        '</div></div></div>';
    }).join('');
  }

  h += '<div class="sec">Attendance sheet – ' +
    esc(new Date(DAY+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})) + '</div>';
  h += '<div class="wrap-x"><table><thead><tr><th>Staff</th><th>Clock in</th><th>In location</th>' +
    '<th>Clock out</th><th>Out location</th><th>Hours</th><th style="text-align:right">Status</th></tr></thead><tbody>' +
    (sheet.length ? sheet.map(r =>
      '<tr><td class="who"><div class="n">'+esc(r.name)+'</div><div class="r">'+esc(r.role)+'</div></td>' +
      '<td class="num">'+r.in+'</td><td class="geo">'+esc(r.inGeo)+'</td>' +
      '<td class="num">'+r.out+'</td><td class="geo">'+esc(r.outGeo)+'</td>' +
      '<td class="num">'+r.hours+'</td>' +
      '<td style="text-align:right"><span class="tag '+r.tagClass+'">'+esc(r.status)+'</span>' +
      /* only where it can mean anything: somebody who was photographed was
         here, and marking them on leave would be a note contradicting a fact */
      (r.present ? '' :
        '<button class="link lv" data-lv="'+esc(r.id)+'" data-on="'+(r.leave?'1':'0')+'">' +
        (r.leave ? 'not on leave' : 'on leave') + '</button>') +
      (r.leave && r.note ? '<div class="geo" style="margin-top:3px">'+esc(r.note)+'</div>' : '') +
      '</td></tr>').join('')
      : '<tr><td colspan="7" class="empty">No names on the roster yet.</td></tr>') +
    '</tbody></table></div>';
  h += '<div class="foot"><span>A row fills in only from a photo somebody has named. ' +
    'Late is any clock-in after ' + A.hm(late) + '. ' +
    (st.leave ? st.leave + ' on leave, ' : '') + st.absent + ' unaccounted for.</span></div>';
  return h;
}

/* ---------------------------------------------------------------- leave

   The sheet marks leave for the day being read, after the fact. This is the
   other half: somebody says on Friday that they are away next week, and it
   gets written down on Friday. Same rows, same table - just reachable before
   the day arrives rather than only on it. */
function viewLeave(){
  const today = A.dstr(new Date());
  const from = LV_FROM || today, to = LV_TO || from;
  const days = A.dayRange(from, to);
  const nameOf = id => { const p = PEOPLE.find(x => x.id === id); return p ? p.name : id; };
  const pretty = d => new Date(d + 'T12:00:00')
    .toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });

  let h = '<div class="obar"><div><div class="kicker">Leave</div>' +
    '<h2>Write it down before the day, not after it.</h2></div></div>';

  if (!PEOPLE.length){
    return h + '<div class="empty">Nobody on the roster yet. Add the team first, ' +
      'and leave can be marked against them.</div>';
  }

  h += '<div class="ctl" style="margin-bottom:10px">' +
    '<select id="lvWho">' + PEOPLE.map(p =>
      '<option value="'+esc(p.id)+'"'+(LV_WHO===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('') +
    '</select>' +
    '<input type="date" id="lvFrom" value="'+esc(from)+'" title="From">' +
    '<input type="date" id="lvTo" value="'+esc(to)+'" title="To">' +
    '<input type="text" id="lvNote" placeholder="A note (optional)" value="'+esc(LV_NOTE)+'" style="min-width:200px">' +
    '<button class="btn" id="lvAdd" style="min-height:0;padding:9px 14px">Mark leave</button></div>';
  h += '<div class="foot" style="margin-top:0"><span>' +
    (days.length > 1 ? days.length + ' days – ' + pretty(days[0]) + ' to ' + pretty(days[days.length-1])
                     : 'One day – ' + pretty(from)) +
    '. A photograph always outranks this: if they are marked away and turn up, the sheet says they were here.' +
    '</span></div>';

  const runs = A.groupLeave(AHEAD);
  h += '<div class="sec">Marked from today on – ' + AHEAD.length +
    (AHEAD.length === 1 ? ' day' : ' days') + '</div>';
  h += '<div class="chips">' + (runs.length ? runs.map(r =>
      '<span class="chip" style="cursor:default">' + esc(nameOf(r.person)) +
      ' <span style="opacity:.65">· ' + esc(pretty(r.from)) +
      (r.to !== r.from ? ' to ' + esc(pretty(r.to)) : '') + '</span>' +
      (r.note ? ' <span style="opacity:.5">· ' + esc(r.note) + '</span>' : '') +
      ' <button class="link" data-lvdrop="' + esc(r.person + '|' + r.days.join(',')) +
      '" title="Take this leave off" style="color:inherit;opacity:.5">×</button>' +
      '</span>').join('')
    : '<span class="empty" style="padding:0">Nothing marked. Anybody absent without a mark here ' +
      'shows on the sheet as unaccounted for.</span>') + '</div>';
  return h;
}

/* -------------------------------------------------------- the team members */
function viewTeam(){
  let h = '<div class="obar"><div><div class="kicker">Team members</div>' +
    '<h2>Everyone the sheet is measured against.</h2></div></div>';
  h += '<div class="sec">The roster – ' + PEOPLE.length + '</div>';
  if (window.IS_OWNER){
    h += '<div class="ctl" style="margin-bottom:12px">' +
      '<input type="text" id="pn" placeholder="Name" style="min-width:180px">' +
      '<input type="text" id="pr" placeholder="Role (optional)" style="min-width:150px">' +
      '<button class="btn" id="padd" style="min-height:0;padding:9px 14px">Add to the roster</button></div>';
  }
  h += '<div class="chips">' + (PEOPLE.length ? PEOPLE.map(p =>
      '<span class="chip" style="cursor:default">' + esc(p.name) +
      (p.role ? ' <span style="opacity:.6">· '+esc(p.role)+'</span>' : '') +
      (window.IS_OWNER ? ' <button class="link" data-rm="'+esc(p.id)+'" title="Take off the roster" style="color:inherit;opacity:.5">×</button>' : '') +
      '</span>').join('')
    : '<span class="empty" style="padding:0">Nobody yet. ' +
      (window.IS_OWNER ? 'Add the first name above.' : 'Ask Sithara to add the team.') + '</span>') + '</div>';
  h += '<div class="foot"><span>Taking somebody off marks them away rather than deleting them – ' +
    'a name removed outright would take every past absence of that person with it.</span></div>';
  return h;
}

/* The device links. A crew phone opens /attendance/ with its token in the
   address and files a photograph; it cannot read a record, a name or another
   device. The token is shown in full when it is made and abbreviated after,
   because it is a credential and a screen in an office is not private.

   Its own tab, and the housekeeping with it: making a credential and deleting
   photographs are both things to arrive at deliberately, not to scroll past
   on the way to the morning's sheet. */
function viewLinks(){
  let h = '<div class="obar"><div><div class="kicker">Device links</div>' +
    '<h2>One link per phone. It files photos and reads nothing.</h2></div></div>';
  {
    h += '<div class="sec">The links – ' + DEVICES.length + '</div>';
    h += '<div class="ctl" style="margin-bottom:12px">' +
      '<input type="text" id="dl" placeholder="Which phone (e.g. Janaka crew)" style="min-width:220px">' +
      '<button class="btn" id="dadd" style="min-height:0;padding:9px 14px">Make a link</button></div>';
    if (MADE){
      const url = location.origin + '/attendance/?d=' + MADE.token;
      h += '<div class="madelink"><div class="kicker" style="color:var(--accent)">' +
        esc(MADE.label || 'New device') + ' – copy this now</div>' +
        '<div class="url" id="madeurl">' + esc(url) + '</div>' +
        '<div class="ctl" style="margin-top:10px">' +
          '<button class="btn" id="dcopy" style="min-height:0;padding:8px 13px">Copy the link</button>' +
        '</div>' +
        '<div class="fine2" style="margin-top:9px">Open it once on the phone and add it to the home screen. ' +
        'Whoever has this link can file a photo for this device and nothing else – it cannot read the sheet, ' +
        'the roster or any name. If a phone is lost, drop the link here and make another.</div></div>';
    }
    h += '<div class="chips">' + (DEVICES.length ? DEVICES.map(d =>
        '<span class="chip" style="cursor:default">' + esc(d.label || d.id) +
        ' <span style="opacity:.5;font-family:\'Space Mono\',monospace;font-size:11px">…' + esc(String(d.token).slice(-6)) + '</span>' +
        (d.last_used ? ' <span style="opacity:.5">· used ' + esc(new Date(d.last_used).toLocaleDateString()) + '</span>' : ' <span style="opacity:.5">· never used</span>') +
        ' <button class="link" data-dd="' + esc(d.id) + '" title="Stop this link working" style="color:inherit;opacity:.5">×</button>' +
        '</span>').join('')
      : '<span class="empty" style="padding:0">No device links yet. Make one and open it on the crew phone.</span>') + '</div>';

    /* Housekeeping. A face and a coordinate together are the most personal
       thing this site holds, and there is no reason to hold them once the
       month they belong to has been read and exported. The rows stay, so an
       old month still exports; only the pictures go. */
    h += '<div class="sec">Stored pictures</div>';
    h += '<div class="ctl"><select id="pold">' +
      [[30,'older than 30 days'],[60,'older than 60 days'],[90,'older than 90 days'],
       [365,'older than a year']].map(o =>
        '<option value="'+o[0]+'"'+(o[0]===OLD?' selected':'')+'>Pictures '+o[1]+'</option>').join('') +
      '</select><button class="btn" id="pclear" style="min-height:0;padding:9px 14px">' +
      (BUSY ? 'Working…' : 'Delete them') + '</button></div>';
    h += '<div class="foot"><span>Only the photograph goes. The time, the place, the device and the ' +
      'names ticked on it stay, so a month that has already been read still exports the same figures.</span></div>';
  }
  return h;
}
/* The crews do not sign in, so what ties a photograph to a phone is the
   device link the office issued: every record filed through it carries the
   device in its reference. Shown by label rather than by id, because
   "Janaka crew phone" is something somebody in the office can act on and
   d1 is not. A photo the office filed itself carries no device at all. */
function deviceOf(u){
  var m = /^D:([^:]+):/.exec(u.ref || '');
  if (!m) return u.ref || 'filed from the office';
  var d = DEVICES.find(function(x){ return x.id === m[1]; });
  return d ? (d.label || d.id) : 'a device link that has since been dropped';
}
function tile(k, v, colour){
  return '<div class="tile"><div class="k">'+esc(k)+'</div>' +
    '<div class="v"' + (colour ? ' style="color:'+colour+'"' : '') + '>'+esc(v)+'</div></div>';
}

function wireOffice(sheet, late){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab; BELL = false; paint();
  });
  /* jumping from the bell to the photograph it is about */
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    const id = b.dataset.goto;
    BELL = false; TAB = 'day'; paint();
    const card = document.querySelector('[data-u="' + CSS.escape(id) + '"]');
    if (card) card.closest('.up').scrollIntoView({ behavior:'smooth', block:'center' });
  });
  const sw1 = $('swSound');
  if (sw1) sw1.onchange = () => { SOUND = sw1.checked; setPref('sound', SOUND);
    if (SOUND) chime(); toast(SOUND ? 'Sound on' : 'Sound off'); };
  const sw2 = $('swDesk');
  if (sw2) sw2.onchange = async () => {
    if (!sw2.checked){ DESKTOP = false; setPref('desktop', false); toast('Desktop notifications off'); return; }
    if (!('Notification' in window)){ sw2.checked = false; toast('This browser has no desktop notifications', 4000); return; }
    /* asked from inside the click, because that is the only place a browser
       will entertain the question */
    let ok = Notification.permission;
    if (ok !== 'granted') { try { ok = await Notification.requestPermission(); } catch(e){ ok = 'denied'; } }
    DESKTOP = ok === 'granted'; setPref('desktop', DESKTOP); sw2.checked = DESKTOP;
    toast(DESKTOP ? 'Desktop notifications on' :
      'The browser refused – allow notifications for this site in its address bar', 6000);
  };

  const lw = $('lvWho'); if (lw) lw.onchange = () => { LV_WHO = lw.value; };
  const lf = $('lvFrom'); if (lf) lf.onchange = () => {
    LV_FROM = lf.value; if (!LV_TO || LV_TO < LV_FROM) LV_TO = LV_FROM; paint(); };
  const lt = $('lvTo'); if (lt) lt.onchange = () => { LV_TO = lt.value; paint(); };
  const ln = $('lvNote'); if (ln) ln.oninput = () => { LV_NOTE = ln.value; };
  const la = $('lvAdd');
  if (la) la.onclick = async () => {
    const who = (lw && lw.value) || (PEOPLE[0] && PEOPLE[0].id);
    if (!who){ toast('Nobody on the roster yet'); return; }
    const days = A.dayRange(lf ? lf.value : LV_FROM, lt ? lt.value : LV_TO);
    if (!days.length){ toast('Pick a date'); return; }
    const name = (PEOPLE.find(p => p.id === who) || {}).name || 'They';
    try {
      await window.DB.attendSetLeaveRange(days, who, ln ? ln.value : LV_NOTE);
      LV_NOTE = ''; await refresh();
      toast(name + ' is marked off for ' + days.length + (days.length>1 ? ' days' : ' day'));
    } catch (e){ toast(e.message, 5000); }
  };
  document.querySelectorAll('[data-lvdrop]').forEach(b => b.onclick = async () => {
    const parts = b.dataset.lvdrop.split('|');
    try { await window.DB.attendClearLeaveRange(parts[1].split(','), parts[0]);
      await refresh(); toast('Leave taken off'); }
    catch (e){ toast(e.message, 5000); }
  });

  const sel = $('day'); if (sel) sel.onchange = () => { DAY = sel.value; refresh(); };
  const sc = $('xscope'); if (sc) sc.onchange = () => {
    XSCOPE = sc.value;
    if (XSCOPE === 'person' && !XWHO && PEOPLE.length) XWHO = PEOPLE[0].id;
    paint();
  };
  const mo = $('xmonth'); if (mo) mo.onchange = () => { XMONTH = mo.value || XMONTH; };
  const wh = $('xwho'); if (wh) wh.onchange = () => { XWHO = wh.value; };
  const x = $('xls'); if (x) x.onclick = () => exportXlsx(sheet, late);

  document.querySelectorAll('[data-delpic]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.delpic);
    const n = rec ? (rec.members || []).length : 0;
    const when = rec ? A.fmt(rec.ts) : 'this';
    const ok = await ask([
      { title: 'Delete the picture from the ' + when + ' photo?',
        body: 'The photograph is the evidence behind this row. Deleting it is not the same as ' +
              'deleting the record, and there is a second question after this one.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'The row stays. Only the face goes.',
        body: 'The time, the place, the device it came from and the ' + plural(n, 'name') +
              ' ticked on it all stay, so the sheet for this day does not change. ' +
              'The photograph itself does not come back.',
        no: 'No, keep the picture', yes: 'Delete the picture' }
    ]);
    if (!ok) return;
    try { await window.DB.attendClearPhoto(b.dataset.delpic); await refresh(); toast('The picture is gone'); }
    catch (e){ toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-delrec]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.delrec);
    const on = rec ? (rec.members || []) : [];
    const names = on.map(id => (PEOPLE.find(p => p.id === id) || {}).name).filter(Boolean);
    const kind = rec && rec.kind === 'out' ? 'clock-out' : 'clock-in';
    const ok = await ask([
      { title: 'Delete the ' + (rec ? A.fmt(rec.ts) : '') + ' ' + kind + ' altogether?',
        body: 'This removes the whole record – the photograph, the time, the place and every ' +
              'name ticked on it. It is the one to use for a photo that should never have been filed.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: !names.length ? 'Nothing is ticked on it'
                : names.length === 1 ? 'One name comes off this day'
                : names.length + ' names come off this day',
        body: (names.length
                ? names.join(', ') + (names.length > 1 ? ' lose their ' : ' loses their ') + kind +
                  ' for ' + new Date(DAY + 'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'long'}) +
                  ', and the sheet will recount without it. '
                : 'No names are ticked on this photo, so no row on the sheet changes. ') +
              'There is no undo.',
        no: 'No, keep the record', yes: 'Delete the record' }
    ]);
    if (!ok) return;
    try { await window.DB.attendDropRecord(b.dataset.delrec); await refresh(); toast('Record deleted'); }
    catch (e){ toast(e.message, 5000); }
  });
  const po = $('pold'); if (po) po.onchange = () => { OLD = parseInt(po.value, 10) || 90; };
  const pc = $('pclear');
  if (pc) pc.onclick = async () => {
    const cut = new Date(); cut.setDate(cut.getDate() - OLD);
    const cutDay = A.dstr(cut);
    const pretty = new Date(cutDay + 'T12:00:00')
      .toLocaleDateString(undefined, { day:'numeric', month:'long', year:'numeric' });
    const ok = await ask([
      { title: 'Delete every picture filed before ' + pretty + '?',
        body: 'This is the only control here that reaches days you are not looking at, and it ' +
              'reaches all of them at once. There is a second question after this one.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Every face older than ' + OLD + ' days, in one go.',
        body: 'The records stay – times, places, devices and names – so every old month still ' +
              'exports exactly the same figures. The photographs are deleted from the database ' +
              'and there is no copy of them anywhere else.',
        no: 'No, leave them', yes: 'Delete the pictures' }
    ]);
    if (!ok) return;
    BUSY = true; paint();
    try { const n = await window.DB.attendClearBefore(cutDay);
      BUSY = false; await refresh();
      toast(n ? n + ' picture' + (n>1?'s':'') + ' deleted' : 'There were none that old', 4000); }
    catch (e){ BUSY = false; paint(); toast(e.message, 5000); }
  };

  document.querySelectorAll('.chip[data-u]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.u); if (!rec) return;
    const next = A.toggleMember(rec, b.dataset.p);
    RECS = RECS.map(r => r.id === rec.id ? next : r);
    paint();
    try { await window.DB.attendName(rec.id, next.members); }
    catch (e){ RECS = RECS.map(r => r.id === rec.id ? rec : r); paint(); toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.clear); if (!rec) return;
    const next = Object.assign({}, rec, { members: [] });
    RECS = RECS.map(r => r.id === rec.id ? next : r); paint();
    try { await window.DB.attendName(rec.id, []); }
    catch (e){ RECS = RECS.map(r => r.id === rec.id ? rec : r); paint(); toast(e.message, 5000); }
  });
  const add = $('padd');
  if (add) add.onclick = async () => {
    const p = A.cleanPerson({ name: $('pn').value, role: $('pr').value, sort: PEOPLE.length + 1 });
    if (!p){ toast('A name, at least'); return; }
    try { await window.DB.attendAddPerson(p); $('pn').value=''; $('pr').value='';
      await refresh(); toast(p.name + ' is on the roster'); }
    catch (e){ toast(e.message, 5000); }
  };
  document.querySelectorAll('[data-lv]').forEach(b => b.onclick = async () => {
    const on = b.dataset.on !== '1';
    const note = on ? (prompt('A note, if there is one (optional)') || '') : '';
    try { await window.DB.attendSetLeave(DAY, b.dataset.lv, on, note); await refresh();
      toast(on ? 'Marked on leave' : 'Leave taken off'); }
    catch (e){ toast(e.message, 5000); }
  });
  const dadd = $('dadd');
  if (dadd) dadd.onclick = async () => {
    try { MADE = await window.DB.attendMakeDevice($('dl').value.trim());
      $('dl').value = ''; await refresh(); toast('Link made. Copy it now – it is shown in full once.', 6000); }
    catch (e){ toast(e.message, 5000); }
  };
  const dcopy = $('dcopy');
  if (dcopy) dcopy.onclick = () => {
    const url = $('madeurl').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
      .then(() => toast('Link copied')).catch(() => toast('Select it and copy by hand'));
  };
  document.querySelectorAll('[data-dd]').forEach(b => b.onclick = async () => {
    const d = DEVICES.find(x => x.id === b.dataset.dd) || {};
    const label = d.label || d.id || 'this phone';
    const ok = await ask([
      { title: 'Stop the ' + label + ' link working?',
        body: 'This is the link saved on that phone. Do it if the phone is lost, or if it should ' +
              'no longer be able to file attendance.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'That phone stops filing immediately.',
        body: 'Whoever is holding it cannot clock anybody in until you make a new link and set it ' +
              'up on the phone again – this one cannot be switched back on. Photos it has already ' +
              'filed stay exactly where they are.',
        no: 'No, keep it working', yes: 'Stop the link' }
    ]);
    if (!ok) return;
    try { await window.DB.attendDropDevice(b.dataset.dd); MADE = null; await refresh();
      toast('That link no longer works'); }
    catch (e){ toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const p = PEOPLE.find(x => x.id === b.dataset.rm) || {};
    const name = p.name || 'this person';
    /* Counted rather than guessed at, because "they are in 34 photographs" is
       the fact that decides whether somebody goes through with this. */
    const seen = RECS.filter(r => (r.members || []).indexOf(b.dataset.rm) > -1).length;
    const ok = await ask([
      { title: 'Take ' + name + ' off the roster?',
        body: 'They stop appearing on the attendance sheet from today onward, and cannot be ticked ' +
              'in new photographs.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Nothing already recorded is lost.',
        body: name + ' is marked away rather than deleted – every past sheet still counts them' +
              (seen ? ', including the ' + plural(seen, 'photograph') + ' they are named in on this day' : '') +
              '. Adding the same name again later starts a new person, so their history would not ' +
              'come back with it.',
        no: 'No, leave them on', yes: 'Take ' + name + ' off' }
    ]);
    if (!ok) return;
    try { await window.DB.attendRemovePerson(b.dataset.rm); await refresh(); toast('Taken off the roster'); }
    catch (e){ toast(e.message, 5000); }
  });
}

/* One writer for all three shapes, because a title line, a note line and a
   frozen heading row are what makes any of them readable, and three copies of
   that would drift apart. */
function writeXlsx(x, cols, tab, file){
  const aoa = [[x.title], [x.note], [], x.head].concat(x.rows);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = cols;
  const wide = { s:{r:0,c:0}, e:{r:0,c:Math.max(1, x.head.length - 1)} };
  ws['!merges'] = [wide, { s:{r:1,c:0}, e:{r:1,c:wide.e.c} }];
  ws['!freeze'] = { ySplit: 4 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tab);
  XLSX.writeFile(wb, file);
}

async function exportXlsx(sheet, late){
  if (!window.XLSX){ toast('The spreadsheet library is still loading'); return; }

  if (XSCOPE === 'day'){
    const x = A.exportRows(sheet, DAY, late);
    writeXlsx(x, [{wch:22},{wch:16},{wch:11},{wch:22},{wch:11},{wch:22},{wch:8},{wch:14}],
      'Attendance', 'Attendance ' + DAY + '.xlsx');
    return;
  }

  /* A month is not on screen, so it is fetched - without the photographs,
     which the spreadsheet has no use for and which would be tens of
     megabytes of them. */
  /* Both ends counted, never assumed. A range that ends on the 31st of a
     30-day month is not a range with a late row in it - Postgres throws the
     whole query out as a date out of range, and the export simply fails. */
  const ym = XMONTH, from = A.monthStart(ym), to = A.monthEnd(ym);
  if (!from || !to){ toast('Pick a month'); return; }
  BUSY = true; paint();
  let r, l;
  try { [r, l] = await Promise.all([window.DB.attendRange(from, to), window.DB.attendLeaveRange(from, to)]); }
  catch (e){ BUSY = false; paint(); toast(e.message, 5000); return; }
  BUSY = false; paint();
  if (r.error){ toast(r.error, 5000); return; }

  const today = A.dstr(new Date());
  if (XSCOPE === 'month'){
    if (!PEOPLE.length){ toast('Nobody on the roster yet'); return; }
    const x = A.monthTeamRows(PEOPLE, r.records, l.leave || [], ym, late, today);
    const cols = [{wch:22},{wch:14}].concat(
      new Array(x.days).fill({wch:5}), [{wch:9},{wch:7},{wch:10},{wch:8},{wch:9}]);
    writeXlsx(x, cols, 'The month', 'Attendance – team – ' + ym + '.xlsx');
    return;
  }

  const who = PEOPLE.find(p => p.id === XWHO) || PEOPLE[0];
  if (!who){ toast('Nobody on the roster yet'); return; }
  const x = A.monthPersonRows(who, r.records, l.leave || [], ym, late, today);
  writeXlsx(x, [{wch:12},{wch:6},{wch:11},{wch:22},{wch:11},{wch:22},{wch:8},{wch:15},{wch:24}],
    'The month', 'Attendance – ' + who.name + ' – ' + ym + '.xlsx');
}

/* ------------------------------------------------------------------ wiring */
function paint(){ renderHead(); renderOffice(); }

async function refresh(){
  const today = A.dstr(new Date());
  /* leave for the days to come, which is a different question from leave on
     the day being read: sixty days is far enough ahead to plan and near enough
     that the list stays a list */
  const ahead = A.dstr(new Date(Date.now() + 60 * 86400000));
  const [p, r, d, l, a] = await Promise.all([
    window.DB.attendPeople(), window.DB.attendDay(DAY), window.DB.attendDevices(),
    window.DB.attendLeave(DAY), window.DB.attendLeaveRange(today, ahead)
  ]);
  ERR = p.error || r.error || '';
  PEOPLE = A.sortPeople(p.people || []);
  RECS = r.records || [];
  DEVICES = d.devices || [];
  LEAVE = l.leave || [];
  AHEAD = a.leave || [];

  /* An arrival is an id that was not here a moment ago. SEEN is null on the
     first load, so opening the page is not itself news. */
  const ids = RECS.map(x => x.id);
  if (SEEN){
    const fresh = ids.filter(id => SEEN.indexOf(id) < 0);
    if (fresh.length) arrived(fresh.length, DAY);
  }
  SEEN = ids;
  paint();
}

paint();
refresh();
/* Realtime tells us the moment a photograph lands. The diff above catches it
   when it is on the day being read; this catches the other case - a photo
   filed today while somebody is looking back at last Tuesday - which no
   refresh of the current day would ever show. */
window.DB.attendSubscribe(p => {
  const isNew = p && p.eventType === 'INSERT';
  const day = p && p.new && p.new.day;
  if (isNew && day && day !== DAY) arrived(1, day);
  refresh();
});
})();
