/* The device links. A crew phone opens /attendance/ with its token in the
   address and files a photograph; it cannot read a record, a name or another
   device. The token is shown in full when it is made and abbreviated after,
   because it is a credential and a screen in an office is not private.

   Its own tab, and the housekeeping with it: making a credential and deleting
   photographs are both things to arrive at deliberately, not to scroll past
   on the way to the morning's sheet. */
function viewLinks(){
  /* One link. Everybody opens the same one and picks their name, so there is
     nothing here to make a grid of: one panel, the link, a code to point a
     camera at, and the two things that can be done to it.

     The link is a capability - whoever holds it can file attendance as anyone
     on the roster. It is shown as text here because this screen is behind the
     owner's sign-in and the office has to be able to read it out. It is not
     sent anywhere from this page: there is no share button, because a link in
     a group chat stays in that chat forever and stays on the phone of
     everybody who ever leaves. The QR is how it gets onto a phone - printed
     and stuck on the office wall, which reaches the people standing in the
     office and nobody else. */
  const live = DEVICES.filter(d => d.active !== false);
  const one = MADE || live.slice().sort((x, y) =>
    String(y.last_used || '').localeCompare(String(x.last_used || '')))[0] || null;

  let h = '<div class="lk-head"><div><h2 class="lg-t">Mobile links</h2>' +
    '<p class="lk-sub">One link for the whole team. Everybody opens it, picks their own name ' +
    'and clocks in. It files photographs and can read nothing else &#8211; not the sheet, ' +
    'not a record, not another day.</p></div></div>';

  if (!one){
    h += '<div class="lk-panel"><div class="empty" style="padding:26px 4px">' +
      'No link yet.' + (window.CAN_EDIT ? ' Make one and print the code for the office wall.' : '') +
      '</div>' +
      (window.CAN_EDIT ? '<div class="lk-acts"><button class="lk-btn go" id="dadd">Make the link</button></div>' : '') +
      '</div>';
    return h + housekeeping();
  }

  const url = location.origin + '/attendance/clock/?d=' + one.token;
  const qr = (window.QR && window.QR.svg)
    ? window.QR.svg(url, { dark: '#0d0a0c', light: '#ffffff', quiet: 3,
                           label: 'Point the phone camera here' })
    : '<div class="lk-noqr">No code</div>';

  h += '<div class="lk-panel">' +
    '<div class="lk-qr">' + qr + '</div>' +
    '<div class="lk-side">' +
      '<div class="lk-lab">The link</div>' +
      '<div class="url" id="theurl">' + esc(url) + '</div>' +
      '<div class="lk-when">' + (one.last_used
        ? 'Last used ' + esc(fmtD(String(one.last_used).slice(0, 10)))
        : 'Not used since it was last issued') + '</div>' +
      (window.CAN_EDIT
        ? '<div class="lk-acts"><button class="lk-btn go" id="dcopy">Copy link</button>' +
          '<button class="lk-btn warn" id="drot">Rotate link</button></div>' +
          '<p class="lk-note">Rotating issues a new link and stops the old one immediately. ' +
          'It is how somebody who has left loses access &#8211; and it means every phone on ' +
          'the team has to open the new link again. Clock-ins already filed are not touched.</p>'
        : '<div class="lk-acts"><button class="lk-btn go" id="dcopy">Copy link</button></div>') +
    '</div></div>';

  /* More than one live token when the model says there is one is worth saying
     out loud: each of the others is a way in that nobody is watching. */
  const extra = live.filter(d => d.id !== one.id);
  if (extra.length){
    h += '<div class="lk-warn"><b>' + plural(extra.length, 'other link is', 'other links are') +
      ' still live.</b> This tool expects one. Each of these still works and rotating the link ' +
      'above will not touch them.' +
      '<div class="lk-extras">' + extra.map(d =>
        '<span class="lk-ex">' + esc(d.label || d.id) +
        '<span class="lk-tail">ends ' + esc(String(d.token).slice(-6)) + '</span>' +
        (window.CAN_EDIT ? '<button class="link" data-dd="' + esc(d.id) + '">stop it</button>' : '') +
        '</span>').join('') + '</div></div>';
  }
  return h + housekeeping();
}

/* Housekeeping. A face and a coordinate together are the most personal thing
   this site holds, and there is no reason to hold them once the month they
   belong to has been read and exported. The rows stay, so an old month still
   exports; only the pictures go. */
function housekeeping(){
  let h = '<div class="sec">Stored pictures</div>';
  h += '<div class="ctl"><select id="pold">' +
    [[30,'older than 30 days'],[60,'older than 60 days'],[90,'older than 90 days'],
     [365,'older than a year']].map(o =>
      '<option value="'+o[0]+'"'+(o[0]===OLD?' selected':'')+'>Pictures '+o[1]+'</option>').join('') +
    '</select><button class="btn" id="pclear" style="min-height:0;padding:9px 14px">' +
    (BUSY ? 'Working\u2026' : 'Delete them') + '</button></div>';
  h += '<div class="foot"><span>Only the photograph goes. The time, the place, the device and the ' +
    'names ticked on it stay, so a month that has already been read still exports the same figures.</span></div>';
  return h;
}
/* The crews do not sign in, so what ties a photograph to a phone is the
   device link the office issued: every record filed through it carries the
   device in its reference. Shown by label rather than by id, because
   "Janaka crew phone" is something somebody in the office can act on and
   d1 is not. A photo the office filed itself carries no device at all. */
function deviceOf(u){
  var t = /^M:(.*)$/.exec(u.ref || '');
  if (t) return 'entered by ' + (t[1] || 'the office');
  var m = /^D:([^:]+):/.exec(u.ref || '');
  if (!m) return u.ref || 'filed from the office';
  var d = DEVICES.find(function(x){ return x.id === m[1]; });
  return d ? (d.label || d.id) : 'a device link that has since been dropped';
}
function tile(k, v, colour){
  return '<div class="tile"><div class="k">'+esc(k)+'</div>' +
    '<div class="v"' + (colour ? ' style="color:'+colour+'"' : '') + '>'+esc(v)+'</div></div>';
}

function wireOffice(sheet, late){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab; BELL = false; paint();
    /* the month is only fetched when somebody asks to see it */
    if (TAB === 'dash' || TAB === 'leave') loadDash();
  });
  /* the month view's own controls */
  document.querySelectorAll('[data-mon]').forEach(b => b.onclick = () => shiftMonth(+b.dataset.mon));
  document.querySelectorAll('[data-shape]').forEach(b => b.onclick = () => {
    DSHAPE = b.dataset.shape; paint();
  });
  /* jumping from the bell to the photograph it is about */
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    const id = b.dataset.goto;
    BELL = false; TAB = 'day'; paint();
    const card = document.querySelector('[data-u="' + CSS.escape(id) + '"]');
    if (card) card.closest('.up').scrollIntoView({ behavior:'smooth', block:'center' });
  });
  const sw1 = $('swSound');
  if (sw1) sw1.onchange = () => { SOUND = sw1.checked; setPref('sound', SOUND);
    if (SOUND) chime(); toast(SOUND ? 'Sound on' : 'Sound off'); };
  const sw2 = $('swDesk');
  if (sw2) sw2.onchange = async () => {
    if (!sw2.checked){ DESKTOP = false; setPref('desktop', false); toast('Desktop notifications off'); return; }
    if (!('Notification' in window)){ sw2.checked = false; toast('This browser has no desktop notifications', 4000); return; }
    /* asked from inside the click, because that is the only place a browser
       will entertain the question */
    let ok = Notification.permission;
    if (ok !== 'granted') { try { ok = await Notification.requestPermission(); } catch(e){ ok = 'denied'; } }
    DESKTOP = ok === 'granted'; setPref('desktop', DESKTOP); sw2.checked = DESKTOP;
    toast(DESKTOP ? 'Desktop notifications on' :
      'The browser refused – allow notifications for this site in its address bar', 6000);
  };

  const lw = $('lvWho'); if (lw) lw.onchange = () => { LV_WHO = lw.value; };
  const lf = $('lvFrom'); if (lf) lf.onchange = () => {
    LV_FROM = lf.value; if (!LV_TO || LV_TO < LV_FROM) LV_TO = LV_FROM; paint(); };
  const lt = $('lvTo'); if (lt) lt.onchange = () => { LV_TO = lt.value; paint(); };
  const ln = $('lvNote'); if (ln) ln.oninput = () => { LV_NOTE = ln.value; };
  const la = $('lvAdd');
  if (la) la.onclick = async () => {
    const who = (lw && lw.value) || (PEOPLE[0] && PEOPLE[0].id);
    if (!who){ toast('Nobody on the roster yet'); return; }
    const days = A.dayRange(lf ? lf.value : LV_FROM, lt ? lt.value : LV_TO);
    if (!days.length){ toast('Pick a date'); return; }
    const name = (PEOPLE.find(p => p.id === who) || {}).name || 'They';
    try {
      await window.DB.attendSetLeaveRange(days, who, ln ? ln.value : LV_NOTE, LVTYPE);
      LV_NOTE = ''; await leaveChanged();
      toast(name + ' is marked off for ' + days.length + (days.length>1 ? ' days' : ' day'));
    } catch (e){ toast(e.message, 5000); }
  };
  document.querySelectorAll('[data-lvdrop]').forEach(b => b.onclick = async () => {
    const parts = b.dataset.lvdrop.split('|');
    const lname = (PEOPLE.find(p => p.id === parts[0]) || {}).name || 'this person';
    const ndays = parts[1] ? parts[1].split(',').length : 0;
    const ok = await ask([
      { title: 'Take ' + lname + '’s leave off?',
        body: plural(ndays, 'day') + ' of leave are recorded here.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Those days count as absent again.',
        body: 'Unless a photograph or a typed time covers them, the sheet shows ' + lname + ' as not there.',
        no: 'No, keep the leave', yes: 'Take it off' }
    ]);
    if (!ok) return;
    try { await window.DB.attendClearLeaveRange(parts[1].split(','), parts[0]);
      await refresh(); toast('Leave taken off'); }
    catch (e){ toast(e.message, 5000); }
  });

  /* A time the office enters, for the days no photograph came. */
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
    const p = PEOPLE.find(x => x.id === b.dataset.add) || {};
    const kind = b.dataset.kind;
    const now = new Date();
    const at = await askTime(
      (kind === 'in' ? 'Clock ' : 'Clock ') + kind + ' – ' + (p.name || ''),
      'No photograph came for this, so the time is yours. It counts on the sheet exactly like a ' +
      'photographed one, and the row will say it was typed.',
      A.pad(now.getHours()) + ':' + A.pad(now.getMinutes()));
    if (!at) return;
    /* signed by whoever entered it, so a disputed row names a person rather
       than "the office" - the same way a photographed one names a phone */
    const by = (window.Access && Access.currentUser && Access.currentUser()) || 'office';
    try { await window.DB.attendManual(DAY, kind, b.dataset.add, at, by);
      await refresh(); toast(p.name + ' – ' + kind + ' at ' + at); }
    catch (e){ toast(e.message, 5000); }
  });
  /* and undoing one. Asked twice either way: a typed entry is not evidence,
     but taking it off still changes somebody's day on the sheet. */
  document.querySelectorAll('[data-untime]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.untime);
    const typed = rec && /^M:/.test(rec.ref || '');
    const ok = typed
      ? await ask([
          { title: 'Take this entry off the sheet?',
            body: 'It was typed by the office, not photographed.',
            no: 'Cancel', yes: 'Yes, go on' },
          { title: 'The sheet recounts without it.',
            body: 'The day, the late mark and the hours for this person change straight away. It can be typed in again.',
            no: 'No, keep it', yes: 'Take it off' }
        ])
      : await ask([
          { title: 'This stamp came from a photograph.',
            body: 'Removing it here would delete the record and take every name ticked on that ' +
                  'photo with it. The photo itself is on this page, above the sheet.',
            no: 'Cancel', yes: 'I know, go on' },
          { title: 'The whole record goes, not just this row.',
            body: 'Anybody else named in the same photograph loses this stamp too. There is no undo.',
            no: 'No, keep it', yes: 'Delete the record' }
        ]);
    if (!ok) return;
    try { await window.DB.attendDropRecord(b.dataset.untime); await refresh(); toast('Taken off'); }
    catch (e){ toast(e.message, 5000); }
  });

  const sel = $('day'); if (sel) sel.onchange = () => { DAY = sel.value; refresh(); };
  const sc = $('xscope'); if (sc) sc.onchange = () => {
    XSCOPE = sc.value;
    if (XSCOPE === 'person' && !XWHO && PEOPLE.length) XWHO = PEOPLE[0].id;
    paint();
  };
  const mo = $('xmonth'); if (mo) mo.onchange = () => { XMONTH = mo.value || XMONTH; };
  const wh = $('xwho'); if (wh) wh.onchange = () => { XWHO = wh.value; };
  const x = $('xls'); if (x) x.onclick = () => exportXlsx(sheet, late);

  document.querySelectorAll('[data-delpic]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.delpic);
    const n = rec ? (rec.members || []).length : 0;
    const when = rec ? A.fmt(rec.ts) : 'this';
    const ok = await ask([
      { title: 'Delete the picture from the ' + when + ' photo?',
        body: 'The photograph is the evidence behind this row. Deleting it is not the same as ' +
              'deleting the record, and there is a second question after this one.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'The row stays. Only the face goes.',
        body: 'The time, the place, the device it came from and the ' + plural(n, 'name') +
              ' ticked on it all stay, so the sheet for this day does not change. ' +
              'The photograph itself does not come back.',
        no: 'No, keep the picture', yes: 'Delete the picture' }
    ]);
    if (!ok) return;
    try { await window.DB.attendClearPhoto(b.dataset.delpic); await refresh(); toast('The picture is gone'); }
    catch (e){ toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-delrec]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.delrec);
    const on = rec ? (rec.members || []) : [];
    const names = on.map(id => (PEOPLE.find(p => p.id === id) || {}).name).filter(Boolean);
    const kind = rec && rec.kind === 'out' ? 'clock-out' : 'clock-in';
    const ok = await ask([
      { title: 'Delete the ' + (rec ? A.fmt(rec.ts) : '') + ' ' + kind + ' altogether?',
        body: 'This removes the whole record – the photograph, the time, the place and every ' +
              'name ticked on it. It is the one to use for a photo that should never have been filed.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: !names.length ? 'Nothing is ticked on it'
                : names.length === 1 ? 'One name comes off this day'
                : names.length + ' names come off this day',
        body: (names.length
                ? names.join(', ') + (names.length > 1 ? ' lose their ' : ' loses their ') + kind +
                  ' for ' + new Date(DAY + 'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'long'}) +
                  ', and the sheet will recount without it. '
                : 'No names are ticked on this photo, so no row on the sheet changes. ') +
              'There is no undo.',
        no: 'No, keep the record', yes: 'Delete the record' }
    ]);
    if (!ok) return;
    try { await window.DB.attendDropRecord(b.dataset.delrec); await refresh(); toast('Record deleted'); }
    catch (e){ toast(e.message, 5000); }
  });
  const po = $('pold'); if (po) po.onchange = () => { OLD = parseInt(po.value, 10) || 90; };
  const pc = $('pclear');
  if (pc) pc.onclick = async () => {
    const cut = new Date(); cut.setDate(cut.getDate() - OLD);
    const cutDay = A.dstr(cut);
    const pretty = new Date(cutDay + 'T12:00:00')
      .toLocaleDateString(undefined, { day:'numeric', month:'long', year:'numeric' });
    const ok = await ask([
      { title: 'Delete every picture filed before ' + pretty + '?',
        body: 'This is the only control here that reaches days you are not looking at, and it ' +
              'reaches all of them at once. There is a second question after this one.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Every face older than ' + OLD + ' days, in one go.',
        body: 'The records stay – times, places, devices and names – so every old month still ' +
              'exports exactly the same figures. The photographs are deleted from the database ' +
              'and there is no copy of them anywhere else.',
        no: 'No, leave them', yes: 'Delete the pictures' }
    ]);
    if (!ok) return;
    BUSY = true; paint();
    try { const n = await window.DB.attendClearBefore(cutDay);
      BUSY = false; await refresh();
      toast(n ? n + ' picture' + (n>1?'s':'') + ' deleted' : 'There were none that old', 4000); }
    catch (e){ BUSY = false; paint(); toast(e.message, 5000); }
  };

  document.querySelectorAll('.chip[data-u]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.u); if (!rec) return;
    const next = A.toggleMember(rec, b.dataset.p);
    RECS = RECS.map(r => r.id === rec.id ? next : r);
    paint();
    try { await window.DB.attendName(rec.id, next.members); }
    catch (e){ RECS = RECS.map(r => r.id === rec.id ? rec : r); paint(); toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = async () => {
    const rec = RECS.find(r => r.id === b.dataset.clear); if (!rec) return;
    const nticked = (rec.members || []).length;
    if (nticked){
      const ok = await ask([
        { title: 'Untick everybody on this photo?',
          body: plural(nticked, 'name is', 'names are') + ' ticked on it now.',
          no: 'Cancel', yes: 'Yes, go on' },
        { title: 'They lose this stamp on the sheet.',
          body: 'The photograph stays. Each face has to be ticked again by hand to count.',
          no: 'No, leave them ticked', yes: 'Untick all' }
      ]);
      if (!ok) return;
    }
    const next = Object.assign({}, rec, { members: [] });
    RECS = RECS.map(r => r.id === rec.id ? next : r); paint();
    try { await window.DB.attendName(rec.id, []); }
    catch (e){ RECS = RECS.map(r => r.id === rec.id ? rec : r); paint(); toast(e.message, 5000); }
  });
  const add = $('padd');
  if (add) add.onclick = async () => {
    const val = id => { const el = $(id); return el ? el.value : ''; };
    const p = A.cleanPerson({ name: val('pn'), role: val('pr'), sort: PEOPLE.length + 1 });
    if (!p){ toast('A name, at least'); return; }
    /* crew, phone and site are optional and go in beside the name rather than
       in a second screen – four fields is not enough to make a form of. */
    /* A phone number is written a dozen ways here and none of them is wrong.
       It is kept as typed – stripping the hyphen out of 077-555 0101 only
       makes the office wonder what else the page has quietly changed. */
    p.crew = val('pc').trim(); p.site = val('ps').trim(); p.phone = val('pp').trim();
    try { await window.DB.attendAddPerson(p);
      ['pn','pr','pc','pp','ps'].forEach(id => { const el = $(id); if (el) el.value = ''; });
      await refresh(); toast(p.name + ' is on the roster'); }
    catch (e){ toast(e.message, 5000); }
  };
  /* the search box keeps the caret where it was: repainting the whole view on
     every keystroke would throw it back to the start of the word */
  const qb = $('q');
  if (qb) qb.oninput = () => {
    const at = qb.selectionStart; Q = qb.value; paint();
    const again = $('q');
    if (again){ again.focus(); try { again.setSelectionRange(at, at); } catch (e){} }
  };
  document.querySelectorAll('[data-day]').forEach(el => el.onclick = async () => {
    if (el.dataset.day === DAY) return;
    /* SEEN belongs to the day it was read on. Clearing it is what stops a
       different day's photographs being announced as ones that just landed. */
    DAY = el.dataset.day; SEEN = null;
    await refresh();
  });
  document.querySelectorAll('[data-role]').forEach(el => el.onclick = () => {
    ROLEF = ROLEF === el.dataset.role ? '' : el.dataset.role; paint();
  });
  document.querySelectorAll('[data-lvtype]').forEach(el => el.onclick = () => {
    LVTYPE = el.dataset.lvtype; paint();
  });
  document.querySelectorAll('[data-lvbook]').forEach(el => el.onclick = async () => {
    const booking = el.dataset.lvbook;
    const who = (PEOPLE.find(p => p.id === el.dataset.lvwho) || {}).name || 'this person';
    if (!booking){ toast('That leave has no booking on it – run migration 033.', 6000); return; }

    /* Asked of the table, not of the screen. The list holds one month and a
       booking may run past both ends of it, so the only number worth putting
       in front of somebody about to cancel is the one the table gives. */
    const got = await window.DB.attendBooking(booking);
    if (got.error){ toast('Could not read that booking: ' + got.error, 6000); return; }
    const days = got.days || [];
    if (!days.length){ await refresh(); toast('That leave is already gone'); return; }
    /* ask() writes text, not markup, so the dash is the character itself -
       an entity here reaches the screen spelled out as "&#8211;". */
    const span = days.length === 1 ? fmtD(days[0].day)
               : fmtD(days[0].day) + ' – ' + fmtD(days[days.length - 1].day);
    const crosses = String(days[0].day).slice(0, 7) !== String(days[days.length - 1].day).slice(0, 7);

    const ok = await ask([
      { title: 'Cancel leave for ' + who + ', ' + span + '?',
        body: plural(days.length, 'day comes', 'days come') + ' off' +
              (crosses ? ', across both months – including the days not shown on this list.' : '.'),
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Those days count as absent again.',
        body: 'Unless a photograph or a typed time covers each one, the sheet shows ' + who +
              ' as not there. The note on the leave is gone with it.',
        no: 'No, keep the leave', yes: 'Cancel the leave' }
    ]);
    if (!ok) return;
    try { await window.DB.attendClearBooking(booking); await leaveChanged();
      toast('Leave cancelled · ' + plural(days.length, 'day', 'days') + ' off'); }
    catch (e){ toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-lv]').forEach(b => b.onclick = async () => {
    const on = b.dataset.on !== '1';
    if (!on){
      const who = (PEOPLE.find(p => p.id === b.dataset.lv) || {}).name || 'this person';
      const ok = await ask([
        { title: 'Take ' + who + ' off leave for this day?',
          body: 'The leave mark and its note are removed.',
          no: 'Cancel', yes: 'Yes, go on' },
        { title: 'The day counts as absent again.',
          body: 'Unless a photograph or a typed time covers it, the sheet shows ' + who + ' as not there.',
          no: 'No, keep the leave', yes: 'Take it off' }
      ]);
      if (!ok) return;
    }
    const note = on ? (prompt('A note, if there is one (optional)') || '') : '';
    try { await window.DB.attendSetLeave(DAY, b.dataset.lv, on, note); await leaveChanged();
      toast(on ? 'Marked on leave' : 'Leave taken off'); }
    catch (e){ toast(e.message, 5000); }
  });
  const dadd = $('dadd');
  if (dadd) dadd.onclick = async () => {
    try { MADE = await window.DB.attendMakeDevice('Team link');
      await refresh(); toast('Link made. Print the code for the office wall.', 6000); }
    catch (e){ toast(e.message, 5000); }
  };

  /* Copying is the only way the link leaves this page under its own steam,
     and it goes straight to the clipboard. */
  const dcopy = $('dcopy');
  if (dcopy) dcopy.onclick = () => {
    const url = ($('theurl') || {}).textContent || '';
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
      .then(() => toast('Link copied'))
      .catch(() => toast('This browser would not copy it – select the link and copy it by hand.', 6000));
  };

  /* Rotating is the only revocation this tool has. There is one link and the
     whole team holds it, so taking it back from one person takes it back from
     all of them. That is not a thing to do by accident. */
  const drot = $('drot');
  if (drot) drot.onclick = async () => {
    const live = DEVICES.filter(d => d.active !== false);
    const one = MADE || live.slice().sort((x, y) =>
      String(y.last_used || '').localeCompare(String(x.last_used || '')))[0];
    if (!one){ toast('There is no link to rotate.'); return; }
    const n = PEOPLE.length;
    const ok = await ask([
      { title: 'Issue a new link and stop this one?',
        body: 'Do this when somebody has left the team, or if the link has gone somewhere it ' +
              'should not have. It is the only way to take access back.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Every phone will stop working and everyone must open the new link again.',
        body: 'The old link stops the moment you confirm – ' +
              (n ? 'all ' + n + ' people on the roster ' : 'everybody ') +
              'will find the clock app dead until they open the new one and add it to the home ' +
              'screen again. Clock-ins already recorded are not touched and nothing on any sheet ' +
              'changes. Have the new code ready to put up before you do this.',
        no: 'No, keep this link', yes: 'Rotate the link' }
    ]);
    if (!ok) return;
    try {
      const next = await window.DB.attendRotateDevice(one.id);
      MADE = null; await refresh();
      toast('New link issued. The old one has stopped – put the new code up.', 7000);
    } catch (e){ toast(e.message, 6000); }
  };
  document.querySelectorAll('[data-dd]').forEach(b => b.onclick = async () => {
    const d = DEVICES.find(x => x.id === b.dataset.dd) || {};
    const label = d.label || d.id || 'this phone';
    const ok = await ask([
      { title: 'Stop the ' + label + ' link working?',
        body: 'This is the link saved on that phone. Do it if the phone is lost, or if it should ' +
              'no longer be able to file attendance.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'That phone stops filing immediately.',
        body: 'Whoever is holding it cannot clock anybody in until you make a new link and set it ' +
              'up on the phone again – this one cannot be switched back on. Photos it has already ' +
              'filed stay exactly where they are.',
        no: 'No, keep it working', yes: 'Stop the link' }
    ]);
    if (!ok) return;
    try { await window.DB.attendDropDevice(b.dataset.dd); MADE = null; await refresh();
      toast('That link no longer works'); }
    catch (e){ toast(e.message, 5000); }
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const p = PEOPLE.find(x => x.id === b.dataset.rm) || {};
    const name = p.name || 'this person';
    /* Counted rather than guessed at, because "they are in 34 photographs" is
       the fact that decides whether somebody goes through with this. */
    const seen = RECS.filter(r => (r.members || []).indexOf(b.dataset.rm) > -1).length;
    const ok = await ask([
      { title: 'Take ' + name + ' off the roster?',
        body: 'They stop appearing on the attendance sheet from today onward, and cannot be ticked ' +
              'in new photographs.',
        no: 'Cancel', yes: 'Yes, go on' },
      { title: 'Nothing already recorded is lost.',
        body: name + ' is marked away rather than deleted – every past sheet still counts them' +
              (seen ? ', including the ' + plural(seen, 'photograph') + ' they are named in on this day' : '') +
              '. Adding the same name again later starts a new person, so their history would not ' +
              'come back with it.',
        no: 'No, leave them on', yes: 'Take ' + name + ' off' }
    ]);
    if (!ok) return;
    try { await window.DB.attendRemovePerson(b.dataset.rm); await refresh(); toast('Taken off the roster'); }
    catch (e){ toast(e.message, 5000); }
  });
}

/* One writer for all three shapes, because a title line, a note line and a
   frozen heading row are what makes any of them readable, and three copies of
   that would drift apart. */
function writeXlsx(x, cols, tab, file){
  const aoa = [[x.title], [x.note], [], x.head].concat(x.rows);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = cols;
  const wide = { s:{r:0,c:0}, e:{r:0,c:Math.max(1, x.head.length - 1)} };
  ws['!merges'] = [wide, { s:{r:1,c:0}, e:{r:1,c:wide.e.c} }];
  ws['!freeze'] = { ySplit: 4 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tab);
  XLSX.writeFile(wb, file);
}

async function exportXlsx(sheet, late){
  if (!window.XLSX){ toast('The spreadsheet library is still loading'); return; }

  if (XSCOPE === 'day'){
    const x = A.exportRows(sheet, DAY, late);
    writeXlsx(x, [{wch:22},{wch:16},{wch:11},{wch:22},{wch:11},{wch:22},{wch:8},{wch:14}],
      'Attendance', 'Attendance ' + DAY + '.xlsx');
    return;
  }

  /* A month is not on screen, so it is fetched - without the photographs,
     which the spreadsheet has no use for and which would be tens of
     megabytes of them. */
  /* Both ends counted, never assumed. A range that ends on the 31st of a
     30-day month is not a range with a late row in it - Postgres throws the
     whole query out as a date out of range, and the export simply fails. */
  const ym = XMONTH, from = A.monthStart(ym), to = A.monthEnd(ym);
  if (!from || !to){ toast('Pick a month'); return; }
  BUSY = true; paint();
  let r, l;
  try { [r, l] = await Promise.all([window.DB.attendRange(from, to), window.DB.attendLeaveRange(from, to)]); }
  catch (e){ BUSY = false; paint(); toast(e.message, 5000); return; }
  BUSY = false; paint();
  if (r.error){ toast(r.error, 5000); return; }

  const today = A.dstr(new Date());
  if (XSCOPE === 'month'){
    if (!PEOPLE.length){ toast('Nobody on the roster yet'); return; }
    const x = A.monthTeamRows(PEOPLE, r.records, l.leave || [], ym, late, today);
    const cols = [{wch:22},{wch:14}].concat(
      new Array(x.days).fill({wch:5}), [{wch:9},{wch:7},{wch:10},{wch:8},{wch:9}]);
    writeXlsx(x, cols, 'The month', 'Attendance – team – ' + ym + '.xlsx');
    return;
  }

  const who = PEOPLE.find(p => p.id === XWHO) || PEOPLE[0];
  if (!who){ toast('Nobody on the roster yet'); return; }
  const x = A.monthPersonRows(who, r.records, l.leave || [], ym, late, today);
  writeXlsx(x, [{wch:12},{wch:6},{wch:11},{wch:22},{wch:11},{wch:22},{wch:8},{wch:15},{wch:24}],
    'The month', 'Attendance – ' + who.name + ' – ' + ym + '.xlsx');
}

/* ------------------------------------------------------------------ wiring */
function paint(){ renderHead(); renderOffice(); }

async function refresh(){
  const today = A.dstr(new Date());
  /* leave for the days to come, which is a different question from leave on
     the day being read: sixty days is far enough ahead to plan and near enough
     that the list stays a list */
  const ahead = A.dstr(new Date(Date.now() + 60 * 86400000));
  const [p, r, d, l, a, si] = await Promise.all([
    window.DB.attendPeople(), window.DB.attendDay(DAY), window.DB.attendDevices(),
    window.DB.attendLeave(DAY), window.DB.attendLeaveRange(today, ahead),
    window.DB.attendSites()
  ]);
  ERR = p.error || r.error || '';
  PEOPLE = A.sortPeople(p.people || []);
  RECS = r.records || [];
  DEVICES = d.devices || [];
  LEAVE = l.leave || [];
  AHEAD = a.leave || [];
  SITES = si.sites || [];

  /* The true first and last day of every booking on screen. Without it the
     list can only draw the part of a booking that falls inside the month. */
  const bks = [];
  LEAVE.concat(AHEAD).forEach(l => { if (l.booking && bks.indexOf(l.booking) < 0) bks.push(l.booking); });
  LVSPAN = bks.length ? (await window.DB.attendBookingSpans(bks)).spans || {} : {};

  /* An arrival is an id that was not here a moment ago. SEEN is null on the
     first load, so opening the page is not itself news. */
  const ids = RECS.map(x => x.id);
  if (SEEN){
    const fresh = ids.filter(id => SEEN.indexOf(id) < 0);
    if (fresh.length) arrived(fresh.length, DAY);
  }
  SEEN = ids;
  paint();
  /* The month opens on the month, so it has to fetch itself rather than
     wait for a tab to be clicked - and it needs PEOPLE, which is why it is
     asked for here and not at boot. */
  if (TAB === 'dash' || TAB === 'leave') loadDash();
}

/* The clock ticks by writing into the one element, not by painting the page:
   a repaint every second would close a dialog, drop a half-typed name and
   fight whatever the cursor is over. It also notices midnight, when the sheet
   on screen quietly stops being today's. */
setInterval(() => {
  const el = $('clock');
  if (el) el.textContent = new Date().toLocaleTimeString(undefined,
    { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  const today = A.dstr(new Date());
  if (DAY !== today && el){ DAY = today; refresh(); }   // only when it was today a moment ago
}, 1000);

paint();
refresh();
/* Realtime tells us the moment a photograph lands. The diff above catches it
   when it is on the day being read; this catches the other case - a photo
   filed today while somebody is looking back at last Tuesday - which no
   refresh of the current day would ever show. */
window.DB.attendSubscribe(p => {
  const isNew = p && p.eventType === 'INSERT';
  const day = p && p.new && p.new.day;
  if (isNew && day && day !== DAY) arrived(1, day);
  refresh();
});
})();
</script>
