<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1619">
<title>Daily Attendance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emortia">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_lib/theme.css">
<script src="../_lib/theme.js" defer></script>
<script src="../_lib/owner-config.js"></script>
<script src="../_lib/owner.js"></script>
<script src="../_lib/supabase-config.js"></script>
<script src="../_lib/db.js"></script>
<script src="../_lib/access-config.js"></script>
<script src="../_lib/access.js"></script>
<!-- The QR codes are drawn here rather than fetched from a drawing service:
     a device link is a capability, and handing it to somebody else's server
     to render would put it in their logs. -->
<script src="../_lib/qr.js"></script>
<script>Access.protect({ feature: 'tool:attendance' });</script>
<script src="attendance.js"></script>
<style>
  /* Indigo. The one accent left unspoken for: the lookups are teal, the field
     reference amber, the material list green. Only the accent is this tool's
     own; the rest is theme.css, like every other tool. */
  :root,html[data-theme="dark"]{--accent:#6b7fd7;--accentB:#8b9cf0;--accentD:#4a5cae;
    --accent-ink:#0b0e1c;--glow:rgba(107,127,215,.5);--glowSoft:rgba(107,127,215,.24);
    --bad:#e2607a;--ok:#5fc189;--zebra:rgba(255,255,255,.02);--goHover:var(--accentB)}
  html[data-theme="light"]{--accent:#414f9c;--accentB:#4a5cae;--accentD:#2c3670;
    --accent-ink:#ffffff;--glow:rgba(65,79,156,.4);--glowSoft:rgba(65,79,156,.16);
    --bad:#c2405c;--ok:#217a4a;--zebra:rgba(0,0,0,.024);--goHover:#2c3670}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  ::selection{background:var(--glowSoft)}

  .hdr{display:flex;align-items:center;gap:10px;color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:var(--navy);position:sticky;top:0;z-index:20}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;font-size:0;padding:0;border:none}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px} .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px} .hdr .logo i:nth-child(4){height:13px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-.02em;color:#fff;white-space:nowrap}
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  .hdr h1{font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .theme{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;
    width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;flex-shrink:0}
  .seg{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:9px;overflow:hidden;flex-shrink:0}
  .seg button{font:inherit;font-size:12.5px;padding:6px 13px;border:0;cursor:pointer;
    background:transparent;color:#cfd6e6}
  .seg button + button{border-left:1px solid rgba(255,255,255,.22)}
  .seg button.on{background:#fff;color:var(--navy);font-weight:600}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }

  /* The bell sits in the header rather than in the tabs, because a photograph
     arriving is news wherever you happen to be looking. */
  .bell{position:relative;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;line-height:1;flex-shrink:0}
  .bell.on{background:#fff;color:var(--navy)}
  .bell .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;
    border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;
    font-family:'Space Mono',monospace}

  main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}

  /* One tab per thing the office does, because the day is read every morning
     and the other three are touched once a month between them. */
  /* ---- clock in and out ---- */
  .lg-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .lg-t{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
  .lg-sum{font-size:13px;color:var(--muted)}
  .lg-q{margin-left:auto;background:var(--card);border:1px solid var(--line3);border-radius:10px;
    padding:9px 12px;color:var(--text);font-size:14px;width:220px;outline:none}
  .lg-q:focus{border-color:var(--accent)}
  .lg-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .lg-day{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 12px;
    border-radius:12px;cursor:pointer;border:1px solid var(--line3);background:var(--card);color:var(--muted)}
  .lg-day .wd{font-size:10.5px;letter-spacing:.06em}
  .lg-day .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:var(--text)}
  .lg-day.on{background:var(--accent);border-color:var(--accent)}
  .lg-day.on .wd,.lg-day.on .n{color:var(--ink)}
  .lg-panel{padding:0;overflow:hidden}
  .lg-grid{min-width:1160px}
  .lg-hrow,.lg-row{display:grid;grid-template-columns:230px minmax(230px,1fr) minmax(230px,1fr) 70px 100px 150px;
    gap:12px;align-items:center;padding:11px 18px}
  .lg-hrow{border-bottom:1px solid var(--line);font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .lg-row{border-bottom:1px solid var(--line)}
  .lg-row:hover{background:rgba(var(--accentRGB,234,132,250),.04)}
  .lg-who{display:flex;align-items:center;gap:10px;min-width:0}
  .av{width:32px;height:32px;border-radius:50%;color:#130a12;font:700 11px/1 'Space Mono',monospace;
    display:flex;align-items:center;justify-content:center;flex:none}
  .av.lg{width:44px;height:44px;font-size:14px}
  .lg-who .nm,.tm-top .nm{display:flex;flex-direction:column;min-width:0}
  .lg-who .nm b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg-who .nm i{font-style:normal;font-size:11.5px;color:var(--muted)}
  .lg-when{display:flex;align-items:center;gap:10px;min-width:0}
  .lg-when .t{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;width:48px;flex:none}
  .lg-when .t.late{color:var(--warn)}
  .lg-geo{display:flex;flex-direction:column;min-width:0;color:var(--text);text-decoration:none}
  .lg-geo .pl{font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg-geo .pl i{font-style:normal;color:var(--muted)}
  .lg-geo .gg{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap}
  a.lg-geo:hover .pl{color:var(--accentB)}
  .lg-h{font-family:'Space Mono',monospace;font-size:13px}
  .lg-st{justify-self:start;white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
  .lg-st.ok{background:rgba(95,193,137,.14);color:var(--ok)}
  .lg-st.lt{background:rgba(242,184,75,.14);color:var(--warn)}
  .lg-st.os{background:rgba(95,193,137,.14);color:var(--ok)}
  .lg-st.ab{background:rgba(226,96,122,.14);color:var(--bad)}
  .lg-st.lv{background:rgba(226,96,122,.10);color:var(--bad)}
  .lg-ref{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}

  /* ---- leave ---- */
  .lv-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
  .lv-form{display:flex;flex-direction:column;gap:14px}
  .lv-h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px}
  .lv-p{font-size:13px;color:var(--muted);line-height:1.5}
  .lv-l{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  .lv-l input,.lv-l select{background:var(--card2);border:1px solid var(--line3);border-radius:10px;
    padding:10px 12px;color:var(--text);font-size:14px;color-scheme:dark;outline:none}
  .lv-l input:focus,.lv-l select:focus{border-color:var(--accent)}
  .lv-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lv-chips{display:flex;gap:6px;flex-wrap:wrap}
  .lv-chip,.tm-chip{flex:none;white-space:nowrap;padding:7px 12px;border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:600;border:1px solid var(--line3);background:transparent;color:var(--muted)}
  .lv-chip.on,.tm-chip.on{border-color:var(--accent);background:rgba(var(--accentRGB,234,132,250),.16);color:var(--accentB)}
  .lv-add{padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);
    font-weight:700;font-size:15px;cursor:pointer}
  .lv-add:hover{filter:brightness(1.08)}
  .lv-list{padding:0;overflow:hidden}
  .lv-lh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .lv-lh h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px}
  .lv-lh span{font-size:13px;color:var(--muted)}
  .lv-nav{display:flex;align-items:center;gap:10px}
  .lv-mon{width:28px;height:28px;border-radius:8px;border:1px solid var(--line3);background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .lv-mon:hover{border-color:var(--accent);color:var(--accentB)}
  .lv-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
  .lv-date{width:46px;flex:none;display:flex;flex-direction:column;align-items:center;border-radius:10px;
    border:1.5px solid var(--bad);background:repeating-linear-gradient(135deg,rgba(226,96,122,.18) 0 3px,transparent 3px 7px);padding:4px 0}
  .lv-date .m{font-size:10px;color:var(--bad);letter-spacing:.06em}
  .lv-date .d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;line-height:1.1}
  .lv-who{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .lv-who b{font-weight:600;font-size:14px}
  .lv-who i{font-style:normal;font-size:12.5px;color:var(--muted)}
  .lv-n{font-family:'Space Mono',monospace;font-size:12px;color:var(--bad)}
  .lv-x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line3);background:transparent;
    color:var(--muted);cursor:pointer;font-size:16px;flex:none}
  .lv-x:hover{border-color:var(--bad);color:var(--bad)}

  /* ---- team ---- */
  .tm-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .tm-chips{display:flex;gap:6px;flex-wrap:wrap}
  .tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .tm-card,.tm-new{background:var(--card);border:1px solid var(--line3);border-radius:16px;padding:16px;
    display:flex;flex-direction:column;gap:14px}
  .tm-new{border-style:dashed;justify-content:center}
  .tm-new b{font-weight:700;font-size:15px}
  .tm-new input{background:var(--card2);border:1px solid var(--line3);border-radius:10px;padding:10px 12px;
    color:var(--text);font-size:14px;outline:none;width:100%;box-sizing:border-box}
  .tm-new input:focus{border-color:var(--accent)}
  .tm-new .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tm-new button{padding:11px;border-radius:10px;border:1px solid var(--accent);background:transparent;
    color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
  .tm-new button:hover{background:rgba(var(--accentRGB,234,132,250),.10)}
  .tm-top{display:flex;align-items:center;gap:12px}
  .tm-top .nm b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm-top .nm i{font-style:normal;font-size:12px;color:var(--muted)}
  .tm-top .lg-st{margin-left:auto;font-size:11.5px}
  .tm-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:12.5px}
  .tm-fact{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden}
  .tm-fact.dim{color:var(--muted)}
  .tm-fact .mono{font-family:'Space Mono',monospace;font-size:11.5px}
  a.tm-fact:hover{border-color:var(--accent)}
  .tm-mon{display:flex;flex-direction:column;gap:6px}
  .tm-mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .tm-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
  .tm-nums{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .tm-nums b{color:var(--text)}
  .tm-nums b.w{color:var(--warn)}
  .tm-nums b.b{color:var(--bad)}
  .tm-rm{align-self:flex-start;font-size:12.5px}
  @media (max-width:640px){ .lg-q{margin-left:0;width:100%} }
  /* ---- mobile links ---- */
  .lk-head{margin-bottom:16px}
  .lk-sub{font-size:13px;color:var(--muted);line-height:1.55;max-width:60ch;margin-top:4px}
  .lk-panel{background:var(--card);border:1px solid var(--line3);border-radius:16px;padding:18px;
    display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .lk-qr{background:#fff;border-radius:12px;padding:10px;width:186px;flex:none}
  .lk-qr svg{width:100%;height:auto;display:block}
  .lk-noqr{width:100%;aspect-ratio:1;display:grid;place-items:center;color:#777;font-size:12px}
  .lk-side{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
  .lk-lab{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .lk-panel .url{font-family:'Space Mono',monospace;font-size:13px;word-break:break-all;
    line-height:1.55;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;user-select:all}
  .lk-when{font-size:12.5px;color:var(--muted)}
  .lk-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .lk-btn{font:inherit;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:10px;
    border:1px solid var(--line3);background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}
  .lk-btn.go{border-color:var(--accent);color:var(--accent)}
  .lk-btn.go:hover{background:rgba(var(--accentRGB,234,132,250),.10)}
  .lk-btn.warn{border-color:rgba(226,96,122,.45);color:var(--bad)}
  .lk-btn.warn:hover{background:rgba(226,96,122,.10);border-color:var(--bad)}
  .lk-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:4px;max-width:58ch}
  .lk-warn{margin-top:14px;border:1px solid rgba(242,184,75,.4);background:rgba(242,184,75,.06);
    border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.6;color:var(--muted)}
  .lk-warn b{color:var(--warn);font-weight:700}
  .lk-extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .lk-ex{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line3);
    border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text)}
  .lk-tail{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim)}
  @media (max-width:560px){ .lk-qr{width:100%;max-width:240px;margin:0 auto} }

  /* ---- the month view ----
     A person a row, a day a column. The first column and the header row stay
     put while the month scrolls sideways under them, because a square with
     no name and no date beside it says nothing. */
  .dsh-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .dsh-nav{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line3);
    border-radius:999px;padding:4px}
  .dsh-nav b{font-weight:700;font-size:14px;min-width:132px;text-align:center}
  .dsh-mv{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--text);
    font-size:16px;cursor:pointer}
  .dsh-mv:hover{background:rgba(255,255,255,.06)}
  .dsh-shape{display:flex;background:var(--card2);border:1px solid var(--line3);border-radius:10px;padding:3px;margin-left:auto}
  .dsh-sh{padding:7px 14px;border:0;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;
    background:transparent;color:var(--muted)}
  .dsh-sh.on{background:var(--accent);color:var(--ink)}
  .dsh-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
  .dsh-stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .dsh-stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
  .dsh-stat .l{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .dsh-stat .v{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;
    letter-spacing:-.03em;line-height:1}
  .dsh-stat .v i{font-style:normal;font-family:'Hanken Grotesk',sans-serif;font-weight:500;
    font-size:14px;color:var(--muted);margin-left:4px}
  .dsh-stat .s{font-size:12.5px;color:var(--muted)}
  .dsh-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
  .dsh-key span{display:flex;align-items:center;gap:6px}
  .dsh-key i{width:12px;height:12px;border-radius:3px;box-sizing:border-box;flex:none}
  .dsh-wrap{overflow-x:auto;overflow-y:hidden}
  .dsh-grid{min-width:max-content}
  .dsh-hrow,.dsh-row{display:flex;align-items:center}
  .dsh-who{width:230px;min-width:230px;box-sizing:border-box;flex:none;position:sticky;left:0;z-index:2;
    background:var(--card);display:flex;align-items:center;gap:10px;padding:4px 14px;
    font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dsh-hrow .dsh-who{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);padding:8px 14px}
  .dsh-who .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ink);

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const A = window.ATT, $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The shift starts at nine and a quarter of an hour is allowed for the road,
   so anybody photographed after 09:15 is late. Everything that says so on
   screen and in the exports reads this, rather than repeating the time. */
const SHIFT = '09:00', GRACE = 15;
let PEOPLE = [], RECS = [], DAY = A.dstr(new Date()), BUSY = false, ERR = '';
let DEVICES = [], MADE = null, LEAVE = [];      // MADE: a link just created, shown once in full
/* What the export covers. The day is what is on screen; the two monthly ones
   are asked for by a month rather than read off it, because a month is not a
   thing this page shows and pretending otherwise would mean loading one. */
let XSCOPE = 'day', XMONTH = DAY.slice(0, 7), XWHO = '';
let OLD = 90;                                   // how old a picture has to be to be swept
let TAB = 'dash';                               // dash | day | leave | team | links
/* the month view: which month, which shape, and the month itself once it
   has been fetched - kept so flipping grid/tiles does not re-query */
let DYM = A.dstr(new Date()).slice(0, 7), DDAYS = null, DSHAPE = 'grid', DBUSY = false, DERR = '';
let Q = '';                                     // the name search, shared by the log and the team
let ROLEF = '';                                 // which role chip is on
let SITES = [];                                 // the places, for naming a photograph's coordinates
let LVTYPE = 'Annual';                          // which leave chip is on
let LVSPAN = {};                                // booking id -> its real {from, to, n}
let AHEAD = [];                                 // leave marked for the days to come
let BELL = false, SEEN = null;                  // SEEN: the ids already known, so an arrival is an arrival
let LV_WHO = '', LV_FROM = '', LV_TO = '', LV_NOTE = '';
const pref = (k, d) => { try { const v = localStorage.getItem('attend_'+k);
  return v === null ? d : v === '1'; } catch(e){ return d; } };
const setPref = (k, v) => { try { localStorage.setItem('attend_'+k, v ? '1' : '0'); } catch(e){} };
let SOUND = pref('sound', true), DESKTOP = pref('desktop', false);

let tt; function toast(m, ms){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), ms||2400); }

/* --------------------------------------------------------- asking twice

   Two questions, not one question asked twice. A box that says "are you sure"
   and then says it again only teaches somebody to click through both; the
   second question here says what is actually about to be lost, and naming it
   is the only thing that makes asking again worth anything.

   Built rather than confirm(), because a browser that has just shown two
   confirms in a row offers to suppress the next one - and the one it would
   suppress is the second, which is the one that matters. Escape and the
   safe button both cancel, and the safe button is the one that has focus. */
function ask(steps){
  return new Promise(resolve => {
    let at = 0;
    const back = document.createElement('div');
    back.className = 'ask-back';
    const close = ok => { document.removeEventListener('keydown', key); back.remove(); resolve(ok); };
    const key = e => { if (e.key === 'Escape') close(false); };
    function draw(){
      const s = steps[at];
      back.innerHTML = '<div class="ask" role="dialog" aria-modal="true">' +
        '<div class="step">Step ' + (at + 1) + ' of ' + steps.length + '</div>' +
        '<h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p>' +
        '<div class="btns"><button class="no">' + esc(s.no || 'Cancel') + '</button>' +
        '<button class="yes">' + esc(s.yes || 'Yes') + '</button></div></div>';
      back.querySelector('.no').onclick = () => close(false);
      back.querySelector('.yes').onclick = () => { at++; if (at < steps.length) draw(); else close(true); };
      back.querySelector('.no').focus();
    }
    back.onclick = e => { if (e.target === back) close(false); };
    document.addEventListener('keydown', key);
    document.body.appendChild(back);
    draw();
  });
}
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

/* The same box, with a time in it. Filled with the clock as it is now, because
   the common case by far is somebody standing there marking a person in at the
   moment they walk up; typing over it covers the other case. */
function askTime(title, body, value){
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'ask-back';
    back.innerHTML = '<div class="ask" role="dialog" aria-modal="true">' +
      '<div class="step">The office is entering this</div>' +
      '<h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
      '<input type="time" id="askt" value="' + esc(value) + '" step="60">' +
      '<div class="btns"><button class="no">Cancel</button>' +
      '<button class="yes" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)">Save the time</button></div></div>';
    const close = v => { document.removeEventListener('keydown', key); back.remove(); resolve(v); };
    const key = e => { if (e.key === 'Escape') close(null);
      if (e.key === 'Enter') close(back.querySelector('#askt').value || null); };
    back.querySelector('.no').onclick = () => close(null);
    back.querySelector('.yes').onclick = () => close(back.querySelector('#askt').value || null);
    back.onclick = e => { if (e.target === back) close(null); };
    document.addEventListener('keydown', key);
    document.body.appendChild(back);
    const f = back.querySelector('#askt'); f.focus(); f.select && f.select();
  });
}

/* -------------------------------------------------------------- an arrival

   A photograph turning up is the one thing here that happens without anybody
   in the office doing anything, so it is the one thing that has to announce
   itself. Two short notes rather than a file: a sound file is a request, a
   cache entry and a binary in the repository, and this is a beep.

   Browsers will not make a sound until the page has been clicked once. That is
   not worked around, it is said out loud in the panel. */
let AC = null;
function chime(){
  if (!SOUND) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    [[784, 0], [1175, .14]].forEach(pair => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = pair[0];
      g.gain.setValueAtTime(.0001, t0 + pair[1]);
      g.gain.exponentialRampToValueAtTime(.2, t0 + pair[1] + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + pair[1] + .3);
      o.connect(g); g.connect(AC.destination);
      o.start(t0 + pair[1]); o.stop(t0 + pair[1] + .32);
    });
  } catch (e){}
}
function desktopNote(text){
  if (!DESKTOP || !('Notification' in window) || Notification.permission !== 'granted') return;
  /* one tag, so ten photographs in a morning are one notification that keeps
     being replaced rather than ten stacked up */
  try { new Notification('Daily Attendance', { body: text, tag: 'attend' }); } catch (e){}
}
function arrived(n, day){
  const what = n > 1 ? n + ' photos have arrived' : 'A photo has arrived';
  const when = day === A.dstr(new Date()) ? '' : ' for ' + day;
  chime(); desktopNote(what + when + ' – name the faces on it.');
  toast(what + when, 4200);
}
/* What the bell counts: photographs on the day being read with nobody ticked
   on them yet. A count that survives a reload, because it is a fact about the
   day rather than about this browser tab. */
function waiting(day){ return (day || []).filter(u => !(u.members || []).length); }

/* ---------------------------------------------------------------- chrome */
function renderHead(){
  const n = waiting(A.ofDay(RECS, DAY)).length;
  /* The crews' screen is /attendance/ - a page with no
     sign-in, opened from a link on the shared phone - and there is deliberately
     nothing here that navigates to it: it is not a thing to be browsed into,
     and a link from an office laptop would be a link to a credential. */
  $('hdr').innerHTML =
    '<a class="brand" href="../../" title="Emortia"><span class="logo"><i></i><i></i><i></i><i></i></span>' +
    '<span class="bname">Emortia</span></a><span class="hsep"></span>' +
    '<h1>Daily Attendance</h1>' +
    '<button class="bell' + (BELL ? ' on' : '') + '" id="bell" title="Photos waiting to be named">🔔' +
      (n ? '<span class="badge">' + n + '</span>' : '') + '</button>' +
    '<button class="theme" id="themeBtn" title="Light / dark">☾</button>';
  const b = $('bell'); if (b) b.onclick = () => { BELL = !BELL; paint(); };
  /* The saved choice was only ever read by the button's click, so the page
     opened with no theme at all - dark colours under a button that said light.
     It is applied here, on the first draw, the way the other tools do it. */
  const root = document.documentElement;
  if (!root.dataset.theme){
    let saved = null;
    try { saved = localStorage.getItem('office_tool_theme'); } catch(e){}
    root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  const t = $('themeBtn');
  if (t){ t.textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾';
    t.onclick = () => { const to = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = to;
      try { localStorage.setItem('office_tool_theme', to); } catch(e){}
      t.textContent = to === 'dark' ? '☀' : '☾'; }; }
}

/* ------------------------------------------------------------ the office

   Four tabs. The day is read every morning; the other three are touched
   between them about once a month, and having them all on one page meant
   scrolling past the roster and a credential to reach the sheet. */
function renderOffice(){
  const late = A.lateAfter(SHIFT, GRACE);
  const sheet = A.buildSheet(PEOPLE, RECS, DAY, late, LEAVE);
  const day = A.ofDay(RECS, DAY);
  const st = A.stats(sheet, day);

  /* the design's names, and a glyph apiece */
  const TABI = {
    dash:  'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',
    day:   'M12 7v5l3 2 M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0 -18',
    leave: 'M3 5h18v16H3z M3 9h18 M8 3v4 M16 3v4 M9 14l2 2 4-4',
    team:  'M6 8a3 3 0 1 0 6 0a3 3 0 1 0 -6 0 M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6 M15.5 5.3a3 3 0 0 1 0 5.4 M18 14.4c1.8.9 3 2.9 3 5.6',
    links: 'M7 2h10v20H7z M11 18h2',
  };
  const tabs = [['dash','Dashboard', 0], ['day','Clock in/out', day.length],
                ['leave','Leave', AHEAD.length], ['team','Team', PEOPLE.length]];
  /* CAN_EDIT rather than IS_OWNER: an office admin runs this tool, and running
     it includes handing a phone its link and taking it back when the phone is
     lost. Everything else on the page already asks CAN_EDIT; this one tab was
     left behind, so the admin could name faces and mark leave but not issue the
     link the faces arrive through. */
  if (window.CAN_EDIT) tabs.push(['links','Mobile links', DEVICES.length]);

  let h = '<div class="tabs">' + tabs.map(t =>
    '<button class="tab' + (TAB===t[0]?' on':'') + '" data-tab="'+t[0]+'">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="' + TABI[t[0]] + '"></path></svg>' +
    esc(t[1]) + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>').join('') + '</div>';

  if (BELL) h += bellPanel(day);
  if (ERR) h += '<div class="empty">' + esc(ERR) + '</div>';

  h += TAB === 'dash'  ? viewDash()
     : TAB === 'leave' ? viewLeaveNew()
     : TAB === 'team'  ? viewTeamNew()
     : TAB === 'links' ? viewLinks()
     : viewDayNew(sheet, day, st, late);

  $('main').innerHTML = h;
  wireOffice(sheet, late);
}

/* ---------------------------------------------------------- the month view

   A person a row, a day a column, for the month being looked at. The same
   A.monthSheets() the exports use, so a day that reads Late here reads Late
   in the spreadsheet - there is one rule and it lives in one place. */
async function loadDash(force){
  if (DBUSY) return;
  if (DDAYS && DDAYS.ym === DYM && !force) return;
  const from = A.monthStart(DYM), to = A.monthEnd(DYM);
  if (!from || !to) return;
  DBUSY = true; DERR = ''; paint();
  try {
    const [r, l] = await Promise.all([window.DB.attendRange(from, to), window.DB.attendLeaveRange(from, to)]);
    if (r.error) throw new Error(r.error);
    const leave = (l && l.leave) || [];
    /* The month's leave is kept rather than only folded into the sheets. The
       leave list is a view of the month on screen, and it used to be built
       from today's marks plus sixty days ahead - so stepping back to March or
       on to December showed an empty list under a heading naming that month. */
    const bks = [];
    leave.forEach(x => { if (x.booking && bks.indexOf(x.booking) < 0) bks.push(x.booking); });
    const sp = bks.length ? (await window.DB.attendBookingSpans(bks)).spans || {} : {};
    Object.keys(sp).forEach(k => { LVSPAN[k] = sp[k]; });
    DDAYS = { ym: DYM, leave: leave,
      days: A.monthSheets(PEOPLE, r.records, leave, DYM,
                          A.lateAfter(SHIFT, GRACE), A.dstr(new Date())) };
  } catch (e){ DERR = e.message || 'Could not read that month.'; DDAYS = null; }
  DBUSY = false; paint();
}

/* Leave was written or cancelled, so whatever month is cached is out of date.
   Without this the list goes on showing the count it had before the change. */
async function leaveChanged(){ DDAYS = null; await refresh(); }

function shiftMonth(by){
  const [y, m] = DYM.split('-').map(Number);
  const d = new Date(y, m - 1 + by, 1);
  DYM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  DDAYS = null; paint(); loadDash();
}

/* Every day of the month, whether or not it has been reached: monthSheets
   stops at today, and a grid that stops with it looks like a month that
   ended early. */
function dashDays(){
  const [y, m] = DYM.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const today = A.dstr(new Date());
  const byDate = {};
  ((DDAYS && DDAYS.days) || []).forEach(d => { byDate[d.date] = d.sheet; });
  const out = [];
  for (let n = 1; n <= last; n++){
    const ds = DYM + '-' + String(n).padStart(2, '0');
    const dt = new Date(y, m - 1, n);
    out.push({ n, ds, wd: ['Su','Mo','Tu','We','Th','Fr','Sa'][dt.getDay()],
      sun: dt.getDay() === 0, today: ds === today, fut: ds > today,
      sheet: byDate[ds] || null, dow: dt.getDay() });
  }
  return out;
}

/* One square. The states are the sheet's own, not a second opinion. */
function dashCell(day, row, name){
  const tip = name + ' · ' + day.wd + ' ' + day.n + ' · ';
  const base = 'width:24px;height:24px;box-sizing:border-box;border-radius:6px;font:700 9.5px/1 ' +
    "'Space Mono',monospace;display:flex;align-items:center;justify-content:center;";
  if (day.fut) return { st:base + 'background:transparent;border:1px dashed rgba(255,255,255,.09);color:#4a3748', t:'', tip:tip + 'Not yet' };
  if (!row)    return { st:base + 'background:rgba(255,255,255,.05);color:#5a4458', t:'', tip:tip + (day.sun ? 'Sunday' : 'No sheet') };
  if (row.present) return {
    st: base + 'background:var(--ok);color:#0b1a12' + (row.late ? ';box-shadow:inset 0 -4px 0 var(--warn)' : ''),
    t: row.closed ? '' : '·',
    tip: tip + (row.late ? 'Late' : 'Present') + (row.closed ? '' : ' · no clock-out') };
  if (row.leave) return {
    st: base + 'background:repeating-linear-gradient(135deg,rgba(226,96,122,.45) 0 2px,transparent 2px 5px);' +
        'border:1.5px solid var(--bad);color:#ffd2dc', t:'L', tip:tip + 'On leave' };
  if (day.sun) return { st:base + 'background:rgba(255,255,255,.05);color:#5a4458', t:'', tip:tip + 'Sunday' };
  return { st:base + 'background:var(--bad);color:#2a0610', t:'A', tip:tip + 'Absent' };
}

/* the month for one person, and the counts under it */
function dashRow(p, days){
  const cells = [], t = { p:0, late:0, lv:0, a:0 };
  days.forEach(day => {
    const row = day.sheet ? day.sheet.find(x => x.id === p.id) : null;
    if (!day.fut && row){
      if (row.present){ t.p++; if (row.late) t.late++; }
      else if (row.leave) t.lv++;
      else if (!day.sun) t.a++;
    }
    cells.push(dashCell(day, row, p.name));
  });
  const worked = t.p + t.a;
  /* 'who', not 'p': the totals below carry a p of their own - the days
     present - and spreading them over the person replaced the person with a
     number, which is how every row lost its name and its role. */
  return { who: p, cells, ...t, rate: worked ? Math.round(t.p / worked * 100) : null };
}

function viewDash(){
  const days = dashDays();
  const rows = PEOPLE.map(p => dashRow(p, days));
  const nav = '<div class="dsh-nav">' +
    '<button class="dsh-mv" data-mon="-1" aria-label="Previous month">&#8249;</button>' +
    '<b>' + esc(A.monthLabel(DYM)) + '</b>' +
    '<button class="dsh-mv" data-mon="1" aria-label="Next month">&#8250;</button></div>';

  if (DBUSY) return '<div class="panel">' + nav + '<div class="empty">Reading the month…</div></div>';
  if (DERR)  return '<div class="panel">' + nav + '<div class="empty">' + esc(DERR) + '</div></div>';
  if (!PEOPLE.length) return '<div class="panel">' + nav + '<div class="empty">Nobody on the roster yet.</div></div>';

  /* the month in five numbers */
  const tot = rows.reduce((a, r) => ({ p:a.p + r.p, late:a.late + r.late, lv:a.lv + r.lv, a:a.a + r.a }),
                          { p:0, late:0, lv:0, a:0 });
  const expected = tot.p + tot.a;
  const onTime = tot.p - tot.late;
  const stat = (label, value, of, sub, c) =>
    '<div class="dsh-stat" style="--sc:' + c + '"><span class="l">' + esc(label) + '</span>' +
    '<span class="v">' + value + (of ? '<i>' + esc(of) + '</i>' : '') + '</span>' +
    '<span class="s">' + esc(sub) + '</span></div>';

  let h = '<div class="dsh-head">' + nav +
    '<div class="dsh-shape">' +
      '<button class="dsh-sh' + (DSHAPE === 'grid' ? ' on' : '') + '" data-shape="grid">Grid</button>' +
      '<button class="dsh-sh' + (DSHAPE === 'tiles' ? ' on' : '') + '" data-shape="tiles">Tiles</button>' +
    '</div></div>';

  h += '<div class="dsh-stats">' +
    stat('Days worked', tot.p, expected ? ' / ' + expected : '', 'across ' + PEOPLE.length + ' people', 'var(--ok)') +
    stat('On time', onTime, tot.p ? ' / ' + tot.p : '', tot.p ? Math.round(onTime / tot.p * 100) + '% of days worked' : 'nothing yet', 'var(--ok)') +
    stat('Late', tot.late, '', tot.late === 1 ? 'one arrival after ' + A.hm(A.lateAfter(SHIFT, GRACE)) : 'arrivals after ' + A.hm(A.lateAfter(SHIFT, GRACE)), 'var(--warn)') +
    stat('Absent', tot.a, '', 'no photo, no leave', 'var(--bad)') +
    stat('On leave', tot.lv, '', 'days marked by the office', 'var(--accent)') +
    '</div>';

  const legend = '<div class="dsh-key">' +
    '<span><i style="background:var(--ok)"></i>Present</span>' +
    '<span><i style="background:var(--ok);box-shadow:inset 0 -3px 0 var(--warn)"></i>Late</span>' +
    '<span><i style="background:var(--bad)"></i>Absent</span>' +
    '<span><i style="border:1.5px solid var(--bad);background:repeating-linear-gradient(135deg,rgba(226,96,122,.45) 0 2px,transparent 2px 5px)"></i>Leave</span>' +
    '<span><i style="background:rgba(255,255,255,.06)"></i>Sunday</span></div>';

  if (DSHAPE === 'tiles'){
    h += '<div class="panel">' + legend + '<div class="dsh-tiles">' + rows.map(r => {
      const pad = new Array(days.length ? days[0].dow : 0).fill('<span></span>').join('');
      return '<div class="dsh-tile"><div class="hd">' +
        '<span class="av">' + esc(((r.who.name || '?').trim()[0] || '?').toUpperCase()) + '</span>' +
        '<span class="nm"><b>' + esc(r.who.name) + '</b><i>' + esc(r.who.role || '—') + '</i></span>' +
        '<span class="rate">' + (r.rate == null ? '—' : r.rate + '%') + '</span></div>' +
        '<div class="mini">' + pad + r.cells.map(c =>
          '<span title="' + esc(c.tip) + '" style="' + c.st.replace(/width:24px;height:24px/, 'width:100%;aspect-ratio:1;height:auto') + '">' + c.t + '</span>').join('') + '</div>' +
        '<div class="ft"><span><b style="color:var(--ok)">' + r.p + '</b> present</span>' +
        '<span><b style="color:var(--bad)">' + r.a + '</b> absent</span>' +
        '<span><b style="color:var(--accent)">' + r.lv + '</b> leave</span></div></div>';
    }).join('') + '</div></div>';
    return h;
  }

  /* the grid, grouped by role the way the day sheet is */
  const byRole = {};
  rows.forEach(r => { const k = r.who.role || 'Team'; (byRole[k] = byRole[k] || []).push(r); });

  h += '<div class="panel">' + legend + '<div class="dsh-wrap"><div class="dsh-grid">' +
    '<div class="dsh-hrow"><div class="dsh-who">' + days.length + ' days</div>' +
    days.map(d => '<div class="dsh-dh' + (d.today ? ' now' : '') + (d.sun ? ' sun' : '') + '">' +
      '<span class="wd">' + d.wd + '</span><span class="dn">' + d.n + '</span></div>').join('') +
    '<div class="dsh-tot"><span>P</span><span>A</span><span>LV</span><span>RATE</span></div></div>';

  Object.keys(byRole).forEach(role => {
    h += '<div class="dsh-role">' + esc(role) + ' &#183; ' + byRole[role].length + '</div>';
    byRole[role].forEach(r => {
      h += '<div class="dsh-row"><div class="dsh-who">' +
        '<span class="av">' + esc(((r.who.name || '?').trim()[0] || '?').toUpperCase()) + '</span>' +
        '<span>' + esc(r.who.name) + '</span></div>' +
        r.cells.map(c => '<div class="dsh-c"><span title="' + esc(c.tip) + '" style="' + c.st + '">' + c.t + '</span></div>').join('') +
        '<div class="dsh-tot"><span style="color:var(--ok)">' + r.p + '</span>' +
        '<span style="color:' + (r.a ? 'var(--bad)' : 'var(--mute)') + '">' + r.a + '</span>' +
        '<span style="color:' + (r.lv ? 'var(--accent)' : 'var(--mute)') + '">' + r.lv + '</span>' +
        '<b>' + (r.rate == null ? '—' : r.rate + '%') + '</b></div></div>';
    });
  });
  return h + '</div></div></div>';
}


/* ------------------------------------------------------- clock in and out

   The day, a person a row: when they came, where from, when they went, and
   how long that was. The place beside each time is the nearest site on the
   list to the coordinates the phone recorded - and where nothing is near
   enough, the coordinates stand on their own rather than being given a name
   they have not earned. */
function initialOf(name){ return (String(name || '?').trim()[0] || '?').toUpperCase(); }
function avatarOf(id){
  /* a steady colour per person, from the tool's own family */
  const P = ['#ea84fa','#f1a2fd','#de68f1','#c9a3f5','#f7b6d9'];
  let n = 0; String(id || '').split('').forEach(c => { n = (n * 31 + c.charCodeAt(0)) >>> 0; });
  return P[n % P.length];
}
/* the sheet row carries neither of these: the crew is a fact about the
   person, and the reference is stamped on the photograph. */
function crewOf(id){ const p = PEOPLE.find(x => x.id === id); return p ? (p.crew || '') : ''; }
function refOf(recId){ const u = RECS.find(x => x.id === recId); return u ? (u.ref || '') : ''; }
function mapHref(geo){
  const p = A.parseGeo(geo);
  return p ? 'https://www.google.com/maps?q=' + p.lat + ',' + p.lng : '';
}
function geoCell(geo, colour){
  /* Three different things, and the cell should not blur them. A photograph
     with no coordinates on it is not the same as one taken somewhere nobody
     has written down – the sheet stores an em dash for the first, so the test
     is whether the string parses, not whether it is empty. */
  const at = A.parseGeo(geo);
  const place = at ? A.placeOf(geo, SITES) : '', href = mapHref(geo);
  const pin = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="' + colour +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6-7-11.5a7 7 0 0 1 14 0C19 15 12 21 12 21z M9.5 9.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"></path></svg>';
  const inner = '<span class="pl">' + pin +
      (place ? esc(place) : at ? '<i>not a known site</i>' : '<i>no location on the photo</i>') + '</span>' +
    '<span class="gg">' + (at ? esc(geo) : '') + '</span>';
  return href ? '<a class="lg-geo" href="' + href + '" target="_blank" rel="noopener">' + inner + '</a>'
              : '<span class="lg-geo">' + inner + '</span>';
}

function viewDayNew(sheet, day, st, late){
  const q = Q.trim().toLowerCase();
  const rows = sheet.filter(r => !q || String(r.name).toLowerCase().indexOf(q) > -1);
  const inCount = sheet.filter(r => r.present).length;

  /* the fortnight behind today, to step back through */
  const strip = [];
  for (let i = 0; i < 14; i++){
    const d = new Date(DAY + 'T12:00:00'); d.setDate(d.getDate() - i);
    const ds = A.dstr(d);
    strip.push({ ds, n: d.getDate(), wd: ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()],
      on: ds === DAY, today: ds === A.dstr(new Date()) });
  }

  let h = '<div class="lg-head">' +
    '<h2 class="lg-t">Clock in &amp; out</h2>' +
    '<span class="lg-sum">' + esc(A.monthLabel(DAY.slice(0,7)).split(' ')[0]) + ' ' +
      parseInt(DAY.slice(8), 10) + ' &#183; ' + inCount + ' clocked in &#183; ' +
      (sheet.length - inCount) + ' not in</span>' +
    '<input id="q" class="lg-q" placeholder="Search a name" value="' + esc(Q) + '">' +
    '</div>';

  h += '<div class="lg-strip">' + strip.map(d =>
    '<button class="lg-day' + (d.on ? ' on' : '') + '" data-day="' + d.ds + '">' +
    '<span class="wd">' + (d.today ? 'TODAY' : d.wd) + '</span>' +
    '<span class="n">' + d.n + '</span></button>').join('') + '</div>';

  h += '<div class="panel lg-panel"><div class="wrap-x"><div class="lg-grid">' +
    '<div class="lg-hrow"><span>Person</span><span>Clock in &#183; location</span>' +
    '<span>Clock out &#183; location</span><span>Hours</span><span>Status</span><span>Record</span></div>';

  if (!rows.length){
    h += '<div class="empty">' + (q ? 'Nobody by that name.' : 'Nobody on the roster yet.') + '</div>';
  } else rows.forEach(r => {
    const on = r.present && !r.closed;
    const status = !r.present ? (r.leave ? 'On leave' : 'Absent')
                 : on ? 'On site' : (r.late ? 'Late' : 'On time');
    const sk = !r.present ? (r.leave ? 'lv' : 'ab') : on ? 'os' : (r.late ? 'lt' : 'ok');
    h += '<div class="lg-row">' +
      '<div class="lg-who"><span class="av" style="background:' + avatarOf(r.id) + '">' +
        esc(initialOf(r.name)) + '</span>' +
        '<span class="nm"><b>' + esc(r.name) + '</b><i>' + (esc([r.role, crewOf(r.id)].filter(Boolean).join(' \u00b7 ')) || '&#8212;') + '</i></span></div>' +
      '<div class="lg-when"><span class="t' + (r.late ? ' late' : '') + '">' + (esc(r.in) || '&#8212;') + '</span>' +
        (r.present ? geoCell(r.inGeo, 'var(--accent)') : '<span class="lg-geo"><span class="gg">&#8212;</span></span>') + '</div>' +
      '<div class="lg-when"><span class="t">' + (esc(r.out) || '&#8212;') + '</span>' +
        (r.closed ? geoCell(r.outGeo, 'var(--accent)')
         : '<span class="lg-geo"><span class="pl" style="color:var(--ok)">' + (on ? 'Still on site' : '&#8212;') + '</span>' +
           '<span class="gg">' + (on ? 'No clock-out photo yet' : '') + '</span></span>') + '</div>' +
      '<span class="lg-h">' + (r.hours === '—' ? '&#8212;' : esc(r.hours) + 'h') + '</span>' +
      '<span class="lg-st ' + sk + '">' + status + '</span>' +
      '<span class="lg-ref">' + (esc(refOf(r.inId)) || '&#8212;') + '</span>' +
      '</div>';
  });
  return h + '</div></div></div>';
}

/* ------------------------------------------------------------------ leave */
function viewLeaveNew(){
  const ym = DYM, from = A.monthStart(ym), to = A.monthEnd(ym);
  /* The month being shown, read from the month that was fetched. AHEAD and
     LEAVE only ever cover today and the sixty days after it, so they cannot
     answer for a month the office has stepped to. */
  const loaded = (DDAYS && DDAYS.ym === DYM) ? (DDAYS.leave || []) : null;
  if (!loaded && DBUSY) return '<div class="panel"><div class="empty">Reading ' +
    esc(A.monthLabel(ym)) + '&#8230;</div></div>';

  const mine = (loaded || (AHEAD || []).concat(LEAVE || []))
    .filter(l => l.day >= from && l.day <= to)
    .filter((l, i, a) => a.findIndex(x => x.day === l.day && x.person === l.person) === i)
    .sort((a, b) => String(a.day).localeCompare(String(b.day)));

  /* One booking is one row here, and which days belong to it is read off the
     booking id rather than guessed from runs of consecutive dates. The guess
     could only ever see the month on screen, so a booking running 29 Sep to
     1 Oct looked like two days and cancelled as two days, leaving 1 Oct
     marked on a person who was working.

     LVSPAN carries the real first and last day from the table, so a booking
     that runs past the edge of the month says so instead of shrinking to fit. */
  const byBooking = {}, runs = [];
  mine.forEach(l => {
    const key = l.booking || ('~' + l.person + '|' + (l.label || 'Leave') + '|' + l.day);
    let r = byBooking[key];
    if (!r){
      const span = LVSPAN[l.booking] || null;
      r = byBooking[key] = { booking: l.booking || '', person: l.person,
        label: l.label || 'Leave', note: l.note || '',
        from: span ? span.from : l.day, to: span ? span.to : l.day,
        n: span ? span.n : 0, shown: 0, whole: !!span };
      runs.push(r);
    }
    r.shown++;
    if (!r.whole){
      if (l.day < r.from) r.from = l.day;
      if (l.day > r.to) r.to = l.day;
      r.n++;
    }
  });
  runs.sort((a, b) => String(a.from).localeCompare(String(b.from)));
  const nameOf = id => (PEOPLE.find(p => p.id === id) || {}).name || id;
  const days = runs.reduce((a, r) => a + r.n, 0);

  const TYPES = ['Annual','Casual','Medical','Half day','No pay'];
  let h = '<div class="lv-wrap">';

  if (window.CAN_EDIT){
    h += '<div class="panel lv-form"><h2 class="lv-h">Mark leave</h2>' +
      '<p class="lv-p">Leave shows in red on the month view. A clock-in photo on the same day still counts as present.</p>' +
      '<label class="lv-l">Team member<select id="lvWho">' +
        (PEOPLE.length ? PEOPLE.map(p => '<option value="' + esc(p.id) + '"' +
          (LV_WHO === p.id ? ' selected' : '') + '>' + esc(p.name) +
          (p.role ? ' &#183; ' + esc(p.role) : '') + '</option>').join('')
         : '<option value="">Nobody on the roster</option>') + '</select></label>' +
      '<div class="lv-two">' +
        '<label class="lv-l">From<input type="date" id="lvFrom" value="' + esc(LV_FROM) + '" max="' + esc(A.dstr(new Date(Date.now() + 365*86400000))) + '"></label>' +
        '<label class="lv-l">To<input type="date" id="lvTo" value="' + esc(LV_TO) + '" max="' + esc(A.dstr(new Date(Date.now() + 365*86400000))) + '"></label>' +
      '</div>' +
      '<div class="lv-l">Type<div class="lv-chips">' + TYPES.map(t =>
        '<button class="lv-chip' + (LVTYPE === t ? ' on' : '') + '" data-lvtype="' + esc(t) + '">' + esc(t) + '</button>').join('') +
      '</div></div>' +
      '<label class="lv-l">Note<input type="text" id="lvNote" placeholder="Optional" value="' + esc(LV_NOTE) + '"></label>' +
      '<button class="lv-add" id="lvAdd">Add leave &#183; ' + plural(lvDays(), 'day', 'days') + '</button>' +
      '</div>';
  }

  /* The list is a month, so the month has to be steppable from here. It was
     only steppable from the dashboard, which left this heading naming a month
     the office had no way to change without leaving the tab. */
  h += '<div class="panel lv-list"><div class="lv-lh">' +
    '<h2>Leave in ' + esc(A.monthLabel(ym)) + '</h2>' +
    '<span class="lv-nav"><button class="lv-mon" data-mon="-1" aria-label="The month before">&#8249;</button>' +
      plural(runs.length, 'mark', 'marks') + ' &#183; ' + plural(days, 'day', 'days') +
      '<button class="lv-mon" data-mon="1" aria-label="The month after">&#8250;</button></span></div>';
  if (!runs.length) h += '<div class="empty">No leave marked this month.</div>';
  else runs.forEach(r => {
    const d = new Date(r.from + 'T12:00:00');
    const range = r.n === 1 ? fmtD(r.from) : fmtD(r.from) + ' &#8211; ' + fmtD(r.to);
    h += '<div class="lv-row">' +
      '<div class="lv-date"><span class="m">' + ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()] + '</span>' +
        '<span class="d">' + d.getDate() + '</span></div>' +
      '<div class="lv-who"><b>' + esc(nameOf(r.person)) + '</b>' +
        '<i>' + range + ' &#183; ' + esc(r.label) + (r.note ? ' &#183; ' + esc(r.note) : '') +
        /* said plainly, so nobody is surprised by what cancelling takes */
        (r.shown < r.n ? ' &#183; runs past this month' : '') + '</i></div>' +
      '<span class="lv-n">' + plural(r.n, 'day', 'days') + '</span>' +
      (window.CAN_EDIT ? '<button class="lv-x" data-lvbook="' + esc(r.booking) +
        '" data-lvwho="' + esc(r.person) + '" aria-label="Cancel this leave">&#215;</button>' : '') +
      '</div>';
  });
  return h + '</div></div>';
}
function fmtD(ds){
  const d = new Date(ds + 'T12:00:00');
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
function lvDays(){
  if (!LV_FROM || !LV_TO) return 1;
  const a = new Date(LV_FROM + 'T12:00:00'), b = new Date(LV_TO + 'T12:00:00');
  return Math.max(1, Math.round((b - a) / 86400000) + 1);
}

/* ------------------------------------------------------------------- team */
function viewTeamNew(){
  const q = Q.trim().toLowerCase();
  const roles = {};
  PEOPLE.forEach(p => { const r = p.role || 'Team'; roles[r] = (roles[r] || 0) + 1; });
  const chips = [['', 'All', PEOPLE.length]].concat(Object.keys(roles).map(r => [r, r, roles[r]]));
  const list = PEOPLE.filter(p => (!ROLEF || (p.role || 'Team') === ROLEF) &&
                                  (!q || String(p.name).toLowerCase().indexOf(q) > -1));
  const days = (DDAYS && DDAYS.ym === DYM) ? dashDays() : null;
  const today = A.dstr(new Date());
  const inToday = {};
  A.ofDay(RECS, DAY).forEach(u => (u.members || []).forEach(id => { inToday[id] = true; }));

  let h = '<div class="tm-head"><h2 class="lg-t">Team</h2>' +
    '<div class="tm-chips">' + chips.map(c =>
      '<button class="tm-chip' + (ROLEF === c[0] ? ' on' : '') + '" data-role="' + esc(c[0]) + '">' +
      esc(c[1]) + ' &#183; ' + c[2] + '</button>').join('') + '</div>' +
    '<input id="q" class="lg-q" placeholder="Search a name" value="' + esc(Q) + '"></div>';

  h += '<div class="tm-grid">';
  if (!list.length) h += '<div class="empty">' + (q || ROLEF ? 'Nobody matches that.' : 'Nobody on the roster yet.') + '</div>';
  list.forEach(p => {
    /* the month, for this one person */
    let t = { p:0, late:0, lv:0, a:0, mins:0, n:0 };
    if (days) days.forEach(day => {
      const row = day.sheet ? day.sheet.find(x => x.id === p.id) : null;
      if (day.fut || !row) return;
      if (row.present){ t.p++; if (row.late) t.late++;
        if (row.in && row.in !== '—'){ const hm = String(row.in).split(':'); t.mins += (+hm[0]) * 60 + (+hm[1]); t.n++; }
      } else if (row.leave) t.lv++; else if (!day.sun) t.a++;
    });
    const worked = t.p + t.a, rate = worked ? Math.round(t.p / worked * 100) : null;
    const avg = t.n ? A.hm(Math.round(t.mins / t.n)) : '—';
    const tot = Math.max(1, t.p + t.lv + t.a);
    const here = !!inToday[p.id];
    h += '<div class="tm-card">' +
      '<div class="tm-top"><span class="av lg" style="background:' + avatarOf(p.id) + '">' + esc(initialOf(p.name)) + '</span>' +
        '<span class="nm"><b>' + esc(p.name) + '</b><i>' + (esc(p.role) || '&#8212;') +
          (p.crew ? ' &#183; ' + esc(p.crew) : '') + '</i></span>' +
        '<span class="lg-st ' + (here ? 'ok' : 'ab') + '">' + (here ? 'In today' : 'Not in') + '</span></div>' +
      '<div class="tm-facts">' +
        (p.phone ? '<a class="tm-fact" href="tel:' + esc(p.phone.replace(/\s+/g,'')) + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>' +
          '<span class="mono">' + esc(p.phone) + '</span></a>'
         : '<span class="tm-fact dim">No phone on file</span>') +
        (p.site ? '<span class="tm-fact dim">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6-7-11.5a7 7 0 0 1 14 0C19 15 12 21 12 21z M9.5 9.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0"></path></svg>' +
          esc(p.site) + '</span>'
         : '<span class="tm-fact dim">No site on file</span>') +
      '</div>' +
      '<div class="tm-mon"><div class="tm-mh"><span>' + esc(A.monthLabel(DYM).split(' ')[0]) + ' attendance</span>' +
        '<b>' + (rate == null ? '&#8212;' : rate + '%') + '</b></div>' +
        '<div class="tm-bar"><span style="width:' + (t.p / tot * 100) + '%;background:var(--ok)"></span>' +
          '<span style="width:' + (t.lv / tot * 100) + '%;background:var(--bad);opacity:.55"></span>' +
          '<span style="width:' + (t.a / tot * 100) + '%;background:var(--bad)"></span></div>' +
        '<div class="tm-nums"><span><b>' + t.p + '</b> days</span><span><b class="w">' + t.late + '</b> late</span>' +
          '<span><b>' + t.lv + '</b> leave</span><span><b class="b">' + t.a + '</b> absent</span>' +
          '<span><b>' + avg + '</b> avg in</span></div></div>' +
      (window.CAN_EDIT ? '<button class="link tm-rm" data-rm="' + esc(p.id) + '">take off the roster</button>' : '') +
      '</div>';
  });
  /* the last card in the grid is the one that makes a new person */
  if (window.CAN_EDIT){
    h += '<div class="tm-new"><b>Add a team member</b>' +
      '<input type="text" id="pn" placeholder="Name">' +
      '<div class="two"><input type="text" id="pr" placeholder="Role"><input type="text" id="pc" placeholder="Crew"></div>' +
      '<div class="two"><input type="text" id="pp" placeholder="Phone"><input type="text" id="ps" placeholder="Site"></div>' +
      '<button id="padd">Add to the roster</button></div>';
  }
  return h + '</div>';
}
