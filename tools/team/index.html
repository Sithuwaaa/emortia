<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1619">
<title>Team Directory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b03a56'/%3E%3Cg fill='%23170d10'%3E%3Crect x='8' y='13' width='3' height='8' rx='1.5'/%3E%3Crect x='13' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='18' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='23' y='8' width='3' height='15' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_lib/theme.css">
<script src="../_lib/theme.js" defer></script>
<script src="../_lib/owner-config.js"></script>
<script src="../_lib/owner.js"></script>
<script src="../_lib/supabase-config.js"></script>
<script src="../_lib/db.js"></script>
<script src="../_lib/access-config.js"></script>
<script src="../_lib/access.js"></script>
<script>Access.protect({ owner: true, feature: 'tool:team' });</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="team.js"></script>
<style>
  /* Olive - the one band none of the other tools had taken. Only the accent
     is this tool's own; the ground, the lines and the type come from
     theme.css, which is what makes the office tools look like one set rather
     than nine separate programs. */
  :root,html[data-theme="dark"]{--accent:#8fa83f;--accentB:#a9c257;--accentD:#6d8329;
    --accent-ink:#12160a;--glow:rgba(143,168,63,.5);--glowSoft:rgba(143,168,63,.28);
    --bad:#e2607a;--zebra:rgba(255,255,255,.02);--goHover:var(--accentB)}
  /* Light needs a deeper olive than it looks like it should: #66801f read
     4.07 against the page for the small mono kickers and 4.49 for white on
     the buttons, both a hair under. This clears 4.6 and 5.1.
     --accentB stays the lighter one in both themes, because the header is
     dark either way and that is where it is used - so the button's hover
     gets its own colour rather than washing out in light mode. */
  html[data-theme="light"]{--accent:#5f7719;--accentB:#7e9a2e;--accentD:#46590f;
    --accent-ink:#ffffff;--glow:rgba(95,119,25,.4);--glowSoft:rgba(95,119,25,.2);
    --bad:#c2405c;--zebra:rgba(0,0,0,.024);--goHover:#46590f}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  ::selection{background:var(--glowSoft)}
  .mono{font-family:'Space Mono',ui-monospace,monospace}

  /* ---------------------------------------------------------- the header

     The same bar every other tool wears: the site's mark and name leading
     home, a rule, then this tool's name. It used to read
     "EMORTIA / TOOLS · Team Directory" - the middle of that was a word for a
     folder, and nobody needed telling they were in the tools. */
  .hdr{display:flex;align-items:center;gap:10px;color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:var(--navy);position:sticky;top:0;z-index:20}
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;font-size:0;padding:0;border:none}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  .hdr .brand:hover .logo{transform:scale(1.06)}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-.02em;color:#fff;white-space:nowrap}
  /* the site's name and the tool's are different things, so they are kept apart */
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  .hdr h1{font-size:18px;font-weight:700;margin-right:auto;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:7ch}
  .pill{font-size:11.5px;background:var(--navy-2);border:1px solid rgba(255,255,255,.15);
    color:#cfd6e6;border-radius:999px;padding:4px 11px;white-space:nowrap;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill b{color:var(--accent);font-weight:600}
  .theme{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;
    width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;flex-shrink:0}
  /* what a cramped header gives up, and in what order */
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }

  /* ------------------------------------------------------------- the frame */
  /* above the drifting dust theme.js lays down behind everything */
  .frame{display:grid;grid-template-columns:246px minmax(0,1fr);align-items:start;
    position:relative;z-index:1}
  /* the sidebar sits under the header rather than behind it; the height is
     named once so the two cannot drift apart */
  .side{--hdrH:58px;
    border-right:1px solid var(--line);padding:12px 0 50px;position:sticky;top:var(--hdrH);
    max-height:calc(100vh - var(--hdrH));overflow-y:auto}
  .navRow{display:flex;align-items:stretch}
  .nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    font-family:inherit;font-size:13.8px;color:var(--text);background:none;border:0;
    border-left:3px solid transparent;padding:8px 14px;transition:background .14s ease}
  .nav:hover{background:var(--zebra)}
  .nav.on{font-weight:700;border-left-color:var(--accent);background:var(--glowSoft)}
  .nav b{flex:1;min-width:0;font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav i{font-style:normal;font-family:'Space Mono',monospace;font-size:11px;opacity:.62}
  .navX{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 12px 0 4px}
  .navX:hover{color:var(--bad)}
  .sideAct{padding:16px 14px 0}

  main{min-width:0;padding:20px 22px 90px}

  /* ------------------------------------------------------------- headings */
  .top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .kick{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;
    letter-spacing:-.02em;line-height:1.12;margin-right:auto}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;
    letter-spacing:-.015em;line-height:1.15}

  input[type=search],input[type=text],select{width:100%;background:var(--card-2);color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;
    outline:none;transition:border-color .15s ease}
  input:focus,select:focus{border-color:var(--accent)}
  .search{width:270px;flex:none}
  @media(max-width:620px){.search{width:100%}}

  .btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:12.5px;color:var(--text);background:none;
    border:1px solid var(--line3);border-radius:9px;padding:9px 13px;white-space:nowrap;
    transition:border-color .15s ease,background .15s ease}
  .btn:hover{border-color:var(--accent);background:var(--zebra)}
  .btn.go{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:700}
  .btn.go:hover{background:var(--goHover)}
  .btn.bad:hover{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn svg{flex:none}

  /* -------------------------------------------------------------- the bar */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;padding-top:10px;
    border-top:1px solid var(--line);font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
  .chip{cursor:pointer;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);
    border-radius:999px;padding:5px 10px;transition:all .15s ease}
  .chip:hover{color:var(--text);border-color:var(--line3)}
  .chip.on{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:700}

  /* ------------------------------------------------------------- the table */
  .scroll{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
  th{text-align:left;font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    padding:9px 8px;border-bottom:1px solid var(--line3);white-space:nowrap}
  td{padding:0;border-bottom:1px solid var(--line)}
  tbody tr:hover{background:var(--zebra)}
  .num{padding:7px 8px;font-family:'Space Mono',monospace;font-size:11.5px;
    color:var(--muted);width:38px}
  .meta{padding:7px 8px;font-size:12.5px;color:var(--muted)}
  .cell{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
    font:inherit;font-size:14px;color:var(--text);background:none;border:0;padding:7px 8px}
  .cell:hover{background:var(--glowSoft)}
  .cell span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .cell svg{flex:none;opacity:.22}
  .cell:hover svg{opacity:.6}
  .cell.n{font-family:'Space Mono',monospace;font-size:13px}
  /* which tab somebody was on - not one of the sheet's columns, so it sits
     under the name rather than taking a column of its own */
  .inteam{display:block;font-style:normal;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .acts{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 0;white-space:nowrap}
  .mini{cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;
    border:1px solid var(--line);border-radius:7px;padding:5px 8px}
  .mini:hover{color:var(--text);border-color:var(--line3)}
  .mini.bad:hover{color:var(--bad);border-color:var(--bad)}
  /* an ID number that is not an ID number shape - marked, never refused */
  .flag{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);
    flex:none;margin-right:2px}
  .none{padding:30px 4px;font-size:14px;color:var(--muted)}
  .warnBox{margin-top:14px;border:1px solid var(--line3);border-left:3px solid var(--warn);
    border-radius:9px;padding:11px 14px;font-size:13px;color:var(--muted);background:var(--card-2)}
  .warnBox b{color:var(--text);font-weight:600}

  section.veh{margin-top:44px}

  /* ------------------------------------------------------------ the modal */
  .veil{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;
    background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
  .modal{width:min(520px,100%);max-height:calc(100vh - 40px);overflow-y:auto;
    background:var(--card);border:1px solid var(--line3);border-radius:15px;padding:20px;
    box-shadow:0 26px 70px rgba(0,0,0,.6)}
  .modal .head{display:flex;align-items:baseline;gap:10px;padding-bottom:11px;
    border-bottom:1px solid var(--line);margin-bottom:15px}
  .modal .head h2{margin-right:auto}
  .fields{display:grid;gap:11px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:520px){.two{grid-template-columns:1fr}}
  label span{display:block;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}

  /* ------------------------------------------------- what an upload does */
  .ptallies{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
  .ptally{flex:1;min-width:96px;border:1px solid var(--line3);border-radius:10px;
    padding:9px 12px;background:var(--card-2)}
  .ptally b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:21px;
    font-weight:800;line-height:1.1;color:var(--accent)}
  .ptally span{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted)}
  .ptally.quiet b{color:var(--muted)}
  .plist{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .plist.warn{border-left:3px solid var(--warn)}
  .plisth{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    padding:9px 12px;background:var(--card-2);border-bottom:1px solid var(--line)}
  .prow{display:flex;gap:12px;align-items:baseline;padding:8px 12px;font-size:13px;
    border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow b{flex:0 0 auto;max-width:44%;font-weight:600;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .prow span{flex:1;min-width:0;color:var(--muted);font-size:12.5px}
  .prow.quiet{color:var(--muted);display:block;line-height:1.55}
  .err{font-size:13px;color:var(--bad);min-height:1em}
  .foot{display:flex;justify-content:flex-end;gap:8px;padding-top:14px;margin-top:15px;
    border-top:1px solid var(--line)}
  .foot .spacer{margin-right:auto}

  /* ------------------------------------------------------------- the toast */
  .toast{position:fixed;left:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:9px;
    max-width:min(520px,calc(100vw - 36px));padding:11px 15px;border-radius:10px;
    background:var(--text);color:var(--bg);font-size:13px;font-weight:600;
    box-shadow:0 14px 40px rgba(0,0,0,.45);animation:up .16s ease-out}
  .toast.bad{background:var(--bad);color:#fff}
  .toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media(max-width:780px){
    .frame{grid-template-columns:1fr}
    .side{border-right:0;border-bottom:1px solid var(--line);position:static;max-height:none;
      padding-bottom:14px}
    main{padding:18px 15px 90px}
    h1{font-size:25px}
  }
</style>
</head>
<body>

<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>Team Directory</h1>
  <span class="pill" id="tally">loading…</span>
  <button class="theme" id="themeBtn" type="button" aria-label="Toggle theme">☾</button>
</header>

<div class="frame">
  <nav class="side" id="side"></nav>
  <main>
    <div class="top">
      <div style="margin-right:auto;min-width:0">
        <div class="kick" id="kick">Everyone</div>
        <h1 id="title">Team Directory</h1>
      </div>
      <input type="search" class="search" id="q" placeholder="Name, mobile, ID, vehicle…"
             autocomplete="off" spellcheck="false">
      <button class="btn" id="importBtn" type="button" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>
        Excel</button>
      <button class="btn" id="addPerson" type="button" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add member</button>
      <button class="btn go" id="copyAll" type="button">Copy all</button>
    </div>

    <div class="bar">
      <span>Click any value to copy it · a row copies as the sheet's own five columns</span>
    </div>

    <!-- the sheet's own columns, in the sheet's own order, so a row copied out
         and pasted back lands where it came from -->
    <div class="scroll">
      <table>
        <thead><tr>
          <th class="num">#</th><th>Name</th><th style="width:140px">Mobile Number</th>
          <th style="width:150px">ID No</th><th style="width:200px">Company Name</th>
          <th style="width:130px">Role</th><th style="width:120px">Row</th>
        </tr></thead>
        <tbody id="people"></tbody>
      </table>
    </div>
    <div class="none" id="noPeople" hidden></div>
    <div class="warnBox" id="warnBox" hidden></div>

    <section class="veh">
      <div class="top">
        <div style="margin-right:auto">
          <div class="kick">Vehicles</div>
          <h2 id="vehTitle">All vehicles</h2>
        </div>
        <button class="btn" id="addVehicle" type="button" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add vehicle</button>
        <button class="btn" id="copyVeh" type="button">Copy all</button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr>
            <th class="num">#</th><th style="width:190px">Vehicle No</th>
            <th style="width:190px">Type</th><th>Driver</th>
            <th style="width:150px">Team</th><th style="width:120px">Row</th>
          </tr></thead>
          <tbody id="vehicles"></tbody>
        </table>
      </div>
      <div class="none" id="noVeh" hidden></div>
    </section>
  </main>
</div>

<input type="file" id="file" accept=".xlsx,.xls,.xlsm" hidden>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(function(){
  'use strict';
  var T = window.TeamCore, DB = window.DB, A = window.Access;

  var S = {
    teams: [], loaded: false, err: '',
    active: 'ALL', q: '',
    modal: null, form: {}, formErr: '', busy: false,
    importing: null, pending: null
  };

  /* Who may change the directory decides the buttons; the policies decide
     whether a write lands. The buttons are the courtesy, not the lock.

     From migration 020 that is the owner or an office admin, not the owner
     alone - keeping this current is the admin team's daily job. mayEdit falls
     back to isOwner on an older access.js, which is the safe way round. */
  var mine = function(){
    if (!A) return false;
    return A.mayEdit ? A.mayEdit('tool:team') : A.isOwner();
  };

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; });
  };
  var COPY_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="9" y="9" width="12" height="12" rx="2"/>' +
    '<path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

  /* --------------------------------------------------------------- saying */

  var toastT = null;
  function say(msg, bad){
    clearTimeout(toastT);
    $('toastHost').innerHTML = '<div class="toast' + (bad ? ' bad' : '') + '">' +
      '<span>' + esc(msg) + '</span></div>';
    toastT = setTimeout(function(){ $('toastHost').innerHTML = ''; }, bad ? 4200 : 1900);
  }

  /* The clipboard API needs a secure context and a real gesture, and refuses
     quietly when it has neither. The textarea is the way that still works,
     and saying nothing at all would look like the copy had worked. */
  function copy(text, label){
    var done = function(){ say(label); };
    var hard = function(){
      var ta = document.createElement('textarea');
      ta.value = text || ''; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      ok ? done() : say('This browser would not let the page copy. Select it by hand.', true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text || '').then(done, hard);
    else hard();
  }

  /* -------------------------------------------------------------- loading */

  function load(){
    if (!DB || !DB.configured()){
      S.err = 'The directory lives on the server and this page cannot reach it.';
      S.loaded = true; return paint();
    }
    return DB.teamLoad().then(function(r){
      S.loaded = true;
      S.err = r.error ? 'Could not read the directory. ' + r.error : '';
      S.teams = r.teams || [];
      if (S.active !== 'ALL' && !S.teams.some(function(t){ return t.id === S.active; }))
        S.active = 'ALL';
      paint();
    });
  }

  /* --------------------------------------------------------------- drawing */

  function paint(){
    var c = T.counts(S.teams);
    /* the numbers in the accent, the words not - the same pill the lookups wear */
    $('tally').innerHTML = S.loaded
      ? '<b>' + c.people + '</b> members · <b>' + c.vehicles + '</b> vehicles · <b>' +
        c.teams + '</b> teams'
      : 'loading…';
    paintSide();
    paintPeople();
    paintVehicles();
    paintModal();
    $('importBtn').hidden = !mine();
    $('addPerson').hidden = !mine() || !S.teams.length;

  /* One list, every team the same.

     They used to be sorted into "Sub teams", "Other teams" and "Added teams",
     and only the last of those could be renamed or removed. The heading a
     team sat under was decided by how it happened to arrive - by upload, off
     the original sheet, or typed in by hand - which is a fact about this
     tool's history and not about the team. It also meant fifteen of the
     sixteen teams had no way to be corrected or removed at all.

     A team is a team. The `source` column is still recorded; nothing reads
     it. */
  function paintSide(){
    var c = T.counts(S.teams);
    var out = '<div class="navRow"><button class="nav' +
      (!S.q && S.active === 'ALL' ? ' on' : '') +
      '" data-team="ALL" type="button"><b>All teams</b><i>' + c.people + '</i></button></div>';

    S.teams.forEach(function(t){
      var on = !S.q && t.id === S.active;
      out += '<div class="navRow">' +
        '<button class="nav' + (on ? ' on' : '') + '" data-team="' + esc(t.id) + '" type="button">' +
          '<b>' + esc(t.team) + '</b><i>' + t.people.length + '</i></button>' +
        (mine()
          ? '<button class="navX" data-drop="' + esc(t.id) + '" type="button" ' +
            'title="Rename or remove ' + esc(t.team) + '">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'
          : '') +
        '</div>';

    $('side').innerHTML = out +
      (mine() ? '<div class="sideAct"><button class="btn" id="addTeam" type="button" ' +
        'style="width:100%;justify-content:center">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
        'New team</button></div>' : '');

  function shown(){ return T.view(S.teams, S.active, S.q); }
  var teamTitle = function(name){ return T.titleOf(name); };

    var v = shown(), rows = v.people;

    $('kick').textContent = v.scope === 'search' ? 'Search' : v.scope === 'team' ? 'Team' : 'Everyone';

    $('copyAll').disabled = !rows.length;

    /* The five columns are the sheet's own, always, so a row copied out and
       pasted back lands where it came from. Which team somebody is in is not
       one of the sheet's columns - it is which tab they were on - so it goes
       under the name, and only when more than one team is on show. */
    var many = v.scope !== 'team';
    $('people').innerHTML = rows.map(function(p, i){
      var note = T.nicNote(p.nic);
      var mob = T.phone(p.mobile);
      return '<tr data-p="' + esc(p.id) + '">' +
        '<td class="num">' + (i + 1) + '</td>' +

          '</span>' + COPY_ICON + '</button></td>' +
        '<td><button class="cell n" data-copy="' + esc(mob) + '" data-what="mobile" type="button">' +
          '<span>' + (mob ? esc(mob) : '—') + '</span>' + COPY_ICON + '</button></td>' +
        '<td><button class="cell n" data-copy="' + esc(p.nic) + '" data-what="ID" type="button"' +
          (note ? ' title="' + esc(note) + '"' : '') + '>' +
          (note && p.nic ? '<i class="flag"></i>' : '') +
          '<span>' + (p.nic ? esc(p.nic) : '—') + '</span>' + COPY_ICON + '</button></td>' +
        '<td><button class="cell" data-copy="' + esc(p.company) + '" data-what="company" type="button">' +
          '<span>' + (p.company ? esc(p.company) : '—') + '</span>' + COPY_ICON + '</button></td>' +
        '<td><button class="cell" data-copy="' + esc(p.role) + '" data-what="role" type="button">' +
          '<span>' + (p.role ? esc(p.role) : '—') + '</span>' + COPY_ICON + '</button></td>' +
        '<td><div class="acts">' +
          '<button class="mini" data-row="' + esc(p.id) + '" type="button">Copy</button>' +
          (mine() ? '<button class="mini" data-edit="' + esc(p.id) + '" type="button">Edit</button>' +
                    '<button class="mini bad" data-delp="' + esc(p.id) + '" type="button">×</button>' : '') +
        '</div></td></tr>';
    }).join('');

    var empty = $('noPeople');
    empty.hidden = !!rows.length;
    if (!rows.length) empty.textContent = S.err ? S.err
      : !S.loaded ? 'Reading the directory…'
      : !S.teams.length ? 'The directory is empty. Nothing has been imported yet.'
      : S.q ? 'Nobody matches that search.'
      : 'Nobody is filed under this team yet.';

    warnings();
  }

  /* What is worth knowing about the list as a whole, said once under it
     rather than as a badge on every row. Only for whoever can fix it. */
  function warnings(){
    var box = $('warnBox');
    if (!mine() || !S.teams.length){ box.hidden = true; return; }
    var odd = [];
    T.pools(S.teams).people.forEach(function(p){
      if (p.nic && T.nicNote(p.nic)) odd.push(p);
    });
    var dup = T.duplicates(S.teams);
    if (!odd.length && !dup.length){ box.hidden = true; return; }
    /* one of these reads out loud most days, so it has to agree with itself:
       "1 ID number do not look like an NIC" is how a machine talks */
    var many = function(n, one, lots){ return '<b>' + n + '</b> ' + (n === 1 ? one : lots); };
    var bits = [];
    if (odd.length) bits.push(many(odd.length,
        'ID number does not look like an NIC', 'ID numbers do not look like an NIC') + ' – ' +
      odd.slice(0, 3).map(function(p){
        return esc(p.name) + ' (' + esc(T.nicNote(p.nic).toLowerCase()) + ')'; }).join(', ') +
      (odd.length > 3 ? ' and ' + (odd.length - 3) + ' more' : ''));
    if (dup.length) bits.push(many(dup.length,
        'ID number appears twice inside one team', 'ID numbers appear twice inside one team') + ' – ' +
      dup.slice(0, 3).map(function(d){
        return esc(d.name) + ' and ' + esc(d.first) + ' in ' + esc(d.team); }).join(', '));
    box.innerHTML = bits.join('<br>') + '<br>Nothing is refused on account of this – the sheet is ' +
      'the record. It is only worth knowing before somebody is turned away at a gate.';
    box.hidden = false;
  }

    $('vehicles').innerHTML = rows.map(function(x, i){
      return '<tr>' +

          '<span>' + esc(x.reg) + '</span>' + COPY_ICON + '</button></td>' +
        '<td><button class="cell" data-copy="' + esc(x.kind) + '" data-what="type" type="button">' +
          '<span>' + (x.kind ? esc(x.kind) : '—') + '</span>' + COPY_ICON + '</button></td>' +
        '<td><button class="cell" data-copy="' + esc(x.driver) + '" data-what="driver" type="button">' +

          (mine() ? '<button class="mini" data-vedit="' + esc(x.id) + '" type="button">Edit</button>' +

        '</div></td></tr>';
    }).join('');

    var empty = $('noVeh');
    empty.hidden = !!rows.length;

  /* ================================================================
     Uploading a workbook
     ================================================================

     One sheet per team, the tab named after the team. Nothing is written
     until the plan has been read: the point of this is that uploading the
     same sheet twice is a no-op, and the only way to be sure of that is to
     be shown what would move before it moves. */

  function pickFile(){
    if (typeof XLSX === 'undefined')
      return say('The spreadsheet reader has not finished loading. A moment.', true);
    $('file').value = '';
    $('file').click();
  }

  function readFile(f){
    if (!f) return;
    S.importing = { name: f.name, reading: true };
    paint();
    var fr = new FileReader();
    fr.onerror = function(){
      S.importing = null; paint();
      say('That file could not be read.', true);
    };
    fr.onload = function(){
      var read;
      try {
        var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
        /* raw:false so a mobile number stored as a number arrives as the text
           it looks like on screen, rather than as 704465515 with the leading
           zero quietly gone */
        read = T.readWorkbook(wb.SheetNames.map(function(n){
          return { name: n,
                   rows: XLSX.utils.sheet_to_json(wb.Sheets[n],
                           { header: 1, raw: false, defval: '' }) };
        }));
      } catch (e){
        S.importing = null; paint();
        return say('That does not look like a workbook this can read.', true);
      }
      if (!read.teams.length){
        S.importing = null; paint();
        return say('No sheet in that file had a Name column.', true);
      }
      S.importing = { name: f.name, plan: T.planImport(read.teams, S.teams),
                      warnings: read.warnings, teams: read.teams };
      S.modal = 'import';
      paint();
    };
    fr.readAsArrayBuffer(f);
  }

  function applyImport(){
    var imp = S.importing;
    if (!imp || !imp.plan) return;
    if (!imp.plan.counts.writes){ shut(); return say('Nothing to bring in.'); }
    work(function(){ return DB.teamApplyImport(imp.plan); }, function(){
      var c = imp.plan.counts;
      S.importing = null;
      shut();
      say('Brought in ' + c.writes + ' row' + (c.writes === 1 ? '' : 's') +
          (c.same + c.sameV ? ' – ' + (c.same + c.sameV) + ' were already right' : ''));
    });
  }

  /* ================================================================
     The password in front of deleting
     ================================================================

     Not a lock against other people - nobody else can write to the directory
     at all. This is against my own hand: a row removed by a mis-click is gone
     from every device at once and there is nothing behind it.

     Typing it once opens deletion for five minutes, because being asked
     nine times while tidying one team teaches you to type it without
     reading, which is the opposite of the point. */
  var UNLOCK_MS = 5 * 60 * 1000;
  var gateUntil = 0, gateRec = null, gateAsked = null;

  function gate(){
    if (gateAsked) return gateAsked;
    gateAsked = (DB && DB.gateGet ? DB.gateGet('team-delete') : Promise.resolve(null))
      .then(function(r){ gateRec = r; return r; })
      .catch(function(){ return null; });
    return gateAsked;
  }
  var gateOpen = function(){ return Date.now() < gateUntil; };

  /* what to do when something is about to be deleted */
  function askDelete(what, run){
    if (gateOpen()) return confirmDelete(what, run);
    gate().then(function(rec){
      if (!rec) { S.modal = 'setgate'; S.form = {}; S.formErr = '';
                  S.pending = { what: what, run: run }; return paint(); }
      S.modal = 'gate'; S.form = {}; S.formErr = '';
      S.pending = { what: what, run: run };
      paint();
    });
  }
  function confirmDelete(what, run){
    if (!confirm('Remove ' + what + '?\n\nThis takes it off everybody’s copy.')) return;
    run();
  }

  async function tryGate(){
    var pw = String(S.form.pw || '');
    if (!pw){ S.formErr = 'The password, please.'; return paint(); }
    S.busy = true; paint();
    try {
      var got = await A.derive(pw, gateRec.salt, gateRec.iter);
      S.busy = false;
      if (!A.sameSecret(got, gateRec.hash)){
        S.formErr = 'That is not it.'; S.form.pw = ''; return paint();
      }
      gateUntil = Date.now() + UNLOCK_MS;
      var p = S.pending; shut();
      if (p) confirmDelete(p.what, p.run);
    } catch (e){ S.busy = false; S.formErr = e.message; paint(); }
  }

  async function setGate(){
    var a = String(S.form.pw || ''), b = String(S.form.pw2 || '');
    if (a.length < 6){ S.formErr = 'Six characters at least.'; return paint(); }
    if (a !== b){ S.formErr = 'The two do not match.'; return paint(); }
    S.busy = true; paint();
    try {
      var salt = A.randomSalt(), iter = 210000;
      var hash = await A.derive(a, salt, iter);
      await DB.gateSet('team-delete', { salt: salt, hash: hash, iter: iter });
      gateRec = { salt: salt, hash: hash, iter: iter };
      gateAsked = Promise.resolve(gateRec);
      gateUntil = Date.now() + UNLOCK_MS;
      S.busy = false;
      var p = S.pending; shut();
      say('Delete password set.');
      if (p) confirmDelete(p.what, p.run);
    } catch (e){ S.busy = false; S.formErr = e.message; paint(); }
  }

  /* ---------------------------------------------------------- the modal */

  function field(key, label, hint, attrs){
    return '<label><span>' + esc(label) + '</span>' +
      '<input type="text" data-f="' + key + '" value="' + esc(S.form[key] || '') + '"' +
      (attrs || '') + '>' + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</label>';
  }
  function teamPicker(){
    return '<label><span>Team</span><select data-f="teamId">' + S.teams.map(function(t){
      return '<option value="' + esc(t.id) + '"' + (t.id === S.form.teamId ? ' selected' : '') +
        '>' + esc(t.team) + '</option>'; }).join('') + '</select></label>';
  }

  /* What the upload would do, before it does any of it. The unchanged count
     is the important number: it is what says the sheet was read properly and
     that nothing is being rewritten for the sake of it. */
  function importBody(){
    var imp = S.importing, p = imp.plan, c = p.counts;
    var line = function(n, label, cls){
      return '<div class="ptally' + (cls ? ' ' + cls : '') + '"><b>' + n + '</b>' +
             '<span>' + esc(label) + '</span></div>';
    };
    var out = '<p class="hint" style="margin:0 0 12px">' + esc(imp.name) + ' – ' +
      esc(T.planSummary(p)) + '</p>' +
      '<div class="ptallies">' +
        line(c.add + c.addV, 'to add') +
        line(c.update + c.updateV, 'to change') +
        line(c.same + c.sameV, 'already right', 'quiet') +
        (c.teams ? line(c.teams, 'new team' + (c.teams === 1 ? '' : 's')) : '') +
      '</div>';

    if (c.update){
      out += '<div class="plist"><div class="plisth">What changes</div>' +
        p.update.slice(0, 12).map(function(u){
          var ch = T.changesOn(u);
          return '<div class="prow"><b>' + esc(u.name) + '</b><span>' +
            ch.map(function(x){ return esc(x.field) + ': ' +
              (x.from ? esc(x.from) : '—') + ' → ' + (x.to ? esc(x.to) : '—'); }).join(' · ') +
            '</span></div>';
        }).join('') +
        (c.update > 12 ? '<div class="prow quiet">and ' + (c.update - 12) + ' more</div>' : '') +
        '</div>';
    }
    if (c.add){
      out += '<div class="plist"><div class="plisth">Who is new</div>' +
        p.add.slice(0, 12).map(function(a){
          return '<div class="prow"><b>' + esc(a.name) + '</b><span>' +
            esc(a.teamName) + '</span></div>'; }).join('') +
        (c.add > 12 ? '<div class="prow quiet">and ' + (c.add - 12) + ' more</div>' : '') +
        '</div>';
    }
    /* An upload never removes anybody. A sheet for one team would otherwise
       be able to empty the other fifteen, and even within a team a name left
       off by accident should not be a deletion. */
    if (c.missing){
      out += '<div class="plist warn"><div class="plisth">In the directory, not in this file</div>' +
        '<div class="prow quiet">Left exactly as they are. Nothing here is deleted by an ' +
        'upload – remove them by hand if they have really gone.</div>' +
        p.missing.slice(0, 8).map(function(m){
          return '<div class="prow"><b>' + esc(m.name) + '</b><span>' +
            esc(m.team) + ' · ' + esc(m.kind) + '</span></div>'; }).join('') +
        (c.missing > 8 ? '<div class="prow quiet">and ' + (c.missing - 8) + ' more</div>' : '') +
        '</div>';
    }
    if ((imp.warnings || []).length){
      out += '<div class="plist warn"><div class="plisth">Worth knowing</div>' +
        imp.warnings.map(function(w){
          return '<div class="prow quiet">' + esc(w) + '</div>'; }).join('') + '</div>';
    }
    return out;
  }

  function paintModal(){
    var host = $('modalHost');
    if (!S.modal){ host.innerHTML = ''; return; }
    var m = S.modal, body, title, cta;

    if (m === 'team'){
      title = S.form.id ? 'Rename team' : 'New team';
      cta = S.form.id ? 'Save the name' : 'Create the team';

    } else if (m === 'person'){
      title = S.form.id ? 'Edit member' : 'Add member';

      body = '<div class="fields">' + teamPicker() +
        field('name', 'Name', '', ' autocomplete="off"') +
        '<div class="two">' + field('mobile', 'Mobile number', '', ' inputmode="tel"') +
          field('nic', 'ID No', T.nicNote(S.form.nic) || 'Looks like an NIC.') + '</div>' +
        '<div class="two">' + field('company', 'Company') + field('role', 'Role', 'TL, MEMBER, DRIVER…') +
        '</div></div>';
    } else if (m === 'vehicle'){
      title = S.form.id ? 'Edit vehicle' : 'Add vehicle';
      cta = S.form.id ? 'Save' : 'Add vehicle';
      body = '<div class="fields">' + teamPicker() +
        field('reg', 'Vehicle No', 'e.g. LK-8679') +
        '<div class="two">' + field('kind', 'Type', 'Crew Cab, Bolero, Van…') +
          field('driver', 'Driver') + '</div></div>';
    } else if (m === 'import'){
      title = 'From the workbook';
      cta = S.importing && S.importing.plan.counts.writes ? 'Bring it in' : 'Nothing to do';

    } else if (m === 'gate'){
      title = 'Password to delete';
      cta = 'Unlock';
      body = '<div class="fields"><p class="hint" style="margin:0">' +

        'so it is asked for once and then open for five minutes.</p>' +
        '<label><span>Delete password</span>' +
        '<input type="password" data-f="pw" autocomplete="current-password" value=""></label></div>';
    } else if (m === 'setgate'){
      title = 'Set a delete password';
      cta = 'Set it';
      body = '<div class="fields"><p class="hint" style="margin:0">' +
        'Nothing has been deleted yet because no password is set. This is not a lock ' +
        'against anybody else – nobody else can change the directory at all. It is so a ' +
        'mis-click cannot empty a team.</p>' +
        '<label><span>Delete password</span>' +
        '<input type="password" data-f="pw" autocomplete="new-password" value=""></label>' +
        '<label><span>And again</span>' +
        '<input type="password" data-f="pw2" autocomplete="new-password" value=""></label></div>';
    } else {
      title = ''; cta = ''; body = '';
    }

    var wide = m === 'import' ? ' style="width:min(720px,100%)"' : '';
    host.innerHTML = '<div class="veil" id="veil"><div class="modal" role="dialog" aria-modal="true"' +
      wide + '>' +

        '<button class="mini" id="mClose" type="button">Close</button></div>' +

        (S.form.id && m === 'team'
          ? '<button class="btn bad spacer" id="mDrop" type="button">Delete team</button>' : '') +
        '<button class="btn" id="mCancel" type="button">Cancel</button>' +
        '<button class="btn go" id="mGo" type="button"' +
          (S.busy || (m === 'import' && !S.importing.plan.counts.writes) ? ' disabled' : '') + '>' +
          esc(S.busy ? 'Working…' : cta) + '</button>' +
      '</div></div></div>';

    var first = host.querySelector('input,select');
    if (first) setTimeout(function(){ first.focus(); }, 40);
  }

  function open(mode, form){
    var t = S.teams.filter(function(x){ return x.id === S.active; })[0] || S.teams[0];
    S.modal = mode;
    S.formErr = '';
    S.form = form || { teamId: t ? t.id : '', company: 'Tooway Solutions (Pvt) Ltd' };
    paint();
  }
  function shut(){ S.modal = null; S.form = {}; S.formErr = ''; paint(); }

  function find(id){
    var out = null;
    T.pools(S.teams).people.forEach(function(p){ if (p.id === id) out = p; });
    return out;
  }
  function findV(id){
    var out = null;
    T.pools(S.teams).vehicles.forEach(function(v){ if (v.id === id) out = v; });
    return out;
  }

  /* ---------------------------------------------------------- the saving */

  function work(fn, done){
    S.busy = true; paint();
    fn().then(function(){
      S.busy = false;
      return load().then(function(){ if (done) done(); });
    }).catch(function(e){
      S.busy = false; S.formErr = e.message; paint();
      if (!S.modal) say(e.message, true);
    });
  }

  function submit(){
    var f = S.form, m = S.modal;
    if (m === 'team'){
      var err = f.id
        ? (String(f.name || '').trim() ? '' : 'A team name, please.')
        : T.checkTeam(f, S.teams);
      if (err){ S.formErr = err; return paint(); }
      var name = String(f.name).trim();
      if (f.id) return work(function(){ return DB.teamRenameGroup(f.id, name); },
        function(){ shut(); say('Renamed to ' + name); });
      var id = T.slug(name, S.teams.map(function(t){ return t.id; }));
      return work(function(){ return DB.teamAddGroup(id, name, S.teams.length); },
        function(){ S.active = id; S.q = ''; $('q').value = ''; shut(); say('Team added – ' + name); });
    }
    if (m === 'person'){
      var pe = T.checkPerson(f);
      if (pe){ S.formErr = pe; return paint(); }
      var team = S.teams.filter(function(t){ return t.id === f.teamId; })[0];
      return work(function(){ return DB.teamSavePerson({
        id: f.id, teamId: f.teamId, name: String(f.name).trim(),
        mobile: String(f.mobile || '').trim(), nic: String(f.nic || '').trim(),
        company: String(f.company || '').trim(), role: String(f.role || '').trim(),
        sort: DB.teamNextSort(team && team.people) });
      }, function(){ if (!f.id){ S.active = f.teamId; S.q = ''; $('q').value = ''; }
        shut(); say((f.id ? 'Saved – ' : 'Added – ') + String(f.name).trim()); });
    }
    var ve = T.checkVehicle(f);
    if (ve){ S.formErr = ve; return paint(); }
    var vt = S.teams.filter(function(t){ return t.id === f.teamId; })[0];
    return work(function(){ return DB.teamSaveVehicle({
      id: f.id, teamId: f.teamId, reg: String(f.reg).trim(),
      kind: String(f.kind || '').trim(), driver: String(f.driver || '').trim(),
      sort: DB.teamNextSort(vt && vt.vehicles) });
    }, function(){ if (!f.id){ S.active = f.teamId; S.q = ''; $('q').value = ''; }
      shut(); say((f.id ? 'Saved – ' : 'Added – ') + String(f.reg).trim()); });
  }

  /* ----------------------------------------------------------- listening */

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-team],[data-drop],[data-copy],' +
      '[data-row],[data-vrow],[data-edit],[data-vedit],[data-delp],[data-delv],' +
      '#addTeam,#addPerson,#addVehicle,#importBtn,#copyAll,#copyVeh,' +
      '#mClose,#mCancel,#mGo,#mDrop,#themeBtn') : null;
    if (!el) return;
    var d = el.dataset || {};

    if (d.team){ S.active = d.team; S.q = ''; $('q').value = ''; return paint(); }

    if (d.copy != null){
      var what = d.what || 'value';
      if (!d.copy) return say('Nothing recorded for that ' + what + '.', true);
      return copy(d.copy, 'Copied ' + what + ' – ' + d.copy);
    }
    if (d.row){ var p = find(d.row); return p && copy(T.rowText(p), 'Copied row – ' + p.name); }
    if (d.vrow){ var v = findV(d.vrow); return v && copy(T.vehicleText(v), 'Copied row – ' + v.reg); }

    if (el.id === 'copyAll'){
      var rows = shown().people;
      /* the whole table copies with its heading line, so it lands in a fresh
         sheet looking like the workbook it came from; a single row copies
         bare, because that one is going into a sheet that already has them */
      return copy(T.headerText() + '\n' + T.sheet(rows, T.rowText),
                  'Copied ' + rows.length + ' rows with headings');
    }
    if (el.id === 'copyVeh'){
      var vr = shown().vehicles;
      return copy(T.sheet(vr, T.vehicleText), 'Copied ' + vr.length + ' vehicle rows');
    }

    if (el.id === 'addTeam')    return open('team', { name:'' });
    if (el.id === 'addPerson')  return open('person');
    if (el.id === 'addVehicle') return open('vehicle');
    if (el.id === 'importBtn')  return pickFile();

    if (d.edit){
      var ep = find(d.edit); if (!ep) return;
      return open('person', { id:ep.id, teamId:ep.teamId, name:ep.name, mobile:ep.mobile,
                              nic:ep.nic, company:ep.company, role:ep.role });
    }
    if (d.vedit){
      var ev = findV(d.vedit); if (!ev) return;
      return open('vehicle', { id:ev.id, teamId:ev.teamId, reg:ev.reg, kind:ev.kind, driver:ev.driver });
    }
    if (d.drop){
      var dt = S.teams.filter(function(t){ return t.id === d.drop; })[0]; if (!dt) return;
      return open('team', { id:dt.id, name:dt.team });
    }

    /* Every removal goes through the password first, then a confirm naming
       what is going. Nothing deletes on a single click. */
    if (d.delp){
      var dp = find(d.delp); if (!dp) return;
      return askDelete(dp.name + ' from ' + dp.team, function(){
        work(function(){ return DB.teamDeletePerson(dp.id); },
             function(){ say('Removed ' + dp.name); });
      });
    }
    if (d.delv){
      var dv = findV(d.delv); if (!dv) return;
      return askDelete('vehicle ' + dv.reg, function(){
        work(function(){ return DB.teamDeleteVehicle(dv.id); },
             function(){ say('Removed ' + dv.reg); });
      });
    }

    if (el.id === 'mClose' || el.id === 'mCancel'){
      if (S.modal === 'import') S.importing = null;
      S.pending = null;
      return shut();
    }
    if (el.id === 'mGo'){
      if (S.modal === 'import')  return applyImport();
      if (S.modal === 'gate')    return tryGate();
      if (S.modal === 'setgate') return setGate();
      return submit();
    }
    if (el.id === 'mDrop'){
      var g = S.teams.filter(function(t){ return t.id === S.form.id; })[0]; if (!g) return;
      var what = T.titleOf(g.team) + ', with its ' + g.people.length + ' member' +
        (g.people.length === 1 ? '' : 's') + ' and ' + g.vehicles.length + ' vehicle' +
        (g.vehicles.length === 1 ? '' : 's');
      return askDelete(what, function(){
        work(function(){ return DB.teamDeleteGroup(g.id); },
             function(){ S.active = 'ALL'; shut(); say('Removed ' + T.titleOf(g.team)); });
      });
    }
    if (el.id === 'themeBtn') return flipTheme();
  });

  document.addEventListener('input', function(e){
    var el = e.target;
    if (el.id === 'q'){ S.q = el.value; return paintAfterQuery(); }
    if (el.dataset && el.dataset.f){
      S.form[el.dataset.f] = el.value;
      S.formErr = '';
      /* the NIC hint changes as it is typed, and repainting the whole modal
         would take the caret with it - so only that one line is rewritten */
      if (el.dataset.f === 'nic'){
        var hint = el.parentNode.querySelector('.hint');
        if (hint) hint.textContent = T.nicNote(el.value) || 'Looks like an NIC.';
      }
      var err = document.querySelector('.err');
      if (err) err.textContent = '';
    }
  });
  document.addEventListener('change', function(e){
    if (e.target.id === 'file') return readFile(e.target.files && e.target.files[0]);
    if (e.target.dataset && e.target.dataset.f === 'teamId') S.form.teamId = e.target.value;
  });

  /* Repainting the tables on every keystroke is fine; repainting the search
     box is not, so it is left alone and everything else is redrawn. */
  function paintAfterQuery(){ paintSide(); paintPeople(); paintVehicles(); }

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && S.modal){
      if (S.modal === 'import') S.importing = null;
      S.pending = null; return shut();
    }
    if (e.key === 'Enter' && S.modal && e.target.tagName !== 'TEXTAREA'){
      e.preventDefault();
      if (S.modal === 'import')  return applyImport();
      if (S.modal === 'gate')    return tryGate();
      if (S.modal === 'setgate') return setGate();
      return submit();
    }
    /* the search is what this page is for; / puts the caret in it */
    if (e.key === '/' && !S.modal && /^(BODY|DIV|BUTTON)$/.test(e.target.tagName)){
      e.preventDefault(); $('q').focus(); $('q').select();
    }
  });

  /* ------------------------------------------------------------- the theme */
  /* The same key the lookups use, so light chosen in Site Access is still
     light here. (GIN keeps its own under gin_theme and the site keeps
     emortia_theme - those two have never agreed with anything.) */
  var THEME = 'office_tool_theme';
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    /* the glyph is what pressing it will give you, which is the way round the
       other tools read */
    $('themeBtn').textContent = t === 'light' ? '☾' : '☀';
    $('themeBtn').title = t === 'light' ? 'Dark' : 'Light';
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#eef5f6' : '#0c1619');
  }
  function flipTheme(){
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(THEME, next); } catch(e){}
    applyTheme(next);
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME); } catch(e){}
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  /* --------------------------------------------------------------- start */

  paint();
  load();
  /* a member added on the phone shows up on the laptop without a reload */
  if (DB && DB.teamSubscribe) DB.teamSubscribe(function(){ load(); });
})();
</script>
</body>
</html>
