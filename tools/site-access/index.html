<style>
  /* Site Access - azure. Access & permissions. */
  :root,html[data-theme="dark"]{--accent:#2f8fd4;--accentB:#5fb0ea;--accentD:#1f6ba6;--accent-ink:#03151f;
    --glow:rgba(47,143,212,.5);--glowSoft:rgba(47,143,212,.28)}
  html[data-theme="light"]{--accent:#1d6fae;--accentB:#2f8fd4;--accentD:#155585;--accent-ink:#ffffff;
    --glow:rgba(29,111,174,.4);--glowSoft:rgba(29,111,174,.22)}

  /* the site's mark, and the way back to it */
  .hdr .logo{width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(150deg,#d15873,#87213c) !important;
    display:flex;align-items:center;justify-content:center;gap:2.4px;
    box-shadow:0 0 16px rgba(176,58,86,.45) !important;text-decoration:none;font-size:0;
    padding:0;border:none;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease}
  .hdr .logo:hover{transform:scale(1.09);box-shadow:0 0 24px rgba(176,58,86,.75)}
  .hdr .logo:focus-visible{outline:2px solid #f7edf0;outline-offset:3px}
  .hdr .logo i{width:2.6px;border-radius:2px;background:#170d10;display:block}
  .hdr .logo i:nth-child(1){height:7px}
  .hdr .logo i:nth-child(2){height:12px}
  .hdr .logo i:nth-child(3){height:9px}
  .hdr .logo i:nth-child(4){height:13px}
  @media (prefers-reduced-motion:reduce){.hdr .logo{transition:none}}

  /* the site's name beside its mark, both leading home */
  .hdr .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
    flex-shrink:0;transition:opacity .18s ease}
  .hdr .brand:hover{opacity:.86}
  .hdr .brand:focus-visible{outline:2px solid #f7edf0;outline-offset:4px;border-radius:10px}
  .hdr .bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:-0.02em;color:#fff;white-space:nowrap}
  /* the site's name and the tool's are different things, so they are kept apart */
  .hdr .hsep{width:1px;height:19px;background:rgba(255,255,255,.2);flex-shrink:0;margin:0 1px}
  /* the mark is inside the link now, so the lift belongs to the whole brand */
  .hdr .brand:hover .logo{transform:scale(1.06)}

  /* What a cramped header gives up, and in what order. The status pill is the
     most expendable thing in it - it was taking half the bar and squeezing the
     tool name down to "Site Ac…" long before the site name joined it. */
  .hdr h1{flex:0 1 auto;min-width:7ch}
  .hdr .pill{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:820px){ .hdr .bname,.hdr .hsep{display:none} }
  @media (max-width:700px){ .hdr .pill{display:none} }
</style>
<style>
  /* ============================================================
     Site Access · the unified view, under the tools' own header.

     The bar across the top is the one every tool has, untouched - same
     size, same name, same pill, same switch. Everything below it is the
     D · Unified design. Its colours carry an sa- prefix, because the
     shared sheets already mean something by --line and --card and the
     header is drawn with those; borrowing the names would have repainted
     the bar.
     ============================================================ */
  :root,html[data-theme="dark"]{
    --sa-bar:#0a1729; --sa-card:#0d1e35; --sa-cardOn:#0f2340;
    --sa-line:#1a3358; --sa-line2:#274a7a; --sa-acc:#3f7fd8; --sa-accL:#7fb4ff;
    --sa-ink:#e4eeff; --sa-soft:#c8d9f2; --sa-mute:#8098bd; --sa-accInk:#04101f; --sa-ph:#5e77a0;
    --sa-soft1:rgba(63,127,216,.14); --sa-soft2:rgba(63,127,216,.28);
    --sa-ok:#4fc39a; --sa-okBg:rgba(79,195,154,.14); --sa-warn:#e0a23c; --sa-warnBg:rgba(224,162,60,.15);
    --sa-shadow:none;
  }
  html[data-theme="light"]{
    --sa-bar:#ffffff; --sa-card:#ffffff; --sa-cardOn:#eaf2fd;
    --sa-line:#d6e1f0; --sa-line2:#b8cbe6; --sa-acc:#2f6fc4; --sa-accL:#2a63b3;
    --sa-ink:#0f1d33; --sa-soft:#2f4460; --sa-mute:#5b6f8e; --sa-accInk:#ffffff; --sa-ph:#8a9bb5;
    --sa-soft1:rgba(47,111,196,.10); --sa-soft2:rgba(47,111,196,.2);
    --sa-ok:#1d8a62; --sa-okBg:rgba(29,138,98,.12); --sa-warn:#a86a12; --sa-warnBg:rgba(224,162,60,.18);
    --sa-shadow:0 1px 2px rgba(15,29,51,.06);
  }
  [hidden]{display:none !important}

  /* the content keeps its own type and its own width; the header keeps the
     tools' - so none of this reaches up into the bar */
  main{max-width:none;padding-left:0;padding-right:0;padding-bottom:0;
    font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--sa-ink)}
  main a{color:var(--sa-accL)}
  main button{font:inherit;color:inherit}
  main code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--sa-card);
    border:1px solid var(--sa-line);border-radius:6px;padding:1px 6px;margin:2px 2px;display:inline-block}

  /* ---- search, and what sits under it ---- */
  .top{padding:0 16px}
  .wrap{max-width:760px;margin:0 auto}
  .search{display:flex;align-items:center;gap:10px;background:var(--sa-card);border:1px solid var(--sa-line2);
    border-radius:12px;padding:0 14px;height:50px;box-shadow:var(--sa-shadow);transition:border-color .15s ease}
  .search.on,.search:focus-within{border-color:var(--sa-acc)}
  .search .ic{color:var(--sa-mute);font-size:17px;flex:0 0 auto}
  /* the shared sheets dress #q as a big bordered box; here it lives inside one */
  main #q,main #q:focus{flex:1;min-width:0;width:auto;height:auto;margin:0;padding:0;
    font:inherit;font-size:15px;background:none;border:none;border-radius:0;outline:none;
    box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--sa-ink);
    animation:none;transform:none;opacity:1}
  main #q::placeholder{color:var(--sa-ph)}
  main #q::-webkit-search-cancel-button{display:none}
  #qClr{font-size:17px;border:none;background:none;color:var(--sa-mute);cursor:pointer;padding:4px 2px;flex:0 0 auto}
  #qClr:hover{color:var(--sa-ink)}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:11px}
  .fp{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    border:1px solid var(--sa-line2);background:var(--sa-card);color:var(--sa-soft);border-radius:999px;
    padding:8px 13px;cursor:pointer;flex:0 0 auto;box-shadow:var(--sa-shadow);
    transition:border-color .15s ease,background .15s ease}
  .fp:hover{border-color:var(--sa-acc)}
  .fp.on{border-color:var(--sa-acc);background:var(--sa-soft1);color:var(--sa-ink)}
  .fp .gl{color:var(--sa-mute);font-size:13px}
  .fp b{background:var(--sa-acc);color:var(--sa-accInk);font-size:10.5px;min-width:17px;height:17px;
    border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .fp:focus-visible,.tok:focus-visible,.opt:focus-visible,.ghost:focus-visible{outline:2px solid var(--sa-accL);outline-offset:2px}
  #tokens{display:contents}
  .tok{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    border:1px solid var(--sa-acc);background:var(--sa-soft1);color:var(--sa-ink);border-radius:999px;
    padding:7px 9px 7px 12px;cursor:pointer;flex:0 0 auto}
  .tok span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sa-mute);font-weight:700}
  .tok i{font-style:normal;color:var(--sa-mute);font-size:14px;line-height:1}
  .bar .sp{flex:1}
  #count{font-size:12.5px;color:var(--sa-mute);white-space:nowrap}

  .ghost{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    border:1px solid var(--sa-line2);background:var(--sa-card);color:var(--sa-ink);border-radius:9px;
    padding:8px 12px;cursor:pointer}
  .ghost:hover{border-color:var(--sa-acc)}
  .ghost.sm{padding:6px 11px;font-size:12px}
  .ghost.on{border-color:var(--sa-acc);background:var(--sa-soft1)}

  /* the panel of choices, for when you would rather tap than type */
  #fPanel{margin-top:11px;background:var(--sa-bar);border:1px solid var(--sa-line);border-radius:13px;
    padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sa-shadow)}
  .dim{display:flex;flex-direction:column;gap:7px;min-width:0}
  .dl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sa-mute);font-weight:700}
  .dv{display:flex;flex-wrap:wrap;gap:6px}
  .opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;
    border:1px solid var(--sa-line);background:var(--sa-card);color:var(--sa-ink);border-radius:8px;
    padding:6px 10px;cursor:pointer}
  .opt:hover{border-color:var(--sa-acc)}
  .opt.on{background:var(--sa-acc);border-color:var(--sa-acc);color:var(--sa-accInk);font-weight:700}
  .opt b{font-size:11px;font-weight:700;opacity:.72}
  .dv .more{font-size:12.5px;border:none;background:none;color:var(--sa-mute);cursor:pointer;
    text-decoration:underline;padding:6px 4px}
  .dv .more:hover{color:var(--sa-ink)}

  /* the measured hop */
  #tray{margin-top:11px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--sa-bar);border:1px solid var(--sa-line);border-radius:12px;padding:10px 12px}
  #tray .leg{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
  #tray .km{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--sa-accL)}
  #tray .brg{color:var(--sa-mute);font-size:12.5px}
  #tray .sp{flex:1}

  /* ---- the list and the site ---- */
  .body{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;
    padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:1240px;margin:0 auto;width:100%}
  #list{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:8px}
  .ll{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sa-mute);font-weight:700;padding:0 2px 4px}
  .card{background:var(--sa-card);border:1px solid var(--sa-line);border-radius:12px;padding:13px 14px;
    cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sa-shadow);transition:border-color .12s ease}
  .card:hover{border-color:var(--sa-acc)}
  .card:focus-visible{outline:2px solid var(--sa-accL);outline-offset:2px}
  .card.on{background:var(--sa-cardOn);border-color:var(--sa-acc)}
  .ct{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .cl{min-width:0}
  .cid{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--sa-accL);margin-bottom:4px}
  .cnm{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .csub{font-size:12px;color:var(--sa-mute);margin-top:4px}
  .ckm{text-align:right;flex:0 0 auto}
  .ckm b{display:block;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600}
  .ckm span{font-size:10px;color:var(--sa-mute);letter-spacing:.06em}
  .cb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cb .sp{flex:1}
  .tone{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:7px;white-space:nowrap}
  .t-open{background:var(--sa-okBg);color:var(--sa-ok)}
  .t-warn{background:var(--sa-warnBg);color:var(--sa-warn)}
  .t-none{background:var(--sa-bar);color:var(--sa-mute);border:1px solid var(--sa-line)}
  .tw{font-size:11.5px;padding:5px 10px;border-radius:7px;background:var(--sa-bar);color:var(--sa-mute);
    border:1px solid var(--sa-line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .navb{font-size:12.5px;font-weight:700;border:none;background:var(--sa-soft1);color:var(--sa-accL);
    border-radius:9px;height:38px;padding:0 15px;display:inline-flex;align-items:center;text-decoration:none;flex:0 0 auto}
  .navb:hover{background:var(--sa-soft2)}
  .moreRows{align-self:center;margin-top:6px}
  .blank{padding:34px 18px;text-align:center;color:var(--sa-mute);font-size:13.5px;line-height:1.7;
    background:var(--sa-card);border:1px dashed var(--sa-line2);border-radius:12px}
  .blank b{display:block;color:var(--sa-ink);font-size:15px;margin-bottom:6px}

  #detail{flex:1 1 340px;min-width:0;background:var(--sa-bar);border:1px solid var(--sa-line);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:16px;position:sticky;top:78px;box-shadow:var(--sa-shadow)}
  .back{font-size:12.5px;font-weight:600;border:none;background:none;color:var(--sa-accL);cursor:pointer;
    text-align:left;align-self:flex-start;padding:0}
  .did{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sa-accL);font-weight:600;margin-bottom:5px}
  .dnm{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:pretty}
  .dad{font-size:12.5px;color:var(--sa-mute);margin-top:6px;line-height:1.5}
  .dtags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dtags .tw{background:var(--sa-card)}
  .dacts{display:flex;gap:8px}
  .bp,.bs{flex:1;font-size:13px;border-radius:10px;height:44px;display:inline-flex;align-items:center;
    justify-content:center;text-decoration:none;cursor:pointer;text-align:center;padding:0 8px}
  main .bp{font-weight:700;background:var(--sa-acc);color:var(--sa-accInk)}
  main .bp:hover{background:var(--sa-accL)}
  main .bs{font-weight:600;border:1px solid var(--sa-line2);background:var(--sa-card);color:var(--sa-ink)}
  main .bs:hover{border-color:var(--sa-acc)}
  .bp.dis,.bs.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
  .dmini{display:flex;gap:8px;flex-wrap:wrap;margin-top:-6px}
  .sec{display:flex;flex-direction:column;gap:11px}
  .sec.rule{padding-top:14px;border-top:1px solid var(--sa-line)}
  .sh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sa-mute);font-weight:700}
  .fr{display:flex;gap:12px;align-items:baseline}
  .fk{font-size:11.5px;color:var(--sa-mute);flex:0 0 104px}
  .fv{font-size:12.5px;font-weight:500;line-height:1.5;min-width:0;text-wrap:pretty;word-break:break-word}
  .fv.mono{font-family:'IBM Plex Mono',monospace}
  @media (max-width:760px){ #detail{position:static} }
</style>

<body>
<header class="hdr">
  <a class="brand" href="../../" title="Emortia · back to the site" aria-label="Emortia · back to the site">
    <span class="logo"><i></i><i></i><i></i><i></i></span>
    <span class="bname">Emortia</span>
  </a>
  <span class="hsep" aria-hidden="true"></span>
  <h1>Site Access Lookup</h1>
  <span class="pill" id="pill">loading…</span>
  <button class="theme" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>

<main>
  <div class="top"><div class="wrap">
    <div class="search" id="search">
      <span class="ic" aria-hidden="true">⌕</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
        placeholder="Site ID, name, district – or district:kandy, depot:negombo, 24h"
        aria-label="Search sites, or type a filter">
      <button id="qClr" type="button" aria-label="Clear the search" hidden>×</button>
    </div>

    <div class="bar">
      <button class="fp" id="fBtn" type="button" aria-expanded="false" aria-controls="fPanel">
        <span class="gl" aria-hidden="true">⊶</span>Filter<b id="fN" hidden></b>
      </button>
      <button class="fp" id="nearBtn" type="button" aria-pressed="false">◎ Near me</button>
      <span id="tokens"></span>
      <span class="sp"></span>
      <button class="ghost sm" id="mapBtn" type="button" hidden title="Save these sites as a KML for Google Earth or My Maps">Map these</button>
      <span id="count"></span>
    </div>

    <div id="fPanel" hidden></div>
    <div id="tray" hidden></div>
  </div></div>

  <div class="body">
    <section id="list" aria-label="Sites"></section>
    <aside id="detail" aria-label="The site" hidden></aside>
  </div>
</main>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".xlsx,.xls">

<script src="unified.js?v=2"></script>
<script>
window.LOOKUP_CONFIG = {
  sheetName:'Sheet1',
  syncKey:'site_access',          // shared through Supabase; see tools/_lib/db.js
  unit:'sites', unitSingular:'site', source:'DNS Operational Site list · Sheet1',
  idCol:'Site_ID', nameCol:'Site_Name', metaCol:'District',
  latCol:'Latitude', lngCol:'Longitude', telCol:'Depot_Contact',
  searchCols:['Site_ID','Other_Site_IDS','Site_Name','District','New_Region','Depot','Additional_data-Site_Address'],
  /* This page draws itself - unified.js. lookup.js keeps the reading, the live
     updates and the upload, and hands the rows over each time they change. */
  render: api => window.SiteAccessUI.render(api),
  merge:{
    officerFrom:'Depot', officerCol:'Depot_officer(FME_ID)', contactCol:'Depot_Contact',
    aliases:{
      'Site_ID':['site id','site_id','siteid'],
      'Site_Name':['site name','site_name','sitename','name'],
      'Latitude':['lat','latitude'],
      'Longitude':['long','lng','longitude'],
      'Depot':['depot'],
      'District':['district'],
      'New_Region':['region','new region','new_region'],
      'Other_Site_IDS':['other ids','other site ids','other_site_ids'],
      'Additional_data-Site_Address':['address','site address','site_address']
    }
  },
  copyText:(r,v)=>{
    const bad=s=>!s||/^(unknown|undefined|0|deny)$/i.test(String(s).trim());
    const lat=v(r,'Latitude'), lng=v(r,'Longitude');
    const officer=String(v(r,'Depot_officer(FME_ID)')||'').replace(/_\d+$/,'').trim();
    const out=[];
    if(!bad(lat)&&!bad(lng)) out.push('https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng));
    out.push('Site ID - '+(v(r,'Site_ID')||''));
    out.push('Site Name - '+(v(r,'Site_Name')||''));
    out.push('Depot Officer - '+officer);
    out.push('Depot Officer Contact No - '+(v(r,'Depot_Contact')||''));
    return out.join('\n');
  }
};
</script>
<script src="../_lib/lookup.js?v=4"></script>
</body>
